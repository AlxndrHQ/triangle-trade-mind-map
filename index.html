 exempt men', and asked Portugal to stop sending traders.","basis":"documented"},{"t":"Regulation, not abolition.","d":"Afonso established a royal board to verify that people sold were lawfully enslaved; most exports were foreign war captives.","basis":"interpretive"},{"t":"No Portuguese action.","d":"João III replied but did little to curb the trade.","basis":"documented"}],"legacy":"Afonso is remembered as Kongo's great Christian king; his correspondence, preserved in Portuguese archives, is widely taught. The complexity of his position — protesting abuses while trading captives — is central to how historians teach African involvement.","legacyDetail":[{"t":"Teaching the complexity.","d":"Educators use his letters to show that his objection was about who could be enslaved, not to slavery itself.","basis":"interpretive"}],"sources":[{"label":"World History Commons — Afonso I letters to the King of Portugal (primary source)","url":"https://worldhistorycommons.org/node/2382"},{"label":"Religion and Slavery project — Afonso I to Portugal (primary source)","url":"https://religionandslavery.org/ps%3A-afonso-i-to-portugal"},{"label":"Regensburg Forum — Christian Kongo and Slavery (2025)","url":"https://regensburgforum.com/2025/02/01/christian-kongo-and-slavery/"},{"label":"South African History Online — Kingdom of Kongo 1390–1914","url":"https://sahistory.org.za/article/kingdom-kongo-1390-1914"}],"connections":[{"id":"kingdom-of-kongo","type":"ownership","label":"king"},{"id":"crown-of-portugal","type":"political","label":"letters to João III, 1526"},{"id":"port-lisbon","type":"political","label":"sent nobles to Lisbon"},{"id":"port-luanda","type":"trade","label":"Central African trade route"}]},{"id":"queen-nzinga","name":"Queen Njinga (Nzinga) of Ndongo and Matamba","category":"African States & Families","role":"Ruler & Supplier","nation":"Ndongo/Angola","scale":"Significant","scaleBasis":"estimated","scaleNote":"Both resisted Portuguese conquest and traded captives to the Dutch and later Portuguese; quoted figures of hundreds of thousands sold are unverified.","start":1622,"end":1663,"lifespan":"c.1583–1663","base":"Kabasa / Matamba, Angola","geo":[-9.0,16.0],"aliases":["Njinga Mbande","Ana de Sousa Nzinga"],"origins":"Daughter of King Mbande a Ngola of Ndongo. She negotiated with the Portuguese governor in Luanda in 1622, accepting baptism as Ana de Sousa.","role_summary":"Ruling Ndongo from 1624 and Matamba from 1631, Njinga fought Portuguese wars of conquest for decades, allied with Imbangala bands and with the Dutch West India Company (1641–48), and sold war captives to whoever controlled the coast. After 1656 peace she traded with the Portuguese.","roleDetail":[{"t":"Diplomat and war leader.","d":"Her 1622 embassy to Luanda and long war against Portugal made her a symbol of resistance.","basis":"documented"},{"t":"Participant in the trade.","d":"Matamba became a slave-trading state, and Njinga supplied captives to Dutch and later Portuguese buyers.","basis":"interpretive"},{"t":"Contested legacy.","d":"Portuguese and missionary historians stressed her conversion and trading; Angolan nationalists stress her anti-colonial struggle.","basis":"interpretive"}],"legacy":"Njinga is a national heroine in Angola, with statues and a 'Queen Nzinga' banknote and avenue names. Historians such as Linda Heywood present her as both a resistance leader and a slave-trading ruler.","legacyDetail":[{"t":"National symbol.","d":"She is celebrated in Angola and in the diaspora as an anti-colonial heroine.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Nzinga of Ndongo and Matamba","url":"https://en.wikipedia.org/wiki/Nzinga_of_Ndongo_and_Matamba"},{"label":"UNC Global Women's Online — Njinga of Angola: Africa's Warrior Queen","url":"https://gwonline.unc.edu/node/7631"}],"connections":[{"id":"dutch-west-india-company","type":"political","label":"allied with the Dutch 1641–48"},{"id":"crown-of-portugal","type":"political","label":"war and treaties with Portugal"},{"id":"port-luanda","type":"trade","label":"captives sold via Luanda"},{"id":"imbangala-kasanje","type":"political","label":"allied with Imbangala bands"},{"id":"kingdom-of-kongo","type":"political","label":"neighbouring kingdom"}]},{"id":"imbangala-kasanje","name":"Imbangala & Kingdom of Kasanje","category":"African States & Families","role":"Ruler & Supplier","nation":"Ndongo/Angola","scale":"Major","scaleBasis":"estimated","scaleNote":"Imbangala war bands and the Kasanje market were among the main sources of captives for Portuguese Luanda from the 17th to 19th centuries.","start":1610,"end":1850,"lifespan":"c.1610–1911","base":"Kasanje (Cassange), Angola","geo":[-9.4,17.6],"aliases":["Mbangala","Jagas"],"origins":"Militarised warrior bands of disputed origin (possibly Lunda or the central Angolan highlands) who appeared in Angola around 1600 and recruited captured adolescents into their ranks.","role_summary":"The Portuguese hired Imbangala as mercenaries in wars against Ndongo; their raids supplied captives to Luanda. Around 1620–30 they founded Kasanje on the Kwango, where a Portuguese feira (market) channelled captives from Lunda and the deep interior to the coast.","roleDetail":[{"t":"Mercenary slavers.","d":"Imbangala bands served both the Portuguese and their enemies, including Njinga, and their raids produced captives for sale.","basis":"documented"},{"t":"Kasanje market.","d":"Captives from Lunda and beyond passed through Imbangala middlemen to Portuguese-employed pombeiros at Kasanje.","basis":"documented"}],"legacy":"Kasanje resisted Portugal into the 19th century and was conquered c.1911. The Imbangala's reputation for ferocity in Portuguese sources is treated with caution by historians.","legacyDetail":[{"t":"Source bias.","d":"European descriptions of Imbangala cannibalism and ritual are considered exaggerated or unverifiable.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Imbangala","url":"https://en.wikipedia.org/wiki/Imbangala"},{"label":"Britannica — Kasanje","url":"https://www.britannica.com/place/Kasanje"},{"label":"Library of Congress Country Studies (Angola) — Matamba and Kasanje Kingdoms","url":"https://countrystudies.us/angola/8.htm"}],"connections":[{"id":"port-luanda","type":"trade","label":"supplied captives to Luanda"},{"id":"crown-of-portugal","type":"political","label":"mercenaries for Portugal"},{"id":"queen-nzinga","type":"political","label":"allied with Njinga"},{"id":"kingdom-of-kongo","type":"political","label":"raided Kongo region"}]},{"id":"aro-confederacy","name":"Aro Confederacy","category":"African States & Families","role":"Broker & Agent","nation":"Niger Delta & Biafra","scale":"Major","scaleBasis":"estimated","scaleNote":"The main inland trading network supplying the Bight of Biafra ports (Bonny, Calabar), which exported c.1.6 million people (SlaveVoyages estimates).","start":1690,"end":1840,"lifespan":"c.1690–1902","base":"Arochukwu, Nigeria","geo":[5.388,7.912],"aliases":["Aro","Arochukwu"],"origins":"An Igbo-Ibibio-Akpa trading people centred on Arochukwu who emerged in the late 17th century, with the oracle Ibini Ukpabi ('Long Juju') as their spiritual centre.","role_summary":"The Aro built a network of trading settlements across Igboland, using the oracle's prestige, alliances with mercenary communities and judicial verdicts to acquire captives. Many people judged by the oracle were sold, not killed as believed, and passed to Bonny and Calabar for sale to European ships.","roleDetail":[{"t":"The oracle as a recruiter.","d":"UNESCO's tentative-list entry describes Ibini Ukpabi as the major recruiter of captives sent to Bonny.","basis":"documented"},{"t":"Commercial diaspora.","d":"Aro traders founded settlements and slave-holding quarters across Igboland, running markets and caravans.","basis":"documented"},{"t":"Judicial enslavement.","d":"Accusations that priests manipulated verdicts to obtain captives are reported but poorly documented.","basis":"interpretive"}],"legacy":"Britain destroyed the confederacy in the Anglo-Aro War (1901–02), reportedly blowing up the shrine. The Arochukwu Long Juju slave route is on Nigeria's UNESCO tentative list, and the Eze Aro remains a traditional ruler.","legacyDetail":[{"t":"Heritage site.","d":"The Long Juju shrine is now visited as a slave-route heritage site.","basis":"documented"}],"sources":[{"label":"Wikipedia — Aro Confederacy","url":"https://en.wikipedia.org/wiki/Aro_Confederacy"},{"label":"Wikipedia — Ibini Ukpabi","url":"https://en.wikipedia.org/wiki/Ibini_Ukpabi"},{"label":"World Heritage Site — Arochukwu Long Juju Slave Route (Tentative List)","url":"https://dev.worldheritagesite.org/whsorg/tentative/arochkwu-long-juju-slave-route"},{"label":"Wikipedia — Anglo-Aro War","url":"https://en.wikipedia.org/wiki/Anglo-Aro_War"}],"connections":[{"id":"kingdom-of-bonny","type":"trade","label":"supplied captives to Bonny"},{"id":"old-calabar-efik","type":"trade","label":"supplied captives to Calabar"},{"id":"arochukwu-long-juju","type":"ownership","label":"oracle shrine"},{"id":"port-liverpool","type":"trade","label":"captives sold to Liverpool ships"}]},{"id":"kingdom-of-bonny","name":"Kingdom of Bonny (Pepple dynasty)","category":"African States & Families","role":"Ruler & Supplier","nation":"Niger Delta & Biafra","scale":"Major","scaleBasis":"estimated","scaleNote":"One of West Africa's largest slave-exporting ports by the late 18th century: about 20,000 people were shipped from Bonny in 1790 alone (per Britannica), mostly to Liverpool ships.","start":1700,"end":1839,"lifespan":"c.1500s–present (Amanyanabo of Bonny)","base":"Bonny, Rivers State, Nigeria","geo":[4.451,7.17],"aliases":["Ibani","Grand Bonny"],"origins":"An Ijaw city-state in the eastern Niger Delta, ruled by the Pepple dynasty, whose wealth came from brokering trade between inland producers and European ships.","role_summary":"Bonny's kings and trading 'houses' bought captives from the Aro and other inland suppliers and sold them to European (overwhelmingly Liverpool) captains, levying comey (customs). Rulers such as Opubo and William Dappa Pepple resisted British abolition until the 1839 treaty and later deals.","roleDetail":[{"t":"Liverpool partner.","d":"Bonny was a principal destination for Liverpool slave ships in the late 18th century.","basis":"interpretive"},{"t":"Treaty for compensation.","d":"An 1839 agreement with Captain Tucker promised goods worth 10,000 dollars a year for five years to end the trade; British suspicions of continued trade persisted.","basis":"documented"},{"t":"House system.","d":"Trade was organised in canoe houses that absorbed enslaved people as rowers and traders; some, like Jaja, rose to lead houses.","basis":"documented"}],"legacy":"By the 1850s Bonny was a major palm oil exporter; Britain deposed and exiled William Dappa Pepple in 1854. The Pepple dynasty still provides the Amanyanabo of Bonny, today a centre of Nigeria's oil and gas industry.","legacyDetail":[{"t":"From slaves to palm oil to petroleum.","d":"Bonny Island today hosts Nigeria LNG.","basis":"interpretive"}],"sources":[{"label":"Britannica — Kingdom of Bonny","url":"https://www.britannica.com/topic/kingdom-of-Bonny"},{"label":"Wikipedia — Kingdom of Bonny","url":"https://en.wikipedia.org/wiki/Kingdom_of_Bonny"},{"label":"Victorian Web — King William Dappa Pepple of Bonny (Willasey-Wilsey)","url":"https://www.victorianweb.org/history/antislavery/pepple.html"},{"label":"Wikipedia — Fubara Manilla Pepple","url":"https://en.wikipedia.org/wiki/Fubara_Manilla_Pepple"},{"label":"Britannica — Bonny (Nigeria)","url":"https://www.britannica.com/place/Bonny"}],"connections":[{"id":"port-liverpool","type":"trade","label":"main buyer of captives"},{"id":"aro-confederacy","type":"trade","label":"bought captives from Aro"},{"id":"jaja-of-opobo","type":"political","label":"Jaja broke away from Bonny 1869"},{"id":"port-bonny","type":"ownership","label":"port"}]},{"id":"old-calabar-efik","name":"Old Calabar (Efik city-states)","category":"African States & Families","role":"Ruler & Supplier","nation":"Niger Delta & Biafra","scale":"Major","scaleBasis":"estimated","scaleNote":"A leading Bight of Biafra port, closely tied to Bristol and Liverpool; Efik houses sold tens of thousands of captives in the 18th century.","start":1650,"end":1841,"lifespan":"c.1600s–present (Obong of Calabar)","base":"Calabar, Nigeria","geo":[4.958,8.322],"aliases":["Duke Town","Creek Town","Old Town","Akwa Akpa"],"origins":"Efik trading towns on the Calabar River — Duke Town, Creek Town and Old Town — governed through rival houses and the Ekpe (leopard) society.","role_summary":"Efik merchants bought captives inland and sold them on credit ('trust') to British ships; the Ekpe society enforced debts and contracts. Rivalry between Old Town (Robin John) and Duke Town led to the 1767 massacre, in which English captains helped Duke Ephraim's faction kill and enslave Old Town traders.","roleDetail":[{"t":"The 1767 massacre.","d":"English captains lured Old Town's leaders aboard ships; c.300 were killed and others, including two Robin John princes, were sold.","basis":"documented"},{"t":"Antera Duke's diary.","d":"An Efik trader's diary (1785–88), the only surviving eyewitness account of the trade by an African merchant, records daily dealings.","basis":"documented"},{"t":"Ending the trade.","d":"Eyamba V and Eyo Honesty II signed an 1841 treaty to end the slave trade and shifted to palm oil.","basis":"documented"}],"legacy":"Calabar became a Presbyterian mission centre (1846) and the first capital of the Niger Coast Protectorate. The Obong of Calabar remains the paramount ruler; Ekpe survives as a cultural institution and in Cuba as Abakuá.","legacyDetail":[{"t":"Abakuá in Cuba.","d":"Captives from the Cross River region recreated Ekpe as the Abakuá society in Cuba.","basis":"interpretive"}],"sources":[{"label":"Britannica — Calabar","url":"https://www.britannica.com/place/Calabar"},{"label":"Wikipedia — Little Ephraim Robin John and Ancona Robin John","url":"https://en.wikipedia.org/wiki/Little_Ephraim_Robin_John_and_Ancona_Robin_John"},{"label":"Wikipedia — Timeline of Old Calabar history","url":"https://en.wikipedia.org/wiki/Timeline_of_Old_Calabar_history"},{"label":"Smithsonian Transcription Center — Autograph note to William Turner by Eyamba V","url":"https://transcription.si.edu/project/38352"}],"connections":[{"id":"port-bristol","type":"trade","label":"sold captives to Bristol ships"},{"id":"port-liverpool","type":"trade","label":"sold captives to Liverpool ships"},{"id":"aro-confederacy","type":"trade","label":"bought captives from Aro"},{"id":"antera-duke-diary","type":"legacy","label":"diary of an Efik trader"},{"id":"duke-ephraim","type":"ownership","label":"Duke Town leader"}]},{"id":"duke-ephraim","name":"Duke Ephraim (Efik rulers of Duke Town)","category":"African States & Families","role":"Broker & Agent","nation":"Niger Delta & Biafra","scale":"Significant","scaleBasis":"estimated","scaleNote":"Title of successive heads of Duke Town; the 1767 holder allied with English captains in the massacre, and 'Great Duke Ephraim' (d.1834) dominated Calabar's trade.","start":1767,"end":1834,"lifespan":"18th century–1834 (Great Duke Ephraim d. 14 Oct 1834)","base":"Duke Town, Calabar, Nigeria","geo":[4.958,8.322],"aliases":["Efiom Edem","Great Duke Ephraim"],"origins":"Leaders of the Duke house of the Efik, rivals of the Robin John family of Old Town for control of trade with European ships.","role_summary":"In 1767 Duke Ephraim's faction allied with English captains to ambush Old Town traders, securing Duke Town's dominance. Great Duke Ephraim (d. 1834) later monopolised Calabar's dealings in captives and palm oil.","roleDetail":[{"t":"1767 alliance.","d":"Breakdown of talks between Grandy King George (Old Town) and Duke Ephraim preceded the massacre.","basis":"documented"},{"t":"Monopoly.","d":"Historian David Richardson argues the displacement of one clan by another sustained Calabar's slave trade for generations.","basis":"interpretive"}],"legacy":"Duke Town became the dominant Efik settlement and core of modern Calabar.","legacyDetail":[{"t":"Succession.","d":"Eyamba V succeeded as Obong in 1834 and signed the 1841 anti-slave-trade treaty.","basis":"documented"}],"sources":[{"label":"Wikipedia — Timeline of Old Calabar history","url":"https://en.wikipedia.org/wiki/Timeline_of_Old_Calabar_history"},{"label":"Wikipedia — Little Ephraim Robin John and Ancona Robin John","url":"https://en.wikipedia.org/wiki/Little_Ephraim_Robin_John_and_Ancona_Robin_John"},{"label":"Times Higher Education — review of Sparks, The Two Princes of Calabar","url":"https://www.timeshighereducation.com/books/enslaved-slavers-turn-on-dirty-trade-when-free/193646.article"}],"connections":[{"id":"old-calabar-efik","type":"ownership","label":"head of Duke Town"},{"id":"port-liverpool","type":"trade","label":"traded with Liverpool captains"},{"id":"port-bristol","type":"trade","label":"traded with Bristol captains"}]},{"id":"jaja-of-opobo","name":"Jaja of Opobo","category":"African States & Families","role":"Ruler & Supplier","nation":"Niger Delta & Biafra","scale":"Significant","scaleBasis":"estimated","scaleNote":"A formerly enslaved man who became the leading palm oil merchant of the eastern Delta; his significance is for the post-abolition 'legitimate' trade rather than captives.","start":1863,"end":1887,"lifespan":"c.1821–1891","base":"Opobo, Rivers State, Nigeria","geo":[4.513,7.548],"aliases":["Jubo Jubogha","King Jaja"],"origins":"Born in Igboland, he was enslaved and sold as a child to Bonny, where he rose through the Anna Pepple canoe house to lead it in 1863.","role_summary":"After civil war in Bonny, Jaja founded Opobo in 1869 and controlled the inland palm oil markets, dealing directly with Britain. His story illustrates both the house system that absorbed enslaved people and the British drive to break African middlemen after abolition.","roleDetail":[{"t":"From enslaved to king.","d":"Jaja's rise within a Bonny trading house shows how enslaved people could gain status in Delta 'houses'.","basis":"documented"},{"t":"Palm oil monopoly.","d":"He controlled the interior oil trade and shipped oil to Britain directly, angering British firms.","basis":"documented"},{"t":"Deported.","d":"In 1887 Vice-Consul Harry Johnston lured him aboard a ship; he was tried in Accra and exiled to the West Indies.","basis":"documented"}],"legacy":"Jaja died in 1891 on his way home from exile in Barbados/Grenada. He is honoured in Nigeria as an anti-colonial hero; the Jaja dynasty still rules Opobo.","legacyDetail":[{"t":"Statue and dynasty.","d":"Opobo maintains his memory and royal line.","basis":"interpretive"}],"sources":[{"label":"ADF Magazine — King Jaja of Opobo","url":"https://adf-magazine.com/2016/07/king-jaja-of-opobo/"},{"label":"NOW Grenada — This day in history: 8 June 1888 (Jaja arrives in Grenada)","url":"https://nowgrenada.com/2022/06/this-day-in-history-8-june-1888-2/"}],"connections":[{"id":"kingdom-of-bonny","type":"political","label":"rose in and broke from Bonny"},{"id":"port-liverpool","type":"trade","label":"palm oil trade with Liverpool firms"},{"id":"aro-confederacy","type":"parallel","label":"inland Igbo trade networks"}]},{"id":"kosoko-of-lagos","name":"Kosoko, Oba of Lagos","category":"African States & Families","role":"Ruler & Supplier","nation":"Bight of Benin (Lagos/Ouidah)","scale":"Significant","scaleBasis":"estimated","scaleNote":"Ruled Lagos when it was a leading illegal slave port of the 1840s; deposed by British bombardment in December 1851.","start":1845,"end":1851,"lifespan":"d.1872 (Oba 1845–1851)","base":"Lagos, Nigeria","geo":[6.455,3.394],"aliases":["Kosoko"],"origins":"A member of the Lagos royal house who fought his uncle Akitoye for the throne and took power in 1845.","role_summary":"Kosoko allied with Brazilian and Portuguese slave traders who used Lagos to ship Yoruba captives to Bahia and Cuba. Britain backed Akitoye and, from 26–28 December 1851, bombarded Lagos, driving Kosoko into exile at Epe.","roleDetail":[{"t":"Illegal-era port.","d":"Lagos under Kosoko was a major outlet for captives from the Yoruba wars after Oyo's collapse.","basis":"interpretive"},{"t":"1851 bombardment.","d":"HMS Bloodhound, Teazer and boats attacked the palace; Kosoko fled and Akitoye signed the 1 January 1852 anti-slave-trade treaty.","basis":"documented"}],"legacy":"The bombardment opened the way to British annexation of Lagos in 1861. Kosoko later returned to Lagos in 1862 under British pension.","legacyDetail":[{"t":"Prelude to colonialism.","d":"Historians see the anti-slave-trade intervention as the start of British colonial rule in Nigeria.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Kosoko","url":"https://en.wikipedia.org/wiki/Kosoko"},{"label":"Wikipedia — Akitoye","url":"https://en.wikipedia.org/wiki/Akitoye"}],"connections":[{"id":"port-lagos","type":"ownership","label":"Oba of Lagos"},{"id":"madam-tinubu","type":"political","label":"rival of Tinubu's patron Akitoye"},{"id":"port-salvador","type":"trade","label":"sold to Bahian traders"},{"id":"lagos-treaty-1852","type":"political","label":"deposed before treaty"},{"id":"oyo-empire","type":"trade","label":"sold captives from Yoruba wars"}]},{"id":"madam-tinubu","name":"Madam Efunroye Tinubu","category":"African States & Families","role":"Broker & Agent","nation":"Bight of Benin (Lagos/Ouidah)","scale":"Minor","scaleBasis":"estimated","scaleNote":"A wealthy merchant whose trade included enslaved people and arms in Badagry, Lagos and Abeokuta; volumes are undocumented.","start":1830,"end":1856,"lifespan":"c.1805/1810–1887","base":"Lagos / Abeokuta, Nigeria","geo":[6.455,3.394],"aliases":["Iyalode of Egba"],"origins":"An Egba Yoruba woman from Abeokuta, she built a trading business in Badagry and Lagos through her marriage connections, including to Oba Adele.","role_summary":"Tinubu traded salt and tobacco from Europeans for enslaved people from the interior, along with arms and palm oil. A supporter of Akitoye, she was accused of continuing to sell captives to Brazilian traders after the 1852 treaty and was expelled from Lagos in 1856.","roleDetail":[{"t":"Merchant of captives and arms.","d":"Sources describe her trade in enslaved people, tobacco, salt and firearms with European merchants.","basis":"documented"},{"t":"Post-treaty trading.","d":"British consul Benjamin Campbell opposed her, and claims of covert slave trading after 1852 rest on limited sources.","basis":"interpretive"}],"legacy":"In Abeokuta she supplied arms against Dahomey and was made Iyalode of the Egba. Tinubu Square in Lagos is named after her, and recent films and articles debate whether she should be celebrated given her slave trading.","legacyDetail":[{"t":"Contested heroine.","d":"Nigerian media debate the 'glorification of a slave master' in popular portrayals.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Efunroye Tinubu","url":"https://en.wikipedia.org/wiki/Efunroye_Tinubu"},{"label":"BlackPast — Madam Efunroye Tinubu (ca. 1805–1887)","url":"https://blackpast.org/gah/tinubu-madam-efunroye-ca-1805-1887"},{"label":"The Guardian (Nigeria) — Efunroye Tinubu film: glorification of a slave master?","url":"https://guardian.ng/life/film/fathia-baloguns-efunroye-tinubu-glorification-of-a-slave-master-or-promotion-of-art-culture/"}],"connections":[{"id":"kosoko-of-lagos","type":"political","label":"opponent"},{"id":"port-lagos","type":"trade","label":"traded in Lagos"},{"id":"kingdom-of-dahomey","type":"political","label":"armed Abeokuta against Dahomey"},{"id":"port-salvador","type":"trade","label":"alleged sales to Brazilian traders"}]},{"id":"nana-olomu","name":"Nana Olomu of the Itsekiri","category":"African States & Families","role":"Broker & Agent","nation":"Niger Delta & Biafra","scale":"Minor","scaleBasis":"estimated","scaleNote":"A dominant palm oil middleman on the Benin River whose wealth rested on enslaved labour; deposed by Britain in 1894.","start":1883,"end":1894,"lifespan":"1852–1916","base":"Ebrohimi, Benin River, Nigeria","geo":[5.8,5.36],"aliases":["Nanna Olomu","Governor of the Benin River"],"origins":"Son of the Itsekiri trader Olomu, he inherited a trading house and was appointed 'Governor of the Benin River' by the British in 1884.","role_summary":"Nana controlled the Benin River palm oil trade with a large retinue of enslaved workers and armed canoes. After he rejected new British trade terms, a British naval expedition destroyed his fortified town Ebrohimi in 1894.","roleDetail":[{"t":"Slave-based house.","d":"Like other Delta merchants, Nana's trading house relied on large numbers of enslaved people as paddlers, traders and soldiers.","basis":"interpretive"},{"t":"Fall of Ebrohimi.","d":"After an attack on HMS Alecto's cutter, British forces captured Ebrohimi (September 1894); Nana surrendered in Lagos and was deported to the Gold Coast.","basis":"documented"}],"legacy":"Allowed home in 1906, he lived at Koko until his death in 1916. His flags and photographs are held at Royal Museums Greenwich, and he is remembered as a resister of colonial rule.","legacyDetail":[{"t":"Museum objects.","d":"Royal Museums Greenwich holds his personal flags seized in 1894.","basis":"documented"}],"sources":[{"label":"Wikipedia — Nana Olomu","url":"https://en.wikipedia.org/wiki/Nana_Olomu"},{"label":"Royal Museums Greenwich — Personal flag of Itsekiri chief Nana Olomu","url":"https://www.rmg.co.uk/collections/objects/rmgc-object-556"}],"connections":[{"id":"jaja-of-opobo","type":"parallel","label":"fellow Delta merchant deposed by Britain"},{"id":"port-liverpool","type":"trade","label":"palm oil to British firms"},{"id":"kingdom-of-bonny","type":"parallel","label":"Delta house system"}]},{"id":"caulker-family","name":"Caulker family (Sherbro)","category":"African States & Families","role":"Broker & Agent","nation":"Sierra Leone & Upper Guinea","scale":"Significant","scaleBasis":"estimated","scaleNote":"A leading Afro-European slave-trading lineage of the Sherbro coast in the 18th and early 19th centuries; volumes undocumented.","start":1684,"end":1853,"lifespan":"1684–present","base":"Shenge / Plantain Island, Sierra Leone","geo":[7.906,-12.952],"aliases":["Corker family"],"origins":"Descended from Thomas Corker, a Royal African Company agent who arrived in 1684 and married a Sherbro royal woman, gaining land and chiefly rights through her lineage.","role_summary":"The Caulkers became chiefs of the Bumpe and Shenge areas and brokered captives, ivory and camwood to British and other ships, becoming one of the region's wealthiest families. In 1853 Richard Canreba Caulker and other Sherbro chiefs agreed with the Sierra Leone governor to end the trade.","roleDetail":[{"t":"Company origins.","d":"Thomas Corker served the Royal African Company at Sherbro before founding the lineage.","basis":"documented"},{"t":"Chiefs and traders.","d":"Matrilineal marriage gave the family chiefly status; they used it to control trade with European ships.","basis":"documented"},{"t":"1853 renunciation.","d":"Richard Canreba Caulker helped finalise an 1853 agreement ending the Sherbro slave trade, enacted in British law two years later.","basis":"documented"}],"legacy":"The Caulkers remain a prominent Sierra Leonean family, producing paramount chiefs, politicians and academics. Family members have engaged publicly with the history, including visits to US slavery museums.","legacyDetail":[{"t":"Present-day chiefs.","d":"Caulkers still hold paramount chieftaincies in the Sherbro region.","basis":"documented"}],"sources":[{"label":"Wikipedia — Thomas Caulker","url":"https://en.wikipedia.org/wiki/Thomas_Caulker"},{"label":"Wikipedia — Thomas Corker","url":"https://en.wikipedia.org/wiki/Thomas_Corker"},{"label":"Wikipedia — Richard Canreba Caulker","url":"https://en.wikipedia.org/wiki/Richard_Canreba_Caulker"}],"connections":[{"id":"royal-african-company","type":"ownership","label":"founder was RAC agent"},{"id":"bunce-island","type":"trade","label":"regional trade with Bunce Island"},{"id":"tucker-and-rogers-families","type":"political","label":"rival Afro-European Sherbro clans"},{"id":"port-liverpool","type":"trade","label":"sold to British ships"}]},{"id":"tucker-and-rogers-families","name":"Tucker, Rogers and Cleveland families (Sherbro)","category":"African States & Families","role":"Broker & Agent","nation":"Sierra Leone & Upper Guinea","scale":"Minor","scaleBasis":"estimated","scaleNote":"Afro-British trading lineages on the Sherbro and Upper Guinea coast from the 17th–19th centuries; numbers undocumented.","start":1665,"end":1850,"lifespan":"1665–present","base":"Sherbro Island, Sierra Leone","geo":[7.526,-12.505],"aliases":["Sherbro Tuckers","Rogers clan","Clevelands of the Banana Islands"],"origins":"Zachary Rogers and John Tucker arrived in Sherbro in 1665 as English company traders and married daughters of local chiefs to gain trading rights; James Cleveland settled in the region in the mid-18th century.","role_summary":"Their mixed-heritage descendants became chiefs and middlemen, accumulating wealth by supplying captives and goods to European ships. The Clevelands of the Banana Islands were notable slave traders of the late 18th century.","roleDetail":[{"t":"Marriage alliances.","d":"European traders married into chiefly families, as customary for gaining trading rights.","basis":"documented"},{"t":"Merchant class.","d":"Sources describe the Rogers, Caulkers and Tuckers as middlemen forming an emergent merchant class.","basis":"documented"},{"t":"Oral and written roots.","d":"A History in Africa study examines how written and oral testimony differ on the 'first Mr. Rogers'.","basis":"interpretive"}],"legacy":"Tucker and Rogers descendants still hold chieftaincies in southern Sierra Leone. Their histories illustrate how Afro-European elites mediated the Upper Guinea trade.","legacyDetail":[{"t":"Ongoing lineages.","d":"The Sherbro Tuckers remain a recognised chiefly family.","basis":"documented"}],"sources":[{"label":"Wikipedia — Sherbro Tuckers","url":"https://en.wikipedia.org/wiki/Sherbro_Tuckers"},{"label":"Cambridge, History in Africa — White Roots: Written and Oral Testimony on the 'First Mr. Rogers'","url":"https://resolve.cambridge.org/core/journals/history-in-africa/article/white-roots-written-and-oral-testimony-on-the-first-mr-rogers/373DC9CAB8BEB149A6DB58E9DDB5EDED"},{"label":"Wikipedia — John Tucker (merchant trader)","url":"https://en.wikipedia.org/wiki/John_Tucker_(merchant_trader)"}],"connections":[{"id":"caulker-family","type":"political","label":"rival Sherbro clan"},{"id":"royal-african-company","type":"trade","label":"traded with English company"},{"id":"bunce-island","type":"trade","label":"regional trade"}]},{"id":"signares-of-senegambia","name":"Signares of Gorée and Saint-Louis","category":"African States & Families","role":"Broker & Agent","nation":"Senegambia","scale":"Minor","scaleBasis":"estimated","scaleNote":"Women merchants who held enslaved people (often 30–40 each) and ships, renting enslaved labour to the French companies.","start":1700,"end":1848,"lifespan":"17th–19th centuries","base":"Gorée / Saint-Louis, Senegal","geo":[16.026,-16.489],"aliases":["Signare","Nhara (Portuguese Guinea)"],"origins":"African and Eurafrican women who entered long-term 'country marriages' with French and other European officials and traders at Saint-Louis and Gorée.","role_summary":"Signares owned houses, ships and enslaved people, traded in gum, hides and captives, and rented enslaved workers to the French companies. They held real power within the hierarchies of the slave economy.","roleDetail":[{"t":"Enslavers and merchants.","d":"Many signares owned thirty to forty enslaved people whom they hired out to the company.","basis":"documented"},{"t":"Commercial agency.","d":"Historians argue they are remembered for beauty more than business skill, obscuring their role as traders.","basis":"interpretive"}],"legacy":"French abolition in 1848 ended their slaveholding; signare culture remains a powerful image in Senegalese heritage on Gorée and in Saint-Louis.","legacyDetail":[{"t":"Heritage tourism.","d":"Gorée's 'signare houses' are central to its heritage presentation.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Signare","url":"https://en.wikipedia.org/wiki/Signare"},{"label":"American Historical Association 2012 — paper on the signares of Senegambia","url":"https://aha.confex.com/aha/2012/webprogram/Paper8039.html"}],"connections":[{"id":"goree-island","type":"plantation","label":"held enslaved people on Gorée"},{"id":"compagnie-des-indes","type":"trade","label":"hired enslaved labour to the company"},{"id":"saint-domingue","type":"trade","label":"one signare traded property in Saint-Domingue"},{"id":"port-nantes","type":"trade","label":"linked to French traders"}]},{"id":"futa-jallon-imamate","name":"Imamate of Futa Jallon","category":"African States & Families","role":"Ruler & Supplier","nation":"Sierra Leone & Upper Guinea","scale":"Significant","scaleBasis":"estimated","scaleNote":"Its jihad wars and raids supplied captives to Rio Pongo, Rio Nunez and Sierra Leone markets in the 18th–19th centuries.","start":1725,"end":1850,"lifespan":"1725–1896","base":"Timbo, Guinea","geo":[10.633,-11.833],"aliases":["Fouta Djallon"],"origins":"A Fulbe (Fula) Muslim theocracy founded after a jihad in 1725 in the highlands of present-day Guinea, with its capital at Timbo.","role_summary":"Futa Jallon's power rested heavily on raiding non-Muslim neighbours and selling captives, sending many to coastal markets in exchange for cloth, guns and salt, while also using enslaved labour in farming villages (runde).","roleDetail":[{"t":"Jihad and enslavement.","d":"Raids on Jalonke, Baga, Susu and other non-Muslim peoples produced captives for sale and labour.","basis":"documented"},{"t":"Coastal supply.","d":"Fula traders kept Sierra Leone markets supplied with captives, linking to coastal Afro-European traders.","basis":"interpretive"}],"legacy":"France conquered Futa Jallon in 1896. Descendants of enslaved people (often called 'rimaibe' or 'maccube') still face status discrimination in parts of the region.","legacyDetail":[{"t":"Lingering hierarchy.","d":"Slave-descent status remains socially significant in Fuuta Jaloo communities.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Imamate of Futa Jallon","url":"https://en.wikipedia.org/wiki/Imamate_of_Futa_Jallon"},{"label":"Appalachian State Univ. — Upper Gambian Archaeology: Upper Gambia history","url":"https://digitalcollections.library.appstate.edu/s/Upper-Gambian-Archaeology/page/upper-gambia-history"},{"label":"Cambridge, Social Science History — The Impact of the Atlantic Slave Trade on the Societies of the Western Sudan","url":"https://resolve.cambridge.org/core/journals/social-science-history/article/impact-of-the-atlantic-slave-trade-on-the-societies-of-the-western-sudan/7CDA2AC76F07C42FCC9704E234B6450E"}],"connections":[{"id":"tucker-and-rogers-families","type":"trade","label":"supplied coastal traders"},{"id":"caulker-family","type":"trade","label":"supplied Sierra Leone markets"},{"id":"bamana-empire-segou","type":"parallel","label":"Western Sudan supply states"}]},{"id":"port-ouidah","name":"Ouidah (Whydah)","type":"entity","kind":"Port","description":"Inland town and roadstead in present-day Benin, the second-largest embarkation point in Africa after Luanda, from which an estimated 1 million+ captives left. English (1650s/1680s), French (1704) and Portuguese (1721) forts stood there; Dahomey conquered it in 1727 and it remained active until the 1860s. In 1860 it sent the last recorded slave shipment to the United States (the Clotilda).","start":1650,"geo":[6.363,2.085],"connections":[{"id":"kingdom-of-dahomey","type":"ownership","label":"ruled by Dahomey from 1727"},{"id":"francisco-felix-de-souza","type":"trade","label":"Chachá's base"},{"id":"royal-african-company","type":"ownership","label":"English fort"},{"id":"compagnie-des-indes","type":"ownership","label":"French fort 1704"},{"id":"fort-sao-joao-baptista-ajuda","type":"ownership","label":"Portuguese fort"},{"id":"clotilda-meaher","type":"trade","label":"Clotilda captives bought here 1860"}]},{"id":"fort-sao-joao-baptista-ajuda","name":"Fort of São João Baptista de Ajudá","type":"entity","kind":"Fort / trading castle","description":"Portuguese fort built at Ouidah in 1721 to serve the Bahian tobacco-for-captives trade. It remained Portuguese until Dahomey (Benin) seized it in 1961 and now houses Ouidah's history museum.","start":1721,"geo":[6.358,2.087],"connections":[{"id":"port-ouidah","type":"ownership","label":"fort at Ouidah"},{"id":"crown-of-portugal","type":"ownership","label":"Portuguese crown fort"},{"id":"port-salvador","type":"trade","label":"Bahian trade link"},{"id":"francisco-felix-de-souza","type":"ownership","label":"de Souza served here"}]},{"id":"door-of-no-return-ouidah","name":"Door of No Return, Ouidah","type":"entity","kind":"Legacy / apology","description":"Concrete and bronze memorial arch on Ouidah beach, inaugurated in the mid-1990s as part of the UNESCO Slave Route project, marking where captives were taken to ships. Its friezes show lines of chained people.","start":1995,"geo":[6.326,2.09],"connections":[{"id":"port-ouidah","type":"legacy","label":"memorial at Ouidah beach"},{"id":"ouidah-route-des-esclaves","type":"legacy","label":"final stop of the route"}]},{"id":"ouidah-route-des-esclaves","name":"Route des Esclaves, Ouidah","type":"entity","kind":"Legacy / apology","description":"A c.4 km memorial route from Ouidah's slave market square to the beach, with statues and sites including the Tree of Forgetting. Benin placed 'Sites marquants de la Route de l'Esclave' on its UNESCO tentative list in 1996.","start":1992,"geo":[6.36,2.086],"connections":[{"id":"port-ouidah","type":"legacy","label":"memorialises Ouidah trade"},{"id":"door-of-no-return-ouidah","type":"legacy","label":"ends at the Door"},{"id":"de-souza-family","type":"legacy","label":"passes de Souza sites"},{"id":"benin-1999-apology","type":"legacy","label":"part of Benin's memory policy"}]},{"id":"abomey-royal-palaces","name":"Royal Palaces of Abomey","type":"entity","kind":"Legacy / apology","description":"Palace complex of the Dahomean kings, whose bas-reliefs depict warfare and royal history; inscribed as a UNESCO World Heritage Site in 1985. Treasures looted by France in 1892 were partly returned to Benin in 2021.","start":1625,"geo":[7.183,1.991],"connections":[{"id":"kingdom-of-dahomey","type":"ownership","label":"royal seat"},{"id":"ghezo-of-dahomey","type":"ownership","label":"Ghezo's palace"},{"id":"glele-of-dahomey","type":"ownership","label":"Glele's palace"}]},{"id":"fante-confederacy","name":"Fante states and Fante Confederacy","type":"entity","kind":"State / confederation","description":"Fante coastal states (e.g. Anomabo) were major brokers of the 18th-century Gold Coast slave trade, mediating between Asante and the European castles. In 1868 Fante chiefs formed the Fante Confederacy at Mankessim, with a written constitution in 1871, before Britain dissolved it in 1873–74.","start":1700,"geo":[5.274,-1.016],"connections":[{"id":"cape-coast-castle","type":"trade","label":"brokered trade at Cape Coast"},{"id":"royal-african-company","type":"trade","label":"traded with English forts"},{"id":"asante-empire","type":"political","label":"wars with Asante"},{"id":"osei-bonsu-of-asante","type":"political","label":"invaded by Asante"}]},{"id":"mbanza-kongo","name":"Mbanza Kongo (São Salvador)","type":"entity","kind":"Legacy / apology","description":"Capital of the Kingdom of Kongo in northern Angola, renamed São Salvador after Christian conversion. Inscribed as a UNESCO World Heritage Site in 2017 as a testimony to Kongo's encounter with Portugal.","start":1390,"geo":[-6.267,14.25],"connections":[{"id":"kingdom-of-kongo","type":"ownership","label":"capital"},{"id":"afonso-i-of-kongo","type":"ownership","label":"Afonso's seat"}]},{"id":"antera-duke-diary","name":"Diary of Antera Duke (1785–1788)","type":"entity","kind":"Document","description":"Diary of an Efik trader of Old Calabar, written in trade English, the only surviving eyewitness account of the slave trade by an African merchant. The original was apparently destroyed in WWII bombing; extracts survive and were published by Forde (1956) and in a 2010 OUP edition.","start":1785,"geo":[4.958,8.322],"connections":[{"id":"old-calabar-efik","type":"legacy","label":"records Calabar trade"},{"id":"port-liverpool","type":"trade","label":"records dealings with British captains"}]},{"id":"arochukwu-long-juju","name":"Ibini Ukpabi (Long Juju) of Arochukwu","type":"entity","kind":"Oracle / shrine","description":"Oracle shrine at Arochukwu whose verdicts, consulted across Igboland, often resulted in people being sold rather than killed as believed. British forces reportedly destroyed it in the Anglo-Aro War (1901–02); the Long Juju slave route is on Nigeria's UNESCO tentative list.","start":1690,"geo":[5.388,7.912],"connections":[{"id":"aro-confederacy","type":"ownership","label":"Aro oracle"},{"id":"kingdom-of-bonny","type":"trade","label":"captives sent to Bonny"}]},{"id":"port-bonny","name":"Bonny (port)","type":"entity","kind":"Port","description":"Eastern Niger Delta port that became one of the largest slave-exporting ports in Africa in the late 18th century, dominated by Liverpool ships, then a palm oil port after the 1830s.","start":1600,"geo":[4.451,7.17],"connections":[{"id":"kingdom-of-bonny","type":"ownership","label":"port of Bonny kingdom"},{"id":"port-liverpool","type":"trade","label":"Liverpool slave ships"}]},{"id":"port-lagos","name":"Lagos (port)","type":"entity","kind":"Port","description":"Yoruba lagoon port that became a major outlet for the illegal slave trade to Brazil and Cuba in the 1830s–40s. British bombardment in 1851 deposed Kosoko; Britain annexed Lagos in 1861.","start":1760,"geo":[6.455,3.394],"connections":[{"id":"kosoko-of-lagos","type":"ownership","label":"Oba of Lagos"},{"id":"madam-tinubu","type":"trade","label":"Tinubu's trading base"},{"id":"port-salvador","type":"trade","label":"Bahia link"},{"id":"lagos-treaty-1852","type":"charter","label":"1852 treaty"}]},{"id":"lagos-treaty-1852","name":"Anglo-Lagos Treaty of 1852","type":"entity","kind":"Charter / law / treaty","description":"Treaty signed on 1 January 1852 by Oba Akitoye, installed by British force, abolishing the slave trade at Lagos and granting British traders privileges. It paved the way to annexation in 1861.","start":1852,"geo":[6.455,3.394],"connections":[{"id":"port-lagos","type":"charter","label":"abolished trade at Lagos"},{"id":"kosoko-of-lagos","type":"political","label":"followed his overthrow"},{"id":"madam-tinubu","type":"political","label":"Tinubu accused of breaching it"}]},{"id":"bamana-empire-segou","name":"Bamana Empire of Ségou","type":"entity","kind":"State / empire","description":"Bambara state founded c.1712 by Biton Kulibali at Ségou on the Niger, whose armies (tonjon) were composed largely of captives. Its wars supplied captives to Senegambian and Upper Guinea markets and European posts; it fell to Umar Tall in 1861.","start":1712,"geo":[13.431,-6.266],"connections":[{"id":"signares-of-senegambia","type":"trade","label":"captives reached Senegal River posts"},{"id":"futa-jallon-imamate","type":"parallel","label":"Western Sudan supply state"},{"id":"compagnie-des-indes","type":"trade","label":"captives sold to French posts"}]},{"id":"benin-1999-apology","name":"Benin's 1999 apology and Cotonou reconciliation conference","type":"entity","kind":"Legacy / apology","description":"In 1999 President Mathieu Kérékou apologised for Africans' role in the slave trade, including kneeling in a Baltimore church, and convened a Leaders' Reconciliation conference in Cotonou with delegates from the diaspora, Europe and the US. Benin followed in 2024–25 with a law offering citizenship to descendants of enslaved Africans.","start":1999,"geo":[6.367,2.433],"connections":[{"id":"kingdom-of-dahomey","type":"legacy","label":"apology for Dahomey's role"},{"id":"ouidah-route-des-esclaves","type":"legacy","label":"memory policy"},{"id":"port-liverpool","type":"legacy","label":"Liverpool delegates attended"}]},{"id":"crc-nigeria-2009-letter","name":"Civil Rights Congress of Nigeria letter (2009)","type":"entity","kind":"Legacy / apology","description":"In November 2009 the Lagos-based Civil Rights Congress, led by Shehu Sani, wrote to Nigeria's traditional rulers urging them to apologise for their forebears' role in raiding and selling people. A spokesman for the chiefs rejected the idea of inherited guilt.","start":2009,"geo":[6.455,3.394],"connections":[{"id":"aro-confederacy","type":"legacy","label":"addressed Nigerian ruling houses"},{"id":"kingdom-of-bonny","type":"legacy","label":"addressed traditional rulers"},{"id":"old-calabar-efik","type":"legacy","label":"addressed traditional rulers"}]},{"id":"ghana-year-of-return-2019","name":"Ghana's Year of Return (2019)","type":"entity","kind":"Legacy / apology","description":"Campaign launched by President Nana Akufo-Addo in 2018 marking 400 years since enslaved Africans reached Virginia in 1619, inviting the diaspora to visit and settle; Ghana granted citizenship to around 200 diaspora members. Critics noted it focused on European castles more than on African participation.","start":2019,"geo":[5.56,-0.205],"connections":[{"id":"cape-coast-castle","type":"legacy","label":"pilgrimage site"},{"id":"elmina-castle","type":"legacy","label":"pilgrimage site"},{"id":"asante-empire","type":"legacy","label":"Ghana's heritage politics"}]},{"id":"dewolf-family","name":"DeWolf family of Bristol, Rhode Island","category":"American Families","role":"Trader & Shipper","nation":"United States","scale":"Major","scaleBasis":"estimated","scaleNote":"Per the Tracing Center and Brown-affiliated research, the extended family financed or commanded voyages carrying c. 10,000–12,000 enslaved Africans across the Atlantic between 1769 and 1820, making it the largest slave-trading family in US history.","start":1769,"end":1820,"lifespan":"1769–1820 (trade); Cuban plantations held into the 1840s","base":"Bristol, Rhode Island","geo":[41.677,-71.266],"aliases":["D'Wolf family","Mark Anthony DeWolf and sons"],"origins":"Mark Anthony DeWolf, a sailor from Guadeloupe, settled in Bristol and captained slaving voyages for the Newport merchant Simeon Potter in the 1760s. His sons, including James, John, William, Charles and later grandson George, built a family business around ships, rum distilleries, insurance and banking in Bristol.","role_summary":"The DeWolfs ran a closed triangle: Bristol rum went to West Africa, captives were carried to Havana, Charleston and other markets, and Cuban sugar and molasses returned to the family distilleries. They kept trading after Rhode Island's 1787 ban and the federal ban of 1808, using Cuban plantations and the family's own bank and insurance company.","roleDetail":[{"t":"Largest US slave-trading family.","d":"Estimates of c. 10,000–12,000 Africans carried on family-financed voyages (1769–1820) come from the Tracing Center and the 'Traces of the Trade' research.","basis":"documented"},{"t":"Vertically integrated business.","d":"The family owned ships, distilleries, the Bank of Bristol and the Mount Hope Insurance Company, and plantations in Cuba that received captives and supplied sugar.","basis":"documented"},{"t":"Trading through bans.","d":"Rhode Island outlawed the trade in 1787 and Congress in 1808, yet the DeWolfs continued to finance voyages, relying on Cuban ports and weak federal enforcement.","basis":"documented"}],"legacy":"The family's wealth built Bristol's Federal-era mansions, including Linden Place (1810), now a house museum. In 2008 descendant Katrina Browne released the documentary 'Traces of the Trade: A Story from the Deep North', and the Tracing Center continues education on Northern complicity.","legacyDetail":[{"t":"Traces of the Trade (2008).","d":"Ten descendants retraced the triangle to Bristol, Ghana and Cuba in the Emmy-nominated PBS documentary; Thomas Norman DeWolf's book 'Inheriting the Trade' accompanies it.","basis":"documented"},{"t":"Linden Place.","d":"Built for George DeWolf in 1810, later bought by James DeWolf; today a museum that interprets the family's slave-trade wealth.","basis":"documented"}],"sources":[{"label":"Tracing Center — James DeWolf","url":"https://www.tracingcenter.org/resources/background/james-dewolf/"},{"label":"Providence Journal / USA Today Network — Living Off the Trade: Bristol and the DeWolfs","url":"https://stories.usatodaynetwork.com/slaveryinrhodeisland/living-off-the-trade-bristol-and-the-dewolfs/"},{"label":"Linden Place — Meet the Family","url":"https://www.lindenplace.org/meet-the-family"},{"label":"Christian Science Monitor — Family confronts the North's slave-trading past","url":"https://www.csmonitor.com/2008/0131/p13s02-lire.html"}],"connections":[{"id":"james-dewolf","type":"family","label":"leading family member"},{"id":"port-bristol-rhode-island","type":"ownership","label":"home port, ships and distilleries"},{"id":"port-havana","type":"trade","label":"sold captives at Havana"},{"id":"port-charleston","type":"trade","label":"sold captives at Charleston, 1804–07"},{"id":"port-newport","type":"voyage","label":"Mark Anthony DeWolf sailed for Newport merchants"},{"id":"us-slave-trade-act-1807","type":"political","label":"continued trading after the 1808 ban"}]},{"id":"james-dewolf","name":"James DeWolf","category":"American Families","role":"Trader & Shipper","nation":"United States","scale":"Major","scaleBasis":"estimated","scaleNote":"Organised or financed dozens of slaving voyages from Bristol over c. 50 years; often described (Tracing Center) as the most prominent slave trader in US history.","start":1787,"end":1820,"lifespan":"1764–1837","base":"Bristol, Rhode Island","geo":[41.677,-71.266],"aliases":["Captain Jim DeWolf"],"origins":"A son of Mark Anthony DeWolf, James went to sea young and commanded slaving voyages in the 1780s. He married into the Bradford family and invested his profits in ships, distilling, Cuban plantations and later textile mills.","role_summary":"As captain of the Polly in 1789–90 he ordered an enslaved woman sick with smallpox thrown overboard; he was indicted but never convicted. As a shipowner he went on to finance numerous voyages into the 1810s, while serving as a Rhode Island legislator and, from 1821 to 1825, a US senator.","roleDetail":[{"t":"The Polly killing.","d":"In 1791 a federal grand jury indicted him for murdering a woman with smallpox aboard the Polly; he left the state, and a later St. Thomas inquiry cleared him.","basis":"documented"},{"t":"Financier-politician.","d":"He served in the US Senate 1821–25 and was among the richest men in the country at his death in 1837.","basis":"documented"}],"legacy":"His fortune moved into Cuban plantations and New England textile mills. His descendants include Katrina Browne, whose 2008 film 'Traces of the Trade' examined his record.","legacyDetail":[{"t":"Senator and slave trader.","d":"His career shows how slave-trade wealth carried into national political office in the early republic.","basis":"interpretive"}],"sources":[{"label":"Tracing Center — James DeWolf","url":"https://www.tracingcenter.org/resources/background/james-dewolf/"},{"label":"Wikipedia — James DeWolf","url":"https://en.wikipedia.org/wiki/James_DeWolf"}],"connections":[{"id":"dewolf-family","type":"family","label":"son of Mark Anthony DeWolf"},{"id":"port-bristol-rhode-island","type":"ownership","label":"shipowner and distiller"},{"id":"port-havana","type":"plantation","label":"Cuban sugar and coffee plantations"},{"id":"us-slave-trade-act-1807","type":"political","label":"evaded federal bans"}]},{"id":"brown-family-providence","name":"Brown family of Providence","category":"American Families","role":"Trader & Shipper","nation":"United States","scale":"Significant","scaleBasis":"documented","scaleNote":"Per Brown University's 2006 report, the family firm and individual brothers backed a handful of slaving voyages (most notoriously the Sally, 1764–65) among Rhode Island's c. 1,000; their broader fortune rested on rum, candles, iron and Caribbean trade.","start":1736,"end":1797,"lifespan":"1730s–1800s","base":"Providence, Rhode Island","geo":[41.824,-71.413],"aliases":["Nicholas Brown and Company","Nicholas, John, Joseph and Moses Brown"],"origins":"The Browns were Providence merchants; James and Obadiah Brown sent an early slaving voyage in 1736. The four brothers Nicholas, Joseph, John and Moses ran Nicholas Brown and Company, trading in rum, spermaceti candles, iron and West Indian goods.","role_summary":"The firm sent the brigantine Sally to West Africa in 1764; of 196 Africans bought, at least 109 died. The family later split: Moses Brown became a Quaker abolitionist, while John Brown kept trading and in 1797 became the first American tried under the federal Slave Trade Act of 1794.","roleDetail":[{"t":"The Sally voyage (1764–65).","d":"Captain Esek Hopkins bought 196 Africans; at least 109 died from revolt, suicide, starvation and disease before survivors were sold in Antigua.","basis":"documented"},{"t":"Brother against brother.","d":"Moses Brown freed the people he enslaved in 1773 and helped found the Providence Abolition Society; it pursued his brother John, whose ship Hope was forfeited after an 1797 federal case.","basis":"documented"},{"t":"University founders.","d":"The family was the main benefactor of the College in the English Colony of Rhode Island, renamed Brown University in 1804 after Nicholas Brown Jr.'s gift.","basis":"documented"}],"legacy":"Brown University carries the family name. In 2006 its Steering Committee on Slavery and Justice published a report on the family's and university's ties to slavery, which led to a memorial on campus (2014) and new research and education commitments.","legacyDetail":[{"t":"Slavery and Justice report (2006).","d":"Commissioned by President Ruth Simmons, it documented the Sally voyage and recommended memorials and education programs.","basis":"documented"},{"t":"John Brown House.","d":"The house of the Sally co-owner now hosts the Rhode Island Historical Society and has displayed the 'Sally' exhibit.","basis":"documented"}],"sources":[{"label":"Brown University — Slavery and Justice report (2006, PDF)","url":"https://slaveryandjustice.brown.edu/sites/default/files/reports/SlaveryAndJustice2006.pdf"},{"label":"Brown University Library — Voyage of the Slave Ship Sally, 1764–1765","url":"https://cds.lib.brown.edu/cds-project/voyage-slave-ship-sally-1764-1765"},{"label":"Providence Journal / USA Today Network — Brown vs. Brown: Brothers go head to head","url":"https://stories.usatodaynetwork.com/slaveryinrhodeisland/?p=131"},{"label":"Rhode Island Historical Society — John Brown papers, historical note","url":"https://www.rihs.org/mssinv/Mss312.htm"}],"connections":[{"id":"sally-1764","type":"ownership","label":"owned the Sally"},{"id":"esek-hopkins","type":"voyage","label":"hired Hopkins as master of the Sally"},{"id":"brown-university","type":"legacy","label":"main benefactors; name of university"},{"id":"port-havana","type":"trade","label":"John Brown's Hope voyage to Havana"},{"id":"aaron-lopez","type":"trade","label":"fellow Rhode Island merchant; candle-trade associate"},{"id":"port-newport","type":"trade","label":"Rhode Island slaving network"}]},{"id":"esek-hopkins","name":"Esek Hopkins","category":"American Families","role":"Trader & Shipper","nation":"United States","scale":"Minor","scaleBasis":"documented","scaleNote":"Master of the Brown family's Sally (1764–65), on which at least 109 of 196 Africans died (per Brown University).","start":1764,"end":1765,"lifespan":"1718–1802","base":"Providence, Rhode Island","geo":[41.824,-71.413],"aliases":[],"origins":"A Rhode Island sea captain and privateer and brother of Governor Stephen Hopkins. The Browns hired him in 1764 for their slaving venture despite his lack of experience in the African trade.","role_summary":"Hopkins spent about nine months on the Upper Guinea coast buying 196 Africans. During the crossing captives revolted; Hopkins's crew shot or wounded several, and others died of disease, starvation and suicide. Survivors were sold in Antigua.","roleDetail":[{"t":"Deadly voyage.","d":"At least 109 of the 196 people bought died, one of the deadliest Rhode Island voyages documented.","basis":"documented"},{"t":"Later naval career.","d":"In 1775 the Continental Congress appointed him the first commander-in-chief of the Continental Navy.","basis":"documented"}],"legacy":"Hopkins is commemorated in Providence (a statue and a park), while Brown University's research has made the Sally voyage the best-known case study of Rhode Island's slave trade.","legacyDetail":[{"t":"Contested commemoration.","d":"His naval role is honoured locally, which sits uneasily with his record on the Sally.","basis":"interpretive"}],"sources":[{"label":"Brown University Library — Voyage of the Slave Ship Sally, 1764–1765","url":"https://cds.lib.brown.edu/cds-project/voyage-slave-ship-sally-1764-1765"},{"label":"Wikipedia — Sally (1764 ship)","url":"https://en.wikipedia.org/wiki/Sally_(1764_ship)"}],"connections":[{"id":"sally-1764","type":"voyage","label":"master of the Sally"},{"id":"brown-family-providence","type":"voyage","label":"sailed for Nicholas Brown and Company"},{"id":"brown-university","type":"legacy","label":"Sally voyage central to Brown's 2006 report"}]},{"id":"aaron-lopez","name":"Aaron Lopez","category":"American Families","role":"Trader & Shipper","nation":"United States","scale":"Minor","scaleBasis":"documented","scaleNote":"Took part in roughly a dozen or more slaving voyages (c. 14 by one count) between 1761 and 1774, including the Cleopatra's voyages carrying 400+ Africans to Barbados and Jamaica; slaving was a small share of his business and of Rhode Island's c. 1,000 voyages.","start":1761,"end":1774,"lifespan":"1731–1782","base":"Newport, Rhode Island","geo":[41.49,-71.313],"aliases":["Duarte Lopez"],"origins":"Born Duarte Lopez into a converso family in Portugal, he emigrated to Newport in 1752, openly returned to Judaism and took the name Aaron. He became Newport's wealthiest merchant, trading in spermaceti candles, whaling, rum and Caribbean goods with his father-in-law Jacob Rodriguez Rivera.","role_summary":"Lopez and Rivera co-owned or invested in slaving voyages to West Africa, with captives sold mainly in the British Caribbean. Historians, beginning with Virginia Platt (1975), document the voyages while noting they were a minor and often unprofitable part of his trade.","roleDetail":[{"t":"Documented voyages.","d":"The Cleopatra, co-owned with Rivera, made at least three voyages (1770–74) carrying over 400 Africans to Barbados and Jamaica.","basis":"documented"},{"t":"Context, not tropes.","d":"Jewish merchants were a small minority of Rhode Island and Atlantic slave traders; the great majority of Newport and Bristol voyages were sent by Christian merchants such as the DeWolfs and Browns.","basis":"documented"}],"legacy":"Lopez fled Newport during the Revolution and drowned in 1782. He was a founding member of Touro Synagogue's congregation, and Newport historians now include his slaving voyages in accounts of the city's past.","legacyDetail":[{"t":"Historiography.","d":"Antisemitic tracts have exaggerated Lopez's role; mainstream scholarship (Platt; Coughtry) places him as one of many Newport traders.","basis":"documented"}],"sources":[{"label":"RI Historical Society bibliography — 'And Don't Forget the Guinea Voyage': The Slave Trade of Aaron Lopez of Newport (Platt, WMQ 1975)","url":"https://navigator.rihs.org/rhode-island-a-bibliography-of-its-history/and-dont-forget-the-guinea-voyage-the-slave-trade-of-aaron-lopez-of-newport/"},{"label":"The Public's Radio — The irony of Aaron Lopez, the merchant prince of Newport","url":"https://explore.thepublicsradio.org/stories/the-irony-of-aaron-lopez-the-merchant-prince-of-newport/"},{"label":"Wikipedia — Cleopatra (slave ship)","url":"https://en.wikipedia.org/wiki/Cleopatra_(slave_ship)"}],"connections":[{"id":"port-newport","type":"ownership","label":"Newport merchant house"},{"id":"brown-family-providence","type":"trade","label":"candle-trade associates"},{"id":"dewolf-family","type":"parallel","label":"Rhode Island slaving merchants"}]},{"id":"peter-faneuil","name":"Peter Faneuil","category":"American Families","role":"Trader & Shipper","nation":"United States","scale":"Minor","scaleBasis":"documented","scaleNote":"Boston merchant who traded with the slave-based Caribbean and invested in at least one slaving venture; he enslaved at least five people in his household, valued at £620 in his estate.","start":1738,"end":1743,"lifespan":"1700–1743","base":"Boston, Massachusetts","geo":[42.36,-71.056],"aliases":[],"origins":"Born to a Huguenot family that fled La Rochelle for New York and Boston, Faneuil inherited the fortune of his uncle Andrew Faneuil in 1738. The family traded fish, timber and provisions to the West Indies and imported sugar and molasses.","role_summary":"Faneuil's trade supplied Caribbean slave plantations and he took part in the triangle trade, including at least one slaving voyage. In 1740 he offered Boston a market hall; Faneuil Hall opened in 1742, built in part with profits tied to slavery.","roleDetail":[{"t":"Household slavery.","d":"His estate inventory listed five enslaved people; a 1738 letter refers to buying an enslaved boy.","basis":"documented"},{"t":"Funding the 'Cradle of Liberty'.","d":"The National Park Service acknowledges that part of the money for Faneuil Hall came from the slave trade; how central slavery was to his wealth is debated.","basis":"interpretive"}],"legacy":"Faneuil Hall became the 'Cradle of Liberty', where colonists protested British rule. Since 2017 activists have called for renaming it; Boston has declined but considered an auction-block memorial by artist Steven Locke.","legacyDetail":[{"t":"Renaming debate.","d":"The New Democracy Coalition proposed renaming the hall (e.g. after Crispus Attucks); Mayor Marty Walsh rejected the idea in 2017.","basis":"documented"}],"sources":[{"label":"History of Massachusetts — Was Faneuil Hall Built with Slave Money?","url":"https://historyofmassachusetts.org/?p=62"},{"label":"GBH — Proposed memorial at Faneuil Hall would recognize the victims of the slave trade","url":"https://wgbh.org/culture/2018-07-13/proposed-memorial-at-faneuil-hall-would-recognize-the-victims-of-the-slave-trade"},{"label":"Wikipedia — Peter Faneuil","url":"https://en.wikipedia.org/wiki/Peter_Faneuil"}],"connections":[{"id":"faneuil-hall","type":"ownership","label":"funded and donated the hall"},{"id":"royall-family","type":"parallel","label":"fellow Boston-area elite with Caribbean slavery wealth"},{"id":"saint-domingue","type":"parallel","label":"Huguenot merchant networks linking French and British Caribbean"}]},{"id":"royall-family","name":"Royall family (Antigua and Medford)","category":"American Families","role":"Planter & Enslaver","nation":"United States","scale":"Significant","scaleBasis":"documented","scaleNote":"Among the largest slaveholding families in colonial Massachusetts; they brought 27 enslaved people from Antigua in 1737, and more than 60 people were held on the Medford estate over four decades (per the Royall House and Slave Quarters).","start":1700,"end":1775,"lifespan":"c. 1700–1781","base":"Medford, Massachusetts","geo":[42.414,-71.11],"aliases":["Isaac Royall Sr.","Isaac Royall Jr."],"origins":"Isaac Royall Sr. (c. 1677–1739) grew rich in Antigua as a sugar planter, rum distiller and slave trader. In 1732 he bought a 504-acre Medford estate and moved there in 1737 with his family and 27 enslaved Africans.","role_summary":"The Royalls ran an Antigua sugar plantation and traded enslaved people while holding dozens in bondage at Medford. Isaac Royall Jr., a Loyalist, fled in 1775; his bequest funded Harvard's first professorship of law.","roleDetail":[{"t":"Caribbean to New England.","d":"The family's Antigua sugar wealth paid for the Medford mansion and its surviving slave quarters.","basis":"documented"},{"t":"Belinda Sutton's petition.","d":"In 1783 Belinda, a woman the Royalls had enslaved, successfully petitioned the Massachusetts legislature for a pension from the Royall estate.","basis":"documented"}],"legacy":"The Royall House and Slave Quarters in Medford is a museum interpreting the family's enslavement of Africans. Harvard Law School's shield, based on the Royall coat of arms, was retired by the Harvard Corporation in March 2016 after student protests ('Royall Must Fall').","legacyDetail":[{"t":"Harvard Law shield retired (2016).","d":"The Harvard Corporation voted unanimously to retire the 80-year-old emblem.","basis":"documented"},{"t":"Only surviving freestanding slave quarters in New England.","d":"The 1730s building is a rare physical record of Northern slavery.","basis":"documented"}],"sources":[{"label":"Royall House and Slave Quarters — The Royalls","url":"https://www.royallhouse.org/the-royalls/"},{"label":"Bloomberg Law — At Harvard Law School, Battle for Inclusion Continues (2016)","url":"https://news.bgov.com/before-the-bar/at-harvard-law-school-battle-for-inclusion-continues"},{"label":"Wikipedia — Royall House and Slave Quarters","url":"https://en.wikipedia.org/wiki/Royall_House_and_Slave_Quarters"}],"connections":[{"id":"royall-house-medford","type":"plantation","label":"Medford estate and slave quarters"},{"id":"peter-faneuil","type":"parallel","label":"Boston-area merchant elite"},{"id":"codrington-family","type":"parallel","label":"fellow Antigua sugar planters"}]},{"id":"henry-laurens","name":"Henry Laurens","category":"American Families","role":"Broker & Agent","nation":"United States","scale":"Major","scaleBasis":"estimated","scaleNote":"His firm Austin & Laurens handled the sale of c. 8,000–10,000 Africans at Charleston between 1749 and 1762, one of the largest slave-trading houses in North America; he held c. 300 enslaved people at his death.","start":1749,"end":1792,"lifespan":"1724–1792","base":"Charleston, South Carolina","geo":[32.777,-79.931],"aliases":["Austin & Laurens","Austin, Laurens & Appleby"],"origins":"The son of a Huguenot saddler in Charleston, Laurens trained in a London counting house. In 1748 he formed a partnership with merchant George Austin to export rice and import goods.","role_summary":"Austin & Laurens received slave ships on commission (10%, double the rate for other goods), advertised and auctioned captives in Charleston, and acted as agents for British firms including Richard Oswald's, which ran Bunce Island in Sierra Leone. Laurens left the direct trade around 1763 but remained a large planter.","roleDetail":[{"t":"Commission merchant.","d":"The firm marketed thousands of captives arriving from Senegambia, Sierra Leone and elsewhere, earning commissions per sale.","basis":"documented"},{"t":"Revolutionary leader.","d":"He was President of the Continental Congress (1777–78), was held in the Tower of London (1780–81), and helped negotiate the 1783 peace with Richard Oswald, his former trade partner.","basis":"documented"}],"legacy":"His Mepkin plantation is now Mepkin Abbey, a Trappist monastery. Charleston's role as a principal US landing port is now interpreted at the International African American Museum (opened 2023).","legacyDetail":[{"t":"Austin & Laurens records.","d":"The 'Papers of Henry Laurens' are a key source for the Charleston slave market.","basis":"documented"}],"sources":[{"label":"World History Encyclopedia — Henry Laurens","url":"https://www.worldhistory.org/Henry_Laurens/"},{"label":"Encyclopedia.com — Laurens, Henry (1724–1792)","url":"https://encyclopedia.com/people/history/us-history-biographies/henry-laurens"},{"label":"Wikipedia — Henry Laurens","url":"https://en.wikipedia.org/wiki/Henry_Laurens"}],"connections":[{"id":"port-charleston","type":"trade","label":"auctioned captives at Charleston"},{"id":"bunce-island","type":"trade","label":"agent for Oswald's Bunce Island captives"},{"id":"port-london","type":"political","label":"held in the Tower of London, 1780–81"},{"id":"international-african-american-museum","type":"legacy","label":"Charleston landing history interpreted"}]},{"id":"franklin-and-armfield","name":"Franklin & Armfield","category":"Companies & Banks","role":"Trader & Shipper","nation":"United States","scale":"Major","scaleBasis":"estimated","scaleNote":"The largest domestic slave-trading firm in the US, 1828–1836 (Encyclopedia Virginia); it shipped c. 1,000 people a year in the 1830s, and the City of Alexandria counts over 3,750 people exported.","start":1828,"end":1836,"lifespan":"1828–1836","base":"Alexandria, Virginia","geo":[38.804,-77.056],"aliases":[],"origins":"Isaac Franklin had traded enslaved people from the Chesapeake to Natchez since 1808; he met John Armfield in 1824 and they formed a partnership in 1828. They leased a building at 1315 Duke Street, Alexandria, and turned it into a holding pen.","role_summary":"Armfield bought people in Maryland and Virginia, held them in Alexandria and sent them south by coastal ship or on foot in chained coffles. Franklin sold them in Natchez and New Orleans to cotton and sugar planters, profiting from the post-1808 domestic trade.","roleDetail":[{"t":"Coastal shipping line.","d":"The firm ran its own vessels from Alexandria to New Orleans, as well as overland coffles to Natchez.","basis":"documented"},{"t":"Second Middle Passage.","d":"The firm was a major channel of the forced migration of c. 1 million people from the Upper South to the Deep South.","basis":"interpretive"}],"legacy":"The partners retired rich in 1836. The Alexandria pen is now the Freedom House Museum, run by the City of Alexandria; historian Joshua Rothman's 'The Ledger and the Chain' (2021) reconstructs the firm's history.","legacyDetail":[{"t":"Freedom House Museum.","d":"The 1315 Duke Street building is a National Historic Landmark interpreting the domestic slave trade.","basis":"documented"}],"sources":[{"label":"Encyclopedia Virginia — Franklin and Armfield","url":"https://encyclopediavirginia.org/entries/franklin-and-armfield/"},{"label":"New York Review of Books — Partners in Brutality (on the domestic slave trade)","url":"https://www.nybooks.com/articles/2021/11/18/partners-in-brutality-domestic-slave-trade/"},{"label":"City of Alexandria — Freedom House Museum","url":"https://www.alexandriava.gov/go/1760"}],"connections":[{"id":"isaac-franklin","type":"ownership","label":"co-founder; ran New Orleans and Natchez"},{"id":"freedom-house-alexandria","type":"ownership","label":"Alexandria slave pen"},{"id":"port-new-orleans","type":"trade","label":"sold people at New Orleans"},{"id":"us-slave-trade-act-1807","type":"political","label":"domestic trade boomed after 1808 import ban"}]},{"id":"isaac-franklin","name":"Isaac Franklin","category":"American Families","role":"Trader & Shipper","nation":"United States","scale":"Major","scaleBasis":"documented","scaleNote":"Co-head of the largest US domestic slave-trading firm; held 636 people in slavery at his death in 1846 (per Wikipedia, citing estate records).","start":1808,"end":1846,"lifespan":"1789–1846","base":"Gallatin, Tennessee (Fairvue)","geo":[36.388,-86.447],"aliases":[],"origins":"Born in Sumner County, Tennessee, Franklin began buying people in Baltimore and Alexandria with his brothers in 1808 and taking them down the Mississippi to Natchez and New Orleans.","role_summary":"As partner in Franklin & Armfield he ran the selling end of the business in Natchez and New Orleans. He invested his profits in Fairvue plantation in Tennessee and several cotton plantations in West Feliciana Parish, Louisiana, including Angola.","roleDetail":[{"t":"Plantation empire.","d":"Estate records list several hundred enslaved people on his Louisiana plantations and over 100 at Fairvue.","basis":"documented"},{"t":"From Angola plantation to prison.","d":"His Angola lands later became the Louisiana State Penitentiary, where convict labour continued on the former plantation.","basis":"documented"}],"legacy":"His widow Adelicia (later Acklen) used the estate to build Belmont Mansion in Nashville, now part of Belmont University. Angola remains the largest maximum-security prison in the US.","legacyDetail":[{"t":"Belmont Mansion.","d":"The museum now researches and names the enslaved people of the Franklin estate.","basis":"documented"}],"sources":[{"label":"Wikipedia — Isaac Franklin","url":"https://en.wikipedia.org/wiki/Isaac_Franklin"},{"label":"Belmont Mansion — Isaac Franklin","url":"https://belmontmansion.com/family-2/isaac-franklin"},{"label":"City of Alexandria — Biography of Isaac Franklin (PDF)","url":"https://media.alexandriava.gov/docs-archives/historic/info/freedomhouse/web=boxes/biographyisaacfranklin.pdf"}],"connections":[{"id":"franklin-and-armfield","type":"ownership","label":"co-founder"},{"id":"port-new-orleans","type":"trade","label":"sold people in New Orleans"},{"id":"freedom-house-alexandria","type":"ownership","label":"firm's Alexandria pen"}]},{"id":"lehman-brothers","name":"Lehman Brothers","category":"Companies & Banks","role":"Financier & Insurer","nation":"United States","scale":"Significant","scaleBasis":"documented","scaleNote":"A Montgomery cotton-factoring house whose business depended on slave-grown cotton; the 1860 census lists Mayer Lehman as enslaving seven people.","start":1850,"end":1865,"lifespan":"1850–2008","base":"Montgomery, Alabama (later New York)","geo":[32.377,-86.3],"aliases":["H. Lehman & Bro.","Lehman Durr & Co."],"origins":"Bavarian-born Henry Lehman opened a dry-goods store in Montgomery in 1844; his brothers Emanuel and Mayer joined, and by 1850 the firm was Lehman Brothers. They accepted raw cotton as payment and became cotton factors.","role_summary":"As cotton factors the Lehmans extended credit to planters, took cotton in payment and sold it to Northern and British mills, binding the firm to plantation slavery. Mayer Lehman enslaved people in his household, and during the Civil War the firm supported the Confederacy.","roleDetail":[{"t":"Cotton factoring.","d":"Credit to planters secured on future crops linked the firm's profits directly to enslaved labour.","basis":"documented"},{"t":"Confederate ties.","d":"The firm ran blockades and supported Confederate finance; Emanuel and Mayer received pardons after the war.","basis":"documented"}],"legacy":"The firm moved to New York, helped found the New York Cotton Exchange (1870), and became a major investment bank until its 2008 bankruptcy. Under Chicago's 2002 slavery-era disclosure ordinance it acknowledged its ties to slavery; its history is now taught by Harvard Business School's Baker Library.","legacyDetail":[{"t":"Chicago disclosure.","d":"Lehman was among the first city contractors to disclose slavery-era ties under the ordinance.","basis":"documented"}],"sources":[{"label":"Harvard Business School Baker Library — Lehman Brothers: General Merchants to Commodities Brokers","url":"https://www.library.hbs.edu/special-collections-and-archives/exhibits/lehman/general-merchants-to-commodities-brokers"},{"label":"New York Review of Books — The Lehman Trilogy and Wall Street's Debt to Slavery","url":"https://www.nybooks.com/daily/2019/06/11/the-lehman-trilogy-and-wall-streets-debt-to-slavery/"},{"label":"Business Alabama — The Alabama Origin of Lehman Bros.","url":"https://businessalabama.com/the-alabama-origin-of-lehman-bros/"}],"connections":[{"id":"chicago-slavery-era-ordinance","type":"legacy","label":"disclosed slavery ties"},{"id":"brown-brothers-harriman","type":"parallel","label":"fellow cotton financiers"},{"id":"port-liverpool","type":"trade","label":"cotton sold to British markets"}]},{"id":"jpmorgan-chase","name":"JPMorgan Chase","category":"Companies & Banks","role":"Financier & Insurer","nation":"United States","scale":"Significant","scaleBasis":"documented","scaleNote":"Per its 2005 disclosure, predecessor banks Citizens Bank and Canal Bank of Louisiana accepted c. 13,000 enslaved people as loan collateral (1831–1865) and came to own c. 1,250 of them through defaults.","start":1831,"end":null,"lifespan":"1831–present (via predecessors)","base":"New York (predecessors in New Orleans)","geo":[40.756,-73.975],"aliases":["Bank One (predecessor)","Citizens Bank of Louisiana","Canal Bank"],"origins":"JPMorgan Chase absorbed Bank One in 2004, whose lineage included two antebellum New Orleans banks: Citizens Bank and Canal Bank. Louisiana's property banks raised capital and lent to planters against mortgages on land and enslaved people.","role_summary":"The predecessor banks took enslaved men, women and children as collateral and seized many when borrowers defaulted, turning human beings into secured assets of the banking system.","roleDetail":[{"t":"Human collateral.","d":"c. 13,000 people pledged as collateral; c. 1,250 owned after defaults (2005 company statement to the City of Chicago).","basis":"documented"},{"t":"Link to the Georgetown sale.","d":"Reporting on the 1838 Jesuit sale notes that people sold to Louisiana were mortgaged to Citizens Bank.","basis":"documented"}],"legacy":"In January 2005 CEO William Harrison and President Jamie Dimon apologised and created a $5 million scholarship programme for Black students in Louisiana. Reparations advocates called it a first step.","legacyDetail":[{"t":"2005 apology.","d":"Prompted by Chicago's slavery-era disclosure ordinance.","basis":"documented"}],"sources":[{"label":"NBC News — JPMorgan: Predecessors linked to slavery","url":"https://www.nbcnews.com/news/amp/wbna6851727"},{"label":"Diverse Issues in Higher Education — JPMorgan Apologizes for Predecessor Banks' Acceptance of Slaves as Collateral","url":"https://diverseeducation.com/article/4323/"},{"label":"New York Sun — From J.P. Morgan Chase, an Apology and $5 Million in Slavery Reparations","url":"https://nysun.com/article/business-from-jp-morgan-chase-an-apology-and-5-million"}],"connections":[{"id":"citizens-bank-louisiana","type":"legacy","label":"successor of Citizens and Canal banks"},{"id":"chicago-slavery-era-ordinance","type":"legacy","label":"2005 disclosure and apology"},{"id":"port-new-orleans","type":"finance","label":"planter lending in New Orleans"},{"id":"wells-fargo-wachovia","type":"parallel","label":"2005 bank apologies"}]},{"id":"wells-fargo-wachovia","name":"Wachovia / Wells Fargo","category":"Companies & Banks","role":"Financier & Insurer","nation":"United States","scale":"Significant","scaleBasis":"documented","scaleNote":"Per Wachovia's 2005 report, predecessor Georgia Railroad and Banking Co. owned at least 162 enslaved people and the Bank of Charleston accepted at least 529 as loan collateral.","start":1833,"end":null,"lifespan":"1833–present (via predecessors)","base":"Charlotte, North Carolina","geo":[35.227,-80.843],"aliases":["Georgia Railroad and Banking Company","Bank of Charleston"],"origins":"Wachovia acquired descendants of the Bank of Charleston (1991) and, via its 2001 merger with First Union, the Georgia Railroad and Banking Company. Wells Fargo bought Wachovia in 2008.","role_summary":"The Georgia railroad bank owned enslaved people who were forced to build and work the railroad; the Bank of Charleston lent on mortgages secured by enslaved people and acquired some when borrowers defaulted.","roleDetail":[{"t":"Owner and lender
