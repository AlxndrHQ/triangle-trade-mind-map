ery","url":"https://accedacris.ulpgc.es/handle/10553/123155?locale=en"},{"label":"College of Charleston LDHI — Emperor Charles V","url":"https://ldhi.library.cofc.edu/exhibits/show/african_laborers_for_a_new_emp/emperor_charles_v"}],"connections":[{"id":"crown-of-castile","type":"political","label":"lobbied Charles V; New Laws 1542"},{"id":"charter-1518","type":"political","label":"1516 proposal preceded licence"},{"id":"hispaniola-colony","type":"plantation","label":"held encomienda on Hispaniola"},{"id":"alonso-de-ojeda","type":"political","label":"chronicled his slaving"}]},{"id":"pedro-gomes-reinel","name":"Pedro Gomes Reinel","category":"European Families","role":"Trader & Shipper","nation":"Portugal","scale":"Major","scaleBasis":"documented","scaleNote":"First holder of the general Spanish asiento (1595–1601) under Philip II; Portuguese asentistas through 1640 contracted for c. 4,250 captives a year, paying 100,000–170,000 ducats annually.","start":1595,"end":1601,"lifespan":"fl. 1590s–1600s","base":"Lisbon, Portugal / Madrid","geo":[38.722,-9.139],"aliases":["Pero Gomes Reinel"],"origins":"A Portuguese merchant-financier operating during the Iberian Union (1580–1640), when Philip II ruled both Spain and Portugal, giving Portuguese traders access to Spanish America.","role_summary":"Reinel's 1595 contract transformed licensing into a general monopoly asiento, supplied mainly from Angola and Upper Guinea to Cartagena de Indias and Veracruz. He was followed by João Rodrigues Coutinho (1601–04) and others through Cristóvão Mendes de Sousa (1631–40).","roleDetail":[{"t":"First general asiento.","d":"Contracted with Philip II in 1595 (Mellafe 1959, cited by CHAM, NOVA Lisbon).","basis":"documented"},{"t":"Angola–Cartagena route.","d":"Some 38 Portuguese slave ships reached Cartagena de Indias 1596–1608.","basis":"documented"}],"legacy":"The Portuguese asientos made Angola the largest single source of captives for Spanish America in the early 17th century and entrenched New Christian merchant networks in Cartagena and Lima, many later persecuted by the Inquisition.","legacyDetail":[{"t":"Collapse in 1640.","d":"Portugal's restoration of independence ended the Portuguese asientos.","basis":"documented"}],"sources":[{"label":"CHAM / NOVA FCSH — Portuguese asiento contracts 1595–1640","url":"https://livros.fcsh.unl.pt/cham/catalog/download/155/565/1776?inline=1"},{"label":"Revista de Estudios Americanos (CSIC) — El temprano comercio de esclavos desde Angola hacia Hispanoamérica y Brasil, 1575–1595","url":"https://estudiosamericanos.revistas.csic.es/index.php/estudiosamericanos/article/view/957"},{"label":"Britannica — asiento de negros","url":"https://www.britannica.com/print/article/38687"}],"connections":[{"id":"spanish-asiento","type":"charter","label":"first general asiento 1595"},{"id":"crown-of-castile","type":"charter","label":"contract with Philip II"},{"id":"port-luanda","type":"trade","label":"captives drawn from Angola"},{"id":"crown-of-portugal","type":"political","label":"Iberian Union subject"}]},{"id":"grillo-and-lomellini","name":"Domenico Grillo & Ambrosio Lomellini","category":"Companies & Banks","role":"Financier & Insurer","nation":"Genoa/Florence (Italian states)","scale":"Major","scaleBasis":"documented","scaleNote":"Held the Spanish asiento 1662–c.1674; the contract called for 24,500 captives over seven years at 100 pesos per head to the Crown, supplied largely by Dutch and English subcontractors (Florida Slave Trade Center; García-Montón).","start":1662,"end":1674,"lifespan":"1662–1674 (asiento)","base":"Madrid, Spain","geo":[40.417,-3.704],"aliases":["Grillo y Lomelín","Lomelin"],"origins":"Two Genoese patricians exiled from Genoa in 1647 who became financiers at the Madrid court while keeping close ties to Genoa.","role_summary":"They turned the asiento into a monopoly that functioned like a tax farm, buying captives from the Dutch at Curaçao and the English at Jamaica rather than sending their own ships to Africa — tying Spain's trade to its rivals' slaving companies.","roleDetail":[{"t":"Monopoly asiento.","d":"Signed in Madrid in July 1662 (García-Montón, Genoese Entrepreneurship and the Asiento Slave Trade, 1650–1700).","basis":"documented"},{"t":"Subcontracting to rivals.","d":"Relied on Dutch WIC and English suppliers in the Caribbean.","basis":"documented"}],"legacy":"Their contract illustrates Genoese capital's long role in Spanish slaving, now the subject of recent scholarship by Alejandro García-Montón.","legacyDetail":[{"t":"Bridge to foreign asientos.","d":"Their reliance on foreign carriers foreshadowed the French (1701) and British (1713) asientos.","basis":"interpretive"}],"sources":[{"label":"Cambridge Core — review of García-Montón, Genoese Entrepreneurship and the Asiento Slave Trade","url":"https://resolve-he.cambridge.org/core/product/2FF180896027500AB3A206C0B2465091/core-reader"},{"label":"Florida Slave Trade Center — Grillo and Lomelin asiento","url":"https://floridaslavetradecenter.org/Gallery/18"},{"label":"Univ. Pablo de Olavide — Genoese Entrepreneurship and the Asiento Slave Trade, 1650–1700","url":"https://investiga.upo.es/documentos/63d9bf76d9f0044983e20044"}],"connections":[{"id":"spanish-asiento","type":"charter","label":"asiento holders 1662–74"},{"id":"crown-of-castile","type":"finance","label":"paid per-head duties to Crown"},{"id":"dutch-west-india-company","type":"trade","label":"bought captives from the Dutch (Curaçao)"},{"id":"royal-african-company","type":"trade","label":"English suppliers via Jamaica"},{"id":"centurione-family","type":"parallel","label":"earlier Genoese asentistas"}]},{"id":"paulo-dias-de-novais","name":"Paulo Dias de Novais","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Portugal","scale":"Significant","scaleBasis":"estimated","scaleNote":"Founder (1576) and first proprietary governor of Portuguese Angola, which became the single largest source of captives in the Atlantic trade; c. 1550–1836 Luanda was the centre of the trade to Brazil.","start":1575,"end":1589,"lifespan":"c. 1510–1589","base":"Luanda, Angola","geo":[-8.839,13.289],"aliases":[],"origins":"Grandson of Bartolomeu Dias, he led an embassy to Ndongo in 1560 and was granted Angola as a hereditary donataria by King Sebastião in 1571.","role_summary":"He founded São Paulo de Loanda on 25 January 1576 with c. 100 settler families and 400 soldiers and began wars of conquest against Ndongo that generated captives for export to Brazil and Spanish America.","roleDetail":[{"t":"Founded Luanda.","d":"Established the port that became the main Portuguese slave-trading port until the 1836 ban.","basis":"documented"},{"t":"Wars for captives.","d":"Military campaigns into Ndongo were closely tied to slave raiding.","basis":"documented"}],"legacy":"Luanda is today Angola's capital, with over 8 million people; Angola's independence came only in 1975 after a long liberation war.","legacyDetail":[{"t":"Angola–Brazil axis.","d":"Luanda's trade created deep demographic and cultural ties between Angola and Brazil.","basis":"documented"}],"sources":[{"label":"Wikipedia — Luanda","url":"https://en.wikipedia.org/wiki/Luanda"},{"label":"BlackPast — Luanda, Angola (1576– )","url":"https://new.blackpast.org/gah/luanda-angola-1576"}],"connections":[{"id":"port-luanda","type":"ownership","label":"founded Luanda 1576"},{"id":"crown-of-portugal","type":"charter","label":"donatário of Angola 1571"},{"id":"queen-nzinga","type":"political","label":"his wars against Ndongo began the conflict Nzinga later fought"},{"id":"kingdom-of-kongo","type":"political","label":"Kongo aided early Portuguese Angola"}]},{"id":"marquis-of-pombal","name":"Marquis of Pombal (Sebastião José de Carvalho e Melo)","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Portugal","scale":"Major","scaleBasis":"documented","scaleNote":"Created the two monopoly companies that shipped tens of thousands of Africans to Brazil: c. 25,965 to Pará and Maranhão 1757–77 (per Reis) and c. 51,806 to Pernambuco 1760–80 (ANPUH paper).","start":1755,"end":1777,"lifespan":"1699–1782","base":"Lisbon, Portugal","geo":[38.722,-9.139],"aliases":["Sebastião José de Carvalho e Melo"],"origins":"A diplomat in London and Vienna who became chief minister to King José I (1750–77) and led the rebuilding of Lisbon after the 1755 earthquake.","role_summary":"Pombal used state-chartered monopoly companies to expand the slave trade to northern and northeastern Brazil. His 1761 law banning the import of enslaved people into metropolitan Portugal was designed to channel captives to Brazil's mines and plantations, not to end slavery.","roleDetail":[{"t":"Monopoly companies.","d":"Grão-Pará e Maranhão (1755) and Pernambuco e Paraíba (1759).","basis":"documented"},{"t":"1761 law.","d":"Prohibited transporting enslaved people to Portugal itself; often misdescribed as abolition.","basis":"documented"},{"t":"Indigenous labour reforms.","d":"Ended Indigenous slavery in Brazil and expelled the Jesuits, increasing demand for African captives in the Amazon.","basis":"interpretive"}],"legacy":"Pombal is honoured with a monumental statue in Lisbon's Marquês de Pombal square; his slave-trade companies are rarely mentioned in public commemoration.","legacyDetail":[{"t":"Myth of the abolitionist.","d":"His 1761 decree is still sometimes cited as abolition, a framing historians reject.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Sebastião José de Carvalho e Melo, 1st Marquis of Pombal","url":"https://en.wikipedia.org/wiki/Sebasti%C3%A3o_Jos%C3%A9_de_Carvalho_e_Melo,_1st_Marquis_of_Pombal"},{"label":"Wikipedia — Grão Pará and Maranhão Company","url":"https://en.wikipedia.org/wiki/Gr%C3%A3o_Par%C3%A1_and_Maranh%C3%A3o_Company"},{"label":"ANPUH — paper on the Companhia de Pernambuco e Paraíba slave imports","url":"https://mail.anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548206571_63aacaecd42fc49bda5d38847a2a25f3.pdf"}],"connections":[{"id":"crown-of-portugal","type":"political","label":"chief minister to José I"},{"id":"grao-para-maranhao-company","type":"ownership","label":"founded 1755"},{"id":"pernambuco-paraiba-company","type":"ownership","label":"founded 1759"},{"id":"port-luanda","type":"trade","label":"companies bought captives in Angola"},{"id":"cacheu-company","type":"parallel","label":"Upper Guinea supply for Grão-Pará"}]},{"id":"antonio-lopez-comillas","name":"Antonio López y López, 1st Marquis of Comillas","category":"European Families","role":"Trader & Shipper","nation":"Spain","scale":"Significant","scaleBasis":"documented","scaleNote":"Historian Martín Rodrigo y Alharilla documents his firms reselling enslaved people within Cuba from 1846 and a British-consul report of involvement in an illegal expedition of African captives; scale of direct trafficking uncertain.","start":1846,"end":1883,"lifespan":"1817–1883","base":"Barcelona, Spain","geo":[41.385,2.173],"aliases":["Marqués de Comillas","Antonio López y López"],"origins":"Born poor in Comillas (Cantabria), he emigrated to Cuba as a youth and made his fortune in Santiago de Cuba trade, partly through slavery and slave dealing, before settling in Barcelona.","role_summary":"His firms Valdés y López and Antonio López y Hermano bought enslaved people in Santiago and sold them to western Cuba; the British consul accused the firm of joining an illegal expedition of 'bozales' from Africa after the 1817 ban. Back in Spain he founded the Compañía Trasatlántica, the Banco Hispano Colonial and the Compañía General de Tabacos de Filipinas.","roleDetail":[{"t":"Slave dealing in Cuba.","d":"Documented resale of enslaved people within Cuba from 1846 (Rodrigo y Alharilla).","basis":"documented"},{"t":"Illegal trade allegation.","d":"British consular report of an illegal African expedition; surviving documentation is sparse because the trade was clandestine.","basis":"interpretive"},{"t":"Pro-slavery lobbying.","d":"As a leading colonial magnate he opposed abolition in Cuba.","basis":"interpretive"}],"legacy":"Barcelona City Council removed his statue on 4 March 2018 after long campaigns; it is stored by the Barcelona History Museum and the square was renamed after Idrissa Diallo. His family later founded the Pontifical University of Comillas.","legacyDetail":[{"t":"Statue removed, 2018.","d":"One of the first removals of a slave-trader monument in Spain.","basis":"documented"},{"t":"Corporate successors.","d":"Compañía Trasatlántica Española survived into the 20th century; the Comillas legacy includes the Comillas Pontifical University.","basis":"documented"}],"sources":[{"label":"Catalan News — Barcelona removes slave trader statue","url":"https://www.catalannews.com/society-science/item/barcelona-removes-slave-trader-statue"},{"label":"EUI Ideas — Challenging slavery's heritage in Spain and Catalonia","url":"https://euideas.eui.eu/the-end-of-self-delusion-challenging-slaverys-heritage-in-spain-and-catalonia/"},{"label":"Ara — Pruebas del pasado negrero de Antonio López","url":"https://es.ara.cat/cultura/pruebas-pasado-negrero-antonio-lopez_130_3840761.html"},{"label":"elDiario.es — El 'negrero' López y López gana al 'marqués' de Comillas","url":"https://www.eldiario.es/cantabria/sociedad/negrero-lopez-marques-comillas-barcelona_1_2245065.amp.html"}],"connections":[{"id":"port-havana","type":"trade","label":"Cuban slave economy"},{"id":"compania-trasatlantica","type":"ownership","label":"founded Compañía Trasatlántica"},{"id":"lopez-statue-removal-2018","type":"legacy","label":"statue removed 2018"},{"id":"anglo-spanish-treaty-1817","type":"political","label":"traded after 1817 ban"},{"id":"julian-de-zulueta","type":"parallel","label":"fellow Spanish-Cuban magnate"}]},{"id":"pedro-martinez-cadiz","name":"Pedro Martínez (Cádiz)","category":"European Families","role":"Trader & Shipper","nation":"Spain","scale":"Major","scaleBasis":"documented","scaleNote":"Called 'the largest slave trader based in Cádiz in the time of the illegal trade' (Trocadero review of Cózar Navarro, La Orca del Atlántico); his family firm traded 1817–1867.","start":1817,"end":1867,"lifespan":"fl. 1817–1860s","base":"Cádiz, Spain","geo":[36.527,-6.288],"aliases":["Pedro Martínez y Cía."],"origins":"A Cádiz merchant whose family built a slave-trading house after Spain's 1817 treaty with Britain made the trade illegal; linked to the Partido Moderado and the Banco de Cádiz.","role_summary":"Martínez financed and shipped illegal slaving voyages to Cuba, partnering with Pedro Blanco's Gallinas operation, which he reportedly took over after 1839; British courts pursued his ships (e.g. the Cazador, Gibraltar Vice-Admiralty appeal 1836–37).","roleDetail":[{"t":"Illegal trade from Cádiz.","d":"Cádiz was Spain's leading slave port in these decades.","basis":"documented"},{"t":"Partner of Pedro Blanco.","d":"Barcia's biography of Blanco describes Martínez running Blanco's business after 1835–39.","basis":"documented"}],"legacy":"Largely forgotten until Carmen Cózar Navarro's 2021 study; Cádiz's slaving past is now being publicly re-examined.","legacyDetail":[{"t":"Hidden bourgeois fortunes.","d":"His career exposes the slaving roots behind Cádiz's liberal mercantile image.","basis":"interpretive"}],"sources":[{"label":"Trocadero (Univ. Cádiz) — review on Pedro Martínez and the Cádiz slave trade","url":"https://revistas.uca.es/index.php/trocadero/article/download/5348/5743/22718"},{"label":"Documenta — Cózar Navarro, La Orca del Atlántico","url":"https://www.documenta-bcn.com/en/products/270081-la-orca-del-atlantico.html"},{"label":"UK National Archives — Del Campo & Martinez (ship Cazador) appeal","url":"https://discovery.nationalarchives.gov.uk/details/r/C3678424"}],"connections":[{"id":"pedro-blanco","type":"trade","label":"partner; took over Blanco's business"},{"id":"port-havana","type":"trade","label":"illegal voyages to Cuba"},{"id":"anglo-spanish-treaty-1817","type":"political","label":"traded in breach of 1817 treaty"}]},{"id":"josep-xifre","name":"Josep Xifré i Casas","category":"European Families","role":"Planter & Enslaver","nation":"Spain","scale":"Minor","scaleBasis":"documented","scaleNote":"A Catalan-Cuban magnate (estate >120 million reales at death) documented as a slaveholder; whether he imported Africans is disputed (Gran Enciclopèdia Catalana).","start":1789,"end":1856,"lifespan":"1777–1856","base":"Barcelona, Spain","geo":[41.385,2.173],"aliases":["José Xifré"],"origins":"From Arenys de Mar, he fled his father's creditors to Havana in 1789 and built a business in hides and leather export.","role_summary":"Xifré profited from the slave-based Cuban colonial economy and held enslaved people; he moved to New York (1823) and then Barcelona (1840), where he built the Porxos d'en Xifré. He is listed among Barcelona's prominent slaveholders, though not proven as a slave trader.","roleDetail":[{"t":"Slaveholder, not proven trader.","d":"The Gran Enciclopèdia Catalana says he reportedly did not import Africans but did hold enslaved people.","basis":"documented"}],"legacy":"The Porxos d'en Xifré still stand on Barcelona's Passeig d'Isabel II; Barcelona's municipal programme on slave-trade memory includes him.","legacyDetail":[{"t":"Urban landmark.","d":"His colonial fortune shaped Barcelona's waterfront architecture.","basis":"documented"}],"sources":[{"label":"Gran Enciclopèdia Catalana — Josep Xifré i Casas","url":"https://www.enciclopedia.cat/gran-enciclopedia-catalana/josep-xifre-i-casas"},{"label":"3Cat — Esclavistes a Barcelona, la recuperació d'una memòria amagada","url":"https://www.3cat.cat/324/esclavistes-a-barcelona-la-recuperacio-duna-memoria-amagada/noticia/3128473"},{"label":"Ara — Huir de deudas y convertirse en hombres ricos","url":"https://es.ara.cat/economia/empresas/huir-deudas-convertirse-hombres-ricos-europa_1_4960268.html"}],"connections":[{"id":"port-havana","type":"plantation","label":"Havana business, slaveholding"},{"id":"antonio-lopez-comillas","type":"parallel","label":"fellow Catalan-Cuban fortune"}]},{"id":"casa-de-contratacion","name":"Casa de Contratación (Seville)","type":"entity","kind":"Charter / law / treaty","description":"Royal House of Trade founded in Seville in 1503 to register and tax all shipping, goods and passengers to the Indies, including licensed enslaved Africans. It trained and licensed pilots and kept the Padrón Real master chart; Amerigo Vespucci was its first Piloto Mayor (1508–12). It moved to Cádiz in 1717 and was abolished in 1790.","start":1503,"geo":[37.384,-5.993],"connections":[{"id":"crown-of-castile","type":"ownership","label":"royal institution"},{"id":"amerigo-vespucci","type":"charter","label":"first Piloto Mayor 1508"},{"id":"port-seville","type":"ownership","label":"seated in Seville"},{"id":"spanish-asiento","type":"charter","label":"administered licences 1609–15"}]},{"id":"spanish-asiento","name":"The Spanish Asiento (licence system)","type":"entity","kind":"Charter / law / treaty","description":"From the early 16th to the mid-18th century, the Spanish Crown sold contracts (asientos) granting a private party or foreign power the monopoly on supplying enslaved Africans to Spanish America, in return for payments and a fixed quota. Holders included Genoese (1518; 1662), the Welser (1528), Portuguese merchants (1595–1640), the French Guinea Company (1701) and Britain's South Sea Company (1713, 4,800 a year for 30 years).","start":1518,"connections":[{"id":"crown-of-castile","type":"ownership","label":"Crown sold asientos"},{"id":"charter-1518","type":"charter","label":"1518 licence as precursor"},{"id":"pedro-gomes-reinel","type":"charter","label":"first general asiento 1595"},{"id":"grillo-and-lomellini","type":"charter","label":"1662 Genoese asiento"},{"id":"welser-family","type":"charter","label":"1528 contract"},{"id":"south-sea-company","type":"charter","label":"1713 British asiento"},{"id":"compagnie-des-indes","type":"charter","label":"French asiento 1701"}]},{"id":"charter-1518","name":"Charles V's 1518 licence (4,000 Africans)","type":"entity","kind":"Charter / law / treaty","description":"On 18 August 1518 Charles V granted his courtier Laurent de Gorrevod a licence to ship 4,000 enslaved Africans to the Spanish colonies, allowing them to be taken directly from Africa rather than via Iberia. Gorrevod resold it to Genoese merchants. The first known direct voyages from Cape Verde and São Tomé reached the Caribbean in the mid-1520s.","start":1518,"connections":[{"id":"crown-of-castile","type":"charter","label":"issued by Charles V"},{"id":"laurent-de-gorrevod","type":"charter","label":"granted to Gorrevod"},{"id":"centurione-family","type":"trade","label":"operated by Genoese"},{"id":"bartolome-de-las-casas","type":"political","label":"followed 1516 proposal"}]},{"id":"port-seville","name":"Port of Seville","type":"entity","kind":"Port","description":"Castile's monopoly port for the Indies trade (1503–1717) and one of Europe's largest slave markets: by 1565 roughly one in fourteen inhabitants was enslaved. Florentine, Genoese and Portuguese merchants based there financed Columbus and traded in African and Indigenous captives.","start":1492,"geo":[37.389,-5.984],"connections":[{"id":"casa-de-contratacion","type":"ownership","label":"seat of Casa"},{"id":"gianotto-berardi","type":"trade","label":"Berardi's house"},{"id":"amerigo-vespucci","type":"trade","label":"Vespucci's base"},{"id":"port-lisbon","type":"trade","label":"captives re-exported from Lisbon"}]},{"id":"port-lisbon","name":"Port of Lisbon","type":"entity","kind":"Port","description":"Portugal's capital and, from 1512, the only legal landing port for enslaved Africans brought to Portugal; Africans made up an estimated c. 10% of the city's 16th-century population. The Casa dos Escravos and later Casa da Guiné e da Mina handled royal taxation of captives.","start":1444,"geo":[38.722,-9.139],"connections":[{"id":"crown-of-portugal","type":"ownership","label":"royal capital"},{"id":"casa-dos-escravos","type":"ownership","label":"home of slave house"},{"id":"bartolomeo-marchionni","type":"trade","label":"Marchionni's base"},{"id":"port-seville","type":"trade","label":"re-export to Spain"}]},{"id":"casa-dos-escravos","name":"Casa dos Escravos (Lisbon)","type":"entity","kind":"Charter / law / treaty","description":"Royal institution created by King João II in 1486 to receive, assess, tax and sell all captives arriving in Lisbon; its functions later passed to the Casa da Guiné e da Mina. A 1512 order required enslaved people to be landed only at Lisbon.","start":1486,"geo":[38.708,-9.136],"connections":[{"id":"crown-of-portugal","type":"ownership","label":"royal agency"},{"id":"port-lisbon","type":"ownership","label":"based in Lisbon"},{"id":"bartolomeo-marchionni","type":"trade","label":"processed his imports"}]},{"id":"port-luanda","name":"Port of Luanda (Portuguese Angola)","type":"entity","kind":"Port","description":"Founded as São Paulo de Loanda in 1576 by Paulo Dias de Novais, Luanda was the main Portuguese slave-trading port until the 1836 ban and the leading single embarkation point in the Atlantic trade, chiefly to Brazil. It was occupied by the Dutch 1641–48. Today it is Angola's capital, with over 8 million people.","start":1576,"geo":[-8.839,13.289],"connections":[{"id":"paulo-dias-de-novais","type":"ownership","label":"founded 1576"},{"id":"crown-of-portugal","type":"ownership","label":"Portuguese colony"},{"id":"port-rio-valongo","type":"trade","label":"main route to Rio"},{"id":"port-salvador","type":"trade","label":"route to Bahia"},{"id":"queen-nzinga","type":"political","label":"wars with Ndongo/Matamba"},{"id":"dutch-west-india-company","type":"political","label":"Dutch occupation 1641–48"}]},{"id":"elmina-castle","name":"Elmina Castle (São Jorge da Mina)","type":"entity","kind":"Fort / trading castle","description":"Built by the Portuguese in 1482 on the Gold Coast, the first major European building in tropical Africa, initially for gold; it became a key slave-trading post. The Dutch captured it in 1637 and ran the slave trade there until 1814; Britain took it in 1872. A UNESCO World Heritage site since 1979 and a museum and memorial today.","start":1482,"geo":[5.083,-1.348],"connections":[{"id":"crown-of-portugal","type":"ownership","label":"built 1482"},{"id":"dutch-west-india-company","type":"ownership","label":"Dutch from 1637"},{"id":"fernao-gomes","type":"voyage","label":"Mina reached 1471"},{"id":"cape-coast-castle","type":"parallel","label":"neighbouring castle"}]},{"id":"lagos-slave-market","name":"Mercado de Escravos, Lagos (Algarve)","type":"entity","kind":"Port","description":"Site of the August 1444 division and sale of c. 235 captives brought by Lançarote de Freitas, often described as the first large slave market of Africans in Europe. Since 2016 a small museum occupies the building, beside a 1960 statue of Henry the Navigator.","start":1444,"geo":[37.101,-8.673],"connections":[{"id":"henry-the-navigator","type":"trade","label":"Henry took royal fifth"},{"id":"lancarote-de-freitas","type":"trade","label":"1444 landing"},{"id":"crown-of-portugal","type":"ownership","label":"royal town"}]},{"id":"papal-bulls-1452-1455","name":"Papal bulls Dum Diversas (1452) & Romanus Pontifex (1455)","type":"entity","kind":"Charter / law / treaty","description":"Bulls of Pope Nicholas V authorising Afonso V of Portugal to attack, subjugate and reduce to perpetual servitude 'Saracens and pagans', and confirming Portuguese monopoly rights on the African coast. They provided religious sanction for the Portuguese slave trade and are central to the 'Doctrine of Discovery'; the Vatican formally repudiated that doctrine in 2023.","start":1452,"connections":[{"id":"crown-of-portugal","type":"charter","label":"granted to Afonso V"},{"id":"henry-the-navigator","type":"charter","label":"ratified his conquests"}]},{"id":"treaty-of-tordesillas","name":"Treaty of Tordesillas (1494)","type":"entity","kind":"Charter / law / treaty","description":"Signed 7 June 1494, it divided newly found lands along a meridian 370 leagues west of Cape Verde: Africa and Brazil fell to Portugal, most of the Americas to Castile. Because Spain had no African trading posts, it had to buy enslaved Africans from others — the structural origin of the asiento system.","start":1494,"geo":[41.501,-5.0],"connections":[{"id":"crown-of-castile","type":"political","label":"signatory"},{"id":"crown-of-portugal","type":"political","label":"signatory"},{"id":"spanish-asiento","type":"legacy","label":"led Spain to rely on foreign suppliers"}]},{"id":"waldseemuller-map-1507","name":"Waldseemüller world map (1507)","type":"entity","kind":"Legacy / apology","description":"Printed at Saint-Dié in April 1507 by Martin Waldseemüller and Matthias Ringmann, this map first used the name 'America' in honour of Amerigo Vespucci. Of perhaps 1,000 copies, one survives; the Library of Congress agreed to buy it in 2001 for $10 million and displays it permanently.","start":1507,"geo":[38.889,-77.005],"connections":[{"id":"amerigo-vespucci","type":"legacy","label":"named America after him"}]},{"id":"hispaniola-colony","name":"Hispaniola (La Isabela / Santo Domingo)","type":"entity","kind":"Colony / plantation","description":"Spain's first American colony, founded by Columbus in 1493. Its Taíno population collapsed under forced labour, violence and disease (from perhaps several hundred thousand to c. 11,000 by 1517), and from 1502 it received the first enslaved Africans brought to the Americas; it became an early sugar colony.","start":1493,"geo":[18.486,-69.931],"connections":[{"id":"christopher-columbus","type":"ownership","label":"founded colony"},{"id":"nicolas-de-ovando","type":"plantation","label":"governor 1502–09"},{"id":"crown-of-castile","type":"ownership","label":"Castilian colony"}]},{"id":"sao-tome","name":"São Tomé and Cape Verde (Portuguese island entrepôts)","type":"entity","kind":"Colony / plantation","description":"Portugal colonised Cape Verde in the 1460s and São Tomé and Príncipe from the 1490s. São Tomé pioneered the slave-worked sugar plantation model later transplanted to Brazil, and both islands served as collection points from which the first direct voyages to the Caribbean sailed in the 1520s.","start":1462,"geo":[0.336,6.727],"connections":[{"id":"crown-of-portugal","type":"ownership","label":"Portuguese colonies"},{"id":"charter-1518","type":"trade","label":"departure points of first direct voyages"},{"id":"kingdom-of-kongo","type":"trade","label":"captives from Kongo"}]},{"id":"klein-venedig","name":"Klein-Venedig (Welser Venezuela)","type":"entity","kind":"Colony / plantation","description":"The Province of Venezuela, granted by Charles V to the Welser in 1528 and governed from Coro. Welser governors led violent expeditions searching for El Dorado and enslaved Indigenous people; the grant was revoked after the 1546 killings of Welser agents and formally ended in 1556.","start":1528,"geo":[11.405,-69.673],"connections":[{"id":"welser-family","type":"ownership","label":"Welser colony"},{"id":"crown-of-castile","type":"charter","label":"granted by Charles V"}]},{"id":"cacheu-company","name":"Company of Cacheu (Guinea)","type":"entity","kind":"Chartered company","description":"Portuguese company confirmed in 1676 with privileges to trade on the Guinea coast and export enslaved people to Portugal, its colonies and Spanish America; it failed to control the trade against Luso-African traders such as Bibiana Vaz and folded in 1682. Its successor, the Cacheu and Cape Verde Company (1690–1703), also held the Spanish asiento briefly (1696–1701).","start":1676,"geo":[12.274,-16.165],"connections":[{"id":"crown-of-portugal","type":"charter","label":"royal charter 1676"},{"id":"spanish-asiento","type":"charter","label":"successor held asiento 1696–1701"},{"id":"sao-tome","type":"parallel","label":"Cape Verde link"}]},{"id":"grao-para-maranhao-company","name":"Companhia Geral do Grão-Pará e Maranhão","type":"entity","kind":"Chartered company","description":"Monopoly company founded by Pombal in 1755 to develop northern Brazil, with a 20-year monopoly on trade with Cape Verde and the West African coast (Bissau, Cacheu). It brought c. 25,965 enslaved Africans to Pará and Maranhão 1757–77 (per Reis); Queen Maria I ended it in 1778.","start":1755,"geo":[-1.456,-48.502],"connections":[{"id":"marquis-of-pombal","type":"ownership","label":"founded by Pombal"},{"id":"crown-of-portugal","type":"charter","label":"royal monopoly"}]},{"id":"pernambuco-paraiba-company","name":"Companhia Geral de Pernambuco e Paraíba","type":"entity","kind":"Chartered company","description":"Pombaline monopoly company founded 13 August 1759 for trade with Pernambuco and Paraíba, supplying enslaved people mainly from Angola to Recife; c. 51,806 captives were imported 1760–80. Its monopoly ended around 1780 under Maria I.","start":1759,"geo":[-8.054,-34.881],"connections":[{"id":"marquis-of-pombal","type":"ownership","label":"founded by Pombal"},{"id":"port-luanda","type":"trade","label":"bought captives in Angola"},{"id":"crown-of-portugal","type":"charter","label":"royal monopoly"}]},{"id":"anglo-spanish-treaty-1817","name":"Anglo-Spanish Treaty of 1817 & Cuban abolition (1886)","type":"entity","kind":"Charter / law / treaty","description":"Under British pressure Spain agreed on 23 Sept. 1817 to end its slave trade (north of the Equator at once, wholly from 1820) in exchange for £400,000. Enforcement was weak: an illegal trade to Cuba continued until c. 1867, and slavery in Cuba was abolished only in 1886.","start":1817,"connections":[{"id":"crown-of-castile","type":"political","label":"Spanish signatory"},{"id":"pedro-martinez-cadiz","type":"political","label":"traded illegally after"},{"id":"antonio-lopez-comillas","type":"political","label":"traded illegally after"},{"id":"port-havana","type":"legacy","label":"illegal trade to Cuba"}]},{"id":"portugal-abolition-1836-1869","name":"Portuguese abolition decrees (1836–1869)","type":"entity","kind":"Charter / law / treaty","description":"Sá da Bandeira's decree of 10 December 1836 banned the Portuguese slave trade but was poorly enforced until a treaty with Britain in 1842 and Royal Navy action; gradual emancipation laws followed, and a decree of 25 February 1869 abolished slavery throughout Portuguese territories (forced labour regimes persisted in the colonies).","start":1836,"connections":[{"id":"crown-of-portugal","type":"political","label":"royal decree"},{"id":"port-luanda","type":"legacy","label":"ended legal exports"}]},{"id":"compania-trasatlantica","name":"Compañía Trasatlántica Española","type":"entity","kind":"Chartered company","description":"Shipping line developed by Antonio López from his firm A. López y Cía (formally constituted 1881) with state mail contracts to Cuba, Puerto Rico and the Philippines, built partly on capital from the Cuban slave economy.","start":1881,"geo":[41.385,2.173],"connections":[{"id":"antonio-lopez-comillas","type":"ownership","label":"founded by López"}]},{"id":"lopez-statue-removal-2018","name":"Removal of Antonio López statue, Barcelona (2018)","type":"entity","kind":"Legacy / apology","description":"On 4 March 2018 Barcelona City Council removed the statue of Antonio López from the square bearing his name, after years of campaigning by anti-racist groups; the statue is stored by the Barcelona History Museum and the square was renamed for Idrissa Diallo.","start":2018,"geo":[41.381,2.181],"connections":[{"id":"antonio-lopez-comillas","type":"legacy","label":"statue removed"}]},{"id":"portugal-reparations-2024","name":"Portugal's 2024 reparations debate","type":"entity","kind":"Legacy / apology","description":"In April 2024 President Marcelo Rebelo de Sousa said Portugal 'takes full responsibility' for transatlantic slavery and colonial crimes and should 'pay the costs', suggesting debt relief and financing; the government said it would not begin any reparations process, and the far-right Chega party sought to condemn his remarks.","start":2024,"geo":[38.697,-9.199],"connections":[{"id":"crown-of-portugal","type":"legacy","label":"successor state's stance"}]},{"id":"john-hawkins","name":"John Hawkins","category":"Crowns & Explorers","role":"Trader & Shipper","nation":"Britain","scale":"Significant","scaleBasis":"documented","scaleNote":"Led England's first known slaving voyages (1562–68); the first voyage alone took c. 300 Africans from the Sierra Leone coast for sale in Spanish Hispaniola, and he made three to four such voyages in all.","start":1562,"end":1568,"lifespan":"1532–1595","base":"Plymouth, England","geo":[50.371,-4.143],"aliases":["Sir John Hawkins","John Hawkyns"],"origins":"Son of William Hawkins, a Plymouth merchant who had traded with the Guinea coast and Brazil. He learned of the profits of selling captives to Spanish colonists through contacts in the Canary Islands.","role_summary":"Organised the first English slaving expeditions, seizing and buying Africans in Upper Guinea and selling them in the Spanish Caribbean in defiance of Spain's monopoly. His later voyages were backed by London investors and by Elizabeth I, who lent royal ships.","roleDetail":[{"t":"First English slaving voyage, 1562–63.","d":"Sailed with three ships (Salomon, Swallow, Jonas) to the Sierra Leone coast, took c. 300 captives and sold them in Hispaniola.","basis":"documented"},{"t":"Royal backing.","d":"For the 1564 voyage Elizabeth I lent the 700-ton royal ship Jesus of Lübeck, making the Crown an investor in the trade.","basis":"documented"},{"t":"Defeat at San Juan de Ulúa, 1568.","d":"His third voyage ended when a Spanish fleet attacked his ships in the Mexican harbour; most ships and many men were lost.","basis":"documented"}],"legacy":"Hawkins became Treasurer of the Navy and a commander against the Spanish Armada in 1588, and was knighted. His coat of arms featured a bound African captive. His voyages are now remembered as the beginning of England's involvement in the transatlantic slave trade.","legacyDetail":[{"t":"Naval career rather than slaving.","d":"After 1568 England's slave trade lapsed for nearly a century; Hawkins's later fame rested on reforming the navy.","basis":"documented"},{"t":"Contested commemoration.","d":"Since 2020 places named after Hawkins in Plymouth have faced calls for renaming or contextualisation.","basis":"interpretive"}],"sources":[{"label":"World History Encyclopedia — John Hawkins","url":"https://www.worldhistory.org/John_Hawkins/"},{"label":"Encyclopedia.com — Hawkins, John","url":"https://www.encyclopedia.com/humanities/news-wires-white-papers-and-books/hawkins-john"},{"label":"Royal Museums Greenwich — Sir John Hawkins, 1532-95","url":"https://www.rmg.co.uk/collections/objects/rmgc-object-14229"},{"label":"Wikipedia — John Hawkins (naval commander)","url":"https://en.wikipedia.org/wiki/John_Hawkins_(naval_commander)"}],"connections":[{"id":"elizabeth-i","type":"charter","label":"royal backing & ships"},{"id":"jesus-of-lubeck","type":"voyage","label":"commanded 1564 & 1567"},{"id":"francis-drake","type":"family","label":"kinsman & subordinate"},{"id":"crown-of-castile","type":"political","label":"broke Spanish monopoly"},{"id":"spanish-asiento","type":"parallel","label":"illegal sales outside asiento"},{"id":"port-london","type":"finance","label":"London investors"}]},{"id":"francis-drake","name":"Francis Drake","category":"Crowns & Explorers","role":"Trader & Shipper","nation":"Britain","scale":"Minor","scaleBasis":"documented","scaleNote":"Took part in Hawkins's slaving voyages of the 1560s, captaining the 50-ton Judith on the 1567–68 expedition; he did not run slaving ventures of his own.","start":1566,"end":1568,"lifespan":"c. 1540–1596","base":"Plymouth, England","geo":[50.371,-4.143],"aliases":["Sir Francis Drake"],"origins":"A Devon-born relative of the Hawkins family, he went to sea young and joined the Hawkins family's Atlantic ventures in the 1560s.","role_summary":"Served on Hawkins's slaving voyages to West Africa and the Spanish Caribbean, commanding the Judith in 1567–68. He escaped the 1568 Spanish attack at San Juan de Ulúa, an event that shaped his later privateering against Spain.","roleDetail":[{"t":"Captain of the Judith.","d":"Commanded the smallest ship of Hawkins's third slaving fleet, which raided and traded for captives on the Upper Guinea coast.","basis":"documented"},{"t":"San Juan de Ulúa, 1568.","d":"One of the few ships to escape the Spanish attack; the episode fuelled his raids on Spanish shipping.","basis":"documented"}],"legacy":"Drake became famous for circumnavigating the globe (1577–80) and fighting the Armada. His early involvement in the slave trade is far less commemorated than his naval exploits, and his statues have been questioned since 2020.","legacyDetail":[{"t":"Selective memory.","d":"National narratives long presented Drake as a hero while omitting his slaving voyages.","basis":"interpretive"}],"sources":[{"label":"World History Encyclopedia — John Hawkins","url":"https://www.worldhistory.org/John_Hawkins/"},{"label":"Encyclopedia.com — Hawkins, John","url":"https://www.encyclopedia.com/humanities/news-wires-white-papers-and-books/hawkins-john"}],"connections":[{"id":"john-hawkins","type":"voyage","label":"sailed under Hawkins"},{"id":"jesus-of-lubeck","type":"voyage","label":"same 1567 fleet"},{"id":"elizabeth-i","type":"charter","label":"later royal patron"},{"id":"crown-of-castile","type":"political","label":"raided Spanish colonies"}]},{"id":"elizabeth-i","name":"Elizabeth I of England","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Britain","scale":"Minor","scaleBasis":"documented","scaleNote":"Invested in Hawkins's slaving voyages by lending royal ships, including the Jesus of Lübeck (1564, 1567); England's trade remained small until the 1660s.","start":1564,"end":1568,"lifespan":"1533–1603","base":"London, England","geo":[51.501,-0.142],"aliases":["Queen Elizabeth I"],"origins":"Queen of England from 1558. Her government sought ways to break into Iberian Atlantic commerce without open war with Spain.","role_summary":"Became a shareholder in John Hawkins's slaving expeditions by contributing royal ships. Although reported to have earlier called such trade 'detestable', she backed the voyages for their profits.","roleDetail":[{"t":"Royal investor.","d":"Lent the Jesus of Lübeck to Hawkins's second voyage (1564) and to the third (1567).","basis":"documented"},{"t":"State–merchant partnership.","d":"Established a pattern of Crown backing for slaving later formalised in royal charters under the Stuarts.","basis":"interpretive"}],"legacy":"Her backing made the English Crown a participant in the trade from its start. The Stuart monarchy later chartered the Royal Adventurers (1660) and the Royal African Company (1672).","legacyDetail":[{"t":"Precedent for royal charters.","d":"Later Stuart monarchs went further, granting monopolies and holding shares in slaving companies.","basis":"interpretive"}],"sources":[{"label":"Encyclopedia.com — Hawkins, John","url":"https://www.encyclopedia.com/humanities/news-wires-white-papers-and-books/hawkins-john"},{"label":"Wikipedia — Jesus of Lübeck","url":"https://en.wikipedia.org/wiki/Jesus_of_L%C3%BCbeck"}],"connections":[{"id":"john-hawkins","type":"finance","label":"invested in voyages"},{"id":"jesus-of-lubeck","type":"ownership","label":"royal ship lent"},{"id":"francis-drake","type":"charter","label":"patron"},{"id":"james-duke-of-york","type":"parallel","label":"later royal slave-trade investor"}]},{"id":"james-duke-of-york","name":"James, Duke of York (James II)","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Britain","scale":"Major","scaleBasis":"documented","scaleNote":"Governor and largest shareholder of the Royal African Company, which shipped more Africans than any other single institution in the trade; many captives were branded 'DY' for him.","start":1660,"end":1688,"lifespan":"1633–1701","base":"London, England","geo":[51.505,-0.137],"aliases":["James II","James VII of Scotland"],"origins":"Younger brother of Charles II and Lord High Admiral after the 1660 Restoration. He led the royal circle that founded chartered companies to break Dutch dominance of West African trade.","role_summary":"Headed the Company of Royal Adventurers into Africa and then the Royal African Company as governor. Captives shipped by the company were branded with 'DY' (Duke of York) or 'RAC'.","roleDetail":[{"t":"Governor of the RAC.","d":"He was the company's governor and largest shareholder, keeping the post after becoming king in 1685.","basis":"documented"},{"t":"Branding 'DY'.","d":"Smithsonian records note many enslaved people were branded with 'DY'; others were marked 'RAC'.","basis":"documented"},{"t":"War with the Dutch.","d":"English attacks on Dutch Gold Coast forts in 1664 (including Cape Coast) were part of the Royal Adventurers' war for the trade.","basis":"documented"}],"legacy":"Deposed in 1688, after which Parliament opened the trade (1698). New York is named after him. His role is central to recent debates about the British monarchy's historic links to slavery.","legacyDetail":[{"t":"Monarchy and slavery debate.","d":"His RAC role is regularly cited in calls for the Royal Family to acknowledge its historic links to slavery.","basis":"interpretive"}],"sources":[{"label":"Smithsonian Transcription Center — Stock share certificate for the Royal African Company","url":"https://transcription.si.edu/project/29682"},{"label":"Pepys Diary Encyclopedia — Royal African Company","url":"https://pepysdiary.com/encyclopedia/7105"},{"label":"Wikipedia — Royal African Company","url":"https://en.wikipedia.org/wiki/Royal_African_Company"}],"connections":[{"id":"royal-african-company","type":"ownership","label":"governor & largest shareholder"},{"id":"company-of-royal-adventurers","type":"ownership","label":"leading patron"},{"id":"edward-colston","type":"political","label":"RAC colleague"},{"id":"cape-coast-castle","type":"political","label":"seized from Dutch-allied control 1664"},{"id":"dutch-west-india-company","type":"political","label":"rival in Anglo-Dutch wars"},{"id":"elizabeth-i","type":"parallel","label":"earlier royal investor"}]},{"id":"royal-african-company","name":"Royal African Company","category":"Companies & Banks","role":"Trader & Shipper","nation":"Britain","scale":"Dominant","scaleBasis":"documented","scaleNote":"Per SlaveVoyages data cited by historian William Pettigrew, c. 187,700 Africans were carried on 653 company voyages (1672–1731), of whom c. 38,500 died at sea; Pettigrew argues it shipped more captives than any other single institution.","start":1672,"end":1752,"lifespan":"1672–1752","base":"African House, Leadenhall Street, London","geo":[51.513,-0.082],"aliases":["RAC","Royal African Company of England"],"origins":"Chartered in 1672 by Charles II as successor to the failed Company of Royal Adventurers into Africa, with a monopoly on English trade along the West African coast. Royal family members, courtiers and London merchants were its shareholders.","role_summary":"Bought captives from African rulers and merchants at forts such as Cape Coast Castle and shipped them to Barbados, Jamaica and other English colonies, branding many with 'DY' or 'RAC'. It also traded gold, ivory and other goods.","roleDetail":[{"t":"Monopoly charter.","d":"Held a legal monopoly of English trade to West Africa from 1672 until Parliament opened the trade in 1698 (with a 10% duty on private traders until 1712).","basis":"documented"},{"t":"Fort network.","d":"Ran Cape Coast Castle as its Gold Coast headquarters and also held Bunce Island and James Island (Gambia).","basis":"documented"},{"t":"Branding.","d":"Many captives were branded 'DY' for the Duke of York or 'RAC' on the chest.","basis":"documented"}],"legacy":"Weakened by private competition after 1698, the company effectively stopped trading in the 1720s and was replaced in 1750–52 by the Company of Merchants Trading to Africa. Its records survive at The National Archives; its leaders' names, notably Colston's, remain contested in Bristol and London.","legacyDetail":[{"t":"Opening of the trade.","d":"The end of the monopoly let thousands of private merchants from London, Bristol and Liverpool enter the trade, greatly increasing British volumes.","basis":"documented"},{"t":"Successor body.","d":"Its forts passed to the Company of Merchants Trading to Africa, which ran them until 1821.","basis":"documented"}],"sources":[{"label":"Wikipedia — Royal African Company","url":"https://en.wikipedia.org/wiki/Royal_African_Company"},{"label":"Smithsonian Transcription Center — Stock share certificate for the Royal African Company","url":"https://transcription.si.edu/project/29682"},{"label":"Schools History — Lifting of the Royal African Company monopoly","url":"https://schoolshistory.org.uk/topics/british-empire/economic-consequences-of-empire/lifting-of-the-royal-african-company-monopoly/"},{"label":"PBS Africans in America — The Royal African Company","url":"https://www.pbs.org/wgbh/aia/part1/1p269.html"}],"connections":[{"id":"james-duke-of-york","type":"ownership","label":"governor"},{"id":"edward-colston","type":"ownership","label":"member & deputy governor"},{"id":"company-of-royal-adventurers","type":"legacy","label":"successor to"},{"id":"company-of-merchants-trading-to-africa","type":"legacy","label":"replaced by (1752)"},{"id":"cape-coast-castle","type":"ownership","label":"Gold Coast headquarters"},{"id":"bunce-island","type":"ownership","label":"earlier fort"},{"id":"port-london","type":"trade","label":"based in London"},{"id":"asante-empire","type":"trade","label":"Gold Coast trading partners"}]},{"id":"edward-colston","name":"Edward Colston","category":"European Families","role":"Trader & Shipper","nation":"Britain","scale":"Significant","scaleBasis":"estimated","scaleNote":"During his Royal African Company involvement (1680–92) the company is commonly estimated to have transported c. 80,000 Africans; the figure is an estimate and varies by source.","start":1680,"end":1692,"lifespan":"1636–1721","base":"Bristol / London, England","geo":[51.454,-2.597],"aliases":[],"origins":"Born in Bristol to a merchant family, he made his fortune as a London merchant trading to Spain, Portugal and the Mediterranean. He joined the Royal African Company in 1680.","role_summary":"Held shares in the Royal African Company and sat on its governing court, serving as deputy governor in 1689–90. His wealth funded schools, almshouses and churches in Bristol, which commemorated him for three centuries.","roleDetail":[{"t":"RAC official.","d":"Member of the RAC's Court of Assistants and its deputy governor (1689–90).","basis":"documented"},{"t":"Philanthropist of slave-trade wealth.","d":"Endowed Bristol schools and almshouses; the 1895 statue presented him as a benefactor without mentioning slavery.","basis":"documented"}],"legacy":"On 7 June 2020 Black Lives Matter protesters toppled his statue and pushed it into Bristol Harbour; it is now displayed, graffitied, at the M Shed museum. Colston Hall was renamed Bristol Beacon in 2020, and other Bristol institutions dropped his name.","legacyDetail":[{"t":"Statue toppled, 2020.","d":"Four people charged with criminal damage were acquitted by a jury in January 2022.","basis":"documented"},{"t":"Renaming.","d":"Colston Hall became Bristol Beacon (announced 23 September 2020) after a campaign begun in 2017.","basis":"documented"}],"sources":[{"label":"Wikipedia — Statue of Edward Colston","url":"https://en.wikipedia.org/wiki/Statue_of_Edward_Colston"},{"label":"CBS News — Edward Colston statue thrown into Bristol harbor","url":"https://www.cbsnews.com/news/george-floyd-protest-edward-colston-statue-thrown-into-bristol-harbor-today-2020-06-07"},{"label":"Al Jazeera — Four charged over toppling of UK slave trader statue in Bristol","url":"https://www.aljazeera.com/news/2020/12/9/four-charged-over-toppling-of-uk-slave-trader-statue-in-bristol"},{"label":"DJ Mag — Colston Hall officially renamed Bristol Beacon","url":"https://djmag.com/news/bristol-venue-colston-hall-officially-renamed-bristol-beacon"}],"connections":[{"id":"royal-african-company","type":"ownership","label":"deputy governor 1689–90"},{"id":"james-duke-of-york","type":"political","label":"RAC governor"},{"id":"port-bristol","type":"legacy","label":"Bristol benefactor"},{"id":"statue-of-edward-colston","type":"legacy","label":"statue toppled 2020"},{"id":"church-of-england","type":"legacy","label":"benefactor of Queen Anne's Bounty"}]},{"id":"south-sea-company","name":"South Sea Company","category":"Companies & Banks","role":"Trader & Shipper","nation":"Britain","scale":"Major","scaleBasis":"estimated","scaleNote":"Held the 1713 asiento allowing 4,800 captives a year to Spanish America for 30 years; actual deliveries fell far short, and the Church Commissioners' 2023 report cites c. 34,000 people transported, while other estimates are higher.","start":1713,"end":1750,"lifespan":"1711–1853","base":"South Sea House, Threadneedle Street, London","geo":[51.514,-0.086],"aliases":["The Governor and Company of the merchants of Great Britain, trading to the South Seas"],"origins":"Founded in 1711 as a public–private scheme to consolidate British government debt in exchange for trading privileges in Spanish America.","role_summary":"Under the Treaty of Utrecht (1713) it received the asiento, the contract to supply enslaved Africans to Spanish colonies, plus one annual trading ship. It bought captives (often from the Royal African Company and in Jamaica) and shipped them to ports such as Cartagena, Portobelo, Veracruz and Buenos Aires.","roleDetail":[{"t":"The asiento.","d":"Contract for 4,800 enslaved people a year for 30 years, plus a 'navío de permiso' for general trade.","basis":"documented"},{"t":"Slave trade or contraband cover?","d":"Historians disagree on whether the slave trade was profitable or mainly a cover for smuggling; disputes fed the 1739 War of Jenkins' Ear.","basis":"interpretive"},{"t":"The 1720 Bubble.","d":"Speculation in its shares produced the South Sea Bubble crash of 1720.","basis":"documented"}],"legacy":"The asiento was surrendered in 1750 and the company wound up in 1853. Its shareholders included Queen Anne's Bounty (Church of England), whose stake was the main basis of the Church Commissioners' 2023 £100m commitment.","legacyDetail":[{"t":"Church investment.","d":"By 1777 Queen Anne's Bounty held £406,942 of South Sea stock, per the Church Commissioners' 2023 report.","basis":"documented"}],"sources":[{"label":"Wikipedia — South Sea Company","url":"https://en.wikipedia.org/wiki/South_Sea_Company"},{"label":"Britannica — Asiento de negros","url":"https://www.britannica.com/print/article/38687"},{"label":"University of Southampton — South Sea Company and the asiento (working paper)","url":"https://www.southampton.ac.uk/assets/imported/transforms/content-block/UsefulDownloads_Download/326F907A8F434B05B2199578407AA4B6/0924.pdf"},{"label":"Church Times — Church Commissioners to set aside £100 million","url":"https://www.churchtimes.co.uk/articles/2023/13-january/news/uk/church-commissioners-to-set-aside-100-million-to-compensate-for-slave-trade-links"}],"connections":[{"id":"spanish-asiento","type":"charter","label":"held asiento 1713–50"},{"id":"crown-of-castile","type":"charter","label":"Spanish Crown contract"},{"id":"royal-african-company","type":"trade","label":"bought captives from"},{"id":"church-of-england","type":"finance","label":"Queen Anne's Bounty shareholder"},{"id":"port-london","type":"trade","label":"London base"},{"id":"bank-of-england","type":"political","label":"rival in public-debt finance"}]},{"id":"lascelles-family","name":"Lascelles family (Earls of Harewood)","category":"European Families","role":"Planter & Enslaver","nation":"Britain","scale":"Major","scaleBasis":"documented","scaleNote":"Edwin Lascelles at one point owned or managed 24 West Indian plantations with over 3,000 enslaved people (per Harewood House Trust); by 1787 the family held over 27,000 acres in Barbados, Jamaica, Grenada and Tobago (per University of York).","start":1712,"end":1838,"lifespan":"c. 1712–1975 (Caribbean holdings)","base":"Harewood House, Yorkshire / Barbados","geo":[53.896,-1.509],"aliases":["Henry Lascelles","Edwin Lascelles","Earls of Harewood"],"origins":"A Yorkshire gentry family; Henry Lascelles (1690–1753) went to Barbados, became Collector of Customs, and built a fortune as a merchant, slave trader, government contractor and lender to planters.","role_summary":"Combined slave trading, sugar shipping and plantation lending; foreclosures on indebted planters made them owners of many estates. Their profits built Harewood House (1759–71).","roleDetail":[{"t":"Merchant and lender.","d":"Henry Lascelles supplied enslaved Africans and credit to planters in Barbados; defaults brought plantations into the family.","basis":"documented"},{"t":"Compensation claims.","d":"Henry, 2nd Earl of Harewood, was awarded compensation, e.g. £6,486 for 292 people on Belle estate, Barbados (per LBS claim records).","basis":"documented"},{"t":"Resistance on their estates.","d":"Enslaved people on Lascelles plantations took part in Bussa's Rebellion in Barbados in 1816.","basis":"documented"}],"legacy":"The family kept four Barbados plantations into the 20th century and sold its last Caribbean estate in 1975. Harewood House Trust now researches and presents this history, and David Lascelles co-founded the Heirs of Slavery group.","legacyDetail":[{"t":"Public acknowledgement.","d":"Harewood has acknowledged that the house was built with slavery profits and runs school sessions on the trade.","basis":"documented"},{"t":"Heirs of Slavery.","d":"David Lascelles, 8th Earl, co-founded the group with Laura Trevelyan.","basis":"documented"}],"sources":[{"label":"University of York — Harewood and slavery project","url":"https://www.york.ac.uk/projects/harewoodslavery/"},{"label":"Harewood House Trust — Lascelles, slavery and the West Indies","url":"https://harewood.org/?p=5855"},{"label":"UCL LBS — Henry Lascelles, 2nd Earl of Harewood","url":"https://www.ucl.ac.uk/lbs/person/view/2146638743"},{"label":"UCL LBS — Claim, Belle estate, Barbados","url":"https://www.ucl.ac.uk/lbs/claim/view/5922"}],"connections":[{"id":"harewood-house","type":"legacy","label":"built from slavery profits"},{"id":"slavery-abolition-act-1833","type":"legacy","label":"compensation awards"},{"id":"heirs-of-slavery","type":"legacy","label":"co-founded by David Lascelles"},{"id":"trevelyan-family","type":"political","label":"Heirs of Slavery partners"},{"id":"ucl-legacies-of-british-slavery","type":"legacy","label":"documented in LBS"},{"id":"port-london","type":"trade","label":"London sugar house"}]},{"id":"beckford-family","name":"Beckford family","category":"European Families","role":"Planter & Enslaver","nation":"Britain","scale":"Major","scaleBasis":"documented","scaleNote":"Among Jamaica's largest planter dynasties; William Thomas Beckford inherited (1770) about £1 million, Fonthill, and Jamaican plantations with about 3,000 enslaved people.","start":1662,"end":1838,"lifespan":"1662–1844","base":"Fonthill, Wiltshire / Jamaica","geo":[51.085,-2.115],"aliases":["Peter Beckford","Alderman William Beckford","William Thomas Beckford"],"origins":"Peter Beckford (c. 1643–1710) went to Jamaica in 1662, bought land and rose to acting governor. Later generations accumulated a large network of sugar estates.","role_summary":"Owned and profited from Jamaican sugar plantations worked by enslaved people, as absentee owners after the move to England. Alderman William Beckford (1709–70) was MP and twice Lord Mayor of London (1762, 1769) and a leader of the West India interest.","roleDetail":[{"t":"Political power.","d":"Alderman Beckford used City of London office and Parliament to defend planter interests.","basis":"documented"},{"t":"Tacky's War, 1760.","d":"Enslaved people on his Esher estate in St Mary joined the 1760 uprising, which was crushed with mass executions.","basis":"documented"},{"t":"Conspicuous consumption.","d":"His son spent the fortune on Fonthill Abbey and art collecting.","basis":"documented"}],"legacy":"Fonthill Abbey's tower collapsed in 1825 after the fortune declined. A statue of Alderman Beckford still stands in London's Guildhall, and there have been calls to add context about the people he enslaved.","legacyDetail":[{"t":"Guildhall statue.","d":"Campaigners have argued that its inscription should acknowledge the 3,000 enslaved Africans behind the family's wealth.","basis":"documented"}],"sources":[{"label":"Wikipedia — William Beckford (politician)","url":"https://en.wikipedia.org/wiki/William_Beckford_(politician)"},{"label":"National Gallery — William Thomas Beckford","url":"https://www.nationalgallery.org.uk/people/william-thomas-beckford"},{"label":"National Trust for Scotland — William Beckford (1760–1844), part one","url":"https://www.nts.org.uk/stories/william-beckford-1760-1844-part-one"}],"connections":[{"id":"port-london","type":"political","label":"Lord Mayor of London"},{"id":"lascelles-family","type":"political","label":"fellow West India interest"},{"id":"hibbert-family","type":"political","label":"West India lobby"},{"id":"slavery-abolition-act-1833","type":"parallel","label":"planter class compensated"}]},{"id":"hibbert-family","name":"Hibbert family","category":"European Families","role":"Broker & Agent","nation":"Britain","scale":"Significant","scaleBasis":"estimated","scaleNote":"Jamaica slave factors, planters and London West India merchants; one estimate puts family holdings at c. 900 enslaved people (figures vary by source).","start":1734,"end":1838,"lifespan":"c. 1734–1838","base":"London / Kingston, Jamaica","geo":[51.506,-0.022],"aliases":["George Hibbert","Thomas Hibbert","Robert Hibbert"],"origins":"A Manchester merchant family; Thomas Hibbert settled in Kingston, Jamaica in the 1730s and became a leading factor selling newly arrived African captives to planters.","role_summary":"Sold enslaved Africans in Jamaica, owned plantations, and ran the London house that shipped sugar and supplies. George Hibbert (1757–1837) led the London pro-slavery lobby and the West India Dock Company.","roleDetail":[{"t":"Slave factors in Kingston.","d":"Bought cargoes of captives from slave ships and resold them to planters.","basis":"documented"},{"t":"Pro-slavery lobbyist.","d":"George Hibbert, MP and London alderman, spoke against abolition of the slave trade (per LBS).","basis":"documented"},{"t":"Dock builder.","d":"A founding director and chairman of the West India Dock Company (docks opened 1802).","basis":"documented"}],"legacy":"The West India Docks now house the Museum of London Docklands, whose 'London, Sugar & Slavery' gallery and 'Slavery, Culture and Collecting' display examine George Hibbert. A later Robert Hibbert founded the Hibbert Trust, a theological charity.","legacyDetail":[{"t":"Museum display.","d":"The Museum of London Docklands presents Hibbert as collector, philanthropist and enslaver.","basis":"documented"}],"sources":[{"label":"UCL LBS — George Hibbert","url":"https://lbs.ucl.ac.uk/lbs/person/view/16791"},{"label":"London Museum — Portrait of George Hibbert","url":"https://www.londonmuseum.org.uk/collections/v/object-726143/portrait-of-george-hibbert/"},{"label":"Museum of London Docklands — Slavery, Culture and Collecting","url":"https://www.museumoflondon.org.uk/museum-london-docklands/whats-on/exhibitions/slavery-culture-and-collecting"}],"connections":[{"id":"west-india-docks","type":"ownership","label":"chaired dock company"},{"id":"port-london","type":"trade","label":"London West India house"},{"id":"beckford-family","type":"political","label":"West India interest"},{"id":"slavery-abolition-act-1833","type":"political","label":"lobbied on compensation"},{"id":"ucl-legacies-of-british-slavery","type":"legacy","label":"documented in LBS"}]},{"id":"gladstone-family","name":"Gladstone family (Sir John Gladstone)","category":"European Families","role":"Planter & Enslaver","nation":"Britain","scale":"Major","scaleBasis":"documented","scaleNote":"Per LBS, Sir John Gladstone owned or held mortgages over 2,508 enslaved people in British Guiana and Jamaica and received c. £106,769 compensation, among the largest awards to any individual.","start":1803,"end":1851,"lifespan":"1764–1851 (Sir John)","base":"Liverpool, England / Demerara (Guyana)","geo":[53.408,-2.991],"aliases":["Sir John Gladstone","John Gladstones"],"origins":"Born in Leith, John Gladstone made a fortune in Liverpool trading Calcutta goods, Virginia tobacco and American grain. From 1803 he bought sugar estates in Demerara, including Vreedenhoop (1826, 430 enslaved people).","role_summary":"Absentee owner of plantations in British Guiana and Jamaica and a leading defender of slavery in Parliament and the press. After emancipation he pioneered shipping indentured labourers from India to his Guiana estates (1838).","roleDetail":[{"t":"Demerara 1823.","d":"The 1823 Demerara uprising began on his Success plantation; its violent suppression shaped the abolition debate.","basis":"documented"},{"t":"Compensation.","d":"Received c. £106,769 in 1830s compensation (per LBS), including c. £15,052 for 806 people in Jamaica.","basis":"documented"},{"t":"Indenture.","d":"Organised the first shipment of Indian indentured labourers to British Guiana.","basis":"documented"}],"legacy":"His son William Ewart Gladstone became Liberal prime minister; family wealth endowed institutions such as Gladstone's Library. In August 2023 descendants apologised in Guyana and pledged c. £100,000 toward a University of Guyana institute; Guyanese critics called it insufficient.","legacyDetail":[{"t":"2023 apology.","d":"Charles Gladstone read the apology at the University of Guyana on 25 August 2023.","basis":"documented"},{"t":"Reparations debate.","d":"President Irfaan Ali did not attend and called for state reparations.","basis":"documented"}],"sources":[{"label":"UCL LBS — John Gladstone","url":"http://wwwdepts-live.ucl.ac.uk/lbs/person/view/8961"},{"label":"AP via WSLS — Descendants of a British owner of slaves in Guyana apologize","url":"https://www.wsls.com/news/2023/08/25/descendants-of-a-british-owner-of-slaves-in-guyana-apologize-as-caribbean-nation-seeks-reparations/"},{"label":"ITV News — William Gladstone's descendants to apologise","url":"https://www.itv.com/news/2023-08-19/william-gladstones-descendants-to-apologise-for-familys-part-in-slave-trade"}],"connections":[{"id":"slavery-abolition-act-1833","type":"legacy","label":"c. £106,769 compensation"},{"id":"slave-compensation-commission","type":"legacy","label":"claimant"},{"id":"port-liverpool","type":"trade","label":"Liverpool merchant"},{"id":"heirs-of-slavery","type":"legacy","label":"descendants joined apology movement"},{"id":"ucl-legacies-of-british-slavery","type":"legacy","label":"documented in LBS"},{"id":"trevelyan-family","type":"parallel","label":"2023 family apology"}]},{"id":"codrington-family","name":"Codrington family","category":"European Families","role":"Planter & Enslaver","nation":"Britain","scale":"Significant","scaleBasis":"documented","scaleNote":"Held Betty's Hope and other Antigua estates and leased Barbuda for generations; per LBS, Betty's Hope held 380 enslaved people in 1817 and Clare Hall's 1835 award was £4,442 for 296 people.","start":1674,"end":1838,"lifespan":"c. 1670s–1838","base":"Betty's Hope, Antigua","geo":[17.105,-61.763],"aliases":["Christopher Codrington","Sir Christopher Bethell Codrington"],"origins":"Christopher Codrington the elder moved from Barbados to Antigua and founded Betty's Hope in the 1670s. His son Christopher (1668–1710) was Governor of the Leeward Islands and a fellow of All Souls, Oxford.","role_summary":"Ran sugar plantations on Antigua and Barbados and leased Barbuda, enslaving thousands over two centuries. Christopher Codrington's 1710 will left two Barbados plantations, with their enslaved workers, to the Society for the Propagation of the Gospel, and £10,000 to All Souls for a library.","roleDetail":[{"t":"1710 bequest.","d":"Left the Barbados estates to the SPG (Church of England missionary society) and £10,000 to All Souls College.","basis":"documented"},{"t":"West India politics.","d":"Christopher Bethell Codrington was a Tory MP for Tewkesbury (1797–1812) who opposed abolition of the slave trade (per LBS).","basis":"documented"}],"legacy":"In 2020 All Souls stopped calling its library the Codrington Library, added a memorial plaque, and pledged £100,000 to Codrington College, Barbados, but kept his statue. Barbuda's main town is still named Codrington.","legacyDetail":[{"t":"All Souls renaming, 2020.","d":"The college made 'plain its abhorrence of slavery' but critics say the statue should go.","basis":"documented"}],"sources":[{"label":"UCL LBS — Claim, Clare Hall, Antigua","url":"https://www.ucl.ac.uk/lbs/claim/view/642"},{"label":"All Souls College — All Souls College and the Codrington legacy","url":"https://www.asc.ox.ac.uk/node/3693"},{"label":"Wikipedia — Codrington Plantations","url":"https://en.wikipedia.org/wiki/Codrington_Plantations"}],"connections":[{"id":"codrington-plantations-barbados","type":"ownership","label":"founded & bequeathed"},{"id":"church-of-england","type":"legacy","label":"bequest to SPG"},{"id":"all-souls-codrington-library","type":"legacy","label":"£10,000 library bequest"},{"id":"slavery-abolition-act-1833","type":"legacy","label":"Antigua compensation"},{"id":"ucl-legacies-of-british-slavery","type":"legacy","label":"documented in LBS"}]},{"id":"trevelyan-family","name":"Trevelyan family","category":"European Families","role":"Planter & Enslaver","nation":"Britain","scale":"Minor","scaleBasis":"documented","scaleNote":"Owned c. 1,000 enslaved people on six Grenada plantations and received c. £34,000 compensation in the 1830s (c. £3m today), per family statements and press reports.","start":1763,"end":1838,"lifespan":"c. 1760s–1838 (Grenada estates)","base":"England / Grenada","geo":[12.116,-61.679],"aliases":["Trevelyan baronets"],"origins":"An English gentry family of baronets and later public servants and historians. Grenada became British in 1763; the exact date the family acquired its estates is not confirmed here.","role_summary":"Absentee owners of sugar plantations in Grenada worked by enslaved Africans, compensated when slavery ended. They are now best known for their descendants' 2023 apology.","roleDetail":[{"t":"Grenada estates.","d":"Six plantations with c. 1,000 enslaved people.","basis":"documented"},{"t":"Compensation.","d":"c. £34,000 awarded in the 1830s under the 1833 Act.","basis":"documented"}],"legacy":"On 27 February 2023 former BBC journalist Laura Trevelyan and relatives apologised in Grenada and gave £100,000 toward a community fund; the Grenada National Reparations Commission welcomed it. She co-founded Heirs of Slavery with David Lascelles.","legacyDetail":[{"t":"2023 apology.","d":"A letter signed by seven family members called slavery a crime against humanity.","basis":"documented"},{"t":"Call for state reparations.","d":"Family member John Dower urged the UK government to negotiate with CARICOM.","basis":"documented"}],"sources":[{"label":"APPG on Afrikan Reparations — British slave owners' family issue public apology in Grenada","url":"https://www.appg-ar.org/news/british-slave-owners-family-issue-public-apology-and-reparations-in-grenada"},{"label":"Inverness Courier (PA) — Family descended from slaveowners to apologise and pay £100,000 to Grenada","url":"https://www.inverness-courier.co.uk/news/national/family-descended-from-slaveowners-to-apologise-and-pay-100-000-to-grenada-69841/"},{"label":"Antigua Observer — Trevelyan family's slavery apology seen as significant move","url":"https://antiguaobserver.com/?p=256311"}],"connections":[{"id":"slavery-abolition-act-1833","type":"legacy","label":"c. £34,000 compensation"},{"id":"heirs-of-slavery","type":"legacy","label":"co-founded group"},{"id":"lascelles-family","type":"political","label":"Heirs of Slavery partner"},{"id":"gladstone-family","type":"parallel","label":"2023 apology"}]},{"id":"richard-oswald","name":"Richard Oswald","category":"European Families","role":"Trader & Shipper","nation":"Britain","scale":"Major","scaleBasis":"estimated","scaleNote":"Lead partner of Grant, Oswald & Co., which ran Bunce Island, the largest British slave fort on the Upper Guinea 'Rice Coast'; it shipped thousands of captives, many to South Carolina rice planters.","start":1748,"end":1784,"lifespan":"1705–1784","base":"London, England","geo":[51.511,-0.085],"aliases":["Grant, Oswald & Co."],"origins":"A Scottish merchant from Caithness who trained in Glasgow and became a wealthy London merchant and army contractor during the Seven Years' War.","role_summary":"With Alexander Grant and partners he bought Bunce Island in 1748, rebuilt its fort, and made it a major slave-trading depot. Henry Laurens sold the firm's captives in Charleston on commission.","roleDetail":[{"t":"Bunce Island.","d":"The partners rebuilt the fort, added a shipyard and expanded its African workforce.","basis":"documented"},{"t":"Charleston link.","d":"Laurens took 10% commission on sales of Bunce Island captives in South Carolina.","basis":"documented"},{"t":"Peace negotiator.","d":"He was Britain's chief negotiator for the 1782–83 Treaty of Paris, facing his former agent Laurens.","basis":"documented"}],"legacy":"Oswald's Ayrshire estate, Auchincruive, was bought with trade profits. Bunce Island passed to his nephews the Andersons, is now a protected Sierra Leone heritage site, and is a focus for Gullah Geechee descendants in the US.","legacyDetail":[{"t":"Scottish legacies.","d":"The University of Edinburgh's Managing Imperial Legacies project examines his career.","basis":"documented"}],"sources":[{"label":"Wikipedia — Richard Oswald (merchant)","url":"https://en.wikipedia.org/wiki/Richard_Oswald_(merchant)"},{"label":"Yale Gilder Lehrman Center — Bunce Island history","url":"https://macmillan.yale.edu/glc/bunce-island-history"},{"label":"University of Edinburgh — Richard Oswald and Bunce Island, Sierra Leone","url":"https://blogs.ed.ac.uk/managingimperiallegacies/2020/06/22/richard-oswald-and-bunce-island-sierra-leone/"}],"connections":[{"id":"bunce-island","type":"ownership","label":"bought 1748"},{"id":"henry-laurens","type":"trade","label":"Charleston sales agent"},{"id":"port-charleston","type":"trade","label":"main market"},{"id":"port-london","type":"trade","label":"London base"},{"id":"caulker-family","type":"trade","label":"Sherbro-area trading partners"}]},{"id":"tarleton-family","name":"Tarleton family","category":"European Families","role":"Trader & Shipper","nation":"Britain","scale":"Significant","scaleBasis":"documented","scaleNote":"One of Liverpool's largest merchant houses; the Tarleton brothers had 39 ships registered in Liverpool between 1786 and 1804, many of them in the slave trade.","start":1750,"end":1807,"lifespan":"c. 1740s–1807","base":"Liverpool, England","geo":[53.405,-2.992],"aliases":["John Tarleton","Clayton Tarleton","Banastre Tarleton"],"origins":"John Tarleton (1718–73) built a fortune in the Caribbean sugar trade and slaving voyages, continuing earlier family trade with the West Indies and Africa. His sons John, Clayton and Thomas ran the family firm.","role_summary":"Financed and dispatched slaving voyages from Liverpool and traded West India produce. The family dominated Liverpool politics in defence of the trade: Clayton was mayor (1792) and Banastre was MP for Liverpool (1790–1812).","roleDetail":[{"t":"Family shipping firm.","d":"39 Liverpool-registered ships 1786–1804.","basis":"documented"},{"t":"Banastre in Parliament.","d":"The cavalry commander of the American war was a vocal Commons defender of the slave trade, though he never joined the family business.","basis":"documented"}],"legacy":"Family papers (1678–1838) document their slave-trade dealings. Banastre's portraits and Liverpool memorials have been re-examined since 2020.","legacyDetail":[{"t":"Reassessment.","d":"The University of Liverpool's Victoria Gallery revisited Banastre Tarleton's reputation in 2020.","basis":"documented"}],"sources":[{"label":"University of Liverpool Victoria Gallery & Museum — Hero to Zero","url":"https://vgm.liverpool.ac.uk/blog/2020/hero-to-zero"},{"label":"British Online Archives — Papers of the Tarleton family 1678–1838","url":"https://britishonlinearchives.com/collections/37/american-slave-trade-records-and-other-papers-of-the-tarleton-family-1678-1838"},{"label":"Wikipedia — Banastre Tarleton","url":"https://en.wikipedia.org/wiki/Banastre_Tarleton"}],"connections":[{"id":"port-liverpool","type":"trade","label":"Liverpool slaving house"},{"id":"slave-trade-act-1807","type":"political","label":"opposed abolition"},{"id":"earle-family","type":"political","label":"fellow Liverpool traders"},{"id":"thomas-leyland","type":"political","label":"Liverpool council allies"}]},{"id":"earle-family","name":"Earle family","category":"European Families","role":"Trader & Shipper","nation":"Britain","scale":"Significant","scaleBasis":"estimated","scaleNote":"Multi-generational Liverpool slave traders whose archive is the Merseyside Maritime Museum's largest on the trade; voyage totals are not given here.","start":1751,"end":1807,"lifespan":"c. 1700s–1807 (slave trade)","base":"Liverpool, England","geo":[53.406,-2.99],"aliases":["William Earle","Thomas Earle","T. & W. Earle & Co."],"origins":"A Liverpool merchant family active from the early 18th century. Brothers William (1721–88) and Thomas Earle became prominent slave-ship owners and traders.","role_summary":"Sent slaving voyages to the Bight of Biafra (Old Calabar), the Gold Coast and elsewhere. Through Livorno they imported Italian glass beads used as trade goods, and they supplied William Davenport.","roleDetail":[{"t":"Calabar voyages.","d":"A 1751 letter of instruction for a slaving voyage to Calabar survives, along with a letter to an African trader about two relatives taken 'in error'.","basis":"documented"},{"t":"Bead supply chain.","d":"The Earles brought many of Davenport's bead cargoes from Livorno.","basis":"documented"}],"legacy":"Sir George Earle donated the family papers to Merseyside Maritime Museum in 1993. They underpin research at the International Slavery Museum.","legacyDetail":[{"t":"Archive donation.","d":"Seventeen boxes covering the 1700s to the 1930s.","basis":"documented"}],"sources":[{"label":"National Museums Liverpool — Family and business papers of the Earle family","url":"https://liverpoolmuseums.org.uk/artifact/family-and-business-papers-of-earle-family-liverpool-merchant-and-slave-traders"},{"label":"UCL LBS — William Earle","url":"https://lbs.ucl.ac.uk/lbs/person/view/8728"},{"label":"Historic Society of Lancashire and Cheshire — Littler, The Earle collection","url":"https://www.hslc.org.uk/wp-content/uploads/2017/05/146-5-Littler.pdf"}],"connections":[{"id":"port-liverpool","type":"trade","label":"Liverpool slaving house"},{"id":"william-davenport","type":"trade","label":"supplied beads, partner"},{"id":"old-calabar-efik","type":"trade","label":"bought captives at Calabar"},{"id":"international-slavery-museum","type":"legacy","label":"papers held"}]},{"id":"william-davenport","name":"William Davenport","category":"European Families","role":"Trader & Shipper","nation":"Britain","scale":"Major","scaleBasis":"documented","scaleNote":"Invested in about 160 slaving voyages in about 70 vessels (per National Museums Liverpool), carrying almost 40,000 Africans; by ships disembarked, possibly Liverpool's most prolific slave trader.","start":1748,"end":1797,"lifespan":"1725–1797","base":"Liverpool, England","geo":[53.405,-2.99],"aliases":["William Davenport & Co."],"origins":"Born in London, he was apprenticed to the Liverpool slave trader William Whaley, with whom he invested in eight voyages in 1748–53.","role_summary":"Took shares in slaving voyages to the Cameroons, Old Calabar and elsewhere, and specialised in supplying trade goods, especially glass beads from Italy, Silesia and Bohemia, which made up a quarter to a half of some cargoes.","roleDetail":[{"t":"Bead merchant.","d":"In the 1770s beads made up 25–50% of the value of his cargoes to the Cameroons.","basis":"documented"},{"t":"Diversified trader.","d":"Also dealt in ivory, sugar, coffee and tobacco.","basis":"documented"}],"legacy":"His business archive at Merseyside Maritime Museum is one of the most complete records of an 18th-century slave-trading firm and a key source for historians such as David Richardson.","legacyDetail":[{"t":"Research archive.","d":"Davenport & Co. papers (1745–97) include bead and cowrie account books.","basis":"documented"}],"sources":[{"label":"National Museums Liverpool — Archives of William Davenport (1725–1797)","url":"https://liverpoolmuseums.org.uk/artifact/archives-of-william-davenport-1725-1797"},{"label":"Gresham College — Liverpool and the slave trade","url":"https://www.gresham.ac.uk/node/11732"},{"label":"Wikipedia — William Davenport (slave trader)","url":"https://en.wikipedia.org/wiki/William_Davenport_(slave_trader)"}],"connections":[{"id":"port-liverpool","type":"trade","label":"Liverpool investor"},{"id":"earle-family","type":"trade","label":"bead supply partners"},{"id":"old-calabar-efik","type":"trade","label":"Calabar voyages"},{"id":"international-slavery-museum","type":"legacy","label":"archive held"}]},{"id":"thomas-leyland","name":"Thomas Leyland","category":"European Families","role":"Financier & Insurer","nation":"Britain","scale
