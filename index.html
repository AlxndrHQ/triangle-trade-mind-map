.","d":"At least 162 people owned by the Georgia bank; at least 529 pledged to the Bank of Charleston (Wachovia 2005).","basis":"documented"},{"t":"Incomplete records.","d":"The bank said gaps in the records make the true numbers unknowable.","basis":"documented"}],"legacy":"CEO Ken Thompson apologised in June 2005 after research required by Chicago's ordinance; Chicago officials criticised the bank for first filing an affidavit denying any ties.","legacyDetail":[{"t":"2005 apology.","d":"Wachovia also pledged support for African American history education.","basis":"documented"}],"sources":[{"label":"CNN Money — Wachovia apologizes for slavery ties (2005)","url":"https://money.cnn.com/2005/06/02/news/fortune500/wachovia_slavery/"},{"label":"NBC News — Wachovia apologizes to black Americans","url":"https://www.nbcnews.com/id/wbna8076165"},{"label":"JURIST — Fourth-largest US bank apologizes for slavery ties","url":"https://www.jurist.org/news/2005/06/fourth-largest-us-bank-apologizes-for"}],"connections":[{"id":"port-charleston","type":"finance","label":"Bank of Charleston loans on enslaved people"},{"id":"chicago-slavery-era-ordinance","type":"legacy","label":"2005 disclosure and apology"},{"id":"jpmorgan-chase","type":"parallel","label":"2005 bank apologies"}]},{"id":"aetna","name":"Aetna","category":"Companies & Banks","role":"Financier & Insurer","nation":"United States","scale":"Minor","scaleBasis":"documented","scaleNote":"Aetna said in 2000 that it wrote no more than about a dozen policies in the 1850s insuring enslaved people's lives for their enslavers.","start":1853,"end":1860,"lifespan":"1853–present","base":"Hartford, Connecticut","geo":[41.764,-72.685],"aliases":["Aetna Life Insurance Company"],"origins":"Aetna Life Insurance Company was founded in Hartford in 1853. Like several Northern insurers, it sold policies to Southern enslavers.","role_summary":"The policies compensated enslavers financially when an insured enslaved person died, treating people as insurable property.","roleDetail":[{"t":"Slave-life policies.","d":"Discovered after researcher Deadria Farmer-Paellmann asked the company about its records in 1999–2000.","basis":"documented"}],"legacy":"In March 2000 Aetna apologised but said no reparations were due. Farmer-Paellmann's work fed California's 2000 Slavery Era Insurance Registry law and later corporate reparations lawsuits.","legacyDetail":[{"t":"2000 apology.","d":"Among the first US corporate apologies for slavery.","basis":"documented"}],"sources":[{"label":"Las Vegas Sun (AP) — Apology made for slave policies (2000)","url":"https://lasvegassun.com/news/2000/mar/09/apology-made-for-slave-policies/"},{"label":"Insurance Journal — Slavery & Insurance (2000)","url":"https://www.insurancejournal.com/magazines/mag-legalbeat/2000/05/15/21120.htm"},{"label":"Democracy Now! — Aetna acknowledges issuing slave policies","url":"https://www.democracynow.org/2000/3/14/aetna_acknowledges_issuing_slave_policies_during"}],"connections":[{"id":"new-york-life","type":"parallel","label":"insurers of enslaved lives"},{"id":"chicago-slavery-era-ordinance","type":"legacy","label":"insurance disclosures inspired city ordinances"},{"id":"lloyds-of-london","type":"parallel","label":"insuring human 'property'"}]},{"id":"new-york-life","name":"New York Life (Nautilus Insurance Company)","category":"Companies & Banks","role":"Financier & Insurer","nation":"United States","scale":"Minor","scaleBasis":"documented","scaleNote":"Per its 2002 letter to California regulators, predecessor Nautilus sold slaveholder policies for about two years (1846–48); 339 of its first 1,000 policies insured enslaved people.","start":1845,"end":1848,"lifespan":"1845–present","base":"New York, New York","geo":[40.742,-73.986],"aliases":["Nautilus Insurance Company"],"origins":"Nautilus Insurance Company was chartered in New York in 1841 and began selling life policies in 1845; it renamed itself New York Life in 1849.","role_summary":"Nautilus sold one-year policies (usually under $500) to enslavers, mostly in Virginia and Kentucky, on enslaved boatmen, carpenters, miners and labourers, paying the enslaver on death. Trustees voted to stop in April 1848.","roleDetail":[{"t":"Policy registers.","d":"The ledgers, now partly at the New York Public Library, name insured enslaved people — a genealogical source today.","basis":"documented"}],"legacy":"New York Life has expressed 'profound regret' and funds scholarships and research; it disclosed its records under California's Slavery Era Insurance Registry.","legacyDetail":[{"t":"Disclosure.","d":"The company reported 15 death claims under slave policies totalling c. $7,474.","basis":"documented"}],"sources":[{"label":"California Department of Insurance — New York Life letter (2002, PDF)","url":"https://www.insurance.ca.gov/01-consumers/150-other-prog/10-seir/upload/ny-life-letter.pdf"},{"label":"New York Public Library Archives — Nautilus/New York Life slave policy records","url":"https://archives.nypl.org/scm/24140"}],"connections":[{"id":"aetna","type":"parallel","label":"insurers of enslaved lives"},{"id":"lloyds-of-london","type":"parallel","label":"insuring human 'property'"},{"id":"chicago-slavery-era-ordinance","type":"legacy","label":"slavery-era insurance disclosure"}]},{"id":"brown-brothers-harriman","name":"Brown Brothers Harriman","category":"Companies & Banks","role":"Financier & Insurer","nation":"United States","scale":"Significant","scaleBasis":"estimated","scaleNote":"Predecessor Brown Brothers & Co. was a leading financier of the antebellum cotton trade; its own history says borrowers pledged land and enslaved people to collateralise cotton finance.","start":1810,"end":1865,"lifespan":"1800–present","base":"New York (origins in Baltimore and Liverpool)","geo":[40.707,-74.011],"aliases":["Alexander Brown & Sons","Brown Brothers & Co.","William & James Brown & Co. (Liverpool)"],"origins":"Irish-born Alexander Brown founded a linen business in Baltimore in 1800; his sons opened houses in Liverpool, Philadelphia and New York (1825). The firm became one of the leading Anglo-American merchant banks.","role_summary":"The Browns financed and shipped Southern cotton to Liverpool, advanced credit to planters and factors, and in some cases took over mortgaged plantations. A reparations lawsuit alleged the firm held Louisiana plantations with 346 enslaved people; that claim is unadjudicated.","roleDetail":[{"t":"Cotton finance network.","d":"The firm linked Southern plantations with factors, brokers, shippers and insurers on both sides of the Atlantic (per BBH's own history).","basis":"documented"},{"t":"Foreclosed plantations.","d":"Allegations from the 2002 slavery reparations litigation; not established in court.","basis":"interpretive"}],"legacy":"Brown Brothers merged into Brown Brothers Harriman in 1931 and remains a private bank. It now states that it regrets its predecessor's role in a cotton trade that 'relied on the abhorrent practice of slavery'.","legacyDetail":[{"t":"Corporate acknowledgment.","d":"BBH's '200 Years of Partnership' history addresses its cotton-trade past.","basis":"documented"}],"sources":[{"label":"Brown Brothers Harriman — The Cotton Trade","url":"https://www.bbh.com/us/en/bbh-who-we-are/our-story/200-years-of-partnership/the-cotton-trade.html"},{"label":"Kirkus Reviews — Inside Money by Zachary Karabell","url":"https://kirkusreviews.com/book-reviews/zachary-karabell/inside-money/print"}],"connections":[{"id":"port-liverpool","type":"trade","label":"Liverpool cotton house"},{"id":"port-new-orleans","type":"finance","label":"planter credit via New Orleans"},{"id":"lehman-brothers","type":"parallel","label":"fellow cotton financiers"},{"id":"jpmorgan-chase","type":"parallel","label":"plantation credit secured on enslaved people"}]},{"id":"clotilda-meaher","name":"Timothy Meaher and the Clotilda","category":"American Families","role":"Trader & Shipper","nation":"United States","scale":"Minor","scaleBasis":"documented","scaleNote":"Organised the last documented slave voyage to the US (1860), which brought 110 captives from Ouidah to Mobile.","start":1860,"end":1860,"lifespan":"1812–1892","base":"Mobile, Alabama","geo":[30.695,-88.04],"aliases":["Clotilda","Clotilde"],"origins":"Maine-born Timothy Meaher became a Mobile shipbuilder, steamboat owner and planter. He reportedly bet that he could bring Africans into the US despite the 1808 ban.","role_summary":"Meaher financed the schooner Clotilda, captained by William Foster, which bought 110 people at Ouidah from the Kingdom of Dahomey's trade. After landing in July 1860, the ship was burned and scuttled to hide the evidence, and the captives were divided among Meaher, his brothers and Foster. No one was convicted.","roleDetail":[{"t":"An illegal voyage.","d":"Federal charges were brought, but the case was dropped in 1861.","basis":"documented"},{"t":"Africatown.","d":"After emancipation, survivors including Cudjo Lewis (Oluale Kossola) founded Africatown near Mobile.","basis":"documented"}],"legacy":"The wreck was identified in May 2019 by the Alabama Historical Commission. Meaher descendants still own much land around Africatown; in 2022 some called their ancestor's actions 'evil and unforgivable', and Clotilda descendants pursue reconciliation and community revival.","legacyDetail":[{"t":"Wreck found (2019).","d":"Listed on the National Register of Historic Places in 2021.","basis":"documented"},{"t":"'Descendant' (2022).","d":"A documentary film follows Africatown's Clotilda descendants and their fight over land, pollution and memory.","basis":"documented"}],"sources":[{"label":"Encyclopedia of Alabama — Africatown","url":"https://encyclopediaofalabama.org/article/africatown/"},{"label":"NBC News — America's last slave ship could offer a case for reparations","url":"https://www.nbcnews.com/news/nbcblk/america-s-last-slave-ship-could-offer-case-reparations-n1062981"},{"label":"CBS News / 60 Minutes — Descendants of Alabama slave owner say they're 'figuring out next steps'","url":"https://www.cbsnews.com/amp/news/clotilda-meaher-descendants-talk-reconciliation-africatown-60-minutes"},{"label":"Wikipedia — Clotilda (slave ship)","url":"https://en.wikipedia.org/wiki/Clotilda_(slave_ship)"}],"connections":[{"id":"port-ouidah","type":"trade","label":"captives bought at Ouidah, 1860"},{"id":"kingdom-of-dahomey","type":"trade","label":"Dahomey supplied the captives"},{"id":"africatown","type":"legacy","label":"survivors founded Africatown"},{"id":"us-slave-trade-act-1807","type":"political","label":"voyage violated federal ban"},{"id":"charles-lamar","type":"parallel","label":"late illegal US slave voyages"}]},{"id":"charles-lamar","name":"Charles Lamar","category":"American Families","role":"Trader & Shipper","nation":"United States","scale":"Minor","scaleBasis":"documented","scaleNote":"Organised the Wanderer voyage, which landed c. 400 Africans on Jekyll Island in 1858 (estimates 409–490 per Georgia Encyclopedia and others).","start":1857,"end":1860,"lifespan":"1824–1865","base":"Savannah, Georgia","geo":[32.081,-81.091],"aliases":["Charles Augustus Lafayette Lamar"],"origins":"From a wealthy Savannah family, Lamar was a businessman and outspoken campaigner for reopening the African slave trade.","role_summary":"With William Corrie of Charleston he refitted the yacht Wanderer as a slaver; it embarked captives at the Congo River and landed them at Jekyll Island in November 1858. Federal prosecutions failed, and many captives were sold across the South.","roleDetail":[{"t":"Defying the ban.","d":"The voyage was meant to provoke and test enforcement of the 1808 ban; Southern juries declined to convict.","basis":"interpretive"}],"legacy":"Lamar was killed in April 1865 at Columbus, Georgia, often called the last Confederate officer killed in action. A Wanderer memorial stands on Jekyll Island.","legacyDetail":[{"t":"Jekyll Island memorial.","d":"Jekyll Island interprets the landing and the survivors' lives.","basis":"documented"}],"sources":[{"label":"New Georgia Encyclopedia — Wanderer","url":"https://www.georgiaencyclopedia.org/articles/history-archaeology/wanderer/"},{"label":"Massachusetts Historical Society — The Wanderer, the last American slave ship?","url":"https://masshist.org/beehiveblog/2016/02/the-wanderer-the-last-american-slave-ship"}],"connections":[{"id":"wanderer-ship","type":"ownership","label":"organised the Wanderer voyage"},{"id":"us-slave-trade-act-1807","type":"political","label":"violated federal ban"},{"id":"kingdom-of-kongo","type":"trade","label":"captives embarked at the Congo River"},{"id":"clotilda-meaher","type":"parallel","label":"late illegal US slave voyages"}]},{"id":"nathaniel-gordon","name":"Nathaniel Gordon","category":"American Families","role":"Trader & Shipper","nation":"United States","scale":"Minor","scaleBasis":"documented","scaleNote":"Captain of the Erie, seized in 1860 with 897 Africans aboard; the only American executed for slave trading.","start":1851,"end":1860,"lifespan":"1826–1862","base":"Portland, Maine","geo":[43.661,-70.255],"aliases":[],"origins":"A Maine-born sea captain, Gordon made several voyages in the illegal trade in the 1850s.","role_summary":"In August 1860 the USS Mohican captured his ship Erie near the Congo River with 897 captives, many of them children. He was convicted under the 1820 law that made slave trading piracy, and Lincoln refused clemency.","roleDetail":[{"t":"Hanged in 1862.","d":"Executed in New York City on 21 February 1862.","basis":"documented"},{"t":"Lincoln's message.","d":"Signalled federal resolve against the trade during the Civil War.","basis":"interpretive"}],"legacy":"Gordon's case remains the only US execution for slave trading in more than 40 years of the piracy law.","legacyDetail":[{"t":"Unique precedent.","d":"Earlier traders, including the DeWolfs and Lamar, went unpunished.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — ican suppliers and sold them to Spanish and Portuguese ships bound for Cuba and Puerto Rico. His Havana partner was Lino Carballo, with agents in Puerto Rico and elsewhere. The Amistad captives (1839) passed through Lomboko.","roleDetail":[{"t":"Amistad link.","d":"The Africans who later revolted aboard the Amistad were held at Lomboko before shipment to Havana in 1839.","basis":"documented"},{"t":"Myth and record.","d":"Tales of his royal wealth are partly legend; historian María del Carmen Barcia (2018) separates myth from documents.","basis":"interpretive"}],"legacy":"Blanco left Africa around 1839; the British Royal Navy destroyed the Gallinas factories in 1849. He has become a figure of fiction, such as Carlos Bardem's novel 'Mongo Blanco'.","legacyDetail":[{"t":"British naval raids.","d":"The 1849 destruction of the Gallinas barracoons was part of the West Africa Squadron's campaign.","basis":"documented"}],"sources":[{"label":"Wikipedia — Pedro Blanco (slave trader)","url":"https://en.wikipedia.org/wiki/Pedro_Blanco_(slave_trader)"},{"label":"Havana Times — Cuba/Africa: An Old Slave Trading Place","url":"https://havanatimes.org/?p=93447"}],"connections":[{"id":"gallinas-lomboko","type":"ownership","label":"built the Lomboko factories"},{"id":"port-havana","type":"trade","label":"sold captives to Havana"},{"id":"julian-de-zulueta","type":"trade","label":"Zulueta & Co. supplied his factories"}]},{"id":"joaquim-pereira-marinho","name":"Joaquim Pereira Marinho","category":"American Families","role":"Trader & Shipper","nation":"Brazil","scale":"Major","scaleBasis":"estimated","scaleNote":"Described by Brazilian historians as one of the largest traffickers of enslaved Africans into Salvador during the illegal trade (1830–1850); he died with an estate of c. 8,000 contos de réis.","start":1830,"end":1851,"lifespan":"1816–1887","base":"Salvador, Bahia","geo":[-12.974,-38.512],"aliases":["Conde de Pereira Marinho"],"origins":"Born in Portugal, he came to Salvador as a n Manolo Florentino ranks him as the third-largest slave trader in the Rio de Janeiro market around 1800; he owned at least four slave ships.","start":1790,"end":1815,"lifespan":"c. 1770–1815","base":"Rio de Janeiro","geo":[-22.906,-43.173],"aliases":["Elie Antun Lubbus (reported)"],"origins":"A Portuguese merchant (some accounts say of Lebanese descent) who emigrated to Rio de Janeiro, he became one of the city's richest men through trade, royal contracts and the slave trade.","role_summary":"He financed slaving voyages to Africa, mainly to Angola and West Central Africa, which supplied Rio's market. In 1808 he gave his estate at Quinta da Boa Vista to the exiled Portuguese Prince Regent João, winning titles and favour.","roleDetail":[{"t":"Royal patron.","d":"His manor became the Paço de São Cristóvão, home of the Brazilian imperial family.","basis":"documented"},{"t":"Ships.","d":"His vessels included the Europa, Paquete Infante, São João Americano and Deligente.","basis":"documented"}],"legacy":"The palace later housed Brazil's National Museum, gutted by fire in 2018; its foundation in slave-trade wealth is now discussed by historians.","legacyDetail":[{"t":"National Museum.","d":"Rebuilding is under way after the 2018 fire.","basis":"documented"}],"sources":[{"label":"Jornal do Brasil — Gênese da corrupção no Brasil (2019)","url":"https://www.jb.com.br/rio/2019/02/979831-genese-da-corrupcao-no-brasil.html"},{"label":"Wikipedia — Paço de São Cristóvão","url":"https://en.wikipedia.org/wiki/Pa%C3%A7o_de_S%C3%A3o_Crist%C3%B3v%C3%A3o"}],"connections":[{"id":"paco-sao-cristovao","type":"legacy","label":"donated estate to the crown, 1808"},{"id":"crown-of-portugal","type":"political","label":"patron of Prince Regent João"},{"id":"port-rio-valongo","type":"trade","label":"Rio de Janeiro slave market"},{"id":"port-luanda","type":"trade","label":"Rio–Angola trade route"}]},{"id":"jose-bernardino-de-sa","name":"José Bernardino de Sá","category":"American Families","role":"Trader & Shipper","nation":"Brazil","scale":"Major","scaleBasis":"estimated","scaleNote":"Historians attribute to him the trafficking of at least 19,000 Africans into south-eastern Brazil between 1825 and 1851, mostly illegally after 1831.","start":1825,"end":1851,"lifespan":"c. 1802–1855","base":"Rio de Janeiro","geo":[-22.906,-43.173],"aliases":["Viscount of Vila Nova do Minho"],"origins":"Portuguese-born, he worked as a clerk in a Rio trading house when he organised his first known slave shipment in 1825.","role_summary":"With Manoel Pinto da Fonseca he dominated the illegal slave trade into south-east Brazil after 1831, landing captives on secluded beaches. He invested the profits in real estate, ships and finance, becoming the largest individual shareholder of the Banco do Brasil.","roleDetail":[{"t":"Illegal trade baron.","d":"Trafficked c. 19,000+ people despite the 1831 ban.","basis":"documented"},{"t":"Banking.","d":"Major shareholder in the Banco do Brasil after its 1853 re-founding.","basis":"documented"}],"legacy":"In September 2023 federal prosecutors opened an inquiry into the Banco do Brasil's links to slavery after historians traced Sá's investments; the bank apologised publicly on 18 November 2023.","legacyDetail":[{"t":"Reparations debate.","d":"Prosecutors called the bank's proposed measures insufficient.","basis":"documented"}],"sources":[{"label":"JusticeInfo.net — Brazil bank's ties to slavery reopen wounds, reparations debate","url":"https://www.justiceinfo.net/en?p=125376"},{"label":"ArtCultura (UFU) — article on José Bernardino de Sá and the São Pedro theatre","url":"https://seer.ufu.br/index.php/artcultura/article/view/40081"}],"connections":[{"id":"banco-do-brasil","type":"finance","label":"largest individual shareholder"},{"id":"port-rio-valongo","type":"trade","label":"Rio slave trade"},{"id":"eusebio-de-queiros-law-1850","type":"political","label":"trade ended by the 1850 law"},{"id":"crown-of-portugal","type":"charter","label":"titled Viscount of Vila Nova do Minho"}]},{"type":"entity","id":"port-newport","name":"Newport, Rhode Island","kind":"Port","start":1709,"geo":[41.49,-71.313],"description":"Colonial Newport was the leading slaving port of British North America; Rhode Island launched c. 60% of North American slaving voyages (c. 1,000 voyages, 1700s–1807), most from Newport before the Revolution. Rum distilled from Caribbean molasses was the main trade good on the African coast.","connections":[{"id":"aaron-lopez","type":"trade","label":"Lopez's merchant house"},{"id":"dewolf-family","type":"voyage","label":"Mark Anthony DeWolf sailed from Newport"},{"id":"port-bristol-rhode-island","type":"trade","label":"Bristol overtook Newport after 1783"},{"id":"brown-family-providence","type":"trade","label":"Rhode Island slaving network"}]},{"type":"entity","id":"port-bristol-rhode-island","name":"Bristol, Rhode Island","kind":"Port","start":1769,"geo":[41.677,-71.266],"description":"After the Revolution Bristol became Rhode Island's main slaving port, dominated by the DeWolf family. Local craftsmen made chains, sails and rope for slave ships, and distilleries turned Cuban molasses into rum for the African trade.","connections":[{"id":"dewolf-family","type":"ownership","label":"DeWolf home port"},{"id":"port-newport","type":"trade","label":"successor to Newport as chief slaving port"},{"id":"port-havana","type":"trade","label":"Bristol–Havana route"}]},{"type":"entity","id":"port-charleston","name":"Charleston, South Carolina (incl. Sullivan's Island and Gadsden's Wharf)","kind":"Port","start":1670,"geo":[32.79,-79.925],"description":"Charleston was the principal US landing port for African captives; scholars estimate c. 40% of enslaved Africans brought to mainland North America arrived there. Arrivals were quarantined in 'pest houses' on Sullivan's Island, and in 1806 the city required slave ships to dock at Gadsden's Wharf, where c. 100,000 people were landed, many in the 1803–07 rush before the federal ban.","connections":[{"id":"henry-laurens","type":"trade","label":"Austin & Laurens auctions"},{"id":"dewolf-family","type":"trade","label":"DeWolf ships sold captives here, 1804–07"},{"id":"international-african-american-museum","type":"legacy","label":"museum built on Gadsden's Wharf"},{"id":"wells-fargo-wachovia","type":"finance","label":"Bank of Charleston"},{"id":"bunce-island","type":"trade","label":"Sierra Leone–Charleston route"}]},{"type":"entity","id":"international-african-american-museum","name":"International African American Museum (Charleston)","kind":"Legacy / apology","start":2023,"geo":[32.79,-79.925],"description":"Opened in June 2023 on the site of Gadsden's Wharf, the museum interprets the forced arrival of Africans in Charleston and includes a centre for African American genealogy. Nearby, the Toni Morrison Society placed a 'Bench by the Road' on Sullivan's Island in 2008.","connections":[{"id":"port-charleston","type":"legacy","label":"built on Gadsden's Wharf"},{"id":"henry-laurens","type":"legacy","label":"interprets Charleston's slave market"}]},{"type":"entity","id":"port-new-orleans","name":"New Orleans","kind":"Port","start":1719,"geo":[29.951,-90.072],"description":"New Orleans became the largest slave market in the US during the domestic trade, receiving people shipped and marched from the Upper South to Deep South cotton and sugar plantations. Its banks lent to planters against mortgages on enslaved people.","connections":[{"id":"franklin-and-armfield","type":"trade","label":"firm's chief market"},{"id":"citizens-bank-louisiana","type":"finance","label":"property banks"},{"id":"brown-brothers-harriman","type":"finance","label":"cotton credit"},{"id":"georgetown-university","type":"trade","label":"1838 sale shipped people via New Orleans"}]},{"type":"entity","id":"port-havana","name":"Havana","kind":"Port","start":1526,"geo":[23.141,-82.352],"description":"Havana was the hub of Cuba's slave trade, which grew enormously after 1790 with the sugar boom. More than half of the almost one million Africans taken to Cuba arrived illegally after the 1820 Anglo-Spanish ban; the last known slave ship landed c. 1867, and slavery ended in 1886.","connections":[{"id":"julian-de-zulueta","type":"ownership","label":"Zulueta's base"},{"id":"pedro-blanco","type":"trade","label":"Blanco's Havana partners"},{"id":"dewolf-family","type":"trade","label":"DeWolf sales and plantations"},{"id":"spanish-asiento","type":"charter","label":"earlier licensed imports"},{"id":"antonio-lopez-comillas","type":"trade","label":"Cuban base of Comillas fortune"}]},{"type":"entity","id":"gallinas-lomboko","name":"Lomboko and the Gallinas barracoons","kind":"Fort / trading post","start":1822,"geo":[6.95,-11.52],"description":"Pedro Blanco's fortified slave factories on islands at the mouth of the Gallinas River (today Sierra Leone/Liberia border). The Amistad captives were held here in 1839. The Royal Navy destroyed the barracoons in 1849.","connections":[{"id":"pedro-blanco","type":"ownership","label":"Blanco's factories"},{"id":"port-havana","type":"trade","label":"captives shipped to Havana"}]},{"type":"entity","id":"port-rio-valongo","name":"Valongo Wharf, Rio de Janeiro","kind":"Port","start":1811,"geo":[-22.897,-43.186],"description":"Built from 1811 to land enslaved Africans, Valongo was the main point of arrival in the Americas, receiving up to c. 900,000 people (per UNESCO) before it was paved over in 1843. Rediscovered in 2011, it was inscribed as a UNESCO World Heritage Site on 9 July 2017.","connections":[{"id":"elias-antonio-lopes","type":"trade","label":"Rio slave market"},{"id":"jose-bernardino-de-sa","type":"trade","label":"Rio slave trade"},{"id":"port-luanda","type":"trade","label":"main supply from Angola"},{"id":"lei-aurea-1888","type":"legacy","label":"abolition 1888"}]},{"type":"entity","id":"port-salvador","name":"Salvador da Bahia","kind":"Port","start":1550,"geo":[-12.974,-38.512],"description":"Colonial 50,"description":"Brazilian Law No. 581 of 4 September 1850 effectively ended the transatlantic slave trade to Brazil, enforcing the unenforced 1831 ban under heavy British naval pressure after the 1845 Aberdeen Act. Landings largely ceased by 1856, though slavery continued.","connections":[{"id":"jose-bernardino-de-sa","type":"political","label":"ended his trafficking"},{"id":"joaquim-pereira-marinho","type":"political","label":"ended Bahian trafficking"},{"id":"slavery-abolition-act-1833","type":"political","label":"British abolitionist pressure"},{"id":"lei-aurea-1888","type":"legacy","label":"step towards abolition"}]},{"type":"entity","id":"lei-aurea-1888","name":"Lei Áurea (Golden Law), 1888","kind":"Charter / law / treaty","start":1888,"description":"Law No. 3,353 of 13 May 1888, signed by Princess Isabel as regent, abolished slavery in Brazil without compensation to enslavers, freeing c. 700,000 people. Brazil was the last country in the Americas to abolish slavery; freed people received no state support.","connections":[{"id":"crown-of-portugal","type":"family","label":"signed by Braganza princess regent"},{"id":"port-rio-valongo","type":"legacy","label":"end of slavery in Brazil"},{"id":"port-salvador","type":"legacy","label":"end of slavery in Brazil"}]},{"type":"entity","id":"us-slave-trade-act-1807","name":"Act Prohibiting Importation of Slaves (1807)","kind":"Charter / law / treaty","start":1808,"description":"Signed by Thomas Jefferson on 2 March 1807 and effective 1 January 1808, the earliest date the Constitution allowed, it banned the import of enslaved people into the US. Enforcement was weak; an 1820 law made slave trading piracy punishable by death. Domestic slavery and the internal trade continued.","connections":[{"id":"dewolf-family","type":"political","label":"evaded by DeWolfs"},{"id":"nathaniel-gordon","type":"political","label":"Gordon executed under 1820 piracy law"},{"id":"franklin-and-armfield","type":"political","label":"spurred the domestic trade"},{"id":"clotilda-meaher","type":"political","label":"violated in 1860"}]},{"type":"entity","id":"sally-1764","name":"The Sally (1764–1765)","kind":"Ship / voyage","start":1764,"geo":[41.824,-71.413],"description":"Brigantine owned by Nicholas Brown and Company, sailed by Esek Hopkins from Providence to the Windward Coast. Of 196 Africans bought, at least 109 died through a failed revolt, suicide, starvation and disease; survivors were sold in Antigua.","connections":[{"id":"brown-family-providence","type":"ownership","label":"owned by the Browns"},{"id":"esek-hopkins","type":"voyage","label":"master"},{"id":"brown-university","type":"legacy","label":"central to the 2006 report"}]},{"type":"entity","id":"wanderer-ship","name":"The Wanderer (1858)","kind":"Ship / voyage","start":1858,"geo":[31.071,-81.416],"description":"A luxury racing yacht refitted as a slaver by Charles Lamar and William Corrie; it landed c. 400 Africans on Jekyll Island, Georgia, on 28 November 1858, roughly 50 years after the ban. The owners escaped conviction.","connections":[{"id":"charles-lamar","type":"ownership","label":"Lamar's venture"},{"id":"us-slave-trade-act-1807","type":"political","label":"violated federal ban"}]},{"type":"entity","id":"erie-ship","name":"The Erie (1860)","kind":"Ship / voyage","start":1860,"description":"Slave ship captained by Nathaniel Gordon, seized by USS Mohican off the Congo River in August 1860 with 897 captives aboard, many of them children. The captives were taken to Liberia.","connections":[{"id":"nathaniel-gordon","type":"voyage","label":"Gordon's ship"},{"id":"kingdom-of-kongo","type":"trade","label":"Congo River embarkation"}]},{"type":"entity","id":"africatown","name":"Africatown, Mobile","kind":"Colony / community","start":1866,"geo":[30.733,-88.055],"description":"Community near Mobile, Alabama founded after the Civil War by survivors of the Clotilda, including Cudjo Lewis (Oluale Kossola). Descendants still live there, and the community has worked on preservation, environmental justice and a heritage house since the 2019 wreck identification.","connections":[{"id":"clotilda-meaher","type":"legacy","label":"founded by Clotilda survivors"},{"id":"port-ouidah","type":"trade","label":"captives embarked at Ouidah"}]},{"type":"entity","id":"royall-house-medford","name":"Royall House and Slave Quarters","kind":"Colony / plantation","start":1732,"geo":[42.414,-71.11],"description":"Medford estate of the Royall family, with the only known surviving freestanding slave quarters in New England. A museum since 1910, it interprets the lives of the people the Royalls enslaved, including Belinda Sutton. Isaac Royall Jr.'s bequest funded Harvard Law's first professorship; the Royall-arms law school shield was retired in 2016.","connections":[{"id":"royall-family","type":"plantation","label":"Royall estate"}]},{"type":"entity","id":"faneuil-hall","name":"Faneuil Hall, Boston","kind":"Legacy / institution","start":1742,"geo":[42.36,-71.056],"description":"Market hall and meeting place given to Boston by Peter Faneuil and opened in 1742, known as the 'Cradle of Liberty'. Part of its funding came from Faneuil's slavery-linked trade, which has led to calls since 2017 to rename it and to plans for a memorial.","connections":[{"id":"peter-faneuil","type":"ownership","label":"funded by Faneuil"}]},{"type":"entity","id":"freedom-house-alexandria","name":"Freedom House Museum (1315 Duke Street)","kind":"Legacy / institution","start":1828,"geo":[38.804,-77.056],"description":"The Alexandria headquarters and slave pen of Franklin & Armfield, and later of other traders, through which thousands of people were sold south. It is now a National Historic Landmark and museum run by the City of Alexandria.","connections":[{"id":"franklin-and-armfield","type":"ownership","label":"firm's pen"},{"id":"isaac-franklin","type":"ownership","label":"Franklin's firm"}]},{"type":"entity","id":"citizens-bank-louisiana","name":"Citizens Bank and Canal Bank of Louisiana","kind":"Bank / insurer","start":1831,"geo":[29.951,-90.072],"description":"Antebellum New Orleans banks that accepted c. 13,000 enslaved people as loan collateral between 1831 and 1865 and came to own c. 1,250 through defaults, per JPMorgan Chase's 2005 disclosure. They are predecessors of JPMorgan Chase via Bank One.","connections":[{"id":"jpmorgan-chase","type":"legacy","label":"predecessors of JPMorgan Chase"},{"id":"port-new-orleans","type":"finance","label":"planter loans"},{"id":"georgetown-university","type":"finance","label":"1838 sale: people mortgaged to Citizens Bank"}]},{"type":"entity","id":"chicago-slavery-era-ordinance","name":"Chicago Slavery Era Disclosure Ordinance (2002)","kind":"Charter / law / treaty","start":2002,"geo":[41.878,-87.63],"description":"City ordinance requiring companies with city contracts to research and disclose any profits from slavery or slaveholder insurance, modelled on California's 2000 Slavery Era Insurance Registry law. It led to disclosures and apologies by JPMorgan Chase, Wachovia and Lehman Brothers.","connections":[{"id":"jpmorgan-chase","type":"legacy","label":"2005 disclosure"},{"id":"wells-fargo-wachovia","type":"legacy","label":"2005 disclosure"},{"id":"lehman-brothers","type":"legacy","label":"disclosure"},{"id":"aetna","type":"legacy","label":"insurer disclosures"}]},{"type":"entity","id":"brown-university","name":"Brown University","kind":"University / church","start":1764,"geo":[41.826,-71.403],"description":"Founded in 1764 with the Brown family as main benefactors and renamed for Nicholas Brown Jr. in 1804. Its 2006 Slavery and Justice report, commissioned by President Ruth Simmons, documented ties to the slave trade and led to a campus memorial (2014) and the Center for the Study of Slavery and Justice.","connections":[{"id":"brown-family-providence","type":"legacy","label":"named for the Browns"},{"id":"sally-1764","type":"legacy","label":"Sally voyage research"},{"id":"georgetown-university","type":"parallel","label":"university reckonings"}]},{"type":"entity","id":"georgetown-university","name":"Georgetown University and the 1838 sale","kind":"University / church","start":1838,"geo":[38.908,-77.073],"description":"In 1838 the Maryland Jesuits, led by Georgetown president Thomas Mulledy, sold 272 enslaved people to Louisiana planters Henry Johnson and Jesse Batey for $115,000, partly to pay Georgetown's debts. Georgetown apologised in 2017, renamed buildings and offers admissions preference to descendants; in 2021 the Jesuits pledged $100 million towards the Descendants Truth and Reconciliation Foundation.","connections":[{"id":"descendants-truth-reconciliation-foundation","type":"legacy","label":"Jesuit-descendant foundation"},{"id":"port-new-orleans","type":"trade","label":"people shipped to Louisiana"},{"id":"citizens-bank-louisiana","type":"finance","label":"people mortgaged to Citizens Bank"},{"id":"brown-university","type":"parallel","label":"university reckonings"}]},{"type":"entity","id":"descendants-truth-reconciliation-foundation","name":"Descendants Truth & Reconciliation Foundation","kind":"Legacy / apology","start":2021,"description":"Partnership between the GU272 Descendants Association and the Jesuit Conference of Canada and the US, launched in 2021 with a $100 million Jesuit pledge towards a $1 billion goal. It funds descendants' education, racial-justice programmes and support for elderly descendants; some descendants have criticised the pace of funding.","connections":[{"id":"georgetown-university","type":"legacy","label":"reparations for the 1838 sale"}]},{"type":"entity","id":"caricom-reparations-commission","name":"CARICOM Reparations Commission and Ten Point Plan","kind":"Legacy / apology","start":2013,"geo":[13.132,-59.546],"description":"Set up by CARICOM heads of government in 2013 and chaired by Sir Hilary Beckles of the University of the West Indies, it prepares the Caribbean case for reparatory justice from former colonial powers. Its Ten Point Action Plan (2014) calls for: a full formal apology; repatriation; an Indigenous peoples development programme; cultural institutions; action on the public health crisis; illiteracy eradication; an African knowledge programme; psychological rehabilitation; technology transfer; and debt cancellation.","connections":[{"id":"slavery-abolition-act-1833","type":"legacy","label":"rejects compensation paid to enslavers"},{"id":"gladstone-family","type":"legacy","label":"reparations claims on enslaver families"},{"id":"church-of-england","type":"legacy","label":"reparatory justice demands"},{"id":"dutch-west-india-company","type":"legacy","label":"claims on former colonial powers"}]}],"events":[{"year":1444,"title":"Lagos slave sale","text":"Lançarote de Freitas lands c. 235 captives at Lagos; Henry the Navigator takes the royal fifth.","ids":["henry-the-navigator","lancarote-de-freitas","lagos-slave-market"],"source":{"label":"Wikipedia — Mercado de Escravos","url":"https://en.wikipedia.org/wiki/Mercado_de_Escravos"}},{"year":1483,"title":"Portuguese reach Kongo","text":"Diogo Cão's fleet reached the Congo estuary, opening diplomatic and commercial relations that soon included trade in captives.","ids":["kingdom-of-kongo","crown-of-portugal"],"source":{"label":"Britannica — History of Angola","url":"https://www.britannica.com/place/Angola/History"}},{"year":1492,"title":"Vespucci in Seville; Columbus sails","text":"Amerigo Vespucci, Medici agent, is settled in Gianotto Berardi's Seville house as Berardi helps finance Columbus's first voyage.","ids":["amerigo-vespucci","gianotto-berardi","christopher-columbus","lorenzo-di-pierfrancesco-medici"],"source":{"label":"Wikipedia — Amerigo Vespucci","url":"https://en.wikipedia.org/wiki/Amerigo_Vespucci"}},{"year":1494,"title":"Treaty of Tordesillas","text":"Castile and Portugal divide the Atlantic world; Africa goes to Portugal, leaving Spain dependent on foreign suppliers of captives.","ids":["treaty-of-tordesillas","crown-of-castile","crown-of-portugal"],"source":{"label":"New World Encyclopedia — Treaty of Tordesillas","url":"https://www.newworldencyclopedia.org/entry/Treaty_of_Tordesillas"}},{"year":1495,"title":"Columbus ships Taíno captives","text":"Columbus loads c. 500 enslaved Taíno for Spain; c. 300 survive. Berardi dies in December and Vespucci takes over his affairs.","ids":["christopher-columbus","gianotto-berardi","amerigo-vespucci","hispaniola-colony"],"source":{"label":"College of Charleston LDHI — The Spanish and New World Slavery","url":"https://ldhi.library.cofc.edu/exhibits/show/african_laborers_for_a_new_emp/the_spanish_and_new_world_slav"}},{"year":1499,"title":"Ojeda–Vespucci voyage","text":"Alonso de Ojeda's expedition, with Vespucci aboard, ends with a slave raid in the Bahamas and sale of captives in Spain.","ids":["alonso-de-ojeda","amerigo-vespucci"],"source":{"label":"Wikipedia — Alonso de Ojeda","url":"https://en.wikipedia.org/wiki/Alonso_de_Ojeda"}},{"year":1501,"title":"First Africans licensed to the Americas","text":"Ferdinand and Isabella's instructions to Ovando permit enslaved Africans born under Christian rule to be taken to Hispaniola.","ids":["crown-of-castile","nicolas-de-ovando","hispaniola-colony"],"source":{"label":"College of Charleston LDHI — Nicolás de Ovando","url":"https://ldhi.library.cofc.edu/exhibits/show/african_laborers_for_a_new_emp/early_trans_atlantic_slave_tra"}},{"year":1507,"title":"'America' named","text":"Waldseemüller's world map names the New World 'America' after Vespucci.","ids":["waldseemuller-map-1507","amerigo-vespucci"],"source":{"label":"Library of Congress — 1507 Waldseemüller map","url":"https://www.loc.gov/item/prn-01-093/"}},{"year":1508,"title":"Vespucci named Piloto Mayor","text":"Vespucci becomes the first chief pilot of the Casa de Contratación, training pilots and keeping the Padrón Real until his death in 1512.","ids":["amerigo-vespucci","casa-de-contratacion"],"source":{"label":"Wikipedia — Pilot Major of Spain","url":"https://en.wikipedia.org/wiki/Pilot_Major_of_Spain"}},{"year":1518,"title":"Direct Africa–Americas licence","text":"Charles V licenses Laurent de Gorrevod to ship 4,000 Africans directly to the colonies; the licence passes to Genoese merchants.","ids":["charter-1518","crown-of-castile","laurent-de-gorrevod","centurione-family"],"source":{"label":"Slavery, Law & Power — 1518 charter","url":"https://slaverylawpower.org/charter-1518/"}},{"year":1526,"title":"Afonso I protests to João III","text":"Afonso I of Kongo wrote to the king of Portugal that traders were seizing free Kongolese and nobles, asking him to curb the trade; he regulated rather than ended it.","ids":["afonso-i-of-kongo","kingdom-of-kongo","crown-of-portugal"],"source":{"label":"World History Commons — Afonso I letters to the King of Portugal (primary source)","url":"https://worldhistorycommons.org/node/2382"}},{"year":1528,"title":"Welser contract","text":"The Augsburg Welser receive a contract for 4,000 enslaved Africans and the governorship of Venezuela.","ids":["welser-family","klein-venedig","spanish-asiento"],"source":{"label":"Wikipedia — Klein-Venedig","url":"https://en.wikipedia.org/wiki/Klein-Venedig"}},{"year":1562,"title":"Hawkins's first English slaving voyage","text":"John Hawkins took c. 300 Africans from the Sierra Leone coast and sold them in Spanish Hispaniola, beginning England's transatlantic slave trade.","ids":["john-hawkins","crown-of-castile"],"source":{"label":"World History Encyclopedia — John Hawkins","url":"https://www.worldhistory.org/John_Hawkins/"}},{"year":1564,"title":"Elizabeth I invests in slaving","text":"The Queen lent the royal ship Jesus of Lübeck to Hawkins's second slaving voyage.","ids":["elizabeth-i","jesus-of-lubeck","john-hawkins"],"source":{"label":"Encyclopedia.com — Hawkins, John","url":"https://www.encyclopedia.com/humanities/news-wires-white-papers-and-books/hawkins-john"}},{"year":1568,"title":"Defeat at San Juan de Ulúa","text":"A Spanish fleet attacked Hawkins's third slaving expedition in Mexico; Hawkins and Drake escaped but most ships were lost.","ids":["john-hawkins","francis-drake","jesus-of-lubeck"],"source":{"label":"World History Encyclopedia — John Hawkins","url":"https://www.worldhistory.org/John_Hawkins/"}},{"year":1595,"title":"First Portuguese asiento","text":"Pedro Gomes Reinel contracts with Philip II, opening 45 years of Portuguese asientos.","ids":["pedro-gomes-reinel","spanish-asiento","crown-of-castile"],"source":{"label":"CHAM / NOVA FCSH — Portuguese asientos","url":"https://livros.fcsh.unl.pt/cham/catalog/download/155/565/1776?inline=1"}},{"year":1621,"title":"Dutch West India Company chartered","text":"The States General gave the WIC a monopoly on Dutch Atlantic trade and war, the vehicle for the Dutch slave trade.","ids":["dutch-west-india-company"],"source":{"label":"Canon van Nederland — Slavernij","url":"https://www.canonvannederland.nl/en/slavernij"}},{"year":1622,"title":"Njinga's embassy to Luanda","text":"Njinga negotiated peace with the Portuguese governor in Luanda on behalf of Ndongo and was baptised Ana de Sousa.","ids":["queen-nzinga","port-luanda","crown-of-portugal"],"source":{"label":"Wikipedia — Nzinga of Ndongo and Matamba","url":"https://en.wikipedia.org/wiki/Nzinga_of_Ndongo_and_Matamba"}},{"year":1637,"title":"WIC seizes Elmina","text":"Dutch forces took Elmina from Portugal; between 1637 and 1641 they also took São Tomé and Luanda.","ids":["dutch-west-india-company","elmina-castle","crown-of-portugal"],"source":{"label":"Project MANIFEST — The United Provinces and the Transatlantic Slave Trade","url":"https://www.projectmanifest.eu/the-united-provinces-and-the-transatlantic-slave-trade-en-fr/"}},{"year":1650,"title":"Swedes build Carolusborg at Cape Coast","text":"Hendrik Carloff, for the Swedish Africa Company, built the fort that later became Cape Coast Castle.","ids":["swedish-africa-company","hendrik-carloff","carolusborg","cape-coast-castle"],"source":{"label":"Wikipedia — Swedish Gold Coast","url":"https://en.wikipedia.org/wiki/Swedish_Gold_Coast"}},{"year":1660,"title":"Company of Royal Adventurers chartered","text":"Charles II chartered the company under the Duke of York; its 1663 charter explicitly included the slave trade.","ids":["company-of-royal-adventurers","james-duke-of-york"],"source":{"label":"Wikipedia — Royal African Company","url":"https://en.wikipedia.org/wiki/Royal_African_Company"}},{"year":1672,"title":"Royal African Company founded","text":"The RAC received a monopoly of English trade to West Africa and became the largest single shipper of enslaved Africans in the trade's history.","ids":["royal-african-company","james-duke-of-york","edward-colston","cape-coast-castle"],"source":{"label":"PBS Africans in America — The Royal African Company","url":"https://www.pbs.org/wgbh/aia/part1/1p269.html"}},{"year":1683,"title":"Groß Friedrichsburg founded","text":"Brandenburg built its Gold Coast fort; gold proved scarce and the trade turned to captives.","ids":["brandenburg-african-company","gross-friedrichsburg","frederick-william-brandenburg","benjamin-raule"],"source":{"label":"Wikipedia — Brandenburger Gold Coast","url":"https://en.wikipedia.org/wiki/Brandenburger_Gold_Coast"}},{"year":1685,"title":"Code Noir and the Coymans asiento","text":"Louis XIV issued the Code Noir governing slavery in French colonies; the same year Dutchman Balthasar Coymans won the Spanish asiento.","ids":["code-noir","crown-of-france","coymans-family","spanish-asiento"],"source":{"label":"BnF — « Code Noir » (The Black Code)","url":"https://heritage.bnf.fr/france-ameriques/en/code-noir-black-code"}},{"year":1693,"title":"Akwamu seizes Christiansborg","text":"Asameni of Akwamu and some 80 men posing as traders captured the Danish castle at Accra and traded from it for about a year.","ids":["akwamu-kingdom","christiansborg-castle","danish-west-india-guinea-company"],"source":{"label":"The Conversation — Resistance and collaboration: Asameni and the keys to Christiansborg Castle","url":"https://theconversation.com/resistance-and-collaboration-asameni-and-the-keys-to-christiansborg-castle-in-accra-120006"}},{"year":1698,"title":"Slave trade opened to all English merchants","text":"Parliament ended the RAC monopoly, letting private traders from Bristol and later Liverpool expand the trade.","ids":["royal-african-company","port-bristol","port-liverpool"],"source":{"label":"Schools History — Lifting of the Royal African Company monopoly","url":"https://schoolshistory.org.uk/topics/british-empire/economic-consequences-of-empire/lifting-of-the-royal-african-company-monopoly/"}},{"year":1701,"title":"French Guinea Company wins the asiento","text":"Philip V of Spain granted the Compagnie royale de Guinée the asiento to supply captives to Spanish America.","ids":["compagnie-de-guinee","crown-of-france","spanish-asiento"],"source":{"label":"AHA — Trans-Imperial Bondage: The French Slave Trade in the Spanish Caribbean","url":"https://aha.confex.com/aha/2015/webprogram/Paper15525.html"}},{"year":1710,"title":"Codrington bequest to the Church","text":"Christopher Codrington left two Barbados plantations and their enslaved workers to the SPG, and £10,000 to All Souls College.","ids":["codrington-family","church-of-england","codrington-plantations-barbados","all-souls-codrington-library"],"source":{"label":"All Souls College — The Codrington legacy","url":"https://www.asc.ox.ac.uk/node/3693"}},{"year":1713,"title":"Britain wins the asiento","text":"Under the Treaty of Utrecht, the South Sea Company gained the contract to supply 4,800 enslaved Africans a year to Spanish America for 30 years.","ids":["south-sea-company","spanish-asiento","crown-of-castile"],"source":{"label":"Britannica — Asiento de negros","url":"https://www.britannica.com/print/article/38687"}},{"year":1727,"title":"Dahomey conquers Whydah","text":"King Agaja's army took the coastal kingdom of Whydah, giving Dahomey control of the Ouidah slave market.","ids":["agaja-of-dahomey","kingdom-of-dahomey","port-ouidah"],"source":{"label":"Wikipedia — Agaja","url":"https://en.wikipedia.org/wiki/Agaja"}},{"year":1748,"title":"Grant, Oswald & Co. buys Bunce Island","text":"Richard Oswald's London firm took over the Sierra Leone fort, shipping captives to Charleston via Henry Laurens.","ids":["richard-oswald","bunce-island","henry-laurens"],"source":{"label":"Yale Gilder Lehrman Center — Bunce Island history","url":"https://macmillan.yale.edu/glc/bunce-island-history"}},{"year":1755,"title":"Pombal's slave-trade company","text":"Pombal founds the Grão-Pará e Maranhão Company, followed by Pernambuco e Paraíba (1759).","ids":["marquis-of-pombal","grao-para-maranhao-company","pernambuco-paraiba-company"],"source":{"label":"Wikipedia — Grão Pará and Maranhão Company","url":"https://en.wikipedia.org/wiki/Gr%C3%A3o_Par%C3%A1_and_Maranh%C3%A3o_Company"}},{"year":1764,"title":"The Sally sails from Providence","text":"Nicholas Brown and Company's brigantine leaves for West Africa the year Brown University is founded; at least 109 of 196 captives die.","ids":["sally-1764","brown-family-providence","esek-hopkins","brown-university"],"source":{"label":"Brown University Library — Voyage of the Slave Ship Sally","url":"https://cds.lib.brown.edu/cds-project/voyage-slave-ship-sally-1764-1765"}},{"year":1767,"title":"Old Calabar massacre","text":"English captains allied with Duke Town to ambush Old Town traders; some 300 were killed and others, including two Robin John princes, were enslaved.","ids":["old-calabar-efik","duke-ephraim","port-liverpool","port-bristol"],"source":{"label":"Wikipedia — Little Ephraim Robin John and Ancona Robin John","url":"https://en.wikipedia.org/wiki/Little_Ephraim_Robin_John_and_Ancona_Robin_John"}},{"year":1768,"title":"Slave ship Fredensborg wrecked in Norway","text":"After landing 235 captives on St Croix, the Danish-Norwegian ship sank off Tromøy; its wreck, found in 1974, is one of very few excavated slave ships.","ids":["fredensborg-ship","danish-west-indies","crown-of-denmark-norway"],"source":{"label":"Cambridge — History in Africa: The slave ship Fredensborg","url":"https://www.cambridge.org/core/journals/history-in-africa/article/slave-ship-fredensborg-history-shipwreck-and-find/312D4B37E3E6FD5AB492C4677517193E"}},{"year":1772,"title":"Bank of England's Grenada loan","text":"The Bank lent £160,000 on two Grenada plantations; after default it came to own 599 enslaved people, selling them in 1790.","ids":["bank-of-england","bank-of-england-grenada-plantations"],"source":{"label":"Bank of England Museum — A Story of Archival Discovery","url":"https://www.bankofengland.co.uk/museum/online-collections/blog/a-story-of-archival-discovery"}},{"year":1791,"title":"Revolution in Saint-Domingue","text":"Enslaved people rose up in August 1791 in France's richest colony, which became independent Haiti on 1 January 1804.","ids":["saint-domingue","crown-of-france"],"source":{"label":"John Carter Brown Library — Saint-Domingue Before the Revolution","url":"https://www.brown.edu/Facilities/John_Carter_Brown_Library/exhibitions/haitian/pages/part1.html"}},{"year":1792,"title":"Danish slave-trade ban decreed","text":"Christian VII signed the decree of 16 March 1792 banning the trade from 1803; imports grew during the delay.","ids":["danish-1792-decree","crown-of-denmark-norway","schimmelmann-family"],"source":{"label":"EBSCO Research Starters — Denmark Abolishes the Slave Trade","url":"https://ebsco.com/research-starters/history/denmark-abolishes-slave-trade"}},{"year":1797,"title":"John Brown tried under federal Slave Trade Act","text":"John Brown of Providence becomes the first American tried under the 1794 Slave Trade Act; his ship Hope is forfeited after his brother Moses's abolition society pursues the case.","ids":["brown-family-providence"],"source":{"label":"Rhode Island Historical Society — John Brown papers","url":"https://www.rihs.org/mssinv/Mss312.htm"}},{"year":1808,"title":"US ban on importing enslaved people takes effect","text":"The 1807 Act takes effect on 1 January 1808 after a rush of arrivals at Charleston; smuggling and the domestic trade continue.","ids":["us-slave-trade-act-1807","port-charleston","dewolf-family"],"source":{"label":"Wikipedia — Act Prohibiting Importation of Slaves","url":"https://en.wikipedia.org/wiki/Act_Prohibiting_Importation_of_Slaves"}},{"year":1817,"title":"Spain agrees to end trade","text":"Anglo-Spanish treaty bans the trade, but illegal shipments to Cuba continue for decades; Cuban slavery ends in 1886.","ids":["anglo-spanish-treaty-1817","crown-of-castile","pedro-martinez-cadiz"],"source":{"label":"EBSCO Research Starters — Spain Agrees to End Slave Trade","url":"https://www.ebsco.com/research-starters/history/spain-agrees-end-slave-trade"}},{"year":1818,"title":"Ghezo's coup with de Souza","text":"Ghezo overthrew Adandozan with the help of Francisco Félix de Souza, who became Chachá and chief agent of the Ouidah trade.","ids":["ghezo-of-dahomey","francisco-felix-de-souza","kingdom-of-dahomey"],"source":{"label":"Wikipedia — Francisco Félix de Souza","url":"https://en.wikipedia.org/wiki/Francisco_F%C3%A9lix_de_Souza"}},{"year":1820,"title":"Osei Bonsu questions abolition","text":"Asantehene Osei Bonsu asked British envoy Joseph Dupuis why Britain had stopped buying captives and doubted its humanitarian motives.","ids":["osei-bonsu-of-asante","asante-empire"],"source":{"label":"Bedford/St Martin's (McKay, Sources) — Osei Bonsu, An Asante King Questions British Motives (1820)","url":"https://digfir-published.macmillanusa.com/mckaysources/mckaysources_ch20_3.html"}},{"year":1823,"title":"Demerara uprising begins on Gladstone estate","text":"The large 1823 rebellion of enslaved people in Demerara began on John Gladstone's Success plantation and was violently suppressed.","ids":["gladstone-family"],"source":{"label":"AP via WSLS — Descendants tle":"Emancipation in French and Danish colonies","text":"France abolished slavery on 27 April 1848, freeing c. 250,000 people; on 3 July enslaved people on St Croix forced emancipation in the Danish West Indies.","ids":["crown-of-france","danish-west-indies","crown-of-denmark-norway"],"source":{"label":"Wikipedia — Decree of the Abolition of Slavery of April 27, 1848","url":"https://en.wikipedia.org/wiki/Decree_of_the_Abolition_of_Slavery_of_April_27,_1848"}},{"year":1850,"title":"Forbes fails to persuade Ghezo","text":"Royal Navy Captain Frederick Forbes's mission failed to persuade Ghezo to abolish the trade; Ghezo gave him a captive girl, later Sarah Forbes Bonetta. A blockade followed in 1851.","ids":["ghezo-of-dahomey","kingdom-of-dahomey"],"source":{"label":"Royal Collection Trust — Dahomey and the Dahomans, vol. 2, by Frederick E. Forbes","url":"https://col.rct.uk/collection/1072072/dahomey-and-the-dahomans-v-2-by-frederick-e-forbes"}},{"year":1850,"title":"Brazil's Eusébio de Queirós Law","text":"Under British naval pressure Brazil enforces its ban on the African trade; landings largely end by 1856.","ids":["eusebio-de-queiros-law-1850","jose-bernardino-de-sa","joaquim-pereira-marinho"],"source":{"label":"Wikipedia — Eusébio de Queirós Law","url":"https://en.wikipedia.org/wiki/Eus%C3%A9bio_de_Queir%C3%B3s_Law"}},{"year":1851,"title":"British bombardment of Lagos","text":"British warships attacked Lagos on 26–28 December, deposing Kosoko and installing Akitoye, who signed an anti-slave-trade treaty on 1 January 1852.","ids":["kosoko-of-lagos","port-lagos","lagos-treaty-1852","madam-tinubu"],"source":{"label":"Wikipedia — Akitoye","url":"https://en.wikipedia.org/wiki/Akitoye"}},{"year":1858,"title":"The Wanderer lands on Jekyll Island","text":"Charles Lamar's yacht lands c. 400 Africans in Georgia, 50 years after the ban; no one is convicted.","ids":["wanderer-ship","charles-lamar"],"source":{"label":"New Georgia Encyclopedia — Wanderer","url":"https://www.georgiaencyclopedia.org/articles/history-archaeology/wanderer/"}},{"year":1860,"title":"The Clotilda arrives in Mobile","text":"Timothy Meaher's schooner brings 110 captives from Ouidah, the last documented slave voyage to the US; the ship is burned to hide the crime.","ids":["clotilda-meaher","port-ouidah","africatown"],"source":{"label":"Encyclopedia of Alabama — Africatown","url":"https://encyclopediaofalabama.org/article/africatown/"}},{"year":1862,"title":"Nathaniel Gordon hanged","text":"The captain of the Erie becomes the only American executed for slave trading after Lincoln refuses clemency.","ids":["nathaniel-gordon","erie-ship"],"source":{"label":"HarpWeek — Execution of Gordon the Slave-Trader","url":"https://blackhistory.harpweek.com/7Illustrations/Slavery/ExecutionOfSlavetrader.htm"}},{"year":1863,"title":"Dutch abolition (Keti Koti)","text":"The Netherlands abolished slavery in Suriname and the Antilles on 1 July 1863, compensating enslavers; forced 'state supervision' labour lasted to 1873.","ids":["society-of-suriname","de-nederlandsche-bank","house-of-orange"],"source":{"label":"DNB — DNB apologises for its historical links to slavery","url":"https://www.dnb.nl/en/general-news/2022/dnb-apologises-for-its-historical-links-to-slavery"}},{"year":1886,"title":"Cuba abolishes slavery","text":"Spain ends the patronato system, completing gradual emancipation in Cuba begun by the 1870 Moret Law.","ids":["port-havana","julian-de-zulueta"],"source":{"label":"Hispanic American Historical Review — Rebecca Scott, Gradual Abolition and the Dynamics of Slave Emancipation in Cuba, 1868–86","url":"https://dup.silverchair.com/hahr/article/63/3/449/148684/Gradual-Abolition-and-the-Dynamics-of-Slave"}},{"year":1887,"title":"Jaja of Opobo deported","text":"Vice-Consul Harry Johnston lured Jaja aboard a British ship; tried in Accra, he was exiled to the West Indies.","ids":["jaja-of-opobo"],"source":{"label":"NOW Grenada — This day in history: 8 June 1888 (Jaja arrives in function normalize(raw){
  const arr = Array.isArray(raw) ? raw : (raw.records || []);
  const byId = {}, profiles = [], entities = [];
  arr.forEach(r=>{
    if(!r || !r.id || byId[r.id]){ if(r?.id) console.warn('Duplicate id', r.id); return; }
    const n = {...r};
    if(n.type === 'entity'){ n._kind='entity'; entities.push(n); }
    else {
      n._kind='profile';
      if(!CATS[n.category]) { console.warn(`${n.id}: unknown category "${n.category}"`); n.category='European Families'; }
      if(!SCALE[n.scale]) n.scale='Significant';
      profiles.push(n);
    }
    n._s = Number.isFinite(+n.start) && n.start!==null ? +n.start : null;
    n._e = n.end==null ? NOW : +n.end;
    byId[n.id]=n;
  });
  const links = [], seen = new Set();
  arr.forEach(r=>(r?.connections||[]).forEach(c=>{
    const o = typeof c==='string' ? {id:c} : c;
    if(!byId[o.id] || o.id===r.id){ if(!byId[o.id]) console.warn(`${r.id}: connection to unknown id "${o.id}" skipped`); return; }
    const key=[r.id,o.id].sort().join('|');
    if(seen.has(key)) return; seen.add(key);
    links.push({source:r.id, target:o.id, type:EDGE[o.type]?o.type:'connection', label:o.label||''});
  }));
  // entities without dates borrow the earliest year of their neighbours, for the period filter & timeline
  entities.forEach(e=>{ if(e._s!=null) return;
    const ys=links.filter(l=>l.source===e.id||l.target===e.id).map(l=>byId[l.source===e.id?l.target:l.source]._s).filter(y=>y!=null);
    if(ys.length){ e._s=Math.min(...ys); e._approx=true; } });
  const events = (raw.events||[]).filter(ev=>ev && Number.isFinite(+ev.year)).map(ev=>({...ev, year:+ev.year, ids:(ev.ids||[]).filter(id=>byId[id])}))
    .sort((a,b)=>a.year-b.year);
  const evBy = new Map(); events.forEach(ev=>ev.ids.forEach(id=>{ if(!evBy.has(id)) evBy.set(id,[]); evBy.get(id).push(ev); }));
  const nbNames = id => links.filter(l=>l.source===id||l.target===id).map(l=>byId[l.source===id?l.target:l.source].name);
  profiles.forEach(p=>{ p._hay=[p.name,...(p.aliases||[]),p.category,p.role,p.nation,p.scale,p.base,p.lifespan,
    p.origins,p.role_summary,p.legacy,p.scaleNote,
    ...(p.roleDetail||[]).map(x=>x.t+' '+x.d),...(p.legacyDetail||[]).map(x=>x.t+' '+x.d),
    ...nbNames(p.id)].join(' ').toLowerCase(); });
  entities.forEach(e=>{ e._hay=[e.name,e.kind,e.description,...nbNames(e.id)].join(' ').toLowerCase(); });
  const nations=[...new Set(profiles.map(p=>p.nation).filter(Boolean))].sort();
  return {profiles, entities, links, byId, events, evBy, nations};
}
/* Overlaps: two players overlap when they reach the same hub (an entity, or a company/bank) through real
   (non-"parallel") links within OVL_HOPS steps. Paths never pass THROUGH a law/charter/legacy record or a very large hub. */
const OVL_HOPS = 2, OVL_THROUGH_MAX = 18;
const NO_PASS = /law|charter|treaty|act|apology|legacy|database|report/i;
const hubOK = n => n._kind==='entity' || isCo(n);
function computeOverlaps(D){
  const adj=new Map(), add=(a,b,l)=>{ if(!adj.has(a)) adj.set(a,[]); adj.get(a).push({id:b,l}); };
  D.links.forEach(l=>{ if(l.type==='parallel') return; add(l.source,l.target,l); add(l.target,l.source,l); });
  const players=D.profiles.filter(p=>!isCo(p));
  const hubs=new Map();
  players.forEach(p=>{
    const seen=new Set([p.id]), q=[[p.id]];
    while(q.length){
      const path=q.shift(); if(path.length>OVL_HOPS) continue;
      const cur=path[path.length-1], cn=D.byId[cur];
      if(path.length>1 && (NO_PASS.test(cn.kind||'') || (adj.get(cur)||[]).length>OVL_THROUGH_MAX)) continue;
      (adj.get(cur)||[]).forEach(({id})=>{
        if(seen.has(id)||!hubOK(D.byId[id])) return;
        seen.add(id); const np=[...path,id]; q.push(np);
        if(!hubs.has(id)) hubs.set(id,new Map()); hubs.get(id).set(p.id,np);
      });
    }
  });
  const pairs=new Map(), key=(a,b)=>[a,b].sort().join('|');
  const deg=id=>adj.get(id)?.length||0;
  const offer=(a,b,path,hub=null)=>{
    const k=key(a,b), cur=pairs.get(k);
    if(!cur||path.length<cur.path.length||(path.length===cur.path.length&&hub&&cur.hub&&deg(hub)>deg(cur.hub))) pairs.set(k,{a,b,path,hub}); };
  D.links.forEach(l=>{ const a=D.byId[l.source], b=D.byId[l.target];
    if(l.type!=='parallel' && a._kind==='profile' && b._kind==='profile' && !isCo(a) && !isCo(b)) offer(l.source,l.target,[l.source,l.target]); });
  hubs.forEach((m,hubId)=>{
    const ents=[...m.entries()];
    for(let i=0;i<ents.length;i++) for(let j=i+1;j<ents.length;j++){
      const [a,pa]=ents[i], [b,pb]=ents[j];
      if(pa.some((x,k)=>k>0&&pb.includes(x)&&x!==pa[pa.length-1])) continue;
      offer(a,b,[...pa,...pb.slice(0,-1).reverse()],hubId);
    }
  });
  const meet=new Map();
  pairs.forEach(({a,b,path,hub})=>{ if(!hub) return; if(!meet.has(hub)) meet.set(hub,new Map());
    const i=path.indexOf(hub), m=meet.get(hub), set=(p,pp)=>{ if(!m.has(p)||pp.length<m.get(p).length) m.set(p,pp); };
    set(a,path.slice(0,i+1)); set(b,path.slice(i).reverse()); });
  [...D.entities,...D.profiles.filter(isCo)].forEach(e=>{
    const direct=(adj.get(e.id)||[]).map(x=>x.id).filter(id=>D.byId[id]._kind==='profile'&&!isCo(D.byId[id]));
    if(new Set(direct).size<2 && !meet.has(e.id)) return;
    if(!meet.has(e.id)) meet.set(e.id,new Map());
    direct.forEach(p=>meet.get(e.id).set(p,[p,e.id]));
  });
  const byProfile=new Map(D.profiles.map(p=>[p.id,[]]));
  pairs.forEach(pr=>{ byProfile.get(pr.a).push({other:pr.b,path:pr.path}); byProfile.get(pr.b).push({other:pr.a,path:[...pr.path].reverse()}); });
  byProfile.forEach(l=>l.sort((x,y)=>x.path.length-y.path.length));
  [...D.entities,...D.profiles].forEach(e=>{ e._shared=meet.get(e.id)?.size||0; });
  return {hubs:meet, pairs, byProfile};
}
/* Map regions for the Organic layout: each player joins the largest shared hub (3+) they belong to. */
function computeCommunities(D){
  const H=D.ovl.hubs, hubs=[...H.entries()].filter(([,m])=>m.size>=3).sort((a,b)=>b[1].size-a[1].size).map(([id])=>id);
  const comm=new Map();
  D.profiles.forEach(p=>{ if(H.has(p.id)&&H.get(p.id).size>=3){ comm.set(p.id,p.id); return; } const h=hubs.find(h=>H.get(h).has(p.id)); if(h) comm.set(p.id,h); });
  const members=c=>D.profiles.filter(p=>comm.get(p.id)===c).length;
  D.profiles.forEach(p=>{
    if(comm.has(p.id)&&members(comm.get(p.id))>1) return;
    const tie=(D.ovl.byProfile.get(p.id)||[]).find(o=>o.path.length===2&&comm.has(o.other)&&comm.get(o.other)!==comm.get(p.id));
    if(tie) comm.set(p.id,comm.get(tie.other));
  });
  H.forEach((m,h)=>{ if(comm.has(h)&&D.byId[h]._kind==='profile') return; const c=new Map(); m.forEach((_,p)=>{ if(comm.has(p)) c.set(comm.get(p),(c.get(comm.get(p))||0)+1); });
    if(c.size) comm.set(h,[...c.entries()].sort((x,y)=>y[1]-x[1])[0][0]); });
  const nb=new Map(), add=(a,b)=>{ if(!nb.has(a)) nb.set(a,[]); nb.get(a).push(b); };
  D.links.forEach(l=>{ if(l.type!=='parallel'){ add(l.source,l.target); add(l.target,l.source); } });
  let frontier=[...comm.keys()];
  while(frontier.length){
    const next=[];
    frontier.forEach(id=>(nb.get(id)||[]).forEach(o=>{ if(!comm.has(o)){ comm.set(o,comm.get(id)); next.push(o); } }));
    frontier=next;
  }
  const regions=[...new Set(D.profiles.map(p=>comm.get(p.id)).filter(Boolean))], idx=new Map(regions.map((c,i)=>[c,i]));
  Object.values(D.byId).forEach(n=>{ n._comm=idx.has(comm.get(n.id))?idx.get(comm.get(n.id)):-1; });
  return regions.length;
}
const commCenter = (i,w,h) => { const n=DATA.nComm||1, a=-Math.PI/2+2*Math.PI*i/n, R=Math.min(w,h)*.36;
  return i<0 ? [w/2,h/2] : [w/2+Math.cos(a)*R*1.15, h/2+Math.sin(a)*R*.9]; };
const linkBetween = (a,b) => DATA.links.find(l=>(l.source===a&&l.target===b)||(l.source===b&&l.target===a));
const viaText = path => path.length<=2 ? 'direct: '+(linkBetween(path[0],path[1])?.label||'linked')
  : 'via '+path.slice(1,-1).map(id=>DATA.byId[id].name).join(' → ');
const catColor = n => CATS[n.category]?.color || 'var(--muted)';
const colorOf = n => n._kind==='profile' ? catColor(n) : ENTITY_COLOR;
const period = k => PERIODS.find(p=>p.k===k);
const passCat = p => state.cat==='all' || p.category===state.cat;
const passRole = p => state.role==='all' || p.role===state.role;
const passNat = p => state.nation==='all' || p.nation===state.nation;
const passEra = p => { if(state.era==='all') return true; const P=period(state.era); return p._s==null || (p._s<=P.to && p._e>=P.from); };
const terms = () => state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
const matchQ = n => { const t=terms(); return !t.length || t.every(w=>n._hay.includes(w)); };
const narrowedNow = () => state.cat!=='all'||state.role!=='all'||state.nation!=='all'||state.era!=='all'||terms().length>0;
function filterNote(noun='players'){
  if(!narrowedNow()) return '';
  const bits=[state.era!=='all'?period(state.era).label:'', state.cat!=='all'?state.cat:'', state.role!=='all'?state.role:'',
    state.nation!=='all'?state.nation:'', terms().length?'search “'+state.q.trim()+'”':''].filter(Boolean);
  return `<p class="fnote">Filtered to ${esc(bits.join(' · '))}: showing ${visibleProfiles().length} of ${DATA.profiles.length} ${noun}. <button data-clear>Clear filters</button></p>`;
}
function clearFilters(){
  state.cat='all'; state.role='all'; state.nation='all'; state.era='all'; state.q=''; document.getElementById('q').value=''; refresh();
}
document.addEventListener('click',e=>{ if(e.target.closest('[data-clear]')) clearFilters(); });
const visibleProfiles = () => DATA.profiles.filter(p=>passCat(p)&&passRole(p)&&passNat(p)&&passEra(p)&&matchQ(p));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hl(text){
  const t=terms(); let out=esc(text); if(!t.length) return out;
  t.forEach(w=>{ const re=new RegExp('('+esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); out=out.replace(re,'<mark>$1</mark>'); });
  return out;
}
function neighbors(id){
  return DATA.links.filter(l=>l.source===id||l.target===id).map(l=>{
    const out=l.source===id; return {link:l, other:DATA.byId[out?l.target:l.source], out};
  });
}
const scaleLabel = p => (p.scale||'—') + (p.scaleBasis==='estimated'?' est.':'');
const activeLabel = n => n._s==null ? '—' : n._s + '–' + (n.end==null ? 'today' : n.end);
const fmtN = v => v>=1e6 ? (v/1e6).toFixed(v>=1e7?1:2).replace(/\.?0+$/,'')+'M' : v>=1e3 ? Math.round(v/1e3)+'K' : String(v);

/* Visible subgraph: filtered profiles + entities reachable through entities (≤2 hops) */
function subgraph(){
  const profs = visibleProfiles();
  if(state.overlap){
    const ok=new Set(profs.map(p=>p.id)), vis=new Map(), edges=new Set();
    DATA.ovl.pairs.forEach(({a,b,path})=>{
      if(!ok.has(a)||!ok.has(b)) return;
      const home=DATA.byId[a];
      path.forEach(id=>{ if(!vis.has(id)){ const n=DATA.byId[id]; vis.set(id,{cat:n._kind==='profile'?n.category:home.category}); } });
      path.slice(1).forEach((id,i)=>edges.add([path[i],id].sort().join('|')));
    });
    return {vis, links: DATA.links.filter(l=>edges.has([l.source,l.target].sort().join('|')))};
  }
  const vis = new Map(profs.map(p=>[p.id,{cat:p.category}]));
  let frontier = profs.map(p=>p.id);
  for(let hop=0; hop<2; hop++){
    const next=[];
    frontier.forEach(id=>{
      const home=vis.get(id);
      DATA.links.forEach(l=>{
        if(l.type==='parallel') return;
        const other = l.source===id ? l.target : l.target===id ? l.source : null;
        if(!other || vis.has(other) || DATA.byId[other]._kind!=='entity') return;
        if(state.era!=='all' && !passEra(DATA.byId[other])) return;
        vis.set(other,home); next.push(other);
      });
    });
    frontier=next;
  }
  return {vis, links: DATA.links.filter(l=>vis.has(l.source)&&vis.has(l.target))};
}

/* =====================================================================
   MIND MAP (D3 force graph)
   ===================================================================== */
const G = {svg:null, root:null, zoom:null, sim:null, nodes:[], links:[], pos:new Map(), w:0, h:0, fitT:null};
const isHub = n => n._kind==='entity' && n._shared>=2;
const rFor = n => n._kind==='entity' ? (isHub(n) ? 8+Math.min(10,2*(n._shared-2)) : 7) : (SCALE[n.scale]?.r || 12);
/* Timeline layout: piecewise-linear years so the busy centuries get room */
const TL = {years:[1400,1500,1600,1700,1808,1889,NOW+5], stops:[0,.06,.26,.44,.7,.84,1]};
const tlWidth = w => Math.max(w*2.4, 2600);
const TL_H = 1150;
const tlBandY = cat => { const i=BANDS.indexOf(cat), n=BANDS.length; return TL_H*(.1+.82*(i<0?.5:i/(n-1))); };
let yearX = null;

function renderLegend(){

}

function renderMap(){
  const host=document.getElementById('map');

    ax.selectAll('text.band').data(BANDS).join('text').attr('class','band').attr('x',yearX(1440)).attr('y',d=>tlBandY(d)-40).attr('text-anchor','start')
      .style('fill',d=>CATS[d].color).text(d=>d);

  const elabel=root.append('g').selectAll('text').data(G.links).join('text').attr('class','elabel').attr('text-anchor','middle').text(d=>d.label||'');

  const node=root.append('g').selectAll('g').data(G.nodes,d=>d.id).join('g')
    .attr('class',d=>`node ${d._kind}${isHub(d)?' hub':''}${isCo(d)?' co':''}${d.scaleBasis==='estimated'?' est':''}`)
    .style('--c',d=>d._kind==='profile'?catColor(d):null)
    .attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.name)
    .on('click',(ev,d)=>{ ev.stopPropagation(); openNode(d.id); })
    .on('keydown',(ev,d)=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openNode(d.id);} })
    .on('mouseenter',(ev,d)=>hot(d.id)).on('mouseleave',()=>{ state.openId ? hot(state.openId) : clearHot(); })
    .call(d3.drag()
      .on('start',(ev,d)=>{ if(!ev.active) G.sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
      .on('end',(ev,d)=>{ if(!ev.active) G.sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  const prof=node.filter(d=>d._kind==='profile');
  prof.append('circle').attr('class','ring').attr('r',d=>d.r);
  prof.append('circle').attr('class','core').attr('r',d=>Math.max(2.5,d.r*.3));
  prof.append('text').attr('text-anchor','middle').attr('dy',d=>d.r+15).text(d=>d.name);
  const boxed=node.filter(d=>d.hw);
  boxed.append('rect').attr('class','box').attr('x',d=>-d.hw).attr('y',d=>-d.hh).attr('width',d=>d.hw*2).attr('height',d=>d.hh*2);
  boxed.filter(isHub).append('text').attr('text-anchor','middle').attr('dy','.36em').text(d=>d.label);
  node.filter(d=>d._kind==='entity'&&!isHub(d)).append('text').attr('text-anchor','middle').attr('dy',d=>d.hh+11)
    .attr('class',crowded?'minor':null).text(d=>d.label);
  node.filter(isHub).append('title').text(d=>`${d.name}: shared by ${d._shared} players`);

  G.sim=d3.forceSimulation(G.nodes)
    .force('link',d3.forceLink(G.links).id(d=>d.id)
      .distance(l=>l.type==='parallel'?220:(l.source._kind==='profile'&&l.target._kind==='profile')?120:(l.source._kind==='profile'||l.target._kind==='profile')?95:70)
      .strength(l=>tl?(l.type==='parallel'?0:.04):l.type==='parallel'?.05:SOFT.includes(l.type)?.25:.6))
    .force('charge',d3.forceManyBody().strength(d=>d._kind==='profile'?-360:isHub(d)?-240:-110).distanceMax(600))
    .force('collide',d3.forceCollide(d=>d._kind==='profile'?d.r+26:d.hw?d.hw*.7+10:12))
    .on('tick',()=>{
      link.attr('d',d=>{
        const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
        const s0=reach(d.source,ux,uy), t0=reach(d.target,ux,uy)+(d.type==='parallel'?0:3);
        return `M${d.source.x+ux*s0},${d.source.y+uy*s0}L${d.target.x-ux*t0},${d.target.y-uy*t0}`;
      });
      elabel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2-4);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    })
    .on('end',()=>{ G.nodes.forEach(n=>G.pos.set(n.id,{x:n.x,y:n.y})); if(!G.userZoomed) fit(600); });

  applyLayout(false);
  if(state.openId) hot(state.openId);
}

function applyLayout(reheat){
  if(!G.sim) return;
  const {w,h}=G, sim=G.sim;
  const quad={'Crowns & Explorers':[.5,.18],'European Families':[.2,.3],'Companies & Banks':[.8,.3],'African States & Families':[.3,.78],'American Families':[.72,.78]};
  sim.force('center', state.layout==='force' ? d3.forceCenter(w/2,h/2) : null);
  if(state.layout==='cluster'){
    sim.force('x',d3.forceX(d=>w*(quad[d.home?.cat]||[.5,.5])[0]).strength(d=>d._kind==='profile'?.18:.08));
    sim.force('y',d3.forceY(d=>h*(quad[d.home?.cat]||[.5,.5])[1]).strength(d=>d._kind==='profile'?.18:.08));
  } else if(state.layout==='timeline'){
    sim.force('x',d3.forceX(d=>d._s!=null?yearX(d._s):G.w).strength(d=>d._s==null?0:d._kind==='profile'?.9:d._approx?.15:.6));
    sim.force('y',d3.forceY(d=>tlBandY(d._kind==='profile'?d.category:d.home?.cat)).strength(d=>d._kind==='profile'?.6:.1));
  } else {
    sim.force('x',d3.forceX(d=>commCenter(d._comm,w,h)[0]).strength(d=>d._comm<0?.02:.06));
    sim.force('y',d3.forceY(d=>commCenter(d._comm,w,h)[1]).strength(d=>d._comm<0?.02:.06));
  }
  sim.alpha(reheat?.9:1).restart();
  clearTimeout(G.fitT); G.fitT=setTimeout(()=>fit(500),900);
}

function fit(dur){
  if(!G.nodes.length||!G.svg) return;
  const tl=state.layout==='timeline';
  const pad=60, q=G.nodes.length>40&&!tl?.04:0, qs=a=>{ a=[...a].sort((x,y)=>x-y); return [a[Math.floor(q*(a.length-1))], a[Math.ceil((1-q)*(a.length-1))]]; };
  let [xa,xb]=qs(G.nodes.map(n=>n.x)), [ya,yb]=qs(G.nodes.map(n=>n.y));
  if(tl){ xa=Math.min(xa,yearX(1492)-200); ya=Math.min(ya,0); }
  const x0=xa-pad, x1=xb+pad, y0=ya-pad, y1=yb+pad+20;
  const L = G.w>760 ? (document.getElementById('legend').offsetWidth+24) : 0;
  const aw=G.w-L;
  if(tl){   // fit the height and open at 1492; later centuries are a pan to the right
    const k=Math.max(.8,Math.min(1.1,G.h/(y1-y0)));
    G.svg.transition().duration(dur).call(G.zoom.transform, d3.zoomIdentity.translate(L+10-k*x0, G.h/2-k*(y0+y1)/2).scale(k));
    return;
  }
  const k=Math.max(.25,Math.min(1.6, Math.min(aw/(x1-x0), G.h/(y1-y0))));
  G.svg.transition().duration(dur).call(G.zoom.transform, d3.zoomIdentity.translate(L+aw/2-k*(x0+x1)/2, G.h/2-k*(y0+y1)/2).scale(k));
}
function hot(id){
  if(!G.root) return;
  const nb=new Set([id]); G.links.forEach(l=>{ if(l.source.id===id) nb.add(l.target.id); if(l.target.id===id) nb.add(l.source.id); });
  const on=d=>d.source.id===id||d.target.id===id;
  G.root.selectAll('.node').classed('faded',d=>!nb.has(d.id)).classed('nb',d=>nb.has(d.id)).classed('sel',d=>d.id===state.openId);
  G.root.selectAll('.link').classed('faded',d=>!on(d)).classed('hot',on);
  G.root.selectAll('.elabel').classed('faded',d=>!on(d)).style('opacity',d=>on(d)?.95:null);
}
function clearHot(){
  if(!G.root) return;
  G.root.selectAll('.node').classed('faded',false).classed('nb',false).classed('sel',d=>d.id===state.openId);
  G.root.selectAll('.link').classed('faded',false).classed('hot',false);
  G.root.selectAll('.elabel').classed('faded',false).style('opacity',null);
}
