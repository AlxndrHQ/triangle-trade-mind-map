<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Triangle Trade — Mind Map of the Players, 1492–Today</title>
<meta name="description" content="Interactive mind map and dossiers on the European families, African states and families, American families, and companies that built and profited from the transatlantic slave trade, from Amerigo Vespucci in 1492 to today's apologies and reparations debates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* ============ TOKENS — paper (light) / ink (dark) ============ */
:root{
  --bg:#FAFAF7; --bg2:#F3F2EC; --text:#1F1D18; --text2:#1f1d18d9; --muted:#6B6960; --dim:#9C998E;
  --line:#E8E6DF; --line2:#D8D5CB; --accent:#8A5A2B; --accent-soft:#8a5a2b1a;
  --edge:#C4C1B6; --edge-strong:#8F8C82;
  --c-eu:#2a78d6; --c-co:#eb6834; --c-af:#1baf7a; --c-cr:#eda100; --c-am:#6250d6;
  --doc:#3C7A5E; --pattern:#8A5A2B; --scrim:#1f1d1826; --bar:#8A5A2B;
  --serif:'Iowan Old Style','Apple Garamond',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E10; --bg2:#151518; --text:#E8E6DF; --text2:#e8e6dfd9; --muted:#8A8A92; --dim:#5E5E66;
    --line:#26262B; --line2:#34343A; --accent:#C9A875; --accent-soft:#c9a8751f;
    --edge:#36363D; --edge-strong:#5E5E66;
    --c-eu:#3987e5; --c-co:#d95926; --c-af:#199e70; --c-cr:#c98500; --c-am:#9085e9;
    --doc:#7FB89B; --pattern:#C9A875; --scrim:#00000099; --bar:#C9A875;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E10; --bg2:#151518; --text:#E8E6DF; --text2:#e8e6dfd9; --muted:#8A8A92; --dim:#5E5E66;
  --line:#26262B; --line2:#34343A; --accent:#C9A875; --accent-soft:#c9a8751f;
  --edge:#36363D; --edge-strong:#5E5E66;
  --c-eu:#3987e5; --c-co:#d95926; --c-af:#199e70; --c-cr:#c98500; --c-am:#9085e9;
  --doc:#7FB89B; --pattern:#C9A875; --scrim:#00000099; --bar:#C9A875;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent);text-underline-offset:2px}
::selection{background:#c9a87533}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.lbl{font:500 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.14em;flex:none}

/* ============ HEADER ============ */
header.top{border-bottom:1px solid var(--line);background:var(--bg);padding:16px 24px 0;flex:none;z-index:5}
.row1{display:flex;align-items:center;gap:14px 24px;flex-wrap:wrap}
.brand{min-width:0}
.brand h1{font:400 22px/1.15 var(--serif);margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;margin-top:4px;font:500 10px var(--mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.search{flex:1;min-width:200px;max-width:420px;position:relative;margin-left:auto}
.search input{width:100%;background:transparent;border:1px solid var(--line);border-radius:2px;padding:7px 10px 7px 30px;color:var(--text);font:13px var(--sans);outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--edge-strong)}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 10px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:2px;padding:0 5px}
.tabs{display:flex;gap:18px}
.tabs button,.theme{background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tabs button:hover,.theme:hover{color:var(--text)}
.tabs button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent)}
.row2{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 26px;padding:12px 0 11px}
.fgroup{display:flex;align-items:baseline;gap:12px}
.seg,.chips{display:inline-flex;flex-wrap:wrap;gap:3px 13px}
.seg button,.chip{background:none;border:0;border-bottom:1px solid transparent;padding:1px 0;font:400 12.5px var(--sans);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:color .15s}
.seg button:hover,.chip:hover{color:var(--text)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent)}
.chip .d{width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted))}
.seg .n,.chip .n{font:500 9.5px var(--mono);color:var(--dim)}
select.nsel{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:2px;font:12.5px var(--sans);padding:2px 6px;max-width:220px}

/* ============ STAGE ============ */
main{flex:1;min-height:0;position:relative}
#map,#grid,#atlas{position:absolute;inset:0}
#map{background:var(--bg)}
#map svg{display:block;width:100%;height:100%;cursor:grab}
#map svg:active{cursor:grabbing}
#grid{overflow:auto;padding:40px 24px 64px}
[hidden]{display:none!important}

/* graph */
.link{fill:none;stroke:var(--edge);stroke-width:.9;transition:opacity .18s}
.link.dashed{stroke-dasharray:5 4}
.link.dotted{stroke-dasharray:1 3.5;stroke-linecap:round}
.link.t-trade{stroke:var(--edge-strong)}
.link.hot{stroke:var(--accent);stroke-width:1.3;opacity:1}
.arrow{fill:var(--edge-strong)}
.elabel{font:500 8.5px var(--mono);letter-spacing:.06em;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:3px;opacity:0;pointer-events:none;transition:opacity .2s}
svg.zoomed .elabel{opacity:.85}
.node{cursor:pointer;transition:opacity .18s}
.node text{pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.node.profile text{font:400 12.5px var(--serif);fill:var(--text)}
.node.profile .ring{fill:var(--bg);stroke:var(--c);stroke-width:1.2}
.node.profile .core{fill:var(--c)}
.node.profile.co .ring{stroke-width:2.2}
.node.profile.est .ring{stroke-dasharray:3 2.5}
.node.entity .box{fill:var(--bg);stroke:var(--edge-strong);stroke-width:1}
.node.entity text{font:500 8.5px var(--mono);letter-spacing:.08em;fill:var(--muted)}
.node.hub .box{stroke:var(--accent)}
.node.hub text{fill:var(--text);stroke:none}
.node .minor{opacity:0;transition:opacity .2s}
svg.zoomed .node .minor,.node:hover .minor,.node.nb .minor,.node.sel .minor{opacity:1}
.node:hover .ring,.node:hover .box{stroke-width:1.8}
.node.sel .ring,.node.sel .box{stroke:var(--accent);stroke-width:2.4}
.faded{opacity:.1!important}
.axis line{stroke:var(--line2)}
.axis line.era{stroke:var(--edge-strong);stroke-dasharray:2 4}
.axis text{font:500 10px var(--mono);letter-spacing:.1em;fill:var(--muted)}
.axis text.era{font:400 15px var(--serif);letter-spacing:0;fill:var(--text2)}
.axis text.band{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}

/* overlays */
.overlay{position:absolute;background:color-mix(in srgb,var(--bg) 94%,transparent);border:1px solid var(--line);border-radius:2px;padding:12px 14px;font-size:12px}
.legend{left:20px;bottom:20px;max-width:260px}
.legend h4,.ctrls h4{margin:0 0 6px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.legend .it{display:flex;align-items:center;gap:9px;color:var(--text2);line-height:1.85;font-size:11.5px}
.legend .sw{width:7px;height:7px;border-radius:50%;flex:none}
.legend .sq{width:7px;height:7px;border:1px solid var(--edge-strong);flex:none}
.legend .hb{width:16px;height:8px;border:1px solid var(--accent);flex:none}
.legend .ln{width:22px;height:0;border-top:1px solid var(--edge-strong);flex:none}
.legend .extra{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.legend .sizes{display:flex;gap:10px;align-items:flex-end;color:var(--muted);font:500 8.5px var(--mono);margin-bottom:10px}
.legend .sz{display:flex;flex-direction:column;align-items:center;gap:4px}
.legend .sz i{display:block;border:1px solid var(--muted);border-radius:50%}
.ctrls{right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px}
.ctrls .btns{display:flex;gap:16px}
.ibtn{background:none;border:0;padding:2px 0;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ibtn:hover{color:var(--text)}
.ibtn.ovl[aria-pressed="true"]{color:var(--accent)}
.hint{left:50%;top:14px;transform:translateX(-50%);border:0;background:none;padding:0;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;pointer-events:none;font-family:var(--serif)}

/* ============ GRID ============ */
.gridhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto 22px;flex-wrap:wrap}
.gridhead h2{margin:0;font:400 32px/1.15 var(--serif);letter-spacing:-.015em}
.gridhead .meta{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));max-width:1120px;margin:0 auto;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.card{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 18px 16px;cursor:pointer;outline:none;transition:background .15s}
.card:hover,.card:focus-visible{background:var(--bg2)}
.ctop{display:flex;align-items:center;gap:8px;font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.ctop .d{width:6px;height:6px;border-radius:50%;background:var(--c)}
.ctop .era{margin-left:auto;color:var(--dim)}
.card h3{margin:10px 0 2px;font:400 21px/1.2 var(--serif);letter-spacing:-.01em}
.life{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kpi{min-width:0}
.kpi label,.bt label{display:block;font:500 9px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:3px}
.kpi b{font-size:12.5px;font-weight:500;display:block;line-height:1.35}
.kpi b.mono{font-family:var(--mono);color:var(--accent)}
.bt{margin:0;font-size:13px;color:var(--text2)}
.badges{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px}
.badge{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.badge::before{content:"› ";color:var(--accent)}
mark{background:var(--accent-soft);color:inherit;border-radius:1px;padding:0 1px}
.foot{max-width:1120px;margin:28px auto 0;font-size:11.5px;color:var(--dim)}
.subh{max-width:1120px;margin:44px auto 14px;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:12px;align-items:center}
.subh::after{content:"";flex:1;height:1px;background:var(--line)}
.subh .n{color:var(--dim)}
.subh.sech{margin-top:36px}
.subh.sech:first-of-type{margin-top:8px}
.subh .d{width:7px;height:7px;border-radius:50%;background:var(--c)}
.fnote{max-width:1120px;margin:-6px auto 22px;font:500 10.5px/1.7 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fnote button,.clearf{background:none;border:0;border-bottom:1px solid var(--accent);padding:0;color:var(--accent);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.clearf{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;align-self:center}
.empty-sec{max-width:1120px;margin:0 auto;font:italic 400 14.5px var(--serif);color:var(--dim)}
.lede{max-width:1120px;margin:0 auto 26px;color:var(--text2);font:400 16.5px/1.6 var(--serif)}
.lede.small{font-size:15px;margin-bottom:14px}

/* overlaps */
.hubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));max-width:1120px;margin:0 auto;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.hub{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px;min-width:0}
.hub .hh{display:flex;align-items:flex-start;gap:10px}
.hub .hh button{background:none;border:0;padding:0;text-align:left;font:400 19px/1.2 var(--serif);color:var(--text)}
.hub .hh button:hover{color:var(--accent)}
.hub .kind{display:block;font:500 9px/1.6 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
.hub .cnt{margin-left:auto;flex:none;font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:1px 6px}
.who{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.who button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 0;min-width:0}
.who button:hover .nm{color:var(--accent)}
.who .d{width:6px;height:6px;border-radius:50%;flex:none;align-self:center}
.who .nm{font:400 14.5px var(--serif);flex:0 1 auto;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .via{flex:1 1 0}
.who .via{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.who li.out{padding:8px 0 2px;font-size:11.5px;line-height:1.7;color:var(--dim)}
.who li.out button{display:inline;width:auto;border:0;padding:0;background:none;color:var(--muted);font:inherit}
.ties{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tie{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;border-bottom:1px solid var(--line);padding:11px 0;font-size:13px}
.tie button{background:none;border:0;padding:0;font:400 14.5px var(--serif);color:var(--text)}
.tie button:hover{color:var(--accent)}
.tie .rel{color:var(--muted);font-size:12px}

/* ============ CHRONOLOGY ============ */
.chron{max-width:1120px;margin:0 auto}
.ev{display:grid;grid-template-columns:86px 1fr;gap:4px 22px;border-bottom:1px solid var(--line);padding:16px 0}
.ev .yr{font:500 15px var(--mono);color:var(--accent);padding-top:2px}
.ev h4{margin:0;font:400 19px/1.25 var(--serif);letter-spacing:-.005em}
.ev p{margin:4px 0 0;color:var(--text2);font-size:13.5px}
.ev .ppl{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
.ev .ppl button{background:none;border:0;padding:0;font:400 13px var(--serif);color:var(--text);display:inline-flex;align-items:center;gap:6px}
.ev .ppl button:hover{color:var(--accent)}
.ev .ppl .d{width:6px;height:6px;border-radius:50%}
.ev .src{font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:6px;display:inline-block;text-decoration:none}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px 40px;max-width:1120px;margin:0 auto 10px}
.hero{display:flex;gap:40px;flex-wrap:wrap;max-width:1120px;margin:0 auto 26px}
.hero div{min-width:0}
.hero b{display:block;font:400 40px/1.05 var(--serif);letter-spacing:-.02em}
.hero span{font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bars h5{margin:0 0 8px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bar{display:grid;grid-template-columns:150px 1fr 76px;align-items:center;gap:10px;padding:4px 0;font-size:12.5px;color:var(--text2);border-radius:2px}
.bar:hover{background:var(--bg2)}
.bar i{display:block;height:8px;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.bar em{font:500 11px var(--mono);font-style:normal;color:var(--text);text-align:right}
details.tbl{max-width:1120px;margin:6px auto 0;font-size:12px;color:var(--muted)}
details.tbl summary{cursor:pointer;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase}
details.tbl table{border-collapse:collapse;margin-top:8px}
details.tbl td,details.tbl th{border-bottom:1px solid var(--line);padding:4px 14px 4px 0;text-align:left;font-weight:400}
details.tbl td.r{text-align:right;font-family:var(--mono)}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
aside#drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(620px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:21;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
aside#drawer.open{transform:none}
.dhead{padding:24px 32px 20px;border-bottom:1px solid var(--line);position:relative}
.dclose{position:absolute;right:22px;top:18px;width:30px;height:30px;border:0;background:none;color:var(--muted);font-size:15px;display:grid;place-items:center}
.dclose:hover{color:var(--text)}
.eyebrow{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.eyebrow span:first-child{color:var(--text)}
.eyebrow .d{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block}
.eyebrow span+span::before{content:"";display:inline-block;width:24px;height:1px;background:var(--line2);vertical-align:middle;margin-right:12px}
.dhead h2{margin:12px 40px 6px 0;font:400 38px/1.08 var(--serif);letter-spacing:-.02em}
.dbody{flex:1;overflow:auto;padding:24px 32px 52px}
.dbadges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.dbadge{font:400 13px/1.35 var(--sans);color:var(--text)}
.dbadge label{display:block;font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.dbody .kpis{grid-template-columns:repeat(3,1fr);margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin:0 0 16px;padding:1px 0 1px 12px;border-left:1px solid var(--accent)}
blockquote.callout{margin:0 0 14px;padding:0;border:0;font:400 17px/1.55 var(--serif);color:var(--text)}
.sec{margin-top:32px}
.sec h3{display:flex;align-items:center;gap:12px;margin:0 0 12px;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sec h3 .num{color:var(--accent)}
.sec p{margin:0;color:var(--text2)}
ol.steps,ul.bul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ol.steps li,ul.bul li{padding:10px 0 10px 18px;border-bottom:1px solid var(--line);color:var(--text2);font-size:13.5px;position:relative}
ol.steps li::before,ul.bul li::before{content:"›";position:absolute;left:3px;top:9px;color:var(--accent);font-family:var(--mono)}
ol.steps li b,ul.bul li b{color:var(--text);font-weight:600}
.basis{float:right;margin:3px 0 4px 10px;font:500 8.5px var(--mono);letter-spacing:.12em;padding:0 5px;border-radius:2px;text-transform:uppercase;cursor:help;border:1px solid currentColor}
.basis.documented{color:var(--doc)}
.basis.interpretive{color:var(--pattern)}
.net{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.net button{display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0}
.net button:hover .nm{color:var(--accent)}
.net .d{width:6px;height:6px;border-radius:50%;flex:none}
.net .nm{font:400 15px var(--serif)}
.net .rel{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.net .ar{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.dev{border-top:1px solid var(--line)}
.dev div{display:grid;grid-template-columns:56px 1fr;gap:10px;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px;color:var(--text2)}
.dev b{font:500 12px var(--mono);color:var(--accent);font-weight:500}
.srcs{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.disc{margin-top:30px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}

/* ============ ATLAS ============ */
#atlasMap{position:absolute;inset:0;background:var(--bg);z-index:0}
.atlas-bar{left:20px;top:16px;max-width:calc(100% - 40px);z-index:500;display:flex;flex-direction:column;gap:9px;padding:11px 14px}
.atlas-bar .seg button{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.atlas-status{margin:0;font:500 9.5px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);max-width:520px}
.atlas-key{left:20px;bottom:24px;z-index:500;max-width:330px;font-size:11.5px;color:var(--text2)}
.atlas-key h4{margin:0 0 6px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.atlas-key .it{display:flex;align-items:center;gap:9px;line-height:1.8}
.atlas-key .ln{width:24px;height:0;border-top:2px solid;flex:none}
.apin{background:none;border:0}
.apin span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;box-sizing:border-box;font:600 9.5px var(--mono);color:#fff;transition:transform .15s;background:var(--c);border:1.5px solid var(--bg);box-shadow:0 0 0 1px var(--c)}
.apin.ent span{border-radius:1px;background:var(--bg);border:1.5px solid var(--edge-strong);box-shadow:none}
.apin:hover span{transform:scale(1.25)}
.apop .leaflet-popup-content-wrapper{background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:2px;box-shadow:0 10px 30px -12px #0005}
.apop .leaflet-popup-tip{background:var(--bg);border:1px solid var(--line2);box-shadow:none}
.apop .leaflet-popup-content{margin:16px 18px 14px;font:13px/1.5 var(--sans);min-width:220px}
.apop a.leaflet-popup-close-button{color:var(--muted);top:6px;right:6px}
.pop-k{display:flex;align-items:center;gap:8px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pop h4{margin:8px 0 4px;font:400 21px/1.15 var(--serif);letter-spacing:-.01em}
.pop p{margin:0;color:var(--text2)}
.pop .who{max-height:240px;overflow:auto}
.pop .who .nm{font-size:14px}
.leaflet-container{font:13px var(--sans);background:var(--bg)}
.leaflet-control-zoom a{background:var(--bg)!important;color:var(--text)!important;border-color:var(--line)!important;border-radius:2px!important}
.leaflet-bar{border:1px solid var(--line2)!important;box-shadow:none!important;border-radius:2px!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--bg) 85%,transparent)!important;color:var(--dim)!important;font:9.5px var(--sans)}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-tooltip.rtip{background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:2px;box-shadow:none;font:12px var(--sans)}

/* ============ RESPONSIVE ============ */
@media (max-width:760px){
  header.top{padding:12px 16px 0}
  .row1{gap:10px 16px}
  .search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .search kbd{display:none}
  .brand small{display:none}
  .tabs{gap:14px;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .row2{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .row2::-webkit-scrollbar{display:none}
  .seg,.chips{flex-wrap:nowrap}
  #grid{padding:22px 16px 44px}
  .legend .extra{display:none}
  .legend{left:10px;top:10px;bottom:auto;padding:8px 10px}
  .legend h4{display:none}
  .ctrls{right:10px;left:10px;bottom:10px;flex-direction:row;flex-wrap:wrap;justify-content:space-between;padding:8px 10px}
  .ctrls h4{display:none}
  .hint{display:none}
  .dhead,.dbody{padding-left:16px;padding-right:16px}
  .dbadges{grid-template-columns:1fr}
  .dbody .kpis{grid-template-columns:1fr 1fr}
  .dhead h2{font-size:29px}
  .gridhead h2{font-size:26px}
  .ev{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 64px}
  .atlas-bar{left:10px;right:10px;top:10px;max-width:none}
  .atlas-key{left:10px;right:58px;bottom:16px;max-width:none}
  .hero b{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div id="app">
  <header class="top">
    <div class="row1">
      <div class="brand"><h1>The Triangle Trade</h1><small>Players · Families · Companies · 1492–Today</small></div>
      <label class="search" aria-label="Search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search families, companies, ports, kingdoms…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <nav class="tabs" role="group" aria-label="View">
        <button data-view="map" aria-pressed="true" title="Network graph of families, companies, states and places">Web</button>
        <button data-view="grid" aria-pressed="false">Directory</button>
        <button data-view="chron" aria-pressed="false" title="Dated events from 1492 to today">Chronology</button>
        <button data-view="overlaps" aria-pressed="false">Overlaps</button>
        <button data-view="atlas" aria-pressed="false" title="Geographic map of players, ports and the triangle routes">Map</button>
      </nav>
      <button class="theme" id="themeBtn" type="button">☾ Dark</button>
    </div>
    <div class="row2">
      <div class="fgroup"><span class="lbl">Period</span><div class="seg" id="eraSeg" role="group" aria-label="Period"></div></div>
      <div class="fgroup"><span class="lbl">Group</span><div class="chips" id="catChips"></div></div>
      <div class="fgroup"><span class="lbl">Role</span><div class="seg" id="roleSeg" role="group" aria-label="Role"></div></div>
      <div class="fgroup"><span class="lbl">Nation</span><select class="nsel" id="natSel" aria-label="Nation or polity"></select></div>
      <button class="clearf" id="clearBtn" data-clear hidden>Clear filters ✕</button>
    </div>
  </header>

  <main>
    <section id="map" aria-label="Mind map">
      <div class="overlay hint">Drag · Scroll to zoom · Click for dossier</div>
      <div class="overlay legend" id="legend"></div>
      <div class="overlay ctrls">
        <h4>Layout</h4>
        <div class="seg" id="layoutSeg" role="group" aria-label="Layout">
          <button data-layout="force" aria-pressed="true">Organic</button>
          <button data-layout="cluster" aria-pressed="false">Clusters</button>
          <button data-layout="timeline" aria-pressed="false" title="Left to right from 1492 to today">Timeline</button>
        </div>
        <div class="btns">
          <button class="ibtn" id="fitBtn">Fit view</button>
          <button class="ibtn" id="shakeBtn">Re‑run layout</button>
        </div>
        <button class="ibtn ovl" id="ovlBtn" aria-pressed="false" title="Show only players who share a company, port or institution with someone else, and the paths that connect them">Overlaps only</button>
      </div>
      <div class="empty" id="mapEmpty" hidden>No players match these filters.</div>
    </section>
    <section id="grid" aria-label="Directory" hidden></section>
    <section id="atlas" aria-label="Map" hidden>
      <div id="atlasMap"></div>
      <div class="overlay atlas-bar">
        <div class="seg" id="atlasLayer" role="group" aria-label="Map layer">
          <button data-layer="players" aria-pressed="true" title="Every player pinned to its base, plus forts and ports">Players &amp; Places</button>
          <button data-layer="routes" aria-pressed="false" title="The triangle: goods out, captives across, plantation goods back">Triangle Routes</button>
        </div>
        <p class="atlas-status" id="atlasStatus" aria-live="polite"></p>
      </div>
      <div class="overlay atlas-key" id="atlasKey"></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="Dossier"></aside>

<script>
/* =====================================================================
   DATASET — {records:[...], events:[...]}. See README.md for the schema.

const EMBEDDED_DATA = /*DATA-START*/{"records":[{"id":"amerigo-vespucci","name":"Amerigo Vespucci","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Genoa/Florence (Italian states)","scale":"Minor","scaleBasis":"estimated","scaleNote":"No slaving voyage of his own is documented; his ties are indirect but real: he worked inside Gianotto Berardi's Seville house (which traded in enslaved Africans), sailed on the 1499 Ojeda expedition that seized c. 232 Lucayans, and left 'five household slaves' in his 1511 will.","start":1492,"end":1512,"lifespan":"1454–1512","base":"Seville, Spain","geo":[37.389,-5.984],"aliases":["Americus Vespucius","Américo Vespucio"],"origins":"Born in Florence in 1454 (some older sources say 1451), Vespucci was a commercial agent in the household of Lorenzo di Pierfrancesco de' Medici. The Medici sent him to Seville around 1491–92, where he joined the business of the Florentine merchant Gianotto Berardi, Lorenzo's agent and one of Columbus's backers. He was a close friend of Columbus among the Florentines of Seville.","role_summary":"Vespucci stands at the opening of the Atlantic system as merchant-provisioner, navigator and cartographic authority rather than as a slave trader. After Berardi's death (Dec. 1495) he executed his will and tried to complete Berardi's contract to fit out 12 ships for Hispaniola; he sailed with Alonso de Ojeda (1499–1500, Spain) and Gonçalo Coelho (1501–02, Portugal); and from 1508 he was the first Piloto Mayor of the Casa de Contratación, the agency that later administered slave licences.","roleDetail":[{"t":"Worked in a slave-trading merchant house.","d":"Berardi, his employer and partner in Seville, had a business in African slavery and ship chandlery and invested in Columbus's first voyage; the Florentine community in Seville traded in enslaved Africans alongside textiles and dyes (Moya Pons, citing Consuelo Varela). Vespucci's personal part in Berardi's slaving is not documented.","basis":"documented"},{"t":"Sailed on a voyage that took Indigenous captives.","d":"The 1499–1500 Ojeda fleet, two of whose four ships Vespucci and his backers financed, made a slave raid in the Bahamas (c. 232 Lucayans) and Ojeda sold captives in Spain. The 'Soderini' letter attributed to Vespucci says 222 captives were sold at Cádiz, but that letter's authenticity is disputed and his individual role in the raid is not recorded.","basis":"documented"},{"t":"Was himself a slaveholder.","d":"His April 1511 will left most of his modest estate, including five household enslaved people, to his widow María Cerezo (as summarised in Wikipedia's account of the will; primary text not checked here).","basis":"documented"},{"t":"Built the navigational machinery of the Atlantic.","d":"As Piloto Mayor (appointed 22 March 1508) he trained and licensed pilots and oversaw the Padrón Real master chart at the Casa de Contratación, the institution through which the Crown later registered Atlantic shipping, including slave licences. Linking this office to the slave trade is an interpretive, structural point.","basis":"interpretive"}],"legacy":"Two continents carry his name because Martin Waldseemüller's 1507 world map, drawing on the printed 'Mundus Novus' and Soderini letters, labelled the southern landmass 'America'. The only surviving copy of that map was bought by the US Library of Congress for $10 million (agreement 2001, purchase completed 2003) and is on permanent display. His name, more than any other, symbolises the European 'naming' of lands whose peoples were then enslaved.","legacyDetail":[{"t":"Named America (1507).","d":"Waldseemüller's 1507 map was the first to use the name 'America'; he dropped it on later maps (1513, 1516), but it stuck.","basis":"documented"},{"t":"A contested reputation.","d":"Since the 16th century (Las Casas among the first) critics have questioned the authenticity of his letters and his claimed 1497 voyage; historians still debate how many voyages he made.","basis":"documented"}],"sources":[{"label":"Wikipedia — Amerigo Vespucci","url":"https://en.wikipedia.org/wiki/Amerigo_Vespucci"},{"label":"Library of Congress — Library acquires only known copy of 1507 Waldseemüller map (2001)","url":"https://www.loc.gov/item/prn-01-093/"},{"label":"Project Gutenberg — The Letters of Amerigo Vespucci (Hakluyt Society, ed. C. Markham)","url":"https://gutenberg.org/ebooks/36924"},{"label":"Wikisource — 1911 Encyclopædia Britannica, 'Vespucci, Amerigo'","url":"https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Vespucci,_Amerigo"}],"connections":[{"id":"lorenzo-di-pierfrancesco-medici","type":"finance","label":"agent of his Medici patron; wrote him 'Mundus Novus'"},{"id":"gianotto-berardi","type":"trade","label":"worked in Berardi's Seville house; executor of his will"},{"id":"christopher-columbus","type":"voyage","label":"friend; helped provision his fleets"},{"id":"alonso-de-ojeda","type":"voyage","label":"sailed on 1499 Ojeda expedition (Lucayan raid)"},{"id":"casa-de-contratacion","type":"charter","label":"first Piloto Mayor, 1508–12"},{"id":"crown-of-castile","type":"charter","label":"naturalised Castilian subject 1505; royal appointee"},{"id":"crown-of-portugal","type":"voyage","label":"sailed for Portugal 1501–02 (Brazil)"},{"id":"waldseemuller-map-1507","type":"legacy","label":"map named 'America' after him"},{"id":"port-seville","type":"ownership","label":"based in Seville from c. 1492"}]},{"id":"christopher-columbus","name":"Christopher Columbus","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Spain","scale":"Significant","scaleBasis":"documented","scaleNote":"Began the transatlantic traffic in enslaved Indigenous people: several dozen Taíno sent to Spain in 1494, then c. 500 loaded in early 1495, of whom c. 300 survived the voyage (College of Charleston LDHI).","start":1494,"end":1500,"lifespan":"1451–1506","base":"Santo Domingo, Hispaniola","geo":[18.486,-69.931],"aliases":["Cristóbal Colón","Cristoforo Colombo"],"origins":"A Genoese navigator who had sailed to Portuguese West Africa and the Canary Islands, where the Guanche people had long been enslaved and exported to Spain. His 1492 voyage was backed by Isabella and Ferdinand, with private money from Seville's Florentine merchants, notably Gianotto Berardi.","role_summary":"As Admiral and governor of Hispaniola, Columbus imposed tribute in gold and labour on the Taíno and organised their enslavement for sale in Spain, apparently to compensate for gold he had not found. The Crown curbed his slaving, but his rule laid the template of coerced labour that preceded mass African enslavement in the Caribbean.","roleDetail":[{"t":"1495 shipment of Taíno captives.","d":"In early 1495 he loaded c. 500 enslaved Taíno for Spain; only c. 300 survived the crossing (per LDHI, College of Charleston). Others captured in the same campaign were distributed to colonists.","basis":"documented"},{"t":"Tribute and forced labour.","d":"He demanded gold tribute and labour from Hispaniola's Taíno; overwork, violence, famine and disease drove a catastrophic population collapse.","basis":"documented"},{"t":"Crown pushback.","d":"Isabella and Ferdinand quickly cut short his slaving and opposed a transatlantic trade in Indigenous people, though they permitted enslavement within the Americas.","basis":"documented"}],"legacy":"Columbus was removed as governor in 1500. His legacy is fiercely contested: statues have been toppled or removed across the Americas, and in the US many places now mark Indigenous Peoples' Day instead of or alongside Columbus Day.","legacyDetail":[{"t":"From Indigenous to African slavery.","d":"The collapse of Hispaniola's Taíno population under Spanish rule was the immediate context for the Crown's turn to importing enslaved Africans after 1501.","basis":"interpretive"}],"sources":[{"label":"College of Charleston LDHI — The Spanish and New World Slavery","url":"https://ldhi.library.cofc.edu/exhibits/show/african_laborers_for_a_new_emp/the_spanish_and_new_world_slav"},{"label":"Wikipedia — Taíno genocide","url":"https://en.wikipedia.org/wiki/Ta%C3%ADno_genocide"},{"label":"New York Review of Books — Indians, Slaves, and Mass Murder: The Hidden History","url":"https://www.nybooks.com/articles/2016/11/24/indians-slaves-and-mass-murder-the-hidden-history/"}],"connections":[{"id":"crown-of-castile","type":"charter","label":"commissioned by Ferdinand & Isabella"},{"id":"gianotto-berardi","type":"finance","label":"Berardi financed/provisioned his voyages"},{"id":"amerigo-vespucci","type":"voyage","label":"friend; Vespucci helped provision fleets"},{"id":"hispaniola-colony","type":"ownership","label":"first governor of Hispaniola"},{"id":"alonso-de-ojeda","type":"voyage","label":"Ojeda sailed on his 2nd voyage, led campaigns on Hispaniola"},{"id":"port-seville","type":"trade","label":"sent Taíno captives for sale in Spain"},{"id":"treaty-of-tordesillas","type":"political","label":"his voyages prompted the 1494 division"}]},{"id":"lorenzo-di-pierfrancesco-medici","name":"Lorenzo di Pierfrancesco de' Medici","category":"European Families","role":"Financier & Insurer","nation":"Genoa/Florence (Italian states)","scale":"Minor","scaleBasis":"estimated","scaleNote":"A Florentine banker whose Seville branch (run by Berardi, later Vespucci) traded in enslaved Africans among other goods; no figures for his firm's slave dealing are documented.","start":1489,"end":1503,"lifespan":"1463–1503","base":"Florence, Italy","geo":[43.77,11.256],"aliases":["Lorenzo il Popolano"],"origins":"A cousin of Lorenzo 'the Magnificent' from the junior branch of the Medici, he was a wealthy patron of Botticelli and Ficino's circle. He kept commercial agents in Seville, including Gianotto Berardi and Amerigo Vespucci.","role_summary":"Through his Seville agents he had a stake in the Florentine merchant network that supplied Columbus's fleets and dealt in enslaved Africans in Andalusia. He is best known as the addressee of Vespucci's letters, including 'Mundus Novus' (c. 1503), which announced a 'New World' to European readers.","roleDetail":[{"t":"Patron of the Seville branch.","d":"Berardi acted as his representative in Seville; some historians speculate that Columbus indirectly drew on Medici credit via Berardi.","basis":"interpretive"},{"t":"Addressee of 'Mundus Novus'.","d":"Vespucci's letter describing the 1501–02 Brazil voyage was addressed to him and became a European bestseller.","basis":"documented"}],"legacy":"He died in 1503. His name survives chiefly through Vespucci's letters and the Renaissance art he commissioned; his branch of the Medici later produced the Grand Dukes of Tuscany.","legacyDetail":[{"t":"Information as capital.","d":"Letters to Florentine patrons spread knowledge of the Atlantic that fed further investment.","basis":"interpretive"}],"sources":[{"label":"John Carter Brown Library — Mundus novus","url":"https://jcblibrary.org/node/330"},{"label":"Academia Dominicana de la Historia — Moya Pons, The Italian Presence in Santo Domingo (p. 42)","url":"https://italianlegacyrden.academiadominicanahistoria.org.do/files/assets/basic-html/page-42.html"},{"label":"Univ. of Minnesota Bell Library — Vespucci's journeys","url":"https://apps.lib.umn.edu/bell/map/WALD/AMER/vesjour.html"}],"connections":[{"id":"amerigo-vespucci","type":"finance","label":"employer/patron of Vespucci"},{"id":"gianotto-berardi","type":"finance","label":"Berardi was his Seville agent"},{"id":"port-seville","type":"trade","label":"branch house in Seville"}]},{"id":"gianotto-berardi","name":"Gianotto Berardi","category":"European Families","role":"Financier & Insurer","nation":"Genoa/Florence (Italian states)","scale":"Significant","scaleBasis":"estimated","scaleNote":"Described by historians as a dealer in enslaved Africans (largely via the Portuguese trade) and as Columbus's key private financier; reported investment c. 500,000 maravedís linked to the first voyage, but no captive totals are documented.","start":1485,"end":1495,"lifespan":"c. 1457–1495","base":"Seville, Spain","geo":[37.389,-5.984],"aliases":["Juanoto Berardi","Giannotto Berardi","Giannozzo Berardi"],"origins":"A Florentine merchant established in Seville from c. 1485, acting as agent for Lorenzo di Pierfrancesco de' Medici. He lent money to merchants, nobles and monarchs.","role_summary":"Berardi ran a business in African slavery and ship chandlery and was among Columbus's most important backers, investing in the first voyage and winning the contract to provision the second fleet. Vespucci worked with him and completed his affairs after his death in December 1495, which left Berardi's contract to send 12 ships to Hispaniola unfinished.","roleDetail":[{"t":"Slave dealer.","d":"Scholarship describes him as having worked mainly in the Portuguese slave trade, from which he built much of his fortune.","basis":"documented"},{"t":"Columbus's financier.","d":"Columbus's c. 500,000-maravedí share of the 1492 costs may have come from a Berardi loan (Moya Pons, citing Varela).","basis":"interpretive"},{"t":"Provisioner of the colonial fleets.","d":"Held contracts to supply Columbus's second fleet and, at his death, to fit out 12 ships for Hispaniola.","basis":"documented"}],"legacy":"He died insolvent-adjacent in late 1495/early 1496, leaving debts that Vespucci, as executor, had to settle. His career shows how Italian merchant capital already invested in African captives flowed directly into the first American colonies.","legacyDetail":[{"t":"Bridge between two trades.","d":"His firm links the 15th-century Portuguese/Andalusian trade in Africans to Spain's first Atlantic colony.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Amerigo Vespucci (section on Berardi)","url":"https://en.wikipedia.org/wiki/Amerigo_Vespucci"},{"label":"Academia Dominicana de la Historia — Moya Pons, The Italian Presence in Santo Domingo (p. 42)","url":"https://italianlegacyrden.academiadominicanahistoria.org.do/files/assets/basic-html/page-42.html"},{"label":"Wikisource — 1911 Encyclopædia Britannica, 'Vespucci, Amerigo'","url":"https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Vespucci,_Amerigo"}],"connections":[{"id":"christopher-columbus","type":"finance","label":"financed and provisioned Columbus"},{"id":"amerigo-vespucci","type":"trade","label":"employed Vespucci; Vespucci his executor"},{"id":"lorenzo-di-pierfrancesco-medici","type":"finance","label":"Medici agent in Seville"},{"id":"crown-of-portugal","type":"trade","label":"traded in captives via the Portuguese trade"},{"id":"port-seville","type":"trade","label":"Seville merchant house"},{"id":"hispaniola-colony","type":"trade","label":"contract to supply 12 ships to Hispaniola"}]},{"id":"bartolomeo-marchionni","name":"Bartolomeo Marchionni","category":"European Families","role":"Trader & Shipper","nation":"Genoa/Florence (Italian states)","scale":"Major","scaleBasis":"documented","scaleNote":"Leading trader of enslaved Africans into Lisbon in the 1480s–90s: held the crown lease for Rios dos Escravos (1486 contract) and Senegambia, and was the largest exporter of enslaved people to Valencia in the 1490s (Guidi Bruscoli).","start":1486,"end":1530,"lifespan":"c. 1450–1530","base":"Lisbon, Portugal","geo":[38.722,-9.139],"aliases":["Bartolomeu Marchioni"],"origins":"A Florentine merchant-banker who settled in Lisbon around 1470 and became one of the richest men in Portugal. He dominated the Madeira sugar trade and lent money to the Crown.","role_summary":"Marchionni leased royal rights to bring captives from West Africa to Lisbon and re-exported them to Valencia, Seville and Florence. He also financed Portuguese voyages to India, including ships in Cabral's 1500 fleet, making him a pivot between African slaving, Atlantic sugar and the Asian spice route.","roleDetail":[{"t":"Crown slave-trade contractor.","d":"A 1486 contract let him import most captives from the Rios dos Escravos (Slave Rivers, Benin region) into Portugal.","basis":"documented"},{"t":"Re-exporter to Spain and Italy.","d":"Through the agent Cesare Barzi he was the largest supplier of enslaved Africans to Valencia in the 1490s, and sent captives, including women, to Florence.","basis":"documented"},{"t":"Financier of empire.","d":"Financed slave trading in and from Africa, the Madeira sugar economy and India voyages; the king considered naturalising him, probably for his loans.","basis":"documented"}],"legacy":"His career, reconstructed by Francesco Guidi Bruscoli ('Bartolomeo Marchionni, homem de grossa fazenda', 2014), is a key case of Italian capital powering Portugal's early African trade.","legacyDetail":[{"t":"Model for later contractors.","d":"The crown-lease model he worked under prefigured the asiento contracts later sold by Spain.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Bartolomeo Marchionni","url":"https://en.wikipedia.org/wiki/Bartolomeo_Marchionni"},{"label":"e-Journal of Portuguese History (Brown Univ.) — vol. 13 no. 2 article on Marchionni","url":"https://www.brown.edu/Departments/Portuguese_Brazilian_Studies/ejph/html/issue26/html/v13n2a07.html"},{"label":"FLORE, Università di Firenze — Guidi Bruscoli, Bartolomeo Marchionni","url":"https://flore.unifi.it/handle/2158/858922"}],"connections":[{"id":"crown-of-portugal","type":"charter","label":"leased crown slave-trade rights 1486"},{"id":"port-lisbon","type":"trade","label":"imported captives into Lisbon"},{"id":"casa-dos-escravos","type":"trade","label":"captives registered/taxed via Casa dos Escravos"},{"id":"port-seville","type":"trade","label":"re-exported captives to Seville"},{"id":"elmina-castle","type":"trade","label":"Gold Coast / Mina trade network"}]},{"id":"crown-of-castile","name":"Crown of Castile / Spain (Ferdinand & Isabella, Charles V, Philip II…)","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Spain","scale":"Dominant","scaleBasis":"documented","scaleNote":"Licensed the whole Spanish American trade from 1501 via licences and asientos; Spanish/Uruguayan-flagged ships themselves made c. 1,116 voyages (c. 4% of the trade, per Eltis/SlaveVoyages), but the Crown's asientos drew Portuguese, Genoese, German, Dutch, French and British carriers into supplying Spanish America.","start":1495,"end":1886,"lifespan":"1479–present (as Spanish monarchy)","base":"Madrid / Seville, Spain","geo":[40.417,-3.704],"aliases":["Catholic Monarchs","Spanish Crown","Habsburg Spain"],"origins":"The union of Castile and Aragon under Isabella I and Ferdinand II (1479) sponsored Columbus in 1492. Under Charles V (r. 1516–56) and Philip II (r. 1556–98) it became the first global empire.","role_summary":"The Crown authorised the first shipments of enslaved Africans to the Americas (1501 instructions to Ovando permitting enslaved people 'born under Christian rule'), opened direct Africa-to-America shipments with Charles V's 1518 licence to Gorrevod, and then sold licences and asiento monopolies for three centuries, treating the trade as a source of revenue. It abolished slavery in Cuba only in 1886.","roleDetail":[{"t":"1501: first legal transatlantic shipments.","d":"Instructions of 16 Sept. 1501 to Governor Ovando permitted 'black slaves or other slaves' born in Christian lands; Ferdinand later sent 100 enslaved Africans from Spain.","basis":"documented"},{"t":"1518: direct trade from Africa.","d":"On 18 Aug. 1518 Charles V granted Laurent de Gorrevod a licence for 4,000 enslaved Africans direct to the colonies.","basis":"documented"},{"t":"Asiento revenue system.","d":"From 1595 to 1640 Portuguese asentistas (Philip II–IV ruled both crowns) held contracts for c. 4,250 captives/year paying 100,000–170,000 ducats annually; later holders included Genoese (1662), French (1701) and British (1713).","basis":"documented"},{"t":"Late abolition.","d":"Agreed in 1817 to end the trade, yet the illegal trade to Cuba ran until c. 1867; slavery in Cuba was abolished in 1886.","basis":"documented"}],"legacy":"The Spanish monarchy continues today. Spain has made no formal state apology for the slave trade; debate has centred on monuments (e.g. Antonio López in Barcelona, 2018) and museum decolonisation.","legacyDetail":[{"t":"No state reparations.","d":"Unlike some northern European states, Spain has not issued a formal apology for its role in Atlantic slavery.","basis":"interpretive"}],"sources":[{"label":"College of Charleston LDHI — The Early Trans-Atlantic Slave Trade: Nicolás de Ovando","url":"https://ldhi.library.cofc.edu/exhibits/show/african_laborers_for_a_new_emp/early_trans_atlantic_slave_tra"},{"label":"College of Charleston LDHI — Emperor Charles V","url":"https://ldhi.library.cofc.edu/exhibits/show/african_laborers_for_a_new_emp/emperor_charles_v"},{"label":"Slavery, Law & Power — Opening the transatlantic slave trade (1518 charter)","url":"https://slaverylawpower.org/charter-1518/"},{"label":"Britannica — asiento de negros","url":"https://www.britannica.com/print/article/38687"}],"connections":[{"id":"christopher-columbus","type":"charter","label":"commissioned Columbus 1492"},{"id":"spanish-asiento","type":"charter","label":"sold asiento contracts"},{"id":"charter-1518","type":"charter","label":"Charles V's 1518 licence"},{"id":"casa-de-contratacion","type":"ownership","label":"founded Casa de Contratación 1503"},{"id":"nicolas-de-ovando","type":"charter","label":"appointed governor; 1501 instructions"},{"id":"welser-family","type":"charter","label":"1528 licence and Venezuela grant"},{"id":"crown-of-portugal","type":"political","label":"Tordesillas 1494; Iberian Union 1580–1640"},{"id":"south-sea-company","type":"charter","label":"1713 asiento to Britain"},{"id":"anglo-spanish-treaty-1817","type":"political","label":"agreed to end trade 1817"}]},{"id":"crown-of-portugal","name":"Crown of Portugal (Houses of Aviz and Braganza)","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Portugal","scale":"Dominant","scaleBasis":"documented","scaleNote":"Portuguese- and Brazilian-flagged ships carried c. 5.8 million of the c. 12.5 million Africans embarked, the largest national share (SlaveVoyages estimates, as charted by Statista); c. 7,310 voyages.","start":1441,"end":1869,"lifespan":"1385–1910 (monarchy)","base":"Lisbon, Portugal","geo":[38.722,-9.139],"aliases":["House of Aviz","House of Braganza","Portuguese Crown"],"origins":"Portugal's monarchs sponsored exploration down the African coast from the 1420s–40s under Prince Henry, seeking gold and a sea route to Asia. Papal bulls (1452, 1455) gave them sanction to subjugate and enslave non-Christians in Africa.","role_summary":"The Crown taxed, licensed and monopolised the African trade: it took a royal fifth of captives (from 1444), leased trade rights (Fernão Gomes 1469), built Elmina (1482), centralised sales in Lisbon's Casa dos Escravos (1486), colonised Cape Verde, São Tomé and Angola, and chartered monopoly companies. Portugal was the first and the last major European slave-trading nation.","roleDetail":[{"t":"Royal fifth and monopoly.","d":"Henry took one fifth of captives landed at Lagos in 1444; from 1512 enslaved people had to be landed only in Lisbon.","basis":"documented"},{"t":"Colonies as slave depots.","d":"Cape Verde (1460s), São Tomé (1490s) and Luanda (1576) became embarkation hubs feeding Brazil and Spanish America.","basis":"documented"},{"t":"Asiento holders for Spain.","d":"During the Iberian Union, Portuguese contractors held the Spanish asiento 1595–1640 (Pedro Gomes Reinel first).","basis":"documented"},{"t":"Slow abolition.","d":"Trade banned by Sá da Bandeira's 1836 decree (poorly enforced); slavery abolished across Portuguese territories 25 Feb. 1869.","basis":"documented"}],"legacy":"The monarchy fell in 1910, but the Portuguese Republic inherited the debate. In April 2024 President Marcelo Rebelo de Sousa said Portugal should 'pay the costs' of slavery and colonial crimes; the government rejected any reparations process.","legacyDetail":[{"t":"2024 reparations remarks.","d":"The President floated debt relief and financing for former colonies; the government said it would not start a reparations process.","basis":"documented"}],"sources":[{"label":"College of Charleston LDHI — Pope Nicholas V and the Portuguese Slave Trade","url":"https://ldhi.library.cofc.edu/exhibits/show/african_laborers_for_a_new_emp/pope_nicolas_v_and_the_portugu"},{"label":"Statista (data: SlaveVoyages) — Countries most active in the trans-Atlantic slave trade","url":"https://statista.com/chart/22057/countries-most-active-trans-atlantic-slave-trade"},{"label":"Omohundro Institute — Eltis, table of voyages by flag","url":"https://oieahc.wm.edu/wp-content/uploads/Eltis_table1.pdf"},{"label":"The EastAfrican/Reuters — Portugal must 'pay costs' of slavery, President says (2024)","url":"https://www.theeastafrican.co.ke/tea/news/world/portugal-must-pay-costs-of-slavery-and-colonial-crimes-4601652"}],"connections":[{"id":"henry-the-navigator","type":"ownership","label":"royal prince; sponsor of voyages"},{"id":"papal-bulls-1452-1455","type":"charter","label":"papal sanction for enslavement"},{"id":"elmina-castle","type":"ownership","label":"built Elmina 1482"},{"id":"fernao-gomes","type":"charter","label":"leased Guinea trade 1469"},{"id":"casa-dos-escravos","type":"ownership","label":"royal slave house, Lisbon 1486"},{"id":"port-luanda","type":"ownership","label":"colony of Angola, Luanda 1576"},{"id":"kingdom-of-kongo","type":"political","label":"alliance/trade with Kongo"},{"id":"grao-para-maranhao-company","type":"charter","label":"chartered by Pombal 1755"},{"id":"portugal-reparations-2024","type":"legacy","label":"2024 reparations debate"}]},{"id":"henry-the-navigator","name":"Prince Henry \"the Navigator\"","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Portugal","scale":"Significant","scaleBasis":"documented","scaleNote":"Sponsor of the 1444 Lagos landing of c. 235 captives, of whom he received the royal fifth (tallies of his share differ between sources); his expeditions initiated Europe's Atlantic African slave trade.","start":1441,"end":1460,"lifespan":"1394–1460","base":"Lagos / Sagres, Algarve, Portugal","geo":[37.102,-8.674],"aliases":["Infante Dom Henrique","Henrique o Navegador"],"origins":"A son of King João I, Henry was governor of the Order of Christ and holder of the Algarve. He sponsored voyages down the West African coast in search of gold, allies against Islam and a route around Africa.","role_summary":"Henry's licensed expeditions began seizing Africans in 1441; in August 1444 Lançarote de Freitas landed c. 235 captives at Lagos, where they were divided — separating families — with Henry taking his fifth. Zurara's chronicle, written for Henry, justified the enslavement as a route to Christian conversion.","roleDetail":[{"t":"Lagos 1444.","d":"The first large public sale of sub-Saharan Africans in Europe took place in Lagos, as described by Zurara, with Henry present on horseback receiving his share.","basis":"documented"},{"t":"Royal fifth.","d":"As sponsor he was entitled to one fifth of the captives or their value.","basis":"documented"},{"t":"Ideological framing.","d":"Zurara professed grief at the captives' suffering but justified it by their conversion — an early pro-slavery argument.","basis":"documented"}],"legacy":"Henry is still celebrated in Portugal (Lagos statue inaugurated 1960; the Padrão dos Descobrimentos in Lisbon). Lagos opened a small Slave Market museum (Mercado de Escravos) in 2016 beside his statue, prompting debate over how Portugal commemorates the 'Discoveries'.","legacyDetail":[{"t":"Contested commemoration.","d":"The juxtaposition of his statue and the slave-market museum is a focus of debate about Portugal's memory of slavery.","basis":"documented"}],"sources":[{"label":"Miami University — Zurara, Chronicle of the Discovery and Conquest of Guinea (1444 excerpt)","url":"https://sites.miamioh.edu/empire/files/2026/01/1444-Zurara-Chronicle-of-the-Discovery-and-Conquest-of-Guinea.pdf"},{"label":"Wikipedia — Mercado de Escravos (Lagos)","url":"https://en.wikipedia.org/wiki/Mercado_de_Escravos"},{"label":"Contested Histories — Portugal: Slave Market Museum in Lagos","url":"https://contestedhistories.org/wp-content/uploads/Portugal-Slave-Market-Museum-in-Lagos.pdf"}],"connections":[{"id":"crown-of-portugal","type":"family","label":"son of João I"},{"id":"lancarote-de-freitas","type":"voyage","label":"licensed the 1444 expedition"},{"id":"lagos-slave-market","type":"trade","label":"took royal fifth of Lagos captives"},{"id":"papal-bulls-1452-1455","type":"charter","label":"bulls ratified his African conquests"}]},{"id":"lancarote-de-freitas","name":"Lançarote de Freitas","category":"Crowns & Explorers","role":"Trader & Shipper","nation":"Portugal","scale":"Minor","scaleBasis":"documented","scaleNote":"Led the 1444 expedition that landed c. 235 captives at Lagos — then the largest single seizure of Africans by Europeans.","start":1444,"end":1445,"lifespan":"fl. 1440s","base":"Lagos, Portugal","geo":[37.102,-8.674],"aliases":["Lançarote da Ilha","Lançarote of Lagos"],"origins":"A squire of Henry's household and tax collector at Lagos. His 1444 expedition was the first funded by Lagos merchants rather than Henry himself.","role_summary":"He commanded six caravels that raided islands off the Arguin coast (Mauritania) and returned to Lagos in August 1444 with c. 235 captives, who were sold in the first public slave auction of Africans in Portugal.","roleDetail":[{"t":"Merchant-financed slaving.","d":"His voyage showed slaving could be profitable to private investors, marking a shift from exploration to commerce.","basis":"documented"},{"t":"Brutal division.","d":"Zurara describes captives divided into lots without regard to family, separating parents, children and spouses.","basis":"documented"}],"legacy":"Remembered mainly through Zurara's chronicle; the site of the 1444 sale is today commemorated by the Lagos slave-market museum.","legacyDetail":[{"t":"Symbolic beginning.","d":"1444 is often cited as the start of Europe's Atlantic slave trade from Africa.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Lançarote de Freitas","url":"https://en.wikipedia.org/wiki/Lan%C3%A7arote_de_Freitas"},{"label":"Miami University — Zurara, Chronicle (1444 excerpt)","url":"https://sites.miamioh.edu/empire/files/2026/01/1444-Zurara-Chronicle-of-the-Discovery-and-Conquest-of-Guinea.pdf"}],"connections":[{"id":"henry-the-navigator","type":"charter","label":"sailed under Henry's licence"},{"id":"lagos-slave-market","type":"trade","label":"landed captives at Lagos 1444"},{"id":"crown-of-portugal","type":"charter","label":"royal fifth paid"}]},{"id":"fernao-gomes","name":"Fernão Gomes","category":"European Families","role":"Trader & Shipper","nation":"Portugal","scale":"Significant","scaleBasis":"estimated","scaleNote":"Held the Crown's monopoly on the Guinea trade 1469–c.1475 (rent c. 200,000 reais/year plus malagueta rights); captive totals undocumented but the lease covered trade in people as well as gold and pepper.","start":1469,"end":1475,"lifespan":"fl. 1469–1478","base":"Lisbon, Portugal","geo":[38.722,-9.139],"aliases":["Fernão Gomes da Mina"],"origins":"A Lisbon merchant and squire, Gomes leased the Guinea trade from Afonso V after Henry's death, in return for an annual rent and an obligation to explore 100 leagues of coast a year.","role_summary":"His captains reached the Gold Coast and found the gold trade at Elmina (1471) and the islands of the Bight of Biafra (Fernando Pó). This privatised exploration opened the regions that later supplied huge numbers of captives and led directly to the building of Elmina Castle.","roleDetail":[{"t":"Privatised the African trade.","d":"The 1469 lease made exploration self-financing for the Crown; terms and dates vary between sources.","basis":"documented"},{"t":"Opened the Gold Coast.","d":"Captains including João de Santarém and Pedro Escobar reached Mina in 1471.","basis":"documented"}],"legacy":"Ennobled with the name 'da Mina' and admitted to the royal council (1478). The Crown took back the trade and built Elmina in 1482.","legacyDetail":[{"t":"Precedent for leasing.","d":"His lease set the pattern of royal contracts with merchants used for Marchionni and later asientos.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Fernão Gomes","url":"https://en.wikipedia.org/wiki/Fern%C3%A3o_Gomes"},{"label":"Univ. NOVA Lisboa, Expansão (EVE) — D. Afonso V","url":"https://eve.fcsh.unl.pt/index.php/en/people/d-afonso-v-b-1432-r-1438-1481"}],"connections":[{"id":"crown-of-portugal","type":"charter","label":"1469 Guinea trade lease from Afonso V"},{"id":"elmina-castle","type":"voyage","label":"his captains reached Mina 1471"},{"id":"port-lisbon","type":"trade","label":"Lisbon merchant"}]},{"id":"laurent-de-gorrevod","name":"Laurent de Gorrevod","category":"European Families","role":"Broker & Agent","nation":"Savoy/Burgundy (Habsburg court)","scale":"Significant","scaleBasis":"documented","scaleNote":"Holder of Charles V's 18 Aug. 1518 licence to ship 4,000 enslaved Africans directly to Spanish America, which he resold to Genoese merchants.","start":1518,"end":1529,"lifespan":"c. 1470–1529","base":"Court of Charles V (Spain / Burgundy)","geo":[41.652,-4.724],"aliases":["Lorenzo de Gorrevod","Laurent de Gouvenot"],"origins":"A Burgundian/Savoyard noble, governor of Bresse and a Flemish-court favourite who came to Spain with the young Charles V.","role_summary":"As a courtier he received the 1518 licence as a royal favour, never intending to trade himself; he sold it in parts to Genoese merchants (via Adán Vivaldo and Valián de Forne to the Centurione), creating the first quasi-asiento.","roleDetail":[{"t":"Licence as patronage.","d":"The licence shows how the trade began as a tradable royal privilege granted to a courtier.","basis":"documented"},{"t":"Broker of the 'asiento of the Genoese'.","d":"His resale made Genoese houses the main importers of Africans into the Americas for over a decade.","basis":"documented"}],"legacy":"The 1518 licence is widely seen as the start of the direct transatlantic slave trade; its 500th anniversary in 2018 drew renewed attention.","legacyDetail":[{"t":"Model of the asiento.","d":"His sale of rights prefigured the asiento system that lasted to 1789.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Laurent de Gorrevod","url":"https://en.wikipedia.org/wiki/Laurent_de_Gorrevod"},{"label":"Slavery, Law & Power — Opening the transatlantic slave trade","url":"https://slaverylawpower.org/charter-1518/"},{"label":"Academia Dominicana de la Historia — The Italian Presence in Santo Domingo (p. 44)","url":"https://italianlegacyrden.academiadominicanahistoria.org.do/files/assets/basic-html/page-44.html"}],"connections":[{"id":"crown-of-castile","type":"charter","label":"received 1518 licence from Charles V"},{"id":"charter-1518","type":"charter","label":"holder of the 1518 licence"},{"id":"centurione-family","type":"trade","label":"sold licence to Genoese/Centurione"}]},{"id":"centurione-family","name":"Centurione family & Genoese merchants of Seville","category":"Companies & Banks","role":"Financier & Insurer","nation":"Genoa/Florence (Italian states)","scale":"Major","scaleBasis":"documented","scaleNote":"Through the Casa Centuriona (Gaspar, Esteban and Jácome Centurión) they operated the 1518 licence for 4,000 Africans — the 'asiento of the Genoese' — and were the main importers into Spanish America for over a decade.","start":1518,"end":1530,"lifespan":"fl. 1400s–1600s","base":"Seville, Spain / Genoa","geo":[37.389,-5.984],"aliases":["Centurión","Casa Centuriona","Genoese of Seville"],"origins":"A Genoese merchant-banking clan with branches in Seville, Cádiz, Toledo and Medina del Campo; Genoese families (Centurione, Spinola, Grimaldi, Lomellini) financed the Spanish Crown throughout the 16th century.","role_summary":"The Centurione bought the Gorrevod licence via Adán Vivaldo and Valián de Forne and organised shipments of Africans, mainly via Portuguese suppliers in Cape Verde and São Tomé, to the Caribbean. The wider Genoese network's credit underpinned Castile's Atlantic ventures.","roleDetail":[{"t":"Operators of the first quasi-asiento.","d":"Britannica dates the first contract to a Genoese company in 1517–18; LDHI and Moya Pons confirm the transfer to the Centurione.","basis":"documented"},{"t":"Genoese finance of empire.","d":"Other Genoese families such as the Grimaldi are documented as Crown financiers; their direct role in slave licences is not established in the sources consulted.","basis":"interpretive"}],"legacy":"Genoese capital returned to the asiento in the 1660s with Grillo and Lomellini. Palazzi in Genoa built by these families survive as UNESCO sites (Strade Nuove), though the slave-trade origins of specific fortunes are rarely highlighted.","legacyDetail":[{"t":"Persistent Genoese role.","d":"Genoese networks financed Spanish slave contracts across two centuries.","basis":"interpretive"}],"sources":[{"label":"Academia Dominicana de la Historia — The Italian Presence in Santo Domingo (p. 44)","url":"https://italianlegacyrden.academiadominicanahistoria.org.do/files/assets/basic-html/page-44.html"},{"label":"Dialnet — article on the Centurione family","url":"https://dialnet.unirioja.es/descarga/articulo/3767561.pdf"},{"label":"Britannica — asiento de negros","url":"https://www.britannica.com/print/article/38687"}],"connections":[{"id":"laurent-de-gorrevod","type":"trade","label":"bought the 1518 licence"},{"id":"charter-1518","type":"charter","label":"operated the 1518 licence"},{"id":"port-seville","type":"trade","label":"Seville branch"},{"id":"spanish-asiento","type":"charter","label":"first 'asiento of the Genoese'"},{"id":"grillo-and-lomellini","type":"parallel","label":"later Genoese asentistas"},{"id":"sao-tome","type":"trade","label":"captives sourced via São Tomé/Cape Verde"}]},{"id":"welser-family","name":"Welser family (Augsburg)","category":"European Families","role":"Financier & Insurer","nation":"Holy Roman Empire (German)","scale":"Significant","scaleBasis":"documented","scaleNote":"Received a 1528 Crown contract to transport 4,000 enslaved Africans to the Spanish Caribbean and ruled Venezuela (Klein-Venedig) 1528–46; the African venture largely failed, and they profited more from enslaving Indigenous people.","start":1528,"end":1556,"lifespan":"1246–present (family); trading house to 1614","base":"Augsburg, Germany","geo":[48.371,10.898],"aliases":["Welser-Gesellschaft","Belzares"],"origins":"An Augsburg merchant-banking dynasty that, with the Fugger, financed Charles V's 1519 imperial election. In return they won trading concessions in the Spanish Atlantic, including a factory in Santo Domingo and the Venezuela grant.","role_summary":"In 1528 the Welser agents (Ehinger and Sailer) contracted to deliver 4,000 enslaved Africans to the Indies and received the province of Venezuela to govern. Their governors led brutal expeditions seeking El Dorado and enslaved Indigenous people; Charles V revoked the grant after 1546.","roleDetail":[{"t":"1528 slave contract.","d":"The contract for 4,000 Africans was a licensed quota; how many were actually delivered is unclear.","basis":"documented"},{"t":"Klein-Venedig.","d":"Welser governors such as Ambrosius Ehinger and Nikolaus Federmann ran Venezuela from Coro, with violent slaving expeditions inland.","basis":"documented"},{"t":"Indigenous enslavement.","d":"Scholarship (Heidelberg) concludes they profited more from enslaving Indigenous people than from the African contract.","basis":"documented"}],"legacy":"The Welser trading house collapsed in 1614, but the family survives. German historians and media have re-examined their colonial role in recent years, including the 2020s debate on Germany's early colonial past.","legacyDetail":[{"t":"First German colony.","d":"Klein-Venedig is often called Germany's first colonial venture.","basis":"documented"}],"sources":[{"label":"Wikipedia — Klein-Venedig","url":"https://en.wikipedia.org/wiki/Klein-Venedig"},{"label":"Heidelberg Univ. journals — article on the Welser slave-trade contract","url":"https://journals.ub.uni-heidelberg.de/index.php/frrec/article/view/92015/87287"},{"label":"Wikipedia — Welser family","url":"https://en.wikipedia.org/wiki/Welser_family"}],"connections":[{"id":"crown-of-castile","type":"finance","label":"financed Charles V; 1528 licence"},{"id":"spanish-asiento","type":"charter","label":"1528 contract for 4,000 Africans"},{"id":"klein-venedig","type":"ownership","label":"governed Venezuela 1528–46"},{"id":"fugger-family","type":"parallel","label":"fellow Augsburg financiers"},{"id":"hispaniola-colony","type":"trade","label":"factory in Santo Domingo"}]},{"id":"fugger-family","name":"Fugger family (Augsburg)","category":"European Families","role":"Financier & Insurer","nation":"Holy Roman Empire (German)","scale":"Significant","scaleBasis":"estimated","scaleNote":"Britannica notes the firm entered the slave trade under Jakob Fugger; its central documented role was supplying Central European copper and brass that Portugal bartered for captives in West Africa (e.g. 4,000 ingots taken to Benin in 1515 to buy captives).","start":1490,"end":1600,"lifespan":"1367–present (family)","base":"Augsburg, Germany","geo":[48.371,10.898],"aliases":["Fugger von der Lilie","Jakob Fugger 'the Rich'"],"origins":"Weavers turned merchant-bankers, the Fugger built a fortune in Tyrolean silver and Hungarian copper and became bankers to the Habsburgs, financing Charles V's election.","role_summary":"Fugger copper and brass, shipped via Antwerp to Lisbon, became manillas and ingots used as currency to purchase captives on the West African coast. The family also financed the Iberian crowns that licensed the trade.","roleDetail":[{"t":"Metals for captives.","d":"A Fugger-marked copper ingot from a Hungarian mine (Linden-Museum) was destined for Portugal's Upper Guinea trade; in 1505 a captive at Calabar cost 8–10 manillas.","basis":"documented"},{"t":"Bankers to the asiento crowns.","d":"Their loans to Charles V and Philip II sustained the monarchy that sold slave licences.","basis":"interpretive"}],"legacy":"The family still exists (Fürst Fugger Privatbank; the Fuggerei social housing in Augsburg, founded 1516). Research projects (e.g. Global Heritage Lab, Bonn) now trace German metals in the Atlantic slave trade.","legacyDetail":[{"t":"Fuggerei.","d":"The world's oldest social housing complex, still run by Fugger foundations, was funded from the family's 16th-century fortune.","basis":"documented"}],"sources":[{"label":"Britannica — Fugger family (summary)","url":"https://www.britannica.com:443/summary/Fugger-family"},{"label":"Deutsche Digitale Bibliothek / Linden-Museum — Fugger copper ingot","url":"https://ccc.deutsche-digitale-bibliothek.de/en/item/YMZH4UMJCLLPVV27PIX5XE6FRWHFYKAH"},{"label":"Global Heritage Lab (Univ. Bonn) — Mining, Metals and Manillas in the Atlantic Slave Trade","url":"https://globalheritagelab.org/project/mining-metals-and-manillas-in-the-atlantic-slave-trade-pilot-study/"}],"connections":[{"id":"crown-of-portugal","type":"trade","label":"supplied copper/brass for African barter"},{"id":"crown-of-castile","type":"finance","label":"bankers to Charles V and Philip II"},{"id":"port-lisbon","type":"trade","label":"metals shipped via Antwerp to Lisbon"},{"id":"welser-family","type":"parallel","label":"fellow Augsburg financiers"}]},{"id":"nicolas-de-ovando","name":"Nicolás de Ovando","category":"Crowns & Explorers","role":"Planter & Enslaver","nation":"Spain","scale":"Significant","scaleBasis":"documented","scaleNote":"First official to oversee the import of enslaved Africans into the Americas (from 1502); requested 17 for the mines in 1505 and later c. 250 more (LDHI).","start":1502,"end":1509,"lifespan":"c. 1460–1511","base":"Santo Domingo, Hispaniola","geo":[18.486,-69.931],"aliases":["Frey Nicolás de Ovando"],"origins":"A Knight Commander of the Order of Alcántara, appointed governor of the Indies after Columbus and Bobadilla, arriving in 1502 with c. 2,500 colonists.","role_summary":"Ovando carried the 1501 royal instructions permitting enslaved Africans born in Christian lands. He briefly asked for a ban (1503) fearing revolts, then requested more captives for gold and copper mines. He also formalised the encomienda of Indigenous labour and ordered the Xaraguá massacre (1503).","roleDetail":[{"t":"First African imports.","d":"Oversaw the earliest documented shipments from Spain to Hispaniola (from 1502).","basis":"documented"},{"t":"Encomienda.","d":"Formalised the system granting Indigenous labour to colonists.","basis":"documented"}],"legacy":"Recalled in 1509. His governorship set the model of colonial forced labour on which African slavery in the Spanish Caribbean was built.","legacyDetail":[{"t":"Early resistance.","d":"Enslaved Africans under his rule fled to the mountains — among the first maroons in the Americas.","basis":"documented"}],"sources":[{"label":"College of Charleston LDHI — The Early Trans-Atlantic Slave Trade: Nicolás de Ovando","url":"https://ldhi.library.cofc.edu/exhibits/show/african_laborers_for_a_new_emp/early_trans_atlantic_slave_tra"},{"label":"Wikipedia — Encomienda","url":"https://en.wikipedia.org/wiki/Encomienda"}],"connections":[{"id":"crown-of-castile","type":"charter","label":"royal governor, 1501 instructions"},{"id":"hispaniola-colony","type":"plantation","label":"governed Hispaniola 1502–09"},{"id":"port-seville","type":"trade","label":"captives shipped from Spain"}]},{"id":"alonso-de-ojeda","name":"Alonso de Ojeda","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Spain","scale":"Minor","scaleBasis":"documented","scaleNote":"Led the 1499–1500 voyage (with Vespucci and Juan de la Cosa) that raided the Bahamas for c. 232 Lucayans and sold captives in Spain; earlier campaigns on Hispaniola yielded c. 600 enslaved Taíno shipped to Spain.","start":1494,"end":1510,"lifespan":"c. 1466–c. 1515","base":"Santo Domingo, Hispaniola","geo":[18.486,-69.931],"aliases":["Alonso de Hojeda"],"origins":"A Castilian hidalgo from Cuenca who sailed on Columbus's second voyage (1493) and led punitive campaigns on Hispaniola.","role_summary":"With royal licence he led the 1499 expedition to Venezuela, on which Vespucci sailed; it ended with a slave raid and sale of captives. In 1508–10 he governed Nueva Andalucía, where his raids for captives provoked fatal resistance.","roleDetail":[{"t":"The 1499 voyage.","d":"Profits were meagre (c. 15,000 maravedís shared among 55 survivors), so captives were sold to recoup costs.","basis":"documented"},{"t":"Las Casas's verdict.","d":"Las Casas attributed his miserable end to 'all the slaves he had made'.","basis":"documented"}],"legacy":"He died poor in Santo Domingo c. 1515. He is remembered in Venezuela as an early conquistador who named the region.","legacyDetail":[{"t":"Context for Vespucci.","d":"His voyage is the clearest documented link between Vespucci and the taking of captives.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Alonso de Ojeda","url":"https://en.wikipedia.org/wiki/Alonso_de_Ojeda"},{"label":"Wikipedia — Amerigo Vespucci (1499 voyage)","url":"https://en.wikipedia.org/wiki/Amerigo_Vespucci"}],"connections":[{"id":"amerigo-vespucci","type":"voyage","label":"Vespucci sailed with him 1499"},{"id":"christopher-columbus","type":"voyage","label":"served on 2nd voyage"},{"id":"crown-of-castile","type":"charter","label":"royal licences 1499, 1508"},{"id":"hispaniola-colony","type":"trade","label":"enslaved Taíno on Hispaniola"}]},{"id":"bartolome-de-las-casas","name":"Bartolomé de las Casas","category":"Crowns & Explorers","role":"Broker & Agent","nation":"Spain","scale":"Minor","scaleBasis":"documented","scaleNote":"Never a trader, but his 1516 proposal to replace Indigenous labour with enslaved Africans was part of the policy debate that preceded the 1518 licence; he later recanted.","start":1502,"end":1566,"lifespan":"1484–1566","base":"Seville, Spain","geo":[37.389,-5.984],"aliases":["Protector of the Indians"],"origins":"A Sevillian colonist who arrived in Hispaniola in 1502 and held an encomienda and enslaved people before renouncing them in 1514 and becoming a Dominican friar.","role_summary":"Las Casas fought for decades against the enslavement and destruction of Indigenous Americans. In 1516 he recommended importing Africans to relieve Indigenous labour; late in life he admitted this as an error and condemned African slavery as equally unjust, in writings unpublished for c. 350 years.","roleDetail":[{"t":"1516 proposal.","d":"Recommended African labour as a remedy for Indigenous suffering (LDHI).","basis":"documented"},{"t":"Exaggerated blame.","d":"Later writers blamed him for 'starting' African slavery; historians note the trade was already licensed from 1501 and his influence on the 1518 decision is debated.","basis":"interpretive"},{"t":"Recantation.","d":"In his 'History of the Indies' he wrote that enslaving Africans was as unjust as enslaving Indians.","basis":"documented"}],"legacy":"Las Casas influenced the 1542 New Laws abolishing Indigenous slavery and is honoured as a founder of human-rights thought; his case is used to discuss how humanitarian reform could redirect rather than end exploitation.","legacyDetail":[{"t":"New Laws, 1542.","d":"Charles V's New Laws, which he championed, banned Indigenous slavery (unevenly enforced).","basis":"documented"}],"sources":[{"label":"Ohio State Origins — Bartolomé de las Casas and 500 Years of Racial Injustice","url":"https://origins.osu.edu/milestones/july-2015-bartolom-de-las-casas-and-500-years-racial-injustice"},{"label":"ULPGC accedaCRIS — Méndez Alonzo on Las Casas and African slav
