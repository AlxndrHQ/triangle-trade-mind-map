":"Significant","scaleBasis":"documented","scaleNote":"Helped finance about 69–72 slaving voyages carrying c. 22,000 Africans (per HSBC History and voyage-database research); left c. £600,000 in 1827.","start":1783,"end":1807,"lifespan":"c. 1752–1827","base":"Liverpool, England","geo":[53.407,-2.989],"aliases":["Leyland & Bullins"],"origins":"A Liverpool merchant whose start-up capital reportedly came from a lottery win; he moved from general shipping into slaving voyages by 1783.","role_summary":"Merchant and ship-owner who financed dozens of slaving voyages, then a banker whose firm Leyland & Bullins lent to other traders. As three-time mayor (first 1798) he presided while the council petitioned against regulation of the trade.","roleDetail":[{"t":"Slave-trade financier.","d":"As merchant and ship-owner he helped finance 72 transatlantic voyages (per HSBC History).","basis":"documented"},{"t":"Banker.","d":"Founded Leyland & Bullins (1807) with his nephew Richard Bullin.","basis":"documented"}],"legacy":"Leyland & Bullins merged into what became Midland Bank and is now part of HSBC, which publishes its history. His letter books survive in the Liverpool Record Office.","legacyDetail":[{"t":"HSBC lineage.","d":"HSBC's own archive acknowledges Leyland's role in financing slave voyages.","basis":"documented"}],"sources":[{"label":"HSBC History — Leyland and Bullins","url":"https://history.hsbc.com/collections/global-archives/leyland-and-bullins"},{"label":"Wikipedia — Thomas Leyland","url":"https://en.wikipedia.org/wiki/Thomas_Leyland"},{"label":"Myles Zhang — The Slave Trader Turned Banker (paper)","url":"https://www.myleszhang.org/files/2023/06/The-Slave-Trader-Turned-Banker.pdf"}],"connections":[{"id":"leyland-and-bullins","type":"ownership","label":"founded bank 1807"},{"id":"port-liverpool","type":"trade","label":"mayor & ship-owner"},{"id":"tarleton-family","type":"political","label":"Liverpool trade lobby"},{"id":"heywood-family","type":"parallel","label":"slave trader turned banker"}]},{"id":"heywood-family","name":"Heywood brothers (Arthur & Benjamin Heywood)","category":"European Families","role":"Financier & Insurer","nation":"Britain","scale":"Significant","scaleBasis":"documented","scaleNote":"Liverpool slave-ship owners: Arthur and Benjamin Heywood invested in 82 slaving voyages, and with Benjamin's sons 133 voyages carrying an estimated 42,000 captives (c. 6,000 of whom died), per a University of Manchester Rylands study drawing on SlaveVoyages; their profits founded Heywood's Bank (1773), an ancestor of Barclays.","start":1750,"end":1807,"lifespan":"c. 1750s–1883 (bank independent)","base":"Liverpool, England","geo":[53.407,-2.991],"aliases":["Arthur Heywood, Sons & Co."],"origins":"Merchant brothers Arthur and Benjamin Heywood traded from Liverpool, including as co-owners of slaving ships. Benjamin later moved to Manchester and with his sons founded a separate bank there (1788), Heywood Brothers & Co, later part of the NatWest group's history.","role_summary":"Owned and invested in slave ships, then used the capital to found a bank (c. 1773) that served Liverpool's Atlantic merchants.","roleDetail":[{"t":"Slave-ship owners.","d":"Arthur, Benjamin and Benjamin's sons Benjamin Arthur and Nathaniel all co-owned slaving voyages.","basis":"documented"},{"t":"Bank founders.","d":"Arthur Heywood's Liverpool bank was established by 1773.","basis":"documented"}],"legacy":"The Liverpool bank was absorbed by the Bank of Liverpool (1883), later Martins Bank, which Barclays bought in 1969. The Martins Bank Building on Water Street, Liverpool, survives as a listed building.","legacyDetail":[{"t":"Barclays lineage.","d":"Heywood's → Bank of Liverpool → Martins → Barclays.","basis":"documented"}],"sources":[{"label":"Wikipedia — Heywood's Bank","url":"https://en.wikipedia.org/wiki/Heywood%27s_Bank"},{"label":"Wikipedia — Bank of Liverpool","url":"https://en.wikipedia.org/wiki/Bank_of_Liverpool"},{"label":"Understanding Slavery Initiative — Liverpool case study","url":"https://understandingslavery.com/casestudy/liverpool/"},{"label":"University of Manchester Rylands Blog — The Heywoods","url":"https://rylandscollections.com/2023/09/18/the-heywoods/"},{"label":"NatWest Group Heritage Hub — Heywood Brothers & Co","url":"https://www.natwestgroup.com/heritage/companies/heywood-brothers-and-co.html"}],"connections":[{"id":"heywoods-bank-liverpool","type":"ownership","label":"founded bank"},{"id":"barclays","type":"legacy","label":"bank merged into Barclays"},{"id":"port-liverpool","type":"trade","label":"slave-ship owners"},{"id":"thomas-leyland","type":"parallel","label":"slave trader turned banker"}]},{"id":"john-bolton","name":"John Bolton","category":"European Families","role":"Trader & Shipper","nation":"Britain","scale":"Significant","scaleBasis":"documented","scaleNote":"Credited by the Transatlantic Slave Trade Database (via LBS) with 69 slaving voyages from 1788 to 1807, peaking at five or more ships a year from Liverpool in 1798–1805.","start":1788,"end":1837,"lifespan":"1756–1837","base":"Liverpool, England","geo":[53.404,-2.985],"aliases":["Colonel John Bolton","Bolton & Littledale"],"origins":"Apprenticed in St Vincent in 1773, he worked in the Caribbean before returning to Liverpool around 1782–83 with £10,000 to start a merchant firm.","role_summary":"One of the last great Liverpool slave traders, increasingly the sole owner of his ships. After 1807 he and Bolton & Littledale became leading cotton traders with British Guiana, where he also owned estates.","roleDetail":[{"t":"Late-era slaver.","d":"Operated right up to abolition of the trade in 1807.","basis":"documented"},{"t":"Slave-owner.","d":"His will refers to property in Demerara, St Vincent and St Croix.","basis":"documented"}],"legacy":"He died worth c. £180,000 and left Storrs Hall on Windermere to a clergyman. He is documented in the LBS database.","legacyDetail":[{"t":"Lake District estate.","d":"Storrs Hall, bought from slave-trade wealth, is now a hotel.","basis":"interpretive"}],"sources":[{"label":"UCL LBS — John Bolton","url":"https://www.ucl.ac.uk/lbs/person/view/2146654877"},{"label":"UCL LBS — John Bolton (British Guiana record)","url":"https://www.ucl.ac.uk/lbs/person/view/7019"}],"connections":[{"id":"port-liverpool","type":"trade","label":"Liverpool slave trader"},{"id":"slave-trade-act-1807","type":"political","label":"trading until abolition"},{"id":"john-tobin","type":"political","label":"Liverpool trade network"},{"id":"ucl-legacies-of-british-slavery","type":"legacy","label":"documented in LBS"}]},{"id":"john-tobin","name":"Sir John Tobin","category":"European Families","role":"Trader & Shipper","nation":"Britain","scale":"Minor","scaleBasis":"documented","scaleNote":"Captain on 6 slaving voyages (1793–1803) and owner in 10 (1794–1804), per LBS; later a leading palm-oil importer.","start":1793,"end":1807,"lifespan":"1762–1851","base":"Liverpool, England","geo":[53.416,-2.917],"aliases":[],"origins":"A Manx-born seaman who rose as a privateer and slave-ship captain before becoming a Liverpool merchant.","role_summary":"Commanded and then owned slaving ships. After 1807 he turned his West African trade networks to palm oil, a shift that shaped Liverpool's 19th-century Africa trade.","roleDetail":[{"t":"Captain to owner.","d":"Sailed as captain, then invested as owner in slaving voyages.","basis":"documented"},{"t":"Palm-oil pioneer.","d":"LBS says he was instrumental in converting slave-trade links into the palm-oil trade.","basis":"documented"}],"legacy":"Mayor of Liverpool in 1819–20 and knighted in 1820. His career shows continuity between the slave trade and later 'legitimate' commerce with West Africa.","legacyDetail":[{"t":"Continuity of networks.","d":"Delta and Calabar trading relationships carried over from slaves to palm oil.","basis":"interpretive"}],"sources":[{"label":"UCL LBS — Sir John Tobin","url":"https://www.ucl.ac.uk/lbs/person/view/42424"},{"label":"National Museums Liverpool — Sir John Tobin","url":"https://www.liverpoolmuseums.org.uk/artifact/sir-john-tobin"},{"label":"Wikipedia — Sir John Tobin","url":"https://en.wikipedia.org/wiki/Sir_John_Tobin"}],"connections":[{"id":"port-liverpool","type":"trade","label":"mayor & merchant"},{"id":"kingdom-of-bonny","type":"trade","label":"Niger Delta trade (palm oil)"},{"id":"old-calabar-efik","type":"trade","label":"Calabar trade"},{"id":"john-bolton","type":"family","label":"related by marriage network"}]},{"id":"pinney-family","name":"Pinney family (John Pretor Pinney)","category":"European Families","role":"Planter & Enslaver","nation":"Britain","scale":"Significant","scaleBasis":"documented","scaleNote":"903 men, women and children are known to have lived enslaved on Mountravers, Nevis, 1680/81–1834 (per Bristol University research by Eickelmann & Small); Pinney & Tobin became a leading Bristol sugar house.","start":1762,"end":1838,"lifespan":"1762–1838 (John Pretor Pinney 1740–1818)","base":"Bristol, England / Nevis","geo":[51.454,-2.604],"aliases":["John Pretor Pinney","Pinney & Tobin"],"origins":"John Pretor inherited the Nevis plantations in 1762 from a distant cousin on condition that he take the name Pinney. He lived on Nevis managing Mountravers until the 1780s.","role_summary":"Ran a sugar plantation on Nevis worked by enslaved people, then moved to Bristol as a West India merchant and lender to planters. He brought enslaved servants, including Pero Jones and Fanny Coker, to his Bristol house.","roleDetail":[{"t":"Plantation owner.","d":"Mountravers, also called Pinney's Estate, Nevis.","basis":"documented"},{"t":"Bristol merchant.","d":"Profits built the Great George Street house (c. 1790) and a sugar business.","basis":"documented"},{"t":"Enslaved in Bristol.","d":"Pero Jones, bought as a child, lived and worked in the house; Pero's Bridge is named after him.","basis":"documented"}],"legacy":"The house is now Bristol's Georgian House Museum, whose displays were revised in 2018 to list the 903 people enslaved on Mountravers. It is Grade II* listed partly for this connection.","legacyDetail":[{"t":"Museum reinterpretation.","d":"Long marketed as a 'West India merchant's house', it now centres the enslaved.","basis":"documented"}],"sources":[{"label":"Wikipedia — John Pinney","url":"https://en.wikipedia.org/wiki/John_Pinney"},{"label":"Discovering Bristol — The Georgian House","url":"https://discoveringbristol.org.uk/slavery/learning-journeys/georgian-house/general-details"},{"label":"Historic England — List entry 1202244","url":"https://HistoricEngland.org.uk/listing/the-list/list-entry/1202244"},{"label":"University of Bristol — Mountravers plantation community (introduction)","url":"https://seis.bristol.ac.uk/~emceee/mountravers~introduction.pdf"}],"connections":[{"id":"mountravers-plantation","type":"plantation","label":"owned Mountravers"},{"id":"georgian-house-bristol","type":"legacy","label":"house now museum"},{"id":"port-bristol","type":"trade","label":"Bristol sugar house"},{"id":"slavery-abolition-act-1833","type":"legacy","label":"family compensation era"}]},{"id":"barclays","name":"Barclays","category":"Companies & Banks","role":"Financier & Insurer","nation":"Britain","scale":"Significant","scaleBasis":"estimated","scaleNote":"Not a slave trader itself, but descends from banks founded with slave-trade capital (Heywood's, Liverpool) and its founding Barclay partners financed West India trade and plantation mortgages.","start":1773,"end":null,"lifespan":"1690–present","base":"London, England","geo":[51.505,-0.014],"aliases":["Barclays Bank","Martins Bank (predecessor)"],"origins":"Grew from a Quaker goldsmith-banking partnership in Lombard Street, London (1690s). Through 20th-century mergers it absorbed many regional banks.","role_summary":"Predecessor banks lent to slave traders and planters: Heywood's Bank was founded by Liverpool slave-ship owners, and the Barclay family's business financed tobacco and West India trade. David Barclay acquired Unity Valley Pen in Jamaica through a debt and in 1795 freed and resettled 30 enslaved people in Philadelphia.","roleDetail":[{"t":"Heywood lineage.","d":"Heywood's → Bank of Liverpool (1883) → Martins → Barclays (1969).","basis":"documented"},{"t":"Unity Valley.","d":"Barclays' archive highlights David Barclay's manumission; the LRB argues this framing is selective.","basis":"interpretive"}],"legacy":"Barclays has said it may have benefited from the slave trade through acquired banks (2007) and in 2020 published archive material on Unity Valley; critics say it has not fully reckoned with its history.","legacyDetail":[{"t":"Contested acknowledgement.","d":"Historian Christopher L. Brown called the bank's statement 'selective, misleading'.","basis":"interpretive"}],"sources":[{"label":"Barclays — From the archives: October's freedom from slavery","url":"https://home.barclays/news/2020/12/From-the-archives--October-s-freedom-from-slavery"},{"label":"London Review of Books — Christopher L. Brown, Funhouse Mirror","url":"https://lrb.co.uk/the-paper/v45/n24/christopher-l.-brown/funhouse-mirror"},{"label":"Wikipedia — Heywood's Bank","url":"https://en.wikipedia.org/wiki/Heywood%27s_Bank"},{"label":"UCL LBS — Person freed from Unity Valley by David Barclay","url":"https://www.ucl.ac.uk/lbs/person/view/2146643793"}],"connections":[{"id":"heywoods-bank-liverpool","type":"legacy","label":"acquired via Martins 1969"},{"id":"heywood-family","type":"legacy","label":"founders of predecessor"},{"id":"port-liverpool","type":"finance","label":"Liverpool predecessor banks"},{"id":"ucl-legacies-of-british-slavery","type":"legacy","label":"documented in LBS"}]},{"id":"lloyds-of-london","name":"Lloyd's of London","category":"Companies & Banks","role":"Financier & Insurer","nation":"Britain","scale":"Major","scaleBasis":"documented","scaleNote":"Lloyd's says it was the global centre for insuring Britain's shipping industry, which carried an estimated 3.2 million enslaved Africans (1640–early 1800s).","start":1688,"end":null,"lifespan":"1688–present","base":"Lime Street, London","geo":[51.513,-0.082],"aliases":["Lloyd's Coffee House","New Lloyd's Coffee House"],"origins":"Began in Edward Lloyd's coffee house (from 1688) where merchants and ship-owners met to arrange marine insurance; the 1771 subscribers formalised the market.","role_summary":"Underwriters in the Lloyd's market insured slave ships, their cargoes and the enslaved people aboard as property. Several founding subscribers were slave traders or slave-owners.","roleDetail":[{"t":"Marine insurance of slaving voyages.","d":"Policies covered ships and captives as cargo, with 'perils of the sea' and insurrection clauses.","basis":"documented"},{"t":"Founders' links.","d":"Founding subscriber Simon Fraser held at least 162 enslaved people and received compensation for a Dominica plantation.","basis":"documented"},{"t":"Angerstein.","d":"Lloyd's research found John Julius Angerstein was not a slave trader but benefited through marine insurance; it dropped calling him 'Father of Lloyd's'.","basis":"documented"}],"legacy":"In June 2020 Lloyd's apologised for its 'shameful' role and pledged funding for Black and ethnic-minority causes, and later published research on its 1771 founders with Lancaster University's William Pettigrew.","legacyDetail":[{"t":"2020 apology.","d":"Issued alongside Greene King after LBS database coverage.","basis":"documented"}],"sources":[{"label":"Lloyd's — 1771 founders (Transatlantic slave trade research)","url":"https://www.lloyds.com/about-lloyds/history/the-trans-atlantic-slave-trade/1771-founders"},{"label":"Lloyd's — John Julius Angerstein history report","url":"https://assets.lloyds.com/media/262917ee-14c2-4fea-812f-deb3d2bc8b7b/Lloyds_John-Julius-Angerstein_history-report_v5.pdf"},{"label":"Insurance Business — Lloyd's of London apologises over founders' slavery links","url":"https://www.insurancebusinessmag.com/uk/news/breaking-news/lloyds-of-london-apologises-over-founders-slavery-links-225611.aspx"}],"connections":[{"id":"port-london","type":"finance","label":"insured London ships"},{"id":"port-liverpool","type":"finance","label":"insured Liverpool ships"},{"id":"port-bristol","type":"finance","label":"insured Bristol ships"},{"id":"greene-king","type":"parallel","label":"joint-day 2020 apologies"},{"id":"slavery-abolition-act-1833","type":"legacy","label":"founders compensated"}]},{"id":"bank-of-england","name":"Bank of England","category":"Companies & Banks","role":"Financier & Insurer","nation":"Britain","scale":"Significant","scaleBasis":"documented","scaleNote":"Owned two Grenada plantations and 599 enslaved people in the late 1780s after a 1772 £160,000 loan defaulted; LBS-based press analyses in 2020 counted at least 11 former governors and 16 early directors (c. 25–27 people) with slavery links.","start":1772,"end":null,"lifespan":"1694–present","base":"Threadneedle Street, London","geo":[51.514,-0.089],"aliases":["The Old Lady of Threadneedle Street"],"origins":"Founded in 1694 as banker to the English government. Its directors and governors came from the City merchant elite, including West India merchants and slave-owners.","role_summary":"Lent £160,000 in 1772 against the Bacolet and Chemin plantations in Grenada, took sole possession in the late 1780s with 599 enslaved people, and sold them in 1790. Former governors such as Jeremiah Harman and Benjamin Buck Greene had slavery-derived wealth.","roleDetail":[{"t":"Plantation owner by foreclosure.","d":"A 1788 inventory names the 599 enslaved women, men and children the Bank owned.","basis":"documented"},{"t":"Governors' links.","d":"Estimates differ: at least 11 governors and 16 directors (Guardian/LBS, 2020), 25 governors and directors (City AM), up to 44 associated individuals (Positive Money).","basis":"documented"}],"legacy":"In June 2020 the Bank apologised for 'inexcusable' links of former governors and directors and removed their portraits. Its museum ran the 'Slavery & the Bank' exhibition (2022–24).","legacyDetail":[{"t":"Critique.","d":"Campaigners argue acknowledgement has not been matched by action.","basis":"interpretive"}],"sources":[{"label":"Bank of England Museum — A Story of Archival Discovery: The Bank and the Grenada Plantations","url":"https://www.bankofengland.co.uk/museum/online-collections/blog/a-story-of-archival-discovery"},{"label":"Bank of England Museum — Beginning the exhibition: Slavery & the Bank","url":"https://www.bankofengland.co.uk/museum/online-collections/blog/beginning-the-exhibition-slavery-and-the-bank"},{"label":"CNN — Bank of England apologizes for slave trade links","url":"https://amp.cnn.com/cnn/2020/06/19/business/bank-of-england-slavery-apology"},{"label":"Positive Money — Slavery & the Bank: acknowledgement is not action","url":"https://positivemoney.org/2022/06/slavery-the-bank-acknowledgement-is-not-action/"}],"connections":[{"id":"bank-of-england-grenada-plantations","type":"plantation","label":"owned 1780s–1790"},{"id":"greene-king","type":"family","label":"Benjamin Buck Greene governor 1873–75"},{"id":"south-sea-company","type":"political","label":"public-debt rival"},{"id":"compensation-loan-1835","type":"finance","label":"government finance context"},{"id":"ucl-legacies-of-british-slavery","type":"legacy","label":"LBS revealed directors' links"}]},{"id":"nm-rothschild","name":"N M Rothschild & Sons","category":"Companies & Banks","role":"Financier & Insurer","nation":"Britain","scale":"Significant","scaleBasis":"documented","scaleNote":"Nathan Mayer Rothschild, with Moses Montefiore and a consortium, was contractor for the 1835 'West India loan', raised by selling government consols and annuities, which funded the greater part (c. £15m) of the £20 million paid to slave-owners; it was not a slave-trading firm.","start":1835,"end":null,"lifespan":"c. 1809–present","base":"New Court, St Swithin's Lane, London","geo":[51.512,-0.089],"aliases":["Nathan Mayer Rothschild","Rothschild & Co"],"origins":"Founded in London by Nathan Mayer Rothschild (1777–1836) in the early 19th century; it became a leading arranger of British government loans.","role_summary":"Led the consortium that took up the 1835 'West India loan' the Treasury used to pay slave-owners compensation under the 1833 Act. The Rothschild Archive presents Nathan's role as supporting abolition by financing the compensation that made it possible.","roleDetail":[{"t":"Compensation loan, 1835.","d":"Arranged with Moses Montefiore; the remaining c. £5m came from other Treasury funds.","basis":"documented"},{"t":"Collateral in enslaved people.","d":"2009 Financial Times research reported that Nathan Mayer Rothschild had taken enslaved people in Antigua as loan collateral; the firm said it 'greatly regrets' any link.","basis":"documented"},{"t":"Framing.","d":"Whether the loan is seen as aiding abolition or rewarding slave-owners is a matter of interpretation; the money went to owners, not the enslaved.","basis":"interpretive"}],"legacy":"The successor Rothschild & Co still operates. The 1835 borrowing was later folded into other government stock; a February 2018 HM Treasury tweet (later deleted) said it was finally paid off in 2015, though Full Fact notes that how much of the original debt was still outstanding by then is unknown.","legacyDetail":[{"t":"2009 statement of regret.","d":"Issued alongside law firm Freshfields after FT research.","basis":"documented"}],"sources":[{"label":"The Rothschild Archive — Guide to the Archive: The West India loan","url":"https://guide-to-the-archive.rothschildarchive.org/the-london-banking-house/depts/loans-business/the-west-india-loan"},{"label":"Reuters via Investing.com — UK law firm and bank regret slave trade links","url":"https://investing.com/news/equities-news/uk-law-firm-and-bank-regret-slave-trade-links-68078"},{"label":"Business & Human Rights Resource Centre — Businesses regret links with slavery","url":"https://www.business-humanrights.org/en/businesses-regret-links-with-slavery"},{"label":"Full Fact — What we know about the government loan to pay slave owners compensation","url":"https://fullfact.org/economy/slavery-abolition-act-loan/"}],"connections":[{"id":"compensation-loan-1835","type":"finance","label":"arranged £15m loan"},{"id":"slavery-abolition-act-1833","type":"finance","label":"financed compensation"},{"id":"slave-compensation-commission","type":"finance","label":"funded awards"},{"id":"bank-of-england","type":"finance","label":"City government finance"}]},{"id":"greene-king","name":"Greene King (Benjamin Greene)","category":"Companies & Banks","role":"Planter & Enslaver","nation":"Britain","scale":"Minor","scaleBasis":"documented","scaleNote":"Founder Benjamin Greene (1780–1860) owned estates in St Kitts and Montserrat and was awarded £4,033 15s 7d compensation for 231 enslaved people (per LBS; the Telegraph put it at c. £500,000 today).","start":1829,"end":null,"lifespan":"1799–present","base":"Bury St Edmunds, Suffolk","geo":[52.243,0.716],"aliases":["Benjamin Greene","Benjamin Buck Greene","Blyth & Greene"],"origins":"Benjamin Greene, a former Whitbread apprentice, founded the Bury St Edmunds brewery in 1799 and acquired West India estates, which his son Benjamin Buck Greene managed from 1829.","role_summary":"Greene owned plantations worked by enslaved people, used his newspaper to oppose abolition, and claimed compensation in the 1830s. The family firm Blyth & Greene later became a major colonial shipping house.","roleDetail":[{"t":"Pro-slavery publisher.","d":"Greene King's 2020 statement called his profiting from slavery and opposition to abolition 'inexcusable'.","basis":"documented"},{"t":"Bank of England link.","d":"Son Benjamin Buck Greene was Bank of England governor 1873–75 (per LBS).","basis":"documented"}],"legacy":"Greene King, now one of Britain's largest pub and brewing groups, apologised in June 2020 and pledged investment in BAME communities. The brewery was run by another son, Edward Greene.","legacyDetail":[{"t":"2020 apology.","d":"Made the same day as Lloyd's of London, prompted by the LBS database.","basis":"documented"}],"sources":[{"label":"ITV News — Greene King and Lloyd's of London apologise for slavery links","url":"https://itv.com/news/2020-06-18/lloyds-of-london-and-greene-king-to-pay-over-slave-links"},{"label":"UCL News — Opinion: The slavery business contributed to the building of modern Britain","url":"https://www.ucl.ac.uk/news/2020/jun/opinion-slavery-business-contributed-building-modern-britain-can-we-make-amends"},{"label":"UCL LBS — Benjamin Buck Greene","url":"https://www.ucl.ac.uk/lbs/person/view/1265637725"},{"label":"UCL LBS — Benjamin Greene (1780–1860)","url":"https://www.ucl.ac.uk/lbs/person/view/25002"}],"connections":[{"id":"slavery-abolition-act-1833","type":"legacy","label":"founder compensated"},{"id":"bank-of-england","type":"family","label":"son became governor"},{"id":"lloyds-of-london","type":"parallel","label":"same-day 2020 apologies"},{"id":"ucl-legacies-of-british-slavery","type":"legacy","label":"documented in LBS"}]},{"id":"slavery-abolition-act-1833","name":"Slavery Abolition Act 1833 & £20m compensation","type":"entity","kind":"Charter / law / treaty","description":"Act ending slavery in most British colonies from 1 August 1834, replaced by 'apprenticeship' until 1838. Parliament voted £20 million (c. 40% of annual government spending) to compensate slave-owners; the enslaved received nothing. Payments went to some 40,000+ claimants listed in the LBS database.","start":1833,"geo":[51.499,-0.125],"connections":[{"id":"slave-compensation-commission","type":"legacy","label":"administered compensation"},{"id":"compensation-loan-1835","type":"finance","label":"funded by loan"},{"id":"gladstone-family","type":"legacy","label":"awardee"},{"id":"ucl-legacies-of-british-slavery","type":"legacy","label":"claims database"},{"id":"slave-trade-act-1807","type":"political","label":"followed trade ban"}]},{"id":"slave-compensation-commission","name":"Slave Compensation Commission","type":"entity","kind":"Institution","description":"Body that met from October 1833 to adjudicate and distribute the £20 million, using colonial slave registers; payments were made by the National Debt Office (1835–43). Its records (T 71, NDO 4) at The National Archives underpin the UCL LBS database.","start":1833,"geo":[51.481,-0.28],"connections":[{"id":"slavery-abolition-act-1833","type":"charter","label":"created under Act"},{"id":"nm-rothschild","type":"finance","label":"loan funded awards"},{"id":"ucl-legacies-of-british-slavery","type":"legacy","label":"records digitised"}]},{"id":"compensation-loan-1835","name":"1835 £15m compensation loan","type":"entity","kind":"Loan / public debt","description":"£15 million raised in 1835 by a syndicate led by Nathan Mayer Rothschild and Moses Montefiore (the 'West India loan'), funding most of the £20 million compensation to slave-owners; the other £5 million was paid directly in government stock. The debt was later merged into other gilts and finally redeemed in 2015 during government debt restructuring, as a since-deleted February 2018 HM Treasury tweet publicised; Full Fact notes that how much of the original sum remained outstanding by 2015 is unknown.","start":1835,"connections":[{"id":"nm-rothschild","type":"finance","label":"arranged by"},{"id":"slavery-abolition-act-1833","type":"finance","label":"funded compensation"},{"id":"bank-of-england","type":"finance","label":"government debt management"}]},{"id":"port-liverpool","name":"Port of Liverpool","type":"entity","kind":"Port","description":"Overtook London and Bristol by the 1740s and by 1750 sent more slaving voyages than both combined; in 1793–1807 it accounted for roughly 80–85% of British slaving voyages. Liverpool ships carried an estimated well over 1 million Africans before 1807.","start":1699,"geo":[53.401,-2.995],"connections":[{"id":"william-davenport","type":"trade","label":"home port"},{"id":"tarleton-family","type":"trade","label":"home port"},{"id":"international-slavery-museum","type":"legacy","label":"museum at Albert Dock"},{"id":"kingdom-of-bonny","type":"trade","label":"main Biafran partner"}]},{"id":"port-bristol","name":"Port of Bristol","type":"entity","kind":"Port","description":"Britain's leading slaving port in the 1730s–40s (c. 38% of British voyages in 1739–48), with an estimated 2,000+ slaving voyages overall carrying around half a million Africans. Its sugar and tobacco trade funded much of Georgian Bristol.","start":1698,"geo":[51.449,-2.598],"connections":[{"id":"edward-colston","type":"legacy","label":"city benefactor"},{"id":"pinney-family","type":"trade","label":"sugar merchants"},{"id":"statue-of-edward-colston","type":"legacy","label":"statue toppled 2020"},{"id":"georgian-house-bristol","type":"legacy","label":"museum"}]},{"id":"port-london","name":"Port of London","type":"entity","kind":"Port","description":"Base of the Royal African and South Sea companies and England's leading slaving port until the 1720s; it remained the financial, insurance and sugar-importing centre of the slavery economy. Robert Milligan's statue at West India Quay was removed in June 2020.","start":1562,"geo":[51.507,-0.075],"connections":[{"id":"royal-african-company","type":"trade","label":"company base"},{"id":"west-india-docks","type":"legacy","label":"sugar docks 1802"},{"id":"lloyds-of-london","type":"finance","label":"insurance market"},{"id":"south-sea-company","type":"trade","label":"company base"}]},{"id":"bunce-island","name":"Bunce Island","type":"entity","kind":"Fort / trading castle","description":"Island fort in the Sierra Leone River, used by the RAC and from 1748 by Grant, Oswald & Co., which made it the largest British slave castle on the Rice Coast. Many captives went to South Carolina and Georgia rice plantations via Henry Laurens; it later passed to Oswald's nephews, the Andersons.","start":1670,"geo":[8.57,-13.04],"connections":[{"id":"richard-oswald","type":"ownership","label":"Grant, Oswald & Co."},{"id":"henry-laurens","type":"trade","label":"Charleston agent"},{"id":"royal-african-company","type":"ownership","label":"earlier RAC fort"},{"id":"port-charleston","type":"trade","label":"main destination"}]},{"id":"cape-coast-castle","name":"Cape Coast Castle","type":"entity","kind":"Fort / trading castle","description":"Built as a Swedish lodge (c. 1653) on the Gold Coast, captured by the English in 1664, and expanded by the RAC as its West African headquarters. Captives were held in windowless dungeons before passing the 'Door of No Return'; it was the seat of British Gold Coast administration until 1877 and became a UNESCO World Heritage Site in 1979.","start":1664,"geo":[5.103,-1.242],"connections":[{"id":"royal-african-company","type":"ownership","label":"RAC headquarters"},{"id":"company-of-merchants-trading-to-africa","type":"ownership","label":"run 1752–1821"},{"id":"elmina-castle","type":"parallel","label":"nearby Dutch rival"},{"id":"asante-empire","type":"trade","label":"inland trade partner"}]},{"id":"church-of-england","name":"Church of England (SPG & Queen Anne's Bounty)","type":"entity","kind":"University / church","description":"Through the Society for the Propagation of the Gospel the Church owned the Codrington plantations in Barbados from 1710, and Queen Anne's Bounty (est. 1704) invested heavily in the South Sea Company. Its 2023 report led the Church Commissioners to pledge £100m; Archbishop Justin Welby said he was 'deeply sorry'.","start":1710,"geo":[51.497,-0.128],"connections":[{"id":"codrington-plantations-barbados","type":"plantation","label":"SPG-owned estates"},{"id":"south-sea-company","type":"finance","label":"Queen Anne's Bounty investment"},{"id":"church-commissioners-fund-2023","type":"legacy","label":"£100m fund"},{"id":"codrington-family","type":"legacy","label":"received bequest"}]},{"id":"codrington-plantations-barbados","name":"Codrington Plantations, Barbados","type":"entity","kind":"Colony / plantation","description":"Two sugar estates left to the SPG by Christopher Codrington in 1710, worked by enslaved people whom the Society owned; for a period they were branded with the word 'Society'. USPG ended its stewardship in 1983 and has apologised; Codrington College still stands on the land.","start":1710,"geo":[13.17,-59.475],"connections":[{"id":"church-of-england","type":"ownership","label":"SPG owner"},{"id":"codrington-family","type":"legacy","label":"bequeathed by"}]},{"id":"company-of-royal-adventurers","name":"Company of Royal Adventurers into Africa","type":"entity","kind":"Chartered company","description":"Chartered December 1660 under the Duke of York and Prince Rupert, first for gold; its 1663 charter explicitly added the slave trade. War with the Dutch and losses ruined it by 1667, and it was replaced by the Royal African Company in 1672.","start":1660,"geo":[51.513,-0.082],"connections":[{"id":"james-duke-of-york","type":"ownership","label":"patron/leader"},{"id":"royal-african-company","type":"legacy","label":"succeeded by"},{"id":"dutch-west-india-company","type":"political","label":"war rival"}]},{"id":"company-of-merchants-trading-to-africa","name":"Company of Merchants Trading to Africa","type":"entity","kind":"Chartered company","description":"Regulated company created by Parliament in 1750 to take over the RAC's forts from 1752, funded by annual parliamentary grants; any British merchant could join. It ran Cape Coast Castle and other forts until abolished in 1821, when the Crown took over.","start":1752,"geo":[5.103,-1.242],"connections":[{"id":"royal-african-company","type":"legacy","label":"successor to"},{"id":"cape-coast-castle","type":"ownership","label":"ran forts"},{"id":"port-liverpool","type":"trade","label":"served private traders"}]},{"id":"jesus-of-lubeck","name":"Jesus of Lübeck","type":"entity","kind":"Ship / voyage","description":"A 700-ton Hanseatic-built warship bought by Henry VIII and lent by Elizabeth I to John Hawkins for his 1564 and 1567 slaving voyages. It was abandoned to the Spanish at San Juan de Ulúa in 1568.","start":1564,"connections":[{"id":"elizabeth-i","type":"ownership","label":"royal ship"},{"id":"john-hawkins","type":"voyage","label":"flagship"}]},{"id":"heywoods-bank-liverpool","name":"Heywood's Bank (Liverpool)","type":"entity","kind":"Bank / insurer","description":"Bank founded in Liverpool by slave-trading merchant Arthur Heywood and his brother, established by 1773. Bought by the Bank of Liverpool in 1883, which became Martins Bank, acquired by Barclays in 1969.","start":1773,"geo":[53.407,-2.991],"connections":[{"id":"heywood-family","type":"ownership","label":"founded by"},{"id":"barclays","type":"legacy","label":"merged into"},{"id":"port-liverpool","type":"finance","label":"financed merchants"}]},{"id":"leyland-and-bullins","name":"Leyland & Bullins","type":"entity","kind":"Bank / insurer","description":"Liverpool bank opened in 1807 by slave trader Thomas Leyland and his nephew Richard Bullin, which lent to other slave traders. It later passed by amalgamation into Midland Bank, now HSBC.","start":1807,"geo":[53.407,-2.989],"connections":[{"id":"thomas-leyland","type":"ownership","label":"founded by"},{"id":"port-liverpool","type":"finance","label":"Liverpool lender"}]},{"id":"west-india-docks","name":"West India Docks, London","type":"entity","kind":"Port","description":"Secure docks on the Isle of Dogs, opened 1802 and promoted by West India merchants such as George Hibbert and Robert Milligan, to handle slave-grown sugar, rum and coffee. Its surviving warehouse houses the Museum of London Docklands and its 'London, Sugar & Slavery' gallery.","start":1802,"geo":[51.506,-0.022],"connections":[{"id":"hibbert-family","type":"ownership","label":"George Hibbert chairman"},{"id":"port-london","type":"trade","label":"part of port"}]},{"id":"harewood-house","name":"Harewood House","type":"entity","kind":"Legacy / apology","description":"Country house near Leeds built 1759–71 by Edwin Lascelles with wealth from Caribbean sugar and slavery. The Harewood House Trust now researches and openly presents the estate's slavery history.","start":1759,"geo":[53.896,-1.509],"connections":[{"id":"lascelles-family","type":"ownership","label":"family seat"}]},{"id":"georgian-house-bristol","name":"Georgian House Museum, Bristol","type":"entity","kind":"Legacy / apology","description":"John Pinney's c. 1790 town house on Great George Street, a museum since 1939. Displays revised in 2018 tell the story of the Nevis plantation and the enslaved servant Pero Jones.","start":1790,"geo":[51.454,-2.604],"connections":[{"id":"pinney-family","type":"ownership","label":"built by Pinney"},{"id":"port-bristol","type":"legacy","label":"Bristol museum"}]},{"id":"mountravers-plantation","name":"Mountravers plantation, Nevis","type":"entity","kind":"Colony / plantation","description":"Pinney family sugar plantation on Nevis; research has identified 903 enslaved men, women and children who lived there between 1680/81 and 1834.","start":1680,"geo":[17.17,-62.62],"connections":[{"id":"pinney-family","type":"plantation","label":"owned by"}]},{"id":"statue-of-edward-colston","name":"Statue of Edward Colston (Bristol)","type":"entity","kind":"Legacy / apology","description":"Bronze statue erected in 1895, toppled by protesters on 7 June 2020 and rolled into Bristol Harbour. Recovered by the council, it is now shown lying down and graffitied in the M Shed museum.","start":1895,"geo":[51.453,-2.597],"connections":[{"id":"edward-colston","type":"legacy","label":"commemorated"},{"id":"port-bristol","type":"legacy","label":"city centre"}]},{"id":"bank-of-england-grenada-plantations","name":"Bacolet & Chemin plantations, Grenada","type":"entity","kind":"Colony / plantation","description":"Two Grenada sugar estates mortgaged to the Bank of England for £160,000 in 1772; after default the Bank took sole possession in the late 1780s with 599 named enslaved people, then sold them to James Baillie for £100,000 in 1790.","start":1772,"connections":[{"id":"bank-of-england","type":"ownership","label":"Bank-owned"}]},{"id":"church-commissioners-fund-2023","name":"Church Commissioners' £100m fund (2023)","type":"entity","kind":"Legacy / apology","description":"In January 2023 the Church Commissioners committed £100m over nine years to impact investment, research and grants after finding Queen Anne's Bounty's slavery links; the Church avoids the word 'reparations' because no individuals are paid.","start":2023,"connections":[{"id":"church-of-england","type":"legacy","label":"Church response"},{"id":"south-sea-company","type":"legacy","label":"addresses past investment"}]},{"id":"ucl-legacies-of-british-slavery","name":"UCL Legacies of British Slavery database","type":"entity","kind":"University / church","description":"University College London project (begun 2009) that put online the identities of all 40,000+ slave-owners in the British Caribbean, Mauritius and the Cape at abolition, from compensation records. Its findings prompted the 2020 apologies by Lloyd's, Greene King and the Bank of England.","start":2009,"geo":[51.525,-0.134],"connections":[{"id":"slave-compensation-commission","type":"legacy","label":"built from its records"},{"id":"lloyds-of-london","type":"legacy","label":"prompted apology"},{"id":"bank-of-england","type":"legacy","label":"prompted apology"},{"id":"gladstone-family","type":"legacy","label":"documents"}]},{"id":"all-souls-codrington-library","name":"All Souls College Library (formerly 'Codrington Library')","type":"entity","kind":"University / church","description":"Oxford library built 1716–20 with Christopher Codrington's £10,000 bequest. In 2020 the college stopped using his name, added a memorial plaque to the enslaved and pledged £100,000 to Codrington College, Barbados, but kept his statue.","start":1710,"geo":[51.753,-1.253],"connections":[{"id":"codrington-family","type":"legacy","label":"funded by bequest"}]},{"id":"heirs-of-slavery","name":"Heirs of Slavery","type":"entity","kind":"Legacy / apology","description":"Group of descendants of British slave-owners, co-founded by Laura Trevelyan and David Lascelles, that encourages apology and reparative justice and supports CARICOM's reparations call.","start":2023,"connections":[{"id":"trevelyan-family","type":"legacy","label":"co-founder"},{"id":"lascelles-family","type":"legacy","label":"co-founder"},{"id":"gladstone-family","type":"legacy","label":"member descendants"}]},{"id":"slave-trade-act-1807","name":"Slave Trade Act 1807","type":"entity","kind":"Charter / law / treaty","description":"Act of Parliament banning British subjects from the Atlantic slave trade from 1 May 1807 (slavery itself continued until 1834–38). Liverpool's merchants and MPs such as Banastre Tarleton had fought it.","start":1807,"geo":[51.499,-0.125],"connections":[{"id":"port-liverpool","type":"political","label":"ended Liverpool trade"},{"id":"tarleton-family","type":"political","label":"opposed"},{"id":"slavery-abolition-act-1833","type":"political","label":"followed by"}]},{"id":"international-slavery-museum","name":"International Slavery Museum, Liverpool","type":"entity","kind":"Legacy / apology","description":"National Museums Liverpool museum at the Albert Dock, opened in 2007 for the bicentenary of the 1807 Act. With the Merseyside Maritime Museum archive it holds the Earle and Davenport papers.","start":2007,"geo":[53.4,-2.993],"connections":[{"id":"port-liverpool","type":"legacy","label":"Liverpool museum"},{"id":"earle-family","type":"legacy","label":"holds papers"},{"id":"william-davenport","type":"legacy","label":"holds archive"}]},{"id":"dutch-west-india-company","name":"Dutch West India Company (WIC)","category":"Companies & Banks","role":"Trader & Shipper","nation":"Netherlands","scale":"Major","scaleBasis":"estimated","scaleNote":"Dutch-flagged ships carried c. 550,000 captives across the Atlantic (per SlaveVoyages via the African Studies Centre Leiden), and the WIC held the Dutch monopoly on that trade until 1730.","start":1621,"end":1791,"lifespan":"1621–1791 (first WIC 1621–1674; second WIC 1674–1791)","base":"Amsterdam (West-Indisch Huis), Netherlands","geo":[52.381,4.889],"aliases":["Geoctroyeerde West-Indische Compagnie","GWC","WIC"],"origins":"Chartered by the States General in 1621 as a joint-stock company with a monopoly on Dutch trade and war in the Atlantic, organised in regional chambers (Amsterdam, Zeeland, Maas and others). Its first aims were privateering against Spain and Portugal and seizing Portuguese sugar lands in Brazil; it entered the slave trade to supply Dutch Brazil.","role_summary":"Between 1637 and 1641 the WIC seized Portuguese slaving posts at Elmina, São Tomé and Luanda, making the Republic a leading slave-trading power. After losing Brazil in 1654 it turned Curaçao into a slave entrepôt supplying Spanish America under asiento sub-contracts, and it shipped captives to Suriname, New Netherland and other colonies.","roleDetail":[{"t":"Captured Elmina in 1637.","d":"WIC forces took São Jorge da Mina from the Portuguese in August 1637; it became the WIC's West African headquarters for gold and slave trading into the 19th century.","basis":"documented"},{"t":"Briefly held Luanda (1641–1648).","d":"Taking Luanda gave the WIC direct access to the Angolan slave supply for Brazil, and it allied with Queen Nzinga of Ndongo-Matamba against Portugal until Portuguese-Brazilian forces retook the city in 1648.","basis":"documented"},{"t":"Made Curaçao a regional slave market.","d":"Curaçao was the dominant Dutch distribution centre for captives sold on to Spanish colonies before the mid-18th century, later overtaken by Sint Eustatius (per SlaveVoyages notes on the intra-American trade).","basis":"documented"},{"t":"Enslaved people in New Amsterdam.","d":"The company owned most of the enslaved Africans in New Amsterdam from c. 1626, using them on public works; in 1644 eleven men won 'half-freedom' after nearly two decades of forced labour.","basis":"documented"}],"legacy":"The WIC lost its slave-trade monopoly in 1730 and was dissolved in 1791, when its possessions passed to the Dutch state. Its history underlies the Dutch state's 2022 apology, King Willem-Alexander's 2023 apology, and the 2022 programme marking 400 years since its founding.","legacyDetail":[{"t":"State apology, 2022.","d":"PM Mark Rutte apologised on 19 December 2022 for the Dutch state's role in slavery and announced a €200 million awareness fund, rejecting individual reparations.","basis":"documented"},{"t":"Archives open to research.","d":"WIC records in the Nationaal Archief in The Hague underpin modern voyage databases, including Curaçao slave trade records for 1700–1730.","basis":"documented"}],"sources":[{"label":"African Studies Centre Leiden — Dutch involvement in the transatlantic slave trade","url":"https://ascleiden.nl/content/webdossiers/dutch-involvement-transatlantic-slave-trade"},{"label":"Project MANIFEST — The United Provinces and the Transatlantic Slave Trade","url":"https://www.projectmanifest.eu/the-united-provinces-and-the-transatlantic-slave-trade-en-fr/"},{"label":"Canon van Nederland — Slavernij","url":"https://www.canonvannederland.nl/en/slavernij"},{"label":"NBC News — Dutch leader apologizes for Netherlands' role in slave trade (2022)","url":"https://www.nbcnews.com/news/world/dutch-leader-apologizes-netherlands-role-slave-trade-establishes-fund-rcna62423"}],"connections":[{"id":"elmina-castle","type":"ownership","label":"seized Elmina from Portugal, 1637"},{"id":"crown-of-portugal","type":"political","label":"war over Brazil, Elmina and Luanda"},{"id":"port-luanda","type":"ownership","label":"occupied Luanda 1641–1648"},{"id":"queen-nzinga","type":"political","label":"alliance against Portugal, 1640s"},{"id":"curacao","type":"ownership","label":"slave entrepôt for Spanish America"},{"id":"new-amsterdam","type":"ownership","label":"owned enslaved Africans in New Amsterdam"},{"id":"spanish-asiento","type":"charter","label":"sub-contracted asiento supplies"},{"id":"house-of-orange","type":"ownership","label":"stadholders as chief directors"},{"id":"society-of-suriname","type":"ownership","label":"one-third shareholder, 1683"}]},{"id":"middelburgsche-commercie-compagnie","name":"Middelburgsche Commercie Compagnie (MCC)","category":"Companies & Banks","role":"Trader & Shipper","nation":"Netherlands","scale":"Significant","scaleBasis":"documented","scaleNote":"The largest Dutch slave trader after 1730: it bought 31,095 enslaved Africans between 1732 and 1803 for sale in the Caribbean and Suriname (per Zeeuws Archief/MCC records).","start":1732,"end":1803,"lifespan":"1720–1889","base":"Middelburg, Zeeland, Netherlands","geo":[51.499,3.611],"aliases":["MCC","Middelburg Commercial Company"],"origins":"Founded in Middelburg in 1720 as a general trading company. When the WIC lost its monopoly on the Dutch Atlantic slave trade in 1730, the MCC moved into 'free' slave trading and by the 1740s was the leading Dutch slaver.","role_summary":"The MCC sent triangular voyages from Zeeland to the West African coast (Gold Coast, Loango and elsewhere) and on to Suriname, Curaçao and Sint Eustatius, selling captives for plantation produce. Between 1756 and 1807 it sent out 92 triangular voyages and 22 other voyages.","roleDetail":[{"t":"31,095 captives purchased.","d":"Company records count 31,095 enslaved Africans bought from 1732 to 1803, carried on ships such as the Eenigheid (Unity, 1761–1763).","basis":"documented"},{"t":"An unusually complete archive.","d":"Logbooks, surgeons' journals, ledgers and letters survive in the Zeeuws Archief and are on UNESCO's Memory of the World Register. They record trade in detail, but the captives themselves are mostly anonymous.","basis":"documented"}],"legacy":"The MCC stopped slave trading after the British and Dutch bans of the early 19th century and was dissolved in 1889. Its papers passed to the Zeeland archives; online projects such as 'Slavenhandel MCC' now reconstruct individual voyages for the public.","legacyDetail":[{"t":"UNESCO Memory of the World.","d":"The MCC archive was inscribed for its detail and condition, making it one of the best-documented slave-trading archives anywhere.","basis":"documented"}],"sources":[{"label":"Zeeuwse Ankers — The slave trade","url":"https://www.zeeuwseankers.nl/en/story/the-slave-trade"},{"label":"Slavenhandel MCC — Middelburgse Commercie Compagnie","url":"https://eenigheid.slavenhandelmcc.nl/middelburgse-commercie-compagnie-en/?lang=en"},{"label":"Wikipedia — Middelburgsche Commercie Compagnie","url":"https://en.wikipedia.org/wiki/Middelburgsche_Commercie_Compagnie"}],"connections":[{"id":"dutch-west-india-company","type":"charter","label":"traded after WIC monopoly ended, 1730"},{"id":"society-of-suriname","type":"trade","label":"sold captives in Suriname"},{"id":"curacao","type":"trade","label":"sold captives at Curaçao"},{"id":"sint-eustatius","type":"trade","label":"sold captives at Sint Eustatius"},{"id":"elmina-castle","type":"trade","label":"bought captives on the Gold Coast"}]},{"id":"house-of-orange","name":"House of Orange-Nassau (stadholders and monarchs)","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Netherlands","scale":"Significant","scaleBasis":"estimated","scaleNote":"A 2023 government-commissioned study ('Staat en Slavernij') estimated stadholders Willem III–V drew c. €545 million (today's value) from colonial roles and VOC/WIC payments in 1675–1770; the royal-commissioned Leiden study presented on 2 October 2026 estimated c. €576 million in colonial income over 1600–present, mostly from the Dutch East Indies, and 'almost nothing' from the slave trade itself.","start":1621,"end":null,"lifespan":"1544–present (stadholders to 1795; monarchy from 1815)","base":"The Hague, Netherlands","geo":[52.081,4.306],"aliases":["Oranje-Nassau","Dutch royal family"],"origins":"The princes of Orange led the Dutch Revolt against Spain and served as stadholders of the Republic. Their political leadership made them patrons and beneficiaries of the VOC and WIC.","role_summary":"Stadholders received payments from the WIC and VOC, and from 1748/49 held the title of chief director of both companies. As kings after 1815 they presided over a state that kept slavery in Suriname and the Antilles until 1863.","roleDetail":[{"t":"Paid by the chartered companies.","d":"Per the 2023 'Staat en Slavernij' research by Raymund Schütz, shareholders arranged to pay the Oranges as if they held c. 3% of shares; Willem III's VOC share alone was c. 1.09 million guilders.","basis":"documented"},{"t":"Contested weight in the Atlantic trade.","d":"The royal-commissioned Leiden study (led by Gert Oostindie, presented 2 Oct 2026) found the family earned almost nothing directly from the slave trade, but supported colonialism, including slavery, 'wholeheartedly' and shares responsibility for its survival; only William I (r. 1813–40) had a direct hand in colonial slavery. The 2023 and 2026 studies use different periods and methods.","basis":"interpretive"}],"legacy":"On 1 July 2023 (Keti Koti, 160 years after the 1863 abolition), King Willem-Alexander apologised in Amsterdam for the Netherlands' role in slavery and said the monarchs of the House of Orange 'took no steps against it'. He commissioned independent research into the family's colonial income, published in 2026.","legacyDetail":[{"t":"Royal apology, 2023.","d":"The king called slavery a crime against humanity and asked forgiveness for his ancestors' part in it; the government still ruled out reparations.","basis":"documented"},{"t":"Royal-commissioned study, 2026.","d":"Leiden researchers (presented 2 October 2026) estimated c. €576 million in colonial earnings from 1600 to the present, mostly from the Dutch East Indies; the king called the findings 'heartbreaking and confronting'.","basis":"documented"}],"sources":[{"label":"DutchNews — Dutch royals earned €545 million from slavery and colonialism (2023)","url":"https://dutchnews.nl/2023/06/dutch-royals-earned-e545-million-from-slavery-and-colonialism"},{"label":"Al Jazeera — Dutch royal house helped slave trade to survive, study finds (2026)","url":"https://www.aljazeera.com/news/2026/10/2/dutch-royal-house-helped-slave-trade-to-survive-study-finds"},{"label":"IamExpat — Keti Koti 2023: Why did the Dutch king apologise for slavery?","url":"https://www.iamexpat.nl/expat-info/dutch-expat-news/keti-koti-2023-why-did-dutch-king-apologise-slavery"},{"label":"DutchReview — King Willem-Alexander apologises for the Netherlands' role in slavery","url":"https://dutchreview.com/featured/king-willem-alexander-apologises-netherlands-slavery"},{"label":"DutchNews — Dutch royal house earned nearly half a billion from slavery (2026)","url":"https://www.dutchnews.nl/2026/10/dutch-royal-house-earned-nearly-half-a-billion-from-slavery/"}],"connections":[{"id":"dutch-west-india-company","type":"ownership","label":"chief directors / company payments"},{"id":"de-nederlandsche-bank","type":"charter","label":"Willem I founded DNB, 1814"},{"id":"society-of-suriname","type":"political","label":"presided over slaveholding colonies"},{"id":"port-amsterdam","type":"legacy","label":"king's 2023 apology in Amsterdam"},{"id":"james-duke-of-york","type":"political","label":"Anglo-Dutch rivalry; Willem III later king of England"}]},{"id":"de-nederlandsche-bank","name":"De Nederlandsche Bank (DNB)","category":"Companies & Banks","role":"Financier & Insurer","nation":"Netherlands","scale":"Minor","scaleBasis":"documented","scaleNote":"Leiden University research found part of DNB's start-up capital came from slavery-linked investors and that board members held enslaved people; DNB also handled 1863 compensation payments to enslavers.","start":1814,"end":null,"lifespan":"1814–present","base":"Amsterdam, Netherlands","geo":[52.358,4.899],"aliases":["DNB","Dutch central bank"],"origins":"Founded in 1814 by King Willem I as a private note-issuing bank to rebuild Dutch finance after French rule. Its founding shareholders and directors included merchants with plantation and slave-economy interests.","role_summary":"DNB acknowledged involvement in slavery between 1814 and 1863. It financed trade linked to slave-produced goods, had directors who were enslavers, and was involved in paying compensation to plantation owners when slavery was abolished in 1863.","roleDetail":[{"t":"Slavery-linked capital and directors.","d":"An independent Leiden University study (2022) found several board members were personally involved in slavery.","basis":"documented"},{"t":"Compensation to enslavers.","d":"At abolition in 1863 the Dutch state paid enslavers per person freed, not the freed people, and DNB was involved in those payments, including to its own board members.","basis":"documented"}],"legacy":"President Klaas Knot apologised on 1 July 2022 (Keti Koti). DNB set up a €5 million fund with the Cultuurfonds for initiatives led by descendants of enslaved people, plus €5 million for education and heritage projects.","legacyDetail":[{"t":"Apology and funds, 2022.","d":"DNB apologised publicly, created two €5 million funds and pledged support to the national research centre on slavery history.","basis":"documented"}],"sources":[{"label":"DNB — DNB apologises for its historical links to slavery (2022)","url":"https://www.dnb.nl/en/general-news/2022/dnb-apologises-for-its-historical-links-to-slavery"},{"label":"DNB — Apologies and measures","url":"https://dnb.nl/en/about-us/dnb-s-links-to-slavery/apologies-and-measures"},{"label":"Al Jazeera — Dutch central bank apologises for historic links to slave trade","url":"https://www.aljazeera.com/news/2022/7/1/dutch-central-bank-apologises-for-historic-links-to-slave"}],"connections":[{"id":"house-of-orange","type":"charter","label":"founded by King Willem I"},{"id":"abn-amro","type":"parallel","label":"Dutch bank apologies, 2022"},{"id":"society-of-suriname","type":"finance","label":"paid 1863 compensation to Suriname enslavers"},{"id":"port-amsterdam","type":"finance","label":"Amsterdam merchant capital"}]},{"id":"abn-amro","name":"ABN AMRO (predecessors Hope & Co. and R. Mees & Zoonen)","category":"Companies & Banks","role":"Financier & Insurer","nation":"Netherlands","scale":"Significant","scaleBasis":"documented","scaleNote":"IISH research found c. 25–33% of predecessor Hope & Co.'s revenue in sample years (1770, 1790) came from slavery, and that it was financially involved in at least 73 Caribbean plantations; Mees & Zoonen arranged at least 16 insurance policies on slave ships.","start":1762,"end":null,"lifespan":"1720s–present (via predecessors)","base":"Amsterdam, Netherlands","geo":[52.338,4.873],"aliases":["Hope & Co.","R. Mees & Zoonen","MeesPierson"],"origins":"ABN AMRO is the product of many mergers. Its legal predecessors include the Amsterdam merchant bank Hope & Co. (a major 18th-century international house) and the Rotterdam firm R. Mees & Zoonen.","role_summary":"Hope & Co. lent to plantation owners in Dutch, British and Danish colonies with enslaved people as security, traded slave-produced goods and sometimes pushed plantation managers to buy or sell enslaved people. Mees & Zoonen insured captives aboard slave ships.","roleDetail":[{"t":"Plantation lender.","d":"Hope & Co. financed at least 73 Caribbean plantations and was involved in their day-to-day management (IISH, 2022).","basis":"documented"},{"t":"Insurer of slave voyages.","d":"R. Mees & Zoonen arranged insurance on enslaved people carried on ships, and partners invested in Rotterdam funds for Suriname plantations.","basis":"documented"}],"legacy":"After commissioning research from the International Institute of Social History, ABN AMRO apologised in April 2022 for its predecessors' role, while declining to pay reparations.","legacyDetail":[{"t":"Apology, April 2022.","d":"CEO Robert Swaak apologised for 'the pain and suffering' caused; the bank said it would fund awareness projects, not reparations.","basis":"documented"}],"sources":[{"label":"ABN AMRO — ABN AMRO apologizes for historic involvement in slavery","url":"https://abnamro.com/en/news/abn-amro-apologizes-for-historic-involvement-in-slavery"},{"label":"IISH — Research shows large-scale involvement in slavery of ABN AMRO predecessors","url":"https://iisg.amsterdam/en/blog/research-iish-shows-large-scale-involvement-slavery-predecessors-abn-amro"},{"label":"IISH — Conclusions report (PDF)","url":"https://iisg.amsterdam/files/2022-04/IISG-Conclusions-ABN-AMRO-ENG.pdf"},{"label":"Al Jazeera — Dutch bank ABN Amro apologises for role in slave trade","url":"https://www.aljazeera.com/news/2022/4/13/dutch-bank-abn-amro-apologises-for-role-in-slave-trade"}],"connections":[{"id":"hope-and-co","type":"legacy","label":"legal predecessor"},{"id":"society-of-suriname","type":"finance","label":"plantation loans in Suriname"},{"id":"danish-west-indies","type":"finance","label":"loans to Danish colony plantations"},{"id":"de-nederlandsche-bank","type":"parallel","label":"Dutch bank apologies, 2022"}]},{"id":"coymans-family","name":"Coymans family (Balthasar Coymans)","category":"European Families","role":"Broker & Agent","nation":"Netherlands","scale":"Significant","scaleBasis":"documented","scaleNote":"Balthasar Coymans's 1685 asiento obliged him to deliver more than 22,000 enslaved people to Spanish America within 4.5 years (per Ramona Negrón's research); the contract largely failed.","start":1685,"end":1689,"lifespan":"c. 1580–1700 (family firm); Balthasar Coymans 1652–1686","base":"Amsterdam / Cádiz","geo":[52.373,4.893],"aliases":["Coymans asiento","Baltazar Coymans"],"origins":"A Flemish-Dutch merchant dynasty with branches in Amsterdam, Haarlem and Cádiz that traded silver, spices and textiles with the Spanish Americas.","role_summary":"In 1685 Balthasar Coymans obtained the Spanish asiento de negros, the licence to supply enslaved Africans to Spanish America. He relied on the WIC to buy captives and on Curaçao as the depot, sending agents across the Caribbean.","roleDetail":[{"t":"Dutch control of the asiento.","d":"The contract put the Spanish slave supply in Dutch hands; evidence for it survives in archives in the Netherlands, Spain, Curaçao, Jamaica, Colombia, Cuba, Mexico and Panama.","basis":"documented"},{"t":"Collapse after his death.","d":"Coymans died in 1686 and the contract ended in disputes with Spain; one effect was that captives held on Curaçao 'piled up' unsold.","basis":"interpretive"}],"legacy":"The family's role is the subject of new scholarship (Negrón's Leiden dissertation and a Routledge book) on Dutch entrepreneurs who worked inside other empires' slave systems.","legacyDetail":[{"t":"Recovered by recent research.","d":"Historians now use the Coymans case to show how Dutch capital served the Spanish slave trade.","basis":"interpretive"}],"sources":[{"label":"Leiden University Scholarly Publications — Negrón, Coymans and the asiento","url":"https://scholarlypublications.universiteitleiden.nl/access/item%3A4210669/view"},{"label":"American Historical Association 2025 — The Transimperial Slave Trade: Dutch Entrepreneurs in Other Empires","url":"https://aha.confex.com/aha/2025/webprogram/Paper39227.html"},{"label":"Routledge — Silver, Spices and the Slave Trade: The Coymans Family","url":"https://www.routledge.com/Silver-Spices-and-the-Slave-Trade-The-Coymans-Family-and-Dutch-Entrepreneurship-in-the-Spanish-Americas-1580-1700/Negron/p/book/9781041199960"}],"connections":[{"id":"spanish-asiento","type":"charter","label":"held the asiento, 1685"},{"id":"crown-of-castile","type":"charter","label":"contract with the Spanish Crown"},{"id":"dutch-west-india-company","type":"trade","label":"bought captives from the WIC"},{"id":"curacao","type":"trade","label":"used Curaçao as depot"},{"id":"port-havana","type":"trade","label":"agents in Cuba"}]},{"id":"van-aerssen-van-sommelsdijck-family","name":"Van Aerssen van Sommelsdijck family","category":"European Families","role":"Planter & Enslaver","nation":"Netherlands","scale":"Significant","scaleBasis":"documented","scaleNote":"One-third owners of the Society of Suriname (1683–1770); by 1713 the colony had c. 200 plantations worked by c. 13,000 enslaved Africans.","start":1683,"end":1770,"lifespan":"1683–1770 (Suriname stake)","base":"Sommelsdijk / The Hague, Netherlands","geo":[51.756,4.15],"aliases":["Cornelis van Aerssen van Sommelsdijck"],"origins":"A Dutch noble family. Cornelis van Aerssen van Sommelsdijck bought a one-third share of the new Society of Suriname in 1683, alongside the city of Amsterdam and the WIC.","role_summary":"Cornelis became the colony's first governor under the Society and expanded plantations and repression of Maroon communities; he was killed by mutinous soldiers in 1688. The family kept its third share until selling it in 1770.","roleDetail":[{"t":"Governor of Suriname, 1683–1688.","d":"He ran a colony whose sugar, coffee and cocoa were produced by enslaved Africans and shipped to Amsterdam.","basis":"documented"},{"t":"Sold out in 1770.","d":"The family sold its share for c. 700,000 guilders.","basis":"documented"}],"legacy":"Fort Sommelsdijk in Suriname bears the family's name. Their stake shows how noble families shared directly in colonial plantation profits alongside cities and companies.","legacyDetail":[{"t":"Name on the landscape.","d":"Fort Sommelsdijk, at the meeting of the Commewijne and Cottica rivers, was built under Cornelis's governorship.","basis":"documented"}],"sources":[{"label":"Wikipedia — Society of Suriname","url":"https://en.wikipedia.org/wiki/Society_of_Suriname"},{"label":"Wikipedia — Cornelis van Aerssen van Sommelsdijck","url":"https://en.wikipedia.org/wiki/Cornelis_van_Aerssen_van_Sommelsdijck"}],"connections":[{"id":"society-of-suriname","type":"ownership","label":"one-third shareholder"},{"id":"port-amsterdam","type":"ownership","label":"co-owner with the city of Amsterdam"},{"id":"dutch-west-india-company","type":"ownership","label":"co-owner with the WIC"}]},{"id":"compagnie-des-indes","name":"Compagnie des Indes (French Indies Company)","category":"Companies & Banks","role":"Trader & Shipper","nation":"France","scale":"Significant","scaleBasis":"documented","scaleNote":"Held the French slave-trade monopoly for Senegal from 1718 and for Guinea in the 1720s; it carried the first captives to Louisiana (1719), where 23 voyages landed c. 6,235 Africans by 1769 (per SlaveVoyages), but sent only c. 16% of French slave ships in 1720–1749.","start":1718,"end":1769,"lifespan":"1664–1794 (successive companies)","base":"Lorient (Port-Louis) and Paris, France","geo":[47.748,-3.367],"aliases":["Compagnie d'Occident","Mississippi Company","John Law's Company","Compagnie perpétuelle des Indes"],"origins":"Formed from John Law's Compagnie d'Occident (1717), which absorbed the earlier Senegal and Guinea companies and the East India Company to become the Compagnie des Indes in 1719. It was tied to Law's bank and the 'Mississippi bubble'.","role_summary":"The company held legal monopolies on French slave trading in West Africa and on Louisiana's trade, running forts at Saint-Louis, Gorée and Ouidah. In practice private shipowners from Nantes and other ports did most French slave trading under licence.","roleDetail":[{"t":"First captives to Louisiana.","d":"The company ship Duc du Maine landed the first African captives in Louisiana on 6 June 1719, from Senegambia.","basis":"documented"},{"t":"Lorient as a slave port.","d":"Between 1723 and 1725 Lorient was among the first slave ports of France, per the French Service historique de la Défense.","basis":"documented"},{"t":"Formal monopoly, small share.","d":"A study of the Ouidah trade finds the company sent only 16.1% of French slave ships in 1720–1749, so its legal monopoly overstated its actual role.","basis":"documented"}],"legacy":"Louisiana returned to the Crown in 1731 and the company lost its monopoly in 1769; it was finally wound up in the Revolution. Lorient, the city it founded, keeps its history in the Musée de la Compagnie des Indes in Port-Louis.","legacyDetail":[{"t":"A city built by the company.","d":"Lorient takes its name from the company's port (L'Orient) and the Port-Louis citadel houses a museum of the company.","basis":"documented"}],"sources":[{"label":"Wikipedia — John Law's Company","url":"https://en.wikipedia.org/wiki/John_Law%27s_Company"},{"label":"BnF France–Amériques — Commercial companies","url":"https://heritage.bnf.fr/france-ameriques/en/commercial-companies"},{"label":"Service historique de la Défense — La Compagnie des Indes (PDF)","url":"https://www.servicehistorique.sga.defense.gouv.fr/sites/default/files/2020-12/la_compagnie_des_Indes.pdf"},{"label":"Wikipedia — Duc du Maine (slave ship)","url":"https://en.wikipedia.org/wiki/Duc_du_Maine_(slave_ship)"}],"connections":[{"id":"crown-of-france","type":"charter","label":"royal monopoly"},{"id":"compagnie-du-senegal","type":"legacy","label":"absorbed Senegal company, 1718"},{"id":"compagnie-de-guinee","type":"legacy","label":"absorbed Guinea company"},{"id":"goree-island","type":"ownership","label":"held Gorée"},{"id":"port-ouidah","type":"trade","label":"French fort at Ouidah"},{"id":"kingdom-of-dahomey","type":"trade","label":"bought captives via Ouidah"},{"id":"port-nantes","type":"charter","label":"licensed Nantes shipowners"}]},{"id":"montaudoin-family","name":"Montaudoin family (Montaudouin)","category":"European Families","role":"Trader & Shipper","nation":"France","scale":"Major","scaleBasis":"estimated","scaleNote":"Among Nantes's leading slave-trading houses for much of the 18th century; one secondary source credits the family with 357 ships, though voyage counts vary between sources.","start":1698,"end":1789,"lifespan":"1698–1789","base":"Nantes, France","geo":[47.213,-1.554],"aliases":["René Montaudoin et consors","Montaudoüin de La Touche"],"origins":"A Nantes merchant family whose outfitting firm, René Montaudouin et consors, operated from 1698 to 1730. Two branches were ennobled in 1750 by buying offices of royal secretary.","role_summary":"The Montaudoins outfitted slave ships to West Africa and sold captives in the French Caribbean, especially Saint-Domingue and Martinique. René Montaudoin owned La Concorde, which made slaving voyages in 1713–14, 1715–16 and 1717 before pirates seized it and it became Blackbeard's Queen Anne's Revenge.","roleDetail":[{"t":"Owner of La Concorde.","d":"On its third voyage La Concorde embarked 516 captives at Ouidah (Juda); 61 died in the crossing, and it was seized by Blackbeard's pirates on 28 November 1717 near Martinique with 455 captives aboard. Renamed Queen Anne's Revenge, it ran aground off Beaufort, North Carolina, in June 1718; the wreck is being excavated.","basis":"documented"},{"t":"Kept trading to the Revolution.","d":"The family continued large-scale outfitting until the eve of the Revolution; Jean-Gabriel Montaudoüin de La Touche corresponded with Benjamin Franklin.","basis":"documented"}],"legacy":"Their mansions stand in Nantes's Feydeau district, built on slave-trade profits. Nantes, once France's leading slave port, opened the Mémorial de l'abolition de l'esclavage in 2012.","legacyDetail":[{"t":"Built heritage.","d":"The Feydeau quarter's 18th-century merchant houses, including Montaudoin homes, are now part of Nantes's slavery-memory trails.","basis":"documented"}],"sources":[{"label":"Wikipedia — Nantes slave trade","url":"https://en.wikipedia.org/wiki/Nantes_slave_trade"},{"label":"Queen Anne's Revenge Project — Researching La Concorde in Nantes","url":"https://qaronline.org/blog/2020-03-24/research-in-nantes"},{"label":"Papers of Benjamin Franklin — Montaudoüin de La Touche, Jean-Gabriel","url":"https://franklinpapers.org/bio?id=312"},{"label":"Queen Anne's Revenge Project — Who was on La Concorde?","url":"https://qaronline.org/blog/2019-07-27/who-was-on-la-concorde"}],"connections":[{"id":"port-nantes","type":"voyage","label":"Nantes outfitters"},{"id":"saint-domingue","type":"trade","label":"sold captives in the French Caribbean"},{"id":"nantes-memorial","type":"legacy","label":"remembered in Nantes's memorial"},{"id":"compagnie-des-indes","type":"charter","label":"traded under company licences"}]},{"id":"gradis-family","name":"Gradis family (David & Abraham Gradis)","category":"European Families","role":"Trader & Shipper","nation":"France","scale":"Significant","scaleBasis":"estimated","scaleNote":"A leading Bordeaux colonial house; it set up on Gorée in 1748 and took part in the slave trade to the Americas, though its voyage count was smaller than the great Nantes houses.","start":1748,"end":1791,"lifespan":"1685–20th century (firm); David Gradis 1665–1751","base":"Bordeaux, France","geo":[44.838,-0.579],"aliases":["David Gradis et fils","Maison Gradis"],"origins":"A family of Portuguese-Jewish origin settled in Bordeaux. David Gradis built the trading house from 1685 into a major colonial import-export firm, renamed David Gradis et fils in 1728.","role_summary":"Gradis ships left Bordeaux with goods, bought captives at Gorée and sold them in the Caribbean. Abraham Gradis supplied the Crown in Canada and West Africa; in the 1760s his West African contracts were paid partly in enslaved people, who were sold in Saint-Domingue for sugar.","roleDetail":[{"t":"Presence on Gorée, 1748.","d":"The house set up on Gorée to buy captives for the Americas.","basis":"documented"},{"t":"Supplier to the Crown.","d":"Abraham Gradis was a major supplier to French colonial forces, linking the firm closely to royal policy.","basis":"documented"}],"legacy":"The firm continued into the 20th century as the Société française pour le commerce avec l'Outre-mer. Bordeaux has added explanatory plaques to streets named after slave-trading shipowners, including rue David Gradis.","legacyDetail":[{"t":"Street plaques.","d":"Bordeaux put explanatory plaques on five streets named for slave-trading shipowners; guided tours start at rue Gradis.","basis":"documented"}],"sources":[{"label":"Encyclopedia.com — Gradis","url":"https://encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/gradis"},{"label":"Wikipedia — Société française pour le commerce avec l'Outre-mer","url":"https://en.wikipedia.org/wiki/Soci%C3%A9t%C3%A9_fran%C3%A7aise_pour_le_commerce_avec_l%27Outre-mer"},{"label":"Europe 1 — À Bordeaux, pédagogie mémorielle concernant la traite","url":"https://www.europe1.fr/societe/a-bordeaux-on-veut-faire-de-la-pedagogie-memorielle-concernant-la-traite-desclaves-3974364"}],"connections":[{"id":"port-bordeaux","type":"voyage","label":"Bordeaux shipowners"},{"id":"goree-island","type":"trade","label":"bought captives at Gorée"},{"id":"saint-domingue","type":"trade","label":"sold captives for sugar"},{"id":"crown-of-france","type":"trade","label":"royal supplier"},{"id":"nairac-family","type":"parallel","label":"fellow Bordeaux house"}]},{"id":"nairac-family","name":"Nairac family","category":"European Families","role":"Trader & Shipper","nation":"France","scale":"Significant","scaleBasis":"estimated","scaleNote":"Bordeaux and La Rochelle shipowners and sugar refiners; SlaveVoyages lists several Nairac-owned slaving voyages from both ports, and they are often counted among Bordeaux's leading slave-trading houses, though a precise voyage total is not established here (see Saugera, Bordeaux, port négrier, for the Bordeaux record).","start":1764,"end":1792,"lifespan":"c. 1760s–1792","base":"Bordeaux, France","geo":[44.841,-0.57],"aliases":["Paul Nairac","Jean-Baptiste Nairac"],"origins":"A Protestant merchant family of Bordeaux, with Jean-Baptiste Nairac (1738–1817) active as a shipowner in La Rochelle. They owned sugar refineries in Bordeaux's Sainte-Croix district.","role_summary":"The Nairacs sent slave ships to the Bight of Benin and other coasts and sold captives in Saint-Domingue, while refining the sugar enslaved people produced.","roleDetail":[{"t":"Two-port operation.","d":"SlaveVoyages records a Nairac ship sailing from La Rochelle in 1771 to the Bight of Benin and Saint-Domingue, and Paul Nairac voyages from Bordeaux.","basis":"documented"},{"t":"Slave trade plus refining.","d":"Combining slaving voyages with sugar refining let the family profit at both ends of the triangle.","basis":"interpretive"}],"legacy":"Their Bordeaux mansions and refinery sites are part of the city's colonial-heritage tours; the Musée d'Aquitaine covers Bordeaux's slave trade in rooms opened in 2009.","legacyDetail":[{"t":"Bordeaux memory work.","d":"The family is among the Bordeaux houses named in the city's remembrance of the slave trade.","basis":"interpretive"}],"sources":[{"label":"SlaveVoyages — Voyage 32273 (Nairac)","url":"https://slavevoyages.org/voyage/32273/variables"},{"label":"SlaveVoyages — Voyage 31639","url":"https://slavevoyages.org/voyage/31639/variables"},{"label":"Wikipedia — Musée d'Aquitaine","url":"https://en.wikipedia.org/wiki/Mus%C3%A9e_d%27Aquitaine"}],"connections":[{"id":"port-bordeaux","type":"voyage","label":"Bordeaux shipowners"},{"id":"port-la-rochelle","type":"voyage","label":"La Rochelle voyages"},{"id":"saint-domingue","type":"trade","label":"sold captives in Saint-Domingue"},{"id":"port-ouidah","type":"trade","label":"Bight of Benin purchases"}]},{"id":"crown-of-france","name":"Crown of France (Bourbon monarchy)","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"France","scale":"Dominant","scaleBasis":"estimated","scaleNote":"French-flagged ships embarked c. 1.38 million captives (SlaveVoyages estimates, 1501–1866: 1,381,404, c. 11% of the Atlantic total), all under royal charters, licences and law; by 1789 Saint-Domingue alone held c. 465,000 enslaved people.","start":1664,"end":1848,"lifespan":"1664–1848 (colonial slavery under the Crown and successor regimes)","base":"Versailles / Paris, France","geo":[48.805,2.12],"aliases":["Louis XIV","Colbert","Charles X"],"origins":"Under Louis XIV and his minister Colbert, the Crown built a colonial system in the Caribbean and chartered companies to supply it with enslaved Africans.","role_summary":"The Crown chartered the Senegal, Guinea and Indies companies, issued the Code Noir (1685) and in 1701 won the Spanish asiento for the Compagnie de Guinée. In 1825 Charles X forced Haiti to pay a 150 million franc indemnity for France's recognition.","roleDetail":[{"t":"Wrote slavery into law.","d":"The 1685 Code Noir, issued at Versailles, regulated slavery in French colonies and stayed largely in force until 1848.","basis":"documented"},{"t":"Imposed the Haitian indemnity.","d":"Charles X's 1825 ordinance, backed by warships, made recognition of Haiti conditional on 150 million francs to compensate former colonists, including for enslaved 'property'.","basis":"documented"},{"t":"Reimposed slavery once.","d":"After the Republic abolished slavery in 1794, Napoleon restored it in 1802; it was finally abolished on 27 April 1848.","basis":"documented"}],"legacy":"The 2001 Taubira Law declared the slave trade and slavery a crime against humanity. In April 2025 President Macron set up a joint Franco-Haitian commission of historians on the 1825 debt, without accepting reparations.","legacyDetail":[{"t":"1848 compensation went to enslavers.","d":"A law of 30 April 1849 paid former owners 126 million francs over 20 years; freed people received nothing.","basis":"documented"},{"t":"Haiti's demands for restitution.","d":"Haitian governments and campaigners continue to seek restitution of the indemnity; France has not agreed to repay it.","basis":"documented"}],"sources":[{"label":"BnF France–Amériques — « Code Noir » (The Black Code)","url":"https://heritage.bnf.fr/france-ameriques/en/code-noir-black-code"},{"label":"Wikipedia — Haitian independence debt","url":"https://en.wikipedia.org/wiki/Haitian_independence_debt"},{"label":"Wikipedia — Decree of the Abolition of Slavery of April 27, 1848","url":"https://en.wikipedia.org/wiki/Decree_of_the_Abolition_of_Slavery_of_April_27,_1848"},{"label":"Fondation pour la mémoire de l'esclavage","url":"https://memoire-esclavage.org/tcpdf/410"},{"label":"SlaveVoyages — Trans-Atlantic Slave Trade Estimates","url":"https://www.slavevoyages.org/assessment/estimates"}],"connections":[{"id":"code-noir","type":"charter","label":"issued the Code Noir, 1685"},{"id":"compagnie-des-indes","type":"charter","label":"chartered the Indies company"},{"id":"compagnie-de-guinee","type":"charter","label":"asiento company, 1701"},{"id":"saint-domingue","type":"ownership","label":"colonial sovereign"},{"id":"haiti-independence-debt","type":"political","label":"imposed 1825 indemnity"},{"id":"spanish-asiento","type":"charter","label":"won the asiento, 1701"},{"id":"taubira-law","type":"legacy","label":"French Republic's 2001 recognition"}]},{"id":"danish-west-india-guinea-company","name":"Danish West India-Guinea Company","category":"Companies & Banks","role":"Trader & Shipper","nation":"Denmark-Norway","scale":"Significant","scaleBasis":"estimated","scaleNote":"Ran Denmark-Norway's Gold Coast forts and Caribbean colonies from 1674 to 1755; ships under the Danish/Baltic flag embarked c. 111,000 captives in all, of whom c. 92,000 survived to disembark (SlaveVoyages estimates, 1501–1866).","start":1671,"end":1755,"lifespan":"1671–1755 (successor companies to 1778)","base":"Copenhagen, Denmark","geo":[55.676,12.568],"aliases":["Vestindisk-guineisk Kompagni","Danish West India Company"],"origins":"Chartered by King Christian V in 1671 to colonise St Thomas; it took over the Guinea trade and became the West India-Guinea Company. Its Gold Coast base was Christiansborg at Osu (Accra), taken from the Swedes in the
