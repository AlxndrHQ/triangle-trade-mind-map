function barsHTML(title, rows, max){
  return `<div class="bars"><h5>${esc(title)}</h5>${rows.map(([k,v])=>`<div class="bar" title="${esc(k)}: ~${v.toLocaleString()}"><span>${esc(k)}</span><i style="width:${(100*v/max).toFixed(1)}%"></i><em>${fmtN(v)}</em></div>`).join('')}</div>`;
}
function numbersHTML(){
  const max=Math.max(...SV.from.map(x=>x[1]),...SV.to.map(x=>x[1]),...SV.flag.map(x=>x[1]));
  const tr=(rows)=>rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v.toLocaleString()}</td></tr>`).join('');
  return `<h3 class="subh">By the numbers, 1501–1866</h3>
    <div class="hero"><div><b>~${fmtN(SV.embarked)}</b><span>People forced onto ships in Africa</span></div><div><b>~${fmtN(SV.disembarked)}</b><span>Survived to land in the Americas</span></div><div><b>~${fmtN(SV.embarked-SV.disembarked)}</b><span>Died in the Middle Passage</span></div></div>
    <div class="nums">${barsHTML('Embarked, by African region',SV.from,max)}${barsHTML('Disembarked, by destination',SV.to,max)}${barsHTML('Embarked, by flag of the ship',SV.flag,max)}</div>
    <details class="tbl"><summary>Table view</summary><table><tbody>
      <tr><th colspan="2">Embarked by region</th></tr>${tr(SV.from)}<tr><th colspan="2">Disembarked by destination</th></tr>${tr(SV.to)}<tr><th colspan="2">By flag</th></tr>${tr(SV.flag)}</tbody></table></details>
    <p class="foot" style="margin-top:10px">Rounded estimates from the <a href="${SV.url}" target="_blank" rel="noopener">SlaveVoyages Estimates database ↗</a>. Bars share one scale.</p>`;
}
function renderChron(){
  const vis=new Set(visibleProfiles().map(p=>p.id)), t=terms(), people=state.cat!=='all'||state.role!=='all'||state.nation!=='all';
  const evs=DATA.events.filter(ev=>{
    if(state.era!=='all'){ const P=period(state.era); if(ev.year<P.from||ev.year>P.to) return false; }
    const hay=(ev.title+' '+ev.text+' '+ev.ids.map(id=>DATA.byId[id].name).join(' ')).toLowerCase();
    if(people && !ev.ids.some(id=>vis.has(id))) return false;
    if(t.length && !t.every(w=>hay.includes(w))) return false;
    return true;
  });
  const ppl=ev=>ev.ids.map(id=>{ const n=DATA.byId[id]; return `<button data-open="${esc(id)}"><span class="d" style="background:${colorOf(n)}"></span>${esc(n.name)}</button>`; }).join('');
  document.getElementById('grid').innerHTML = `
    <div class="gridhead"><h2>Chronology, 1492 to Today</h2><span class="meta">${evs.length} of ${DATA.events.length} events</span></div>
    ${filterNote()}
    <p class="lede">From Amerigo Vespucci’s first voyages to the apologies and reparations debates of the 2020s. Each event links to the players involved, and every entry cites a source.</p>
    ${PERIODS.map(P=>{ const list=evs.filter(e=>e.year>=P.from&&e.year<=P.to); if(!list.length) return '';
      return `<h3 class="subh">${esc(P.label)} · ${esc(P.title)}<span class="n">${list.length}</span></h3><div class="chron">${list.map(ev=>`<div class="ev"><div class="yr">${ev.year}</div><div>
        <h4>${hl(ev.title)}</h4><p>${hl(ev.text||'')}</p>${ev.ids.length?`<div class="ppl">${ppl(ev)}</div>`:''}
        ${ev.source?.url?`<a class="src" href="${esc(ev.source.url)}" target="_blank" rel="noopener">${esc(ev.source.label||'Source')} ↗</a>`:''}</div></div>`).join('')}</div>`; }).join('') || '<p class="empty-sec">No events match these filters.</p>'}
    ${numbersHTML()}

}

function renderOverlaps(){
  const ok=new Set(visibleProfiles().map(p=>p.id));
  const hubs=[...DATA.ovl.hubs.entries()].map(([id,m])=>({id,ppl:[...m.entries()].filter(([p])=>ok.has(p)),out:[...m.keys()].filter(p=>!ok.has(p))}))
    .filter(h=>h.ppl.length>=2).sort((a,b)=>b.ppl.length-a.ppl.length||a.id.localeCompare(b.id));
  const ties=DATA.links.filter(l=>l.type!=='parallel'&&ok.has(l.source)&&ok.has(l.target)&&!isCo(DATA.byId[l.source])&&!isCo(DATA.byId[l.target]));
  const cross=ties.filter(l=>DATA.byId[l.source].category!==DATA.byId[l.target].category);
  const people=new Set(); hubs.forEach(h=>h.ppl.forEach(([p])=>people.add(p))); ties.forEach(l=>{people.add(l.source);people.add(l.target);});
  const who=([p,path])=>{ const n=DATA.byId[p]; return `<li><button data-open="${esc(p)}"><span class="d" style="background:${catColor(n)}"></span><span class="nm">${hl(n.name)}</span>
    <span class="via">${path.length>2?esc('via '+path.slice(1,-1).map(id=>DATA.byId[id].name).join(' → ')):esc(linkBetween(path[0],path[1])?.label||'')}</span></button></li>`; };
  const tieRow=l=>`<div class="tie"><button data-open="${esc(l.source)}">${hl(DATA.byId[l.source].name)}</button><span class="rel">— ${esc(l.label||EDGE[l.type].label)} (${esc(EDGE[l.type].label.toLowerCase())}) —</span>
      <button data-open="${esc(l.target)}">${hl(DATA.byId[l.target].name)}</button></div>`;
  document.getElementById('grid').innerHTML = `
    <div class="gridhead"><h2>Where the Players Connect</h2><span class="meta">${hubs.length} shared hub${hubs.length===1?'':'s'} · ${people.size} players connected · ${ties.length} direct tie${ties.length===1?'':'s'}</span></div>
    ${filterNote()}
    <p class="lede">A company, bank, port, fort or institution counts as shared when two or more players reach it through trade, ownership, finance, charter, voyage, plantation or family links, up to ${OVL_HOPS} steps away. Click any name to open its dossier, or switch on “Overlaps only” on the Web to see these paths.</p>
    <div class="hubs">${hubs.map(({id,ppl,out})=>{ const e=DATA.byId[id]; return `<article class="hub">
      <div class="hh"><div><button data-open="${esc(id)}">${hl(e.name)}</button><span class="kind">${esc(e.kind||e.role||'')}${e._s!=null?' · '+e._s:''}</span></div><span class="cnt">${ppl.length} players</span></div>
      <ul class="who">${ppl.sort((a,b)=>a[1].length-b[1].length).map(who).join('')}${out.length?`<li class="out">Outside current filters: ${out.map(p=>`<button data-open="${esc(p)}">${esc(DATA.byId[p].name)}</button>`).join(', ')}</li>`:''}</ul></article>`; }).join('') || '<p style="color:var(--muted)">No shared hubs among the players that match these filters.</p>'}</div>
    ${cross.length?`<h3 class="subh">Across the triangle: direct ties between groups</h3><p class="lede small">Direct links between, for example, a European family and an African ruler, or an American merchant and a European bank.</p><div class="ties">${cross.map(tieRow).join('')}</div>`:''}
    ${ties.length>cross.length?`<h3 class="subh">Direct ties within a group</h3><div class="ties">${ties.filter(l=>!cross.includes(l)).map(tieRow).join('')}</div>`:''}
    <p class="foot">${esc(META.disclaimer)}</p>`;
}

    ${sh&&sh.size>=2?`<section class="sec"><h3><span class="num">${nx()}</span>Players Tied to This Firm</h3><ul class="who">${[...sh.entries()].sort((a,b)=>a[1].length-b[1].length).map(([p,path])=>`<li><button data-go="${esc(p)}"><span class="d" style="background:${catColor(DATA.byId[p])}"></span><span class="nm">${esc(DATA.byId[p].name)}</span><span class="via">${path.length>2?esc('via '+path.slice(1,-1).map(id=>DATA.byId[id].name).join(' → ')):'direct'}</span></button></li>`).join('')}</ul></section>`:''}
    ${ov.length?`<section class="sec"><h3><span class="num">${nx()}</span>Overlaps With Other Players</h3><ul class="who">${ov.map(({other,path})=>`<li><button data-go="${esc(other)}"><span class="d" style="background:${catColor(DATA.byId[other])}"></span><span class="nm">${esc(DATA.byId[other].name)}</span><span class="via">${esc(viaText(path))}</span></button></li>`).join('')}</ul></section>`:''}
    ${eventsList(n.id,nx())}
    ${srcList(n)}
    <p class="disc">${esc(META.disclaimer)}</p>
  </div>`;
}
function showDrawer(id){
  const n=DATA.byId[id]; if(!n) return;
  state.openId=id;
  const d=document.getElementById('drawer');
  d.innerHTML=dossierHTML(n);
  d.classList.add('open'); d.setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('on');
  d.querySelector('.dclose').onclick=closeDrawer;
  d.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openNode(b.dataset.go));
  d.querySelector('.dbody').scrollTop=0;
  document.title=`${n.name} — ${SITE}`;
  if(state.view==='map'){
    if(G.root && !G.nodes.some(x=>x.id===id)){ clearFilters(); }
    hot(id);
  }
  setTimeout(()=>d.querySelector('.dclose')?.focus({preventScroll:true}),50);
}
function hideDrawer(){
  state.openId=null;
  const d=document.getElementById('drawer');
  d.classList.remove('open'); d.setAttribute('aria-hidden','true');
  document.getElementById('scrim').classList.remove('on');
  document.title=`${SITE} — Mind Map of the Players, 1492–Today`;
  clearHot();
}

/* =====================================================================
   MAP (Leaflet) — players by base, and the triangle routes
   ===================================================================== */
const ATLAS = {map:null, tiles:null, theme:null, layer:'players', group:null, libs:null, booting:null, fitted:{}};
const ATLAS_LIBS = {css:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css', js:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'};
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('Could not load '+src)); document.head.appendChild(s); }); }
function atlasLibs(){
  if (ATLAS.libs) return ATLAS.libs;
  const l=document.createElement('link'); l.rel='stylesheet'; l.href=ATLAS_LIBS.css; document.head.appendChild(l);
  return ATLAS.libs = window.L ? Promise.resolve() : loadScript(ATLAS_LIBS.js);
}
const atlasTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function atlasTiles(){
  const t=atlasTheme(); if (ATLAS.tiles && ATLAS.theme===t) return;
  ATLAS.theme=t; (ATLAS.tiles||[]).forEach(l=>ATLAS.map.removeLayer(l));
  const v = t==='dark' ? 'Dark' : 'Light', url = k => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${v}_Gray_${k}/MapServer/tile/{z}/{y}/{x}`;
  ATLAS.tiles = [
    L.tileLayer(url('Base'), {maxNativeZoom:16, maxZoom:19, attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'}),
    L.tileLayer(url('Reference'), {maxNativeZoom:16, maxZoom:19, pane:'shadowPane', opacity:.85})
  ];
  ATLAS.tiles.forEach(l=>l.addTo(ATLAS.map));
  if(ATLAS.layer==='routes') drawAtlas(false);   // route colours follow the theme
}
const cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const geoOf = n => Array.isArray(n.geo)&&n.geo.length>=2&&isFinite(n.geo[0]) ? [+n.geo[0],+n.geo[1]] : null;
function placePopup(label, items){
  return `<div class="pop"><div class="pop-k">${items.length} ${items.length===1?'record':'records'} here</div><h4>${esc(label)}</h4>
    <ul class="who">${items.slice().sort((a,b)=>(a._s??9999)-(b._s??9999)).map(p=>
      `<li><button data-go="${esc(p.id)}"><span class="d" style="background:${colorOf(p)}"></span><span class="nm">${esc(p.name)}</span><span class="via">${esc(p._kind==='profile'?(p.role||p.category):(p.kind||''))}${p._s!=null?' · '+p._s:''}</span></button></li>`).join('')}</ul></div>`;
}
function arc(a,b,bend=.18){   // quadratic curve between two [lat,lng] points, as a polyline
  const [y1,x1]=a,[y2,x2]=b, mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1, cx=mx-dy*bend, cy=my+dx*bend, pts=[];
  for(let i=0;i<=32;i++){ const t=i/32, u=1-t; pts.push([u*u*y1+2*u*t*cy+t*t*y2, u*u*x1+2*u*t*cx+t*t*x2]); }
  return pts;
}
function drawAtlas(fit){
  if (!ATLAS.map) return;
  atlasTiles();
  if (ATLAS.group) ATLAS.map.removeLayer(ATLAS.group);
  const g = ATLAS.group = L.featureGroup().addTo(ATLAS.map);
  const st=document.getElementById('atlasStatus'), key=document.getElementById('atlasKey');
  document.querySelectorAll('#atlasLayer button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.layer===ATLAS.layer));
  if (ATLAS.layer==='players'){
    const vis=visibleProfiles(), ids=new Set(vis.map(p=>p.id));
    const ents=DATA.entities.filter(e=>geoOf(e) && passEra(e) &&
      (!narrowedNow() || (terms().length && matchQ(e)) || neighbors(e.id).some(x=>ids.has(x.other.id))));
    const at=new Map();
    [...vis,...ents].forEach(n=>{ const ll=geoOf(n); if(!ll) return; const k=ll.map(v=>v.toFixed(1)).join(','); (at.get(k)||at.set(k,{ll,items:[]}).get(k)).items.push(n); });
    for (const {ll,items} of at.values()){
      const ps=items.filter(n=>n._kind==='profile'), label=(ps[0]||items[0]).base || (items[0].name);
      const cats=new Set(ps.map(p=>p.category)), c=ps.length ? (cats.size===1?catColor(ps[0]):'var(--accent)') : null;
      const s=Math.round(12+5*Math.sqrt(items.length));
      const icon=L.divIcon({className:'apin'+(ps.length?'':' ent'), iconSize:ps.length?[s,s]:[11,11], html:`<span style="--c:${c||'var(--edge-strong)'}">${ps.length&&items.length>1?items.length:''}</span>`});
      L.marker(ll,{icon, title:`${label} · ${items.length}`, riseOnHover:true}).bindPopup(placePopup(label, items),{maxWidth:330, className:'apop', autoPanPaddingTopLeft:[24,160]}).addTo(g);
    }
    const unplaced=vis.filter(p=>!geoOf(p)).length;
    st.innerHTML=`${vis.length} players · ${ents.length} places${unplaced?` · <span style="color:var(--dim)">${unplaced} without a base</span>`:''} · uses the filters above`;
    key.innerHTML=`<h4>Players &amp; places</h4>${Object.entries(CATS).map(([k,v])=>`<div class="it"><span class="sw" style="width:9px;height:9px;border-radius:50%;background:${v.color};display:inline-block"></span>${esc(k)}</div>`).join('')}
      <div class="it"><span style="width:9px;height:9px;border:1.5px solid var(--edge-strong);display:inline-block"></span>Port, fort, colony or institution</div><div class="it" style="color:var(--muted)">Numbers = records sharing a city</div>`;
  } else {
    const col={out:cssVar('--c-eu'), mid:cssVar('--c-co'), back:cssVar('--c-af'), bi:cssVar('--c-am')};
    const F=Object.fromEntries(SV.from.map(x=>[x[0],x])), T=Object.fromEntries(SV.to.map(x=>[x[0],x]));
    const line=(pts,c,w,tip,dash)=>L.polyline(pts,{color:c,weight:w,opacity:.75,dashArray:dash,interactive:true}).bindTooltip(tip,{sticky:true,className:'rtip'}).addTo(g);
    ROUTES.out.forEach(([ll,to,name])=>line(arc(ll,F[to][2],-.15),col.out,2,`${name} → ${to}: textiles, guns, iron bars, cowries, brandy`));
    ROUTES.middle.forEach(([a,b,w])=>line(arc(F[a][2],T[b][2],.12),col.mid,1.5+w*2.2,`Middle Passage: ${a} → ${b}`));
    ROUTES.back.forEach(([a,ll,tip])=>line(arc(T[a][2],ll,.2),col.back,2,tip,'6 6'));
    ROUTES.bilateral.forEach(([a,b,tip])=>line(arc(T[a][2],F[b][2],-.2),col.bi,2,tip,'2 6'));
    const maxF=SV.from[0][1];
    [...SV.from.map(x=>[...x,'Embarked']),...SV.to.filter(x=>x[0]!=='Europe').map(x=>[...x,'Landed'])].forEach(([name,v,ll,what])=>{
      L.circleMarker(ll,{radius:4+16*Math.sqrt(v/maxF),color:cssVar('--bg'),weight:1.5,fillColor:what==='Embarked'?col.mid:cssVar('--text'),fillOpacity:.85})
        .bindPopup(`<div class="pop"><div class="pop-k">${what}, 1501–1866</div><h4>${esc(name)}</h4><p>~${v.toLocaleString()} people (SlaveVoyages estimate)</p></div>`,{className:'apop'}).addTo(g);
    });
    st.innerHTML=`Schematic routes. Volumes are rounded <a href="${SV.url}" target="_blank" rel="noopener">SlaveVoyages</a> estimates · hover a line`;
    key.innerHTML=`<h4>The triangle</h4>
      <div class="it"><span class="ln" style="border-color:${col.out}"></span>1 · Europe → Africa: manufactured goods</div>
      <div class="it"><span class="ln" style="border-color:${col.mid};border-top-width:4px"></span>2 · Middle Passage: captives (width ≈ volume)</div>
      <div class="it"><span class="ln" style="border-color:${col.back};border-top-style:dashed"></span>3 · Americas → Europe: sugar, tobacco, cotton</div>
      <div class="it"><span class="ln" style="border-color:${col.bi};border-top-style:dotted"></span>Brazil ⇄ Africa direct (no European leg)</div>
      <div class="it" style="color:var(--muted)">Circles: people embarked (orange) or landed (ink)</div>`;
  }
  if (fit || !ATLAS.fitted[ATLAS.layer]) {
    const b=g.getBounds(); if (b.isValid()) { ATLAS.map.fitBounds(b.pad(.08),{maxZoom:5, animate:false}); ATLAS.fitted[ATLAS.layer]=true; }
  }
}
async function renderAtlas(){
  if (!ATLAS.booting) ATLAS.booting = (async ()=>{
    await atlasLibs();
    ATLAS.map = L.map('atlasMap', {zoomControl:false, worldCopyJump:true, minZoom:2}).setView([15,-30], 3);
    L.control.zoom({position:'bottomright'}).addTo(ATLAS.map);
    ATLAS.map.on('popupopen', e=>e.popup.getElement()?.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openNode(b.dataset.go)));
    new MutationObserver(()=>ATLAS.map&&atlasTiles()).observe(document.documentElement,{attributes:true, attributeFilter:['data-theme']});
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>ATLAS.map&&atlasTiles());
  })().catch(e=>{ document.getElementById('atlasStatus').textContent='The map library could not load. Check your connection and reload.'; throw e; });
  await ATLAS.booting;
  ATLAS.map.invalidateSize();
  drawAtlas(false);
}
document.getElementById('atlasLayer').addEventListener('click', e=>{
  const b=e.target.closest('[data-layer]'); if(!b || b.dataset.layer===ATLAS.layer) return;
  ATLAS.layer=b.dataset.layer; ATLAS.map?.closePopup(); drawAtlas(false);
});

/* =====================================================================
   ROUTER  (#/web · #/grid · #/chronology · #/overlaps · #/map · #/p/<id>)
   ===================================================================== */
function setView(v){
  state.view=v;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));
  document.getElementById('map').hidden = v!=='map';
  document.getElementById('grid').hidden = v==='map'||v==='atlas';
  document.getElementById('atlas').hidden = v!=='atlas';
  document.getElementById('grid').scrollTop=0;
  refresh();
}
const VIEW_HASH = {map:'web', atlas:'map', grid:'directory', overlaps:'overlaps', chron:'chronology'};
const HASH_VIEW = {web:'map', map:'atlas', directory:'grid', grid:'grid', overlaps:'overlaps', chronology:'chron', timeline:'chron'};
const hashOf = v => VIEW_HASH[v] || v;
const viewOfHash = () => HASH_VIEW[location.hash.replace(/^#\/?/,'').split('/')[0]] || null;
function route(){
  const [a,b]=location.hash.replace(/^#\/?/,'').split('/');
  const id=b?decodeURIComponent(b):'';
  if(a==='p' && DATA.byId[id]){ showDrawer(id); return; }
  hideDrawer();
  const v=HASH_VIEW[a];   // sub-paths pick a layout or layer: #/web/timeline, #/map/routes
  if(v==='map' && ['force','cluster','timeline'].includes(b) && b!==state.layout){
    state.layout=b; G.pos.clear(); document.querySelectorAll('#layoutSeg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.layout===b));
    if(state.view==='map'){ renderMap(); return; }
  }
  if(v==='atlas' && ['players','routes'].includes(b) && b!==ATLAS.layer){ ATLAS.layer=b; if(state.view==='atlas'){ drawAtlas(false); return; } }
  if(v && v!==state.view) setView(v);
}

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  try{
    const r=await fetch('data.json',{cache:'no-store'});
    if(r.ok) DATA=normalize(await r.json());
  }catch(_){/* opened from file:// — use embedded copy */}
  if(!DATA) DATA=normalize(EMBEDDED_DATA);
  DATA.ovl=computeOverlaps(DATA);
  DATA.nComm=computeCommunities(DATA);
  renderLegend(); bindUI();
  setView(viewOfHash() || 'map');
  route();
})();
</script>
