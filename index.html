 late 1650s.","role_summary":"The company bought captives at Christiansborg and other Gold Coast posts and shipped them to St Thomas, St John (from 1718) and St Croix (bought from France in 1733), where enslaved people worked sugar plantations. It also leased part of St Thomas to the Brandenburg company.","roleDetail":[{"t":"Gold Coast to Danish Caribbean.","d":"From 1674 to 1755 the company administered the Danish settlements in Guinea and supplied the Danish West Indies with captives.","basis":"documented"},{"t":"St John revolt, 1733.","d":"Enslaved Akwamu people on St John rose against company rule in 1733 and held the island for months before French troops suppressed them.","basis":"documented"}],"legacy":"The Crown took over the colonies in 1754–55. Denmark sold its Gold Coast forts to Britain in 1850 and the Danish West Indies to the United States in 1917; the 2017 centenary set off Denmark's largest public reckoning with its colonial past.","legacyDetail":[{"t":"2017 centenary.","d":"Nearly 30 exhibitions marked 100 years since the sale of the islands; PM Lars Løkke Rasmussen called the era 'shameful' but no formal apology followed.","basis":"documented"}],"sources":[{"label":"Wikipedia — Danish Gold Coast","url":"https://en.wikipedia.org/wiki/Danish_Gold_Coast"},{"label":"Danish National Archives — Timeline on the Danish slave trade","url":"https://tiki-toki.com/timeline/entry/493514/THE-DANISH-NATIONAL-ARCHIVES-Timeline-on-the-Danish-slave-trade"},{"label":"The Local DK — Denmark struggles to come to grips with its slave past (2017)","url":"https://www.thelocal.dk/20170105/denmark-struggles-to-come-to-grips-with-its-slave-past"},{"label":"SlaveVoyages — Trans-Atlantic Slave Trade Estimates","url":"https://www.slavevoyages.org/assessment/estimates"}],"connections":[{"id":"crown-of-denmark-norway","type":"charter","label":"royal charter, 1671"},{"id":"christiansborg-castle","type":"ownership","label":"Gold Coast headquarters"},{"id":"danish-west-indies","type":"ownership","label":"ran St Thomas, St John, St Croix"},{"id":"brandenburg-african-company","type":"trade","label":"leased land on St Thomas, 1685"},{"id":"akwamu-kingdom","type":"trade","label":"bought captives from Akwamu"},{"id":"hendrik-carloff","type":"ownership","label":"Carloff led Danish Africa venture"}]},{"id":"schimmelmann-family","name":"Schimmelmann family (Heinrich Carl & Ernst von Schimmelmann)","category":"European Families","role":"Planter & Enslaver","nation":"Denmark-Norway","scale":"Major","scaleBasis":"documented","scaleNote":"Heinrich Carl von Schimmelmann was the largest Danish slave owner and trader, with over 1,000 enslaved people on four plantations in the Danish West Indies.","start":1763,"end":1848,"lifespan":"Heinrich Carl 1724–1782; Ernst Heinrich 1747–1831","base":"Copenhagen, Denmark / Wandsbek (Hamburg)","geo":[55.683,12.591],"aliases":["Heinrich Carl von Schimmelmann","Ernst Heinrich von Schimmelmann"],"origins":"Heinrich Carl, a Prussian-born merchant and war profiteer, entered Danish service as treasurer and was made a count. In 1763 he bought the king's four West Indian plantations on favourable terms, along with a Copenhagen sugar refinery and slave ships.","role_summary":"Schimmelmann linked guns and textiles from his factories, slaving voyages from the Gold Coast, Caribbean sugar plantations and his Copenhagen refinery into one circuit. His son Ernst, as finance minister, chaired the commission behind the 1792 Danish slave-trade ban while the family kept its plantations.","roleDetail":[{"t":"Atlantic business circuit.","d":"He tied his estates and factories into a closed loop between Western Europe, West Africa and the Caribbean.","basis":"documented"},{"t":"Son drafted the 1792 ban.","d":"Ernst Schimmelmann chaired the 1791 Slave Trade Commission; the ten-year delay he backed let planters build up their enslaved workforce first.","basis":"documented"}],"legacy":"The fortune was locked in an entail for the family. A bust of Heinrich Carl erected in Hamburg-Wandsbek in 2006 was paint-attacked and removed in 2008 after two years of protest, though streets there still bear his name.","legacyDetail":[{"t":"Contested memorial.","d":"The Wandsbek bust became a test case in Germany's debate over honouring slave traders.","basis":"documented"},{"t":"Hans Jonathan.","d":"Hans Jonathan, born enslaved in 1784 on St Croix and brought to Copenhagen by the family, lost a 1802 freedom suit and fled to Iceland.","basis":"documented"}],"sources":[{"label":"Wikipedia — Heinrich Carl von Schimmelmann","url":"https://en.wikipedia.org/wiki/Heinrich_Carl_von_Schimmelmann"},{"label":"Goethe-Institut — Vestiges of Colonialism: Honouring a Slave Trader","url":"https://goethe.de/prj/zei/en/art/22805137.html"},{"label":"Wikipedia — Ernst Heinrich von Schimmelmann","url":"https://en.wikipedia.org/wiki/Ernst_Heinrich_von_Schimmelmann"},{"label":"London Review of Books — Under the Staircase (Hans Jonathan)","url":"https://lrb.co.uk/v39/n20/karl-whitney/under-the-staircase"}],"connections":[{"id":"danish-west-indies","type":"plantation","label":"four plantations, 1,000+ enslaved"},{"id":"crown-of-denmark-norway","type":"political","label":"treasurer; bought crown plantations"},{"id":"danish-1792-decree","type":"political","label":"Ernst chaired commission"},{"id":"christiansborg-castle","type":"trade","label":"Gold Coast slave purchases"}]},{"id":"crown-of-denmark-norway","name":"Crown of Denmark-Norway","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Denmark-Norway","scale":"Significant","scaleBasis":"estimated","scaleNote":"Sovereign over Gold Coast forts and the Danish West Indies; ran the colonies directly from 1755 and issued the 1792 ban that took effect only in 1803.","start":1658,"end":1848,"lifespan":"1658–1848 (slavery under the Crown); colonies sold 1850 and 1917","base":"Copenhagen, Denmark","geo":[55.676,12.58],"aliases":["Christian V","Christian VII","Danish state"],"origins":"Denmark-Norway entered the Gold Coast trade in the 1650s with the help of ex-Swedish agent Hendrik Carloff and chartered a West India company in 1671.","role_summary":"The Crown chartered the companies, bought St Croix from France in 1733, ran the colonies directly from 1755 and sold royal plantations to Schimmelmann in 1763. King Christian VII signed the decree of 16 March 1792 banning the trade, effective 1803.","roleDetail":[{"t":"Early ban, slow effect.","d":"The 1792 decree was among the first national bans on the Atlantic slave trade, but its ten-year delay increased imports in the meantime.","basis":"documented"},{"t":"Emancipation forced from below.","d":"On 3 July 1848 enslaved people on St Croix led by 'General Buddhoe' rose up; Governor-General Peter von Scholten then proclaimed emancipation.","basis":"documented"}],"legacy":"Denmark sold the islands to the US in 1917 for $25 million. During the 2017 centenary the Danish government acknowledged the 'shameful' past but did not formally apologise; Ghana and USVI groups continue to press for reparations.","legacyDetail":[{"t":"Myth of the benevolent governor.","d":"Denmark's National Museum notes that Danes credit von Scholten with emancipation, while Virgin Islanders credit the enslaved themselves.","basis":"interpretive"}],"sources":[{"label":"Cambridge — Itinerario: The Danish ban on the Atlantic slave trade (1787–1807)","url":"https://www.cambridge.org/core/journals/itinerario/article/abs/danish-ban-on-the-atlantic-slave-trade-and-denmarks-african-colonial-ambitions-17871807/C940EE47F9E130847768DE9740DC8910"},{"label":"National Museum of Denmark — The abolition of slavery","url":"https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/the-abolition-of-slavery/"},{"label":"ScienceNordic — Denmark cannot apologise for slave trade","url":"https://sciencenordic.com/criminality-denmark-ethics/denmark-cannot-apologise-for-slave-trade/1375831"}],"connections":[{"id":"danish-west-india-guinea-company","type":"charter","label":"chartered, 1671"},{"id":"danish-west-indies","type":"ownership","label":"crown colony from 1755"},{"id":"danish-1792-decree","type":"charter","label":"Christian VII signed the ban"},{"id":"schimmelmann-family","type":"plantation","label":"sold crown plantations, 1763"},{"id":"christiansborg-castle","type":"ownership","label":"Gold Coast forts, sold 1850"},{"id":"hendrik-carloff","type":"charter","label":"employed Carloff"}]},{"id":"brandenburg-african-company","name":"Brandenburg African Company","category":"Companies & Banks","role":"Trader & Shipper","nation":"Brandenburg-Prussia","scale":"Minor","scaleBasis":"estimated","scaleNote":"The University of Potsdam estimates c. 30,000 people were deported through Brandenburg's trade from the West African coast; the company was never profitable for long.","start":1682,"end":1717,"lifespan":"1682–1711 (renamed Brandenburg-African-American Company 1692); forts sold 1717","base":"Emden (East Frisia) and Berlin","geo":[53.367,7.206],"aliases":["Brandenburgisch-Africanische Compagnie","BAC","Brandenburg-African-American Company"],"origins":"Founded in 1682 by Elector Frederick William on the advice of his Dutch naval director Benjamin Raule, as a joint-stock venture promising investors a share of profits. Its seat moved to Emden in 1683.","role_summary":"Gold proved scarce, so the company's Gold Coast forts, led by Groß Friedrichsburg, came to focus on buying captives. From 1685 it leased land on Danish St Thomas to sell them in the Caribbean, and it also held Arguin off Mauritania.","roleDetail":[{"t":"St Thomas lease, 1685.","d":"Raule agreed with the Danish company to use land on St Thomas for trade, mainly in enslaved people; the Danes seized the Brandenburg section in 1693.","basis":"documented"},{"t":"Traded with interlopers.","d":"From c. 1698 its forts traded more with Dutch and English interlopers than with company ships.","basis":"documented"}],"legacy":"King Frederick William I agreed in 1717 to sell the forts to the Dutch WIC for 7,200 ducats and 12 enslaved Africans (handover c. 1720–21; the Dutch only took Groß Friedrichsburg in 1724–25 after resistance by John Conny). Germany now debates this history, including in Potsdam and Berlin, where 'Mohrenstraße' was officially renamed Anton-Wilhelm-Amo-Straße on 23 August 2025.","legacyDetail":[{"t":"Sold to the Dutch.","d":"Groß Friedrichsburg passed to the WIC, which renamed it Fort Hollandia.","basis":"documented"}],"sources":[{"label":"Wikipedia — Brandenburger Gold Coast","url":"https://en.wikipedia.org/wiki/Brandenburger_Gold_Coast"},{"label":"University of Potsdam — Pre-colonial trade of enslaved people","url":"https://uni-potsdam.de/en/botanischer-garten/unser-garten/kolonialismus/vorkoloniale-versklavung"},{"label":"Cambridge — History in Africa: Archival materials on the Brandenburg African Company","url":"https://www.cambridge.org/core/journals/history-in-africa/article/abs/archival-materials-on-the-brandenburg-african-company-16821721/B2891A2EF5C8537DF58FF475D5E12D35"},{"label":"ZDFheute — Berlin: Mohrenstraße in Anton-Wilhelm-Amo-Straße umbenannt (2025)","url":"https://www.zdfheute.de/politik/deutschland/mohrenstrasse-berlin-umbenannt-anton-wilhelm-amo-100.html"}],"connections":[{"id":"frederick-william-brandenburg","type":"charter","label":"founded by the Great Elector"},{"id":"benjamin-raule","type":"ownership","label":"directed by Raule"},{"id":"gross-friedrichsburg","type":"ownership","label":"Gold Coast fort"},{"id":"danish-west-india-guinea-company","type":"trade","label":"St Thomas lease"},{"id":"dutch-west-india-company","type":"trade","label":"forts sold to WIC, 1717"}]},{"id":"frederick-william-brandenburg","name":"Frederick William, the Great Elector of Brandenburg","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Brandenburg-Prussia","scale":"Minor","scaleBasis":"estimated","scaleNote":"Founder of Brandenburg's short-lived slaving venture, which took c. 30,000 Africans (University of Potsdam estimate).","start":1680,"end":1688,"lifespan":"1620–1688","base":"Berlin / Potsdam, Brandenburg","geo":[52.517,13.402],"aliases":["Friedrich Wilhelm","Der Große Kurfürst"],"origins":"Elector of Brandenburg from 1640, raised partly in the Dutch Republic, he admired Dutch commerce and sought overseas trade to strengthen his state.","role_summary":"He backed Raule's Guinea expedition of 1680–81, chartered the Brandenburg African Company in 1682 and invested his own capital. Africans brought to his court as servants and soldiers appear in Potsdam's history.","roleDetail":[{"t":"State founder of the venture.","d":"The company was a project of the Elector and his court, not of a merchant class.","basis":"documented"},{"t":"African servants at court.","d":"Potsdam researchers document Africans, many enslaved or bought as children, at the Brandenburg-Prussian court.","basis":"documented"}],"legacy":"Prussian nationalists and later the Nazi-era colonial lobby celebrated Groß Friedrichsburg as Germany's first colony. Postcolonial initiatives in Potsdam now reinterpret this heritage.","legacyDetail":[{"t":"Contested heritage.","d":"Groups such as Postcolonial Potsdam trace the Elector's slaving links in city monuments.","basis":"documented"}],"sources":[{"label":"Postcolonial Potsdam — The Rotary of the Oranges: Brandenburg-Prussia and the enslavement of Africans","url":"https://postcolonialpotsdam.org/en/2020/03/22/the-rotary-of-the-oranges-brandenburg-prussia-and-the-enslavement-of-africans/"},{"label":"University of Potsdam — Pre-colonial trade of enslaved people","url":"https://uni-potsdam.de/en/botanischer-garten/unser-garten/kolonialismus/vorkoloniale-versklavung"}],"connections":[{"id":"brandenburg-african-company","type":"charter","label":"chartered, 1682"},{"id":"benjamin-raule","type":"charter","label":"appointed naval director"},{"id":"gross-friedrichsburg","type":"ownership","label":"fort named after him"},{"id":"house-of-orange","type":"family","label":"married Louise Henriette of Orange-Nassau"}]},{"id":"benjamin-raule","name":"Benjamin Raule","category":"European Families","role":"Broker & Agent","nation":"Brandenburg-Prussia","scale":"Minor","scaleBasis":"estimated","scaleNote":"Organised Brandenburg's Guinea and Caribbean slave trade, which deported c. 30,000 people in total.","start":1680,"end":1698,"lifespan":"1634–1707","base":"Emden / Berlin","geo":[53.367,7.206],"aliases":["Benjamin Raule (Zeeland shipowner)"],"origins":"A Zeeland (Dutch) shipowner and privateer who entered Brandenburg's service, becoming director-general of the Elector's navy.","role_summary":"Raule organised the expedition that founded Groß Friedrichsburg, ran the Brandenburg African Company and negotiated the 1685 St Thomas lease with Denmark for selling captives. He was dismissed and imprisoned after the Elector's death in 1688 on corruption charges.","roleDetail":[{"t":"Dutch know-how for a German state.","d":"Raule brought Dutch shipping and slave-trading expertise to Brandenburg.","basis":"interpretive"},{"t":"Negotiated St Thomas lease.","d":"He signed the November 1685 agreement with the Danish company.","basis":"documented"}],"legacy":"Raule is remembered in German naval history as founder of the Brandenburg navy; his role in the slave trade is now part of colonial-memory debates.","legacyDetail":[{"t":"Naval namesake.","d":"He is often celebrated in German naval tradition with little attention to the slave trade.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Saint Thomas (Brandenburg colony)","url":"https://en.wikipedia.org/wiki/Saint_Thomas_(Brandenburg_colony)"},{"label":"Wikipedia — Brandenburger Gold Coast","url":"https://en.wikipedia.org/wiki/Brandenburger_Gold_Coast"}],"connections":[{"id":"brandenburg-african-company","type":"ownership","label":"director"},{"id":"frederick-william-brandenburg","type":"charter","label":"appointed by the Elector"},{"id":"danish-west-indies","type":"trade","label":"St Thomas lease"},{"id":"gross-friedrichsburg","type":"voyage","label":"organised founding expedition"}]},{"id":"swedish-africa-company","name":"Swedish Africa Company","category":"Companies & Banks","role":"Trader & Shipper","nation":"Sweden","scale":"Minor","scaleBasis":"estimated","scaleNote":"A short-lived company (1649–1663) whose Gold Coast posts traded mainly gold and ivory, with limited slave trading; it was soon displaced by Denmark and the Dutch.","start":1649,"end":1663,"lifespan":"1649–1663","base":"Stockholm, Sweden","geo":[59.329,18.069],"aliases":["Afrikanska kompaniet","Swedish Gold Coast"],"origins":"Founded in 1649 under a charter from Queen Christina by Louis De Geer and his son Laurens, with ex-WIC official Hendrik Carloff as its African expert.","role_summary":"Carloff's 1650 expedition built Carolusborg at Cabo Corso (Cape Coast) with the permission of the king of Fetu. The company traded on the Gold Coast until the Danes took Carolusborg in 1658 and the Dutch the remaining posts in 1663.","roleDetail":[{"t":"Founded Carolusborg.","d":"The fort became Cape Coast Castle, later Britain's West African headquarters.","basis":"documented"},{"t":"Limited slaving.","d":"Sweden's direct role in the Atlantic slave trade through this company was small; its scale is debated.","basis":"interpretive"}],"legacy":"Sweden later held Saint-Barthélemy (1784–1878) and used it as a free port, including for trade in enslaved people, before abolishing slavery there in 1847. Swedish museums now cover this history.","legacyDetail":[{"t":"Saint-Barthélemy.","d":"Sweden's Caribbean colony held enslaved people until 1847.","basis":"documented"}],"sources":[{"label":"Wikipedia — Swedish Africa Company","url":"https://en.wikipedia.org/wiki/Swedish_Africa_Company"},{"label":"Wikipedia — Swedish Gold Coast","url":"https://en.wikipedia.org/wiki/Swedish_Gold_Coast"},{"label":"Statens museer för världskultur — Afrikanska kulturer: Ghana (PDF)","url":"https://production.varldskulturmuseerna.se/siteassets/pdf/afrikanska-kulturer/afrikanska-kulturer-fall-5-ghana.pdf"}],"connections":[{"id":"de-geer-family","type":"ownership","label":"founded by the De Geers"},{"id":"hendrik-carloff","type":"voyage","label":"led 1650 expedition"},{"id":"carolusborg","type":"ownership","label":"built Carolusborg"},{"id":"danish-west-india-guinea-company","type":"political","label":"lost forts to Denmark"},{"id":"dutch-west-india-company","type":"political","label":"rival; took posts 1663"}]},{"id":"de-geer-family","name":"De Geer family (Louis & Laurens De Geer)","category":"European Families","role":"Financier & Insurer","nation":"Sweden","scale":"Minor","scaleBasis":"estimated","scaleNote":"Financed and founded the Swedish Africa Company (1649), a small player in the Gold Coast trade.","start":1649,"end":1663,"lifespan":"Louis De Geer 1587–1652","base":"Amsterdam / Finspång, Sweden","geo":[58.706,15.769],"aliases":["Louis De Geer"],"origins":"Louis De Geer, a Liège-born Calvinist merchant in Amsterdam, became Sweden's leading industrialist in iron and armaments. His sister Maria married the Amsterdam arms merchant Elias Trip, linking the De Geers to the Trip family.","role_summary":"With his son Laurens, Louis De Geer founded the Swedish Africa Company in 1649 and financed its Gold Coast expedition. The family's Swedish iron and guns were key goods in Atlantic trade.","roleDetail":[{"t":"Dutch capital under a Swedish flag.","d":"De Geer used Swedish charters to enter a trade the Dutch WIC monopolised at home.","basis":"interpretive"},{"t":"Trip family ties.","d":"The Trip–De Geer arms network supplied guns and metals traded across the Atlantic world; no direct Trip slave-trading has been confirmed here.","basis":"interpretive"}],"legacy":"The De Geers remain a prominent Swedish noble family. The Trippenhuis in Amsterdam, built by Trip relatives in 1662, now houses the Royal Netherlands Academy of Arts and Sciences.","legacyDetail":[{"t":"Industrial legacy.","d":"Finspång and other De Geer works remain landmarks of Swedish industry.","basis":"documented"}],"sources":[{"label":"Wikipedia — Louis De Geer (1587–1652)","url":"https://en.wikipedia.org/wiki/Louis_De_Geer_(1587%E2%80%931652)"},{"label":"Wikipedia — Swedish Africa Company","url":"https://en.wikipedia.org/wiki/Swedish_Africa_Company"},{"label":"Cambridge — The Dutch Republic in the Seventeenth Century: Riches (Trip and De Geer)","url":"https://www.cambridge.org/core/books/dutch-republic-in-the-seventeenth-century/riches/5273C1CF985CE41D3AC73BADA7013258"}],"connections":[{"id":"swedish-africa-company","type":"ownership","label":"founders, 1649"},{"id":"hendrik-carloff","type":"ownership","label":"employed Carloff"},{"id":"port-amsterdam","type":"finance","label":"Amsterdam capital"}]},{"id":"hendrik-carloff","name":"Hendrik Carloff","category":"European Families","role":"Broker & Agent","nation":"Sweden","scale":"Minor","scaleBasis":"estimated","scaleNote":"A company agent who served the Dutch, Swedish and Danish Gold Coast ventures in turn; important for founding forts rather than for the number of captives he shipped.","start":1640,"end":1662,"lifespan":"c. 1621–after 1677","base":"Cape Coast (Cabo Corso), Gold Coast","geo":[5.103,-1.241],"aliases":["Henrik Carloff","Caerloff"],"origins":"A Rostock-born merchant who served the Dutch WIC on the Gold Coast before offering his knowledge to the Swedish De Geer venture.","role_summary":"Carloff led the Swedish expedition of 1650 and built Carolusborg. After leaving Swedish service he became director of the Danish Africa Company (1657–1662) and in 1658 seized the Swedish posts for Denmark.","roleDetail":[{"t":"Changed sides.","d":"His capture of Carolusborg for Denmark in January 1658 showed how agents moved between rival companies.","basis":"documented"}],"legacy":"Carloff's career shows how small states entered the Gold Coast trade through Dutch-trained agents.","legacyDetail":[{"t":"Scholarly interest.","d":"Leiden researchers have studied Carloff as a transimperial broker.","basis":"documented"}],"sources":[{"label":"Wikipedia — Hendrik Carloff","url":"https://en.wikipedia.org/wiki/Hendrik_Carloff"},{"label":"Wikipedia — Capture of Carolusborg (1658)","url":"https://en.wikipedia.org/wiki/Capture_of_Carolusborg_(1658)"},{"label":"Leiden University Scholarly Publications — study of Carloff","url":"https://scholarlypublications.universiteitleiden.nl/access/item%3A2975214/view"}],"connections":[{"id":"dutch-west-india-company","type":"ownership","label":"former WIC official"},{"id":"swedish-africa-company","type":"voyage","label":"led 1650 expedition"},{"id":"carolusborg","type":"ownership","label":"built, then seized it"},{"id":"danish-west-india-guinea-company","type":"ownership","label":"director of Danish venture"}]},{"id":"jacob-kettler-courland","name":"Duke Jacob Kettler and the Duchy of Courland","category":"Crowns & Explorers","role":"Explorer & Crown","nation":"Courland (Baltic duchy)","scale":"Minor","scaleBasis":"estimated","scaleNote":"Courland held St Andrew's Island in the Gambia (1651–1661) and Tobago intermittently; its role in the slave trade was small and is poorly documented.","start":1651,"end":1690,"lifespan":"1610–1682 (Duke 1642–1682)","base":"Mitau (Jelgava), Courland","geo":[56.651,23.721],"aliases":["Jakob Kettler","Curonian colonies"],"origins":"Ruler of a small Baltic duchy under Polish-Lithuanian overlordship, Jacob built a large merchant fleet and sought colonies after Dutch and English models.","role_summary":"He leased St Andrew's Island in the Gambia from the Kingdom of Niumi in 1651 and built Fort Jacob, and planted 'New Courland' on Tobago from 1654. The Gambia fort traded in gold, ivory and some captives; most were taken by the Dutch and English while Jacob was a Swedish prisoner (1658–1660).","roleDetail":[{"t":"Gambia outpost.","d":"St Andrew's Island, later James Island, became an English slave-trading fort after 1661.","basis":"documented"},{"t":"Slaving role debated.","d":"How many captives Courland itself shipped is unclear; sources mostly emphasise trade goods.","basis":"interpretive"}],"legacy":"St Andrew's/James Island is now Kunta Kinteh Island, a UNESCO World Heritage site. In Latvia the colonies are often a point of national pride, which historians are starting to question.","legacyDetail":[{"t":"Kunta Kinteh Island.","d":"The Gambian island Courland first fortified was renamed in 2011 after the character in Roots.","basis":"documented"}],"sources":[{"label":"Wikipedia — Jacob Kettler","url":"https://en.wikipedia.org/wiki/Jacob_Kettler"},{"label":"Rundāle Palace Museum — Duke Jacob (1610–1681)","url":"https://rundale.net/en/vault/duke-jacob-1610-1681/"},{"label":"Wikipedia — Curonian colonisation","url":"https://en.wikipedia.org/wiki/Curonian_colonisation"}],"connections":[{"id":"courland-colonies","type":"ownership","label":"Gambia and Tobago colonies"},{"id":"dutch-west-india-company","type":"political","label":"Dutch seized posts, 1659"},{"id":"royal-african-company","type":"legacy","label":"Gambia fort passed to English traders"}]},{"id":"cic-bank","name":"Crédit Industriel et Commercial (CIC)","category":"Companies & Banks","role":"Financier & Insurer","nation":"France","scale":"Minor","scaleBasis":"documented","scaleNote":"Not a slave trader, but the bank that profited most from Haiti's 1875 loan, taken to keep paying the 1825 'independence debt' (per the New York Times 'Ransom' investigation, 2022).","start":1875,"end":1922,"lifespan":"1859–present","base":"Paris, France","geo":[48.873,2.336],"aliases":["CIC","Crédit Mutuel Alliance Fédérale (parent)"],"origins":"A Paris bank founded in 1859, now part of Crédit Mutuel Alliance Fédérale.","role_summary":"In 1875 CIC arranged a loan to Haiti whose fees and interest drained the Haitian treasury; it also helped found Haiti's national bank, which was controlled from Paris.","roleDetail":[{"t":"Haiti's 'double debt'.","d":"The 1825 indemnity plus loans to pay it cost Haiti c. 112 million francs, about $560 million today, and an estimated $21–115 billion in lost growth (NYT).","basis":"documented"},{"t":"Paris-controlled national bank.","d":"CIC helped set up the Banque Nationale d'Haïti, which was run from Paris and drew profits from Haiti's treasury (NYT, 2022).","basis":"documented"}],"legacy":"The NYT series renewed calls for France to return the indemnity. In 2025, the bicentenary of the debt, France set up a joint commission of historians.","legacyDetail":[{"t":"Bicentenary, 2025.","d":"The Collège de France held a symposium 'Haiti 1825: from independence to debt'.","basis":"documented"}],"sources":[{"label":"Hillman Foundation — The Ransom: The Root of Haiti's Misery","url":"https://hillmanfoundation.org/node/3726"},{"label":"Equal Justice Initiative — Haiti's forced payments to enslavers cost economy $21 billion","url":"https://eji.org/?p=23646"},{"label":"Collège de France — Haiti 1825: from independence to debt","url":"https://college-de-france.fr/en/agenda/symposium/haiti-1825-from-independence-to-debt"}],"connections":[{"id":"haiti-independence-debt","type":"finance","label":"1875 loan to pay the indemnity"},{"id":"crown-of-france","type":"legacy","label":"profited from France's indemnity"},{"id":"saint-domingue","type":"legacy","label":"debt for colonists' losses"}]},{"id":"port-nantes","name":"Nantes","type":"entity","kind":"Port","description":"France's leading slave-trading port: Nantes outfitted c. 1,744 slaving expeditions, about 41% of the French total, and its ships deported more than 500,000 Africans in the 18th century (per Wikipedia summarising Nantes-based research). Merchant houses such as the Montaudoins built the Feydeau and Île Gloriette mansions on these profits.","start":1707,"geo":[47.213,-1.556],"connections":[{"id":"montaudoin-family","type":"voyage","label":"home of Montaudoin voyages"},{"id":"nantes-memorial","type":"legacy","label":"Mémorial de l'abolition, 2012"},{"id":"saint-domingue","type":"trade","label":"main market for captives"},{"id":"compagnie-des-indes","type":"charter","label":"traded under company licences"}]},{"id":"port-bordeaux","name":"Bordeaux","type":"entity","kind":"Port","description":"France's second slave port by many measures, with c. 508 slave-trading expeditions deporting an estimated 120,000–150,000 Africans between 1672 and 1837, and France's main port for colonial sugar and coffee. The Musée d'Aquitaine opened permanent rooms on the slave trade in 2009, and street plaques now explain names such as rue Gradis.","start":1672,"geo":[44.841,-0.57],"connections":[{"id":"gradis-family","type":"voyage","label":"Gradis house"},{"id":"nairac-family","type":"voyage","label":"Nairac house"},{"id":"saint-domingue","type":"trade","label":"sugar and coffee trade"}]},{"id":"port-la-rochelle","name":"La Rochelle","type":"entity","kind":"Port","description":"A leading French slave port (often ranked second or third), with an estimated c. 130,000 Africans deported on its ships, mainly to the French Antilles and Saint-Domingue, where many of its shipowners also held plantations. The Musée du Nouveau Monde occupies the Hôtel Fleuriau, built for a planter-merchant family.","start":1643,"geo":[46.159,-1.152],"connections":[{"id":"nairac-family","type":"voyage","label":"Jean-Baptiste Nairac's voyages"},{"id":"saint-domingue","type":"plantation","label":"shipowners' plantations"}]},{"id":"port-le-havre","name":"Le Havre","type":"entity","kind":"Port","description":"A major Normandy slave port in the 18th century and a centre of illegal French slaving after 1815, as in the 1819 voyage of Le Rôdeur to Guadeloupe. A plaque near the port remembers the c. 90,000 Africans trafficked on Le Havre ships, and the Maison de l'Armateur and Hôtel Dubocage de Bléville hold exhibitions on the trade.","start":1700,"geo":[49.494,0.107],"connections":[{"id":"saint-domingue","type":"trade","label":"Caribbean markets"},{"id":"crown-of-france","type":"charter","label":"under French law"}]},{"id":"port-amsterdam","name":"Amsterdam","type":"entity","kind":"Port","description":"The financial heart of the Dutch Atlantic: seat of the WIC's main chamber, one-third owner of the Society of Suriname (1683–1795), and home of banks such as Hope & Co. that lent to slave plantations. On 1 July 2021 Mayor Femke Halsema apologised for the city government's 'active involvement' in colonial slavery.","start":1621,"geo":[52.377,4.9],"connections":[{"id":"dutch-west-india-company","type":"ownership","label":"WIC Amsterdam chamber"},{"id":"society-of-suriname","type":"ownership","label":"one-third owner of Suriname"},{"id":"hope-and-co","type":"finance","label":"plantation finance"},{"id":"house-of-orange","type":"legacy","label":"king's 2023 apology in Oosterpark"}]},{"id":"saint-domingue","name":"Saint-Domingue (colonial Haiti)","type":"entity","kind":"Colony / plantation","description":"France's richest colony and the world's largest sugar and coffee producer by the 1780s, with c. 465,000 enslaved people in 1789, about two-thirds of them born in Africa. The revolution that began in August 1791 ended slavery and created independent Haiti on 1 January 1804, the first state founded by formerly enslaved people.","start":1697,"geo":[19.759,-72.198],"connections":[{"id":"crown-of-france","type":"ownership","label":"French colony from 1697"},{"id":"code-noir","type":"charter","label":"Code Noir extended here, 1687"},{"id":"haiti-independence-debt","type":"legacy","label":"France demanded indemnity, 1825"},{"id":"port-nantes","type":"trade","label":"main destination of Nantes ships"},{"id":"port-bordeaux","type":"trade","label":"Bordeaux colonial trade"}]},{"id":"code-noir","name":"Code Noir (1685)","type":"entity","kind":"Charter / law / treaty","description":"Edict of Louis XIV issued at Versailles in March 1685, in 60 articles, regulating slavery in the French colonies: it imposed Catholicism, expelled Jews, defined enslaved people as movable property and set punishments, while nominally limiting masters' power. It was extended to Saint-Domingue and later Louisiana and stayed largely in force until 1848.","start":1685,"connections":[{"id":"crown-of-france","type":"charter","label":"issued by Louis XIV"},{"id":"saint-domingue","type":"charter","label":"applied in Saint-Domingue"},{"id":"taubira-law","type":"legacy","label":"repudiated in 2001"}]},{"id":"goree-island","name":"Gorée Island","type":"entity","kind":"Port","description":"A small island off Dakar held in turn by the Portuguese, Dutch, English and French, and a French slave-trading base under the Senegal companies. It became a UNESCO World Heritage Site in 1978; the claim that millions passed through its 'House of Slaves' is disputed by historians such as Philip Curtin, who estimate far smaller numbers (some cite c. 26,000 recorded), but it is widely accepted as a memorial site.","start":1588,"geo":[14.667,-17.398],"connections":[{"id":"compagnie-du-senegal","type":"ownership","label":"French company base"},{"id":"gradis-family","type":"trade","label":"Gradis post from 1748"},{"id":"compagnie-des-indes","type":"ownership","label":"held by the Indies company"},{"id":"crown-of-portugal","type":"ownership","label":"early Portuguese use"}]},{"id":"curacao","name":"Curaçao","type":"entity","kind":"Colony / plantation","description":"Taken from Spain by the WIC in 1634, Curaçao became the main Dutch depot for selling captives on to Spanish America, especially under asiento contracts from 1662 and illegally thereafter; it may have delivered c. 100,000 people to Spanish colonies. Willemstad's Kura Hulanda museum and the 1795 Tula revolt are central to its memory today.","start":1634,"geo":[12.108,-68.935],"connections":[{"id":"dutch-west-india-company","type":"ownership","label":"WIC colony"},{"id":"coymans-family","type":"trade","label":"asiento depot"},{"id":"spanish-asiento","type":"trade","label":"supplied Spanish asientos"},{"id":"port-havana","type":"trade","label":"resold captives to Spanish colonies"}]},{"id":"sint-eustatius","name":"Sint Eustatius","type":"entity","kind":"Colony / plantation","description":"A small Dutch island that became a free port and, after the mid-18th century, the main Dutch transit point for captives sold on to neighbouring colonies, overtaking Curaçao (per SlaveVoyages). A slave depot stood within the Waterfort.","start":1636,"geo":[17.483,-62.983],"connections":[{"id":"dutch-west-india-company","type":"ownership","label":"WIC transit depot"},{"id":"middelburgsche-commercie-compagnie","type":"trade","label":"MCC sales"}]},{"id":"new-amsterdam","name":"New Amsterdam (New Netherland)","type":"entity","kind":"Colony / plantation","description":"The WIC's settlement on Manhattan, where enslaved Africans arrived from c. 1626 and built Fort Amsterdam. In 1644 eleven company-owned men won 'half-freedom' and land north of the town. The English took the colony in 1664 and renamed it New York.","start":1626,"geo":[40.704,-74.013],"connections":[{"id":"dutch-west-india-company","type":"ownership","label":"WIC colony"},{"id":"james-duke-of-york","type":"political","label":"seized by the English, 1664"}]},{"id":"society-of-suriname","name":"Society of Suriname","type":"entity","kind":"Chartered company","description":"Founded in 1683 and owned in equal thirds by the city of Amsterdam, the Van Aerssen van Sommelsdijck family and the WIC to run Suriname. By 1713 c. 13,000 enslaved Africans worked c. 200 plantations producing sugar, coffee and cocoa for Amsterdam; Suriname received about 40% of all captives landed by the Dutch. Dissolved in 1795.","start":1683,"geo":[5.852,-55.204],"connections":[{"id":"port-amsterdam","type":"ownership","label":"one-third owner"},{"id":"van-aerssen-van-sommelsdijck-family","type":"ownership","label":"one-third owner"},{"id":"dutch-west-india-company","type":"ownership","label":"one-third owner"},{"id":"hope-and-co","type":"finance","label":"plantation loans"}]},{"id":"christiansborg-castle","name":"Christiansborg Castle (Osu Castle), Accra","type":"entity","kind":"Fort / trading castle","description":"Denmark-Norway's main Gold Coast fort at Osu, taken over in the late 1650s and the base for Danish slave purchases. Akwamu forces captured it in 1693 and held it for a year. Sold to Britain in 1850, it later served as Ghana's seat of government.","start":1661,"geo":[5.548,-0.18],"connections":[{"id":"danish-west-india-guinea-company","type":"ownership","label":"Danish headquarters"},{"id":"akwamu-kingdom","type":"political","label":"seized by Akwamu, 1693"},{"id":"asante-empire","type":"trade","label":"Gold Coast trade"},{"id":"crown-of-denmark-norway","type":"ownership","label":"sold to Britain, 1850"},{"id":"danish-west-india-guinea-company","type":"ownership","label":"Danish company fort"},{"id":"akwamu-kingdom","type":"political","label":"seized by Akwamu 1693"}]},{"id":"fredensborg-ship","name":"Fredensborg (slave ship, 1768)","type":"entity","kind":"Ship / voyage","description":"A Danish-Norwegian slave ship that embarked c. 265 captives on the Gold Coast and landed 235 on St Croix in 1768, then sank off Tromøy near Arendal, Norway, on its return. Found in 1974, it is one of the very few excavated slave ships; its finds are held by the Aust-Agder museum.","start":1768,"geo":[58.438,8.89],"connections":[{"id":"danish-west-indies","type":"voyage","label":"landed captives on St Croix"},{"id":"christiansborg-castle","type":"voyage","label":"Gold Coast purchases"},{"id":"crown-of-denmark-norway","type":"voyage","label":"Danish-Norwegian flag"}]},{"id":"gross-friedrichsburg","name":"Groß Friedrichsburg","type":"entity","kind":"Fort / trading castle","description":"Brandenburg's fort at Princes Town, Ghana, begun on 1 January 1683 and the base of its slave trading. Sold to the Dutch WIC by an agreement of 1717; local ally John Conny held it until 1724, after which the Dutch renamed it Fort Hollandia.","start":1683,"geo":[4.793,-2.135],"connections":[{"id":"brandenburg-african-company","type":"ownership","label":"company fort"},{"id":"frederick-william-brandenburg","type":"ownership","label":"named after the Elector"},{"id":"dutch-west-india-company","type":"ownership","label":"bought 1717"}]},{"id":"carolusborg","name":"Carolusborg (Cape Coast)","type":"entity","kind":"Fort / trading castle","description":"Fort founded by the Swedish Africa Company at Cabo Corso in 1650–53 with the king of Fetu's consent. Captured by the Danes in 1658 and the Dutch in 1663, it was taken by the English in 1664 and rebuilt as Cape Coast Castle.","start":1650,"geo":[5.103,-1.241],"connections":[{"id":"swedish-africa-company","type":"ownership","label":"Swedish fort"},{"id":"hendrik-carloff","type":"ownership","label":"built and seized by Carloff"},{"id":"cape-coast-castle","type":"legacy","label":"became Cape Coast Castle"}]},{"id":"danish-west-indies","name":"Danish West Indies (St Thomas, St John, St Croix)","type":"entity","kind":"Colony / plantation","description":"Denmark-Norway's Caribbean sugar colonies: St Thomas from 1672, St John from 1718 and St Croix, bought from France in 1733. Enslaved people revolted on St John in 1733 and forced emancipation on St Croix on 3 July 1848. Sold to the US in 1917; now the US Virgin Islands.","start":1672,"geo":[17.746,-64.703],"connections":[{"id":"danish-west-india-guinea-company","type":"ownership","label":"company colony"},{"id":"schimmelmann-family","type":"plantation","label":"Schimmelmann plantations"},{"id":"crown-of-denmark-norway","type":"ownership","label":"crown colony from 1755"},{"id":"brandenburg-african-company","type":"trade","label":"Brandenburg lease on St Thomas"}]},{"id":"haiti-independence-debt","name":"Haiti's 'independence debt' (1825 indemnity)","type":"entity","kind":"Legacy / apology","description":"Under naval threat, Charles X's 1825 ordinance made France's recognition of Haiti conditional on 150 million francs to compensate former colonists, including for enslaved 'property'; it was reduced in 1838. Haiti borrowed from French banks to pay. The NYT (2022) found Haiti paid c. 112 million francs (c. $560 million today) through 1947, at an estimated cost of $21–115 billion in lost growth.","start":1825,"geo":[18.594,-72.307],"connections":[{"id":"crown-of-france","type":"political","label":"imposed by Charles X"},{"id":"saint-domingue","type":"legacy","label":"compensation for lost colony"},{"id":"cic-bank","type":"finance","label":"1875 loan"}]},{"id":"taubira-law","name":"Taubira Law (2001)","type":"entity","kind":"Charter / law / treaty","description":"French Law no. 2001-434 of 21 May 2001, drafted by Christiane Taubira, deputy for French Guiana, recognised the Atlantic and Indian Ocean slave trades and slavery as crimes against humanity. It required them to be taught in schools and led to a national remembrance day (10 May).","start":2001,"geo":[48.862,2.318],"connections":[{"id":"crown-of-france","type":"legacy","label":"French state's recognition"},{"id":"code-noir","type":"legacy","label":"repudiates colonial slave law"},{"id":"nantes-memorial","type":"legacy","label":"memorial culture"}]},{"id":"danish-1792-decree","name":"Danish slave-trade decree (1792)","type":"entity","kind":"Charter / law / treaty","description":"Signed by Christian VII on 16 March 1792 after a commission chaired by Ernst Schimmelmann, it banned the import of captives into the Danish West Indies and their export from Danish forts in Guinea, but only from 1803. It did not end slavery, which lasted until 1848.","start":1792,"geo":[55.676,12.58],"connections":[{"id":"crown-of-denmark-norway","type":"charter","label":"royal decree"},{"id":"schimmelmann-family","type":"political","label":"Ernst Schimmelmann's commission"},{"id":"danish-west-indies","type":"charter","label":"applied to the colonies"}]},{"id":"nantes-memorial","name":"Mémorial de l'abolition de l'esclavage, Nantes","type":"entity","kind":"Legacy / apology","description":"Opened on 25 March 2012 on the Quai de la Fosse, the memorial has c. 2,000 glass inserts, about 1,710 of them naming Nantes slave-ship expeditions and their dates. It is one of Europe's largest memorials to the slave trade.","start":2012,"geo":[47.208,-1.561],"connections":[{"id":"port-nantes","type":"legacy","label":"Nantes remembers"},{"id":"montaudoin-family","type":"legacy","label":"names Nantes voyages"},{"id":"taubira-law","type":"legacy","label":"French memorial policy"}]},{"id":"compagnie-de-guinee","name":"Compagnie de Guinée (Asiento company)","type":"entity","kind":"Chartered company","description":"French chartered company with the monopoly on the slave trade from Sierra Leone to the Cape of Good Hope. In 1701 Philip V of Spain gave it the asiento to supply captives to Spanish America, which passed to Britain's South Sea Company at the 1713 Treaty of Utrecht.","start":1685,"geo":[48.857,2.352],"connections":[{"id":"crown-of-france","type":"charter","label":"royal charter"},{"id":"spanish-asiento","type":"charter","label":"held the asiento 1701–1713"},{"id":"south-sea-company","type":"legacy","label":"asiento passed to Britain, 1713"},{"id":"compagnie-des-indes","type":"legacy","label":"absorbed into the Indies company"}]},{"id":"compagnie-du-senegal","name":"Compagnie du Sénégal","type":"entity","kind":"Chartered company","description":"Successive French chartered companies (from 1673) that ran Saint-Louis and Gorée with a monopoly from Cap Blanc to the Sierra Leone river, trading gum, gold and captives. The monopoly passed to the Compagnie des Indes in December 1718.","start":1673,"geo":[16.026,-16.504],"connections":[{"id":"goree-island","type":"ownership","label":"ran Gorée"},{"id":"crown-of-france","type":"charter","label":"royal charter"},{"id":"compagnie-des-indes","type":"legacy","label":"absorbed 1718"}]},{"id":"hope-and-co","name":"Hope & Co.","type":"entity","kind":"Bank / insurer","description":"An Amsterdam merchant bank founded by the Hope family, one of Europe's leading houses in the 18th century. IISH research (2022) found it lent to at least 73 Caribbean plantations with enslaved people as security, and drew c. 25–33% of revenue from slavery in sample years. It is a legal predecessor of ABN AMRO.","start":1762,"geo":[52.37,4.887],"connections":[{"id":"abn-amro","type":"legacy","label":"predecessor of ABN AMRO"},{"id":"society-of-suriname","type":"finance","label":"Suriname plantation loans"},{"id":"danish-west-indies","type":"finance","label":"Danish colony loans"},{"id":"port-amsterdam","type":"finance","label":"Amsterdam bank"}]},{"id":"courland-colonies","name":"Courland colonies: St Andrew's Island (Gambia) and New Courland (Tobago)","type":"entity","kind":"Colony / plantation","description":"The Duchy of Courland leased St Andrew's Island in the Gambia River from the Kingdom of Niumi in 1651 and built Fort Jacob, and planted 'New Courland' on Tobago from 1654. The Gambia fort fell to the Dutch and then the English (1661), becoming James Island, today Kunta Kinteh Island.","start":1651,"geo":[13.317,-16.361],"connections":[{"id":"jacob-kettler-courland","type":"ownership","label":"Duke Jacob's colonies"},{"id":"royal-african-company","type":"legacy","label":"became English James Fort"},{"id":"dutch-west-india-company","type":"political","label":"seized 1659"}]},{"id":"kingdom-of-dahomey","name":"Kingdom of Dahomey (Danxomè)","category":"African States & Families","role":"Ruler & Supplier","nation":"Dahomey","scale":"Major","scaleBasis":"estimated","scaleNote":"Controlled Ouidah, the leading Slave Coast port and second only to Luanda among African embarkation points: more than a million captives were shipped from it (Robin Law, Ouidah, 2004); Dahomey was the principal supplier there 1727–c.1863.","start":1724,"end":1863,"lifespan":"c.1600–1894 (monarchy survives ceremonially today)","base":"Abomey, Benin","geo":[7.183,1.991],"aliases":["Danhome","Fon kingdom","Abomey kingdom"],"origins":"A Fon kingdom centred on the Abomey plateau, founded in the early 17th century. It was inland and initially cut off from the coast, where the kingdoms of Allada and Whydah (Hueda) brokered trade with Europeans.","role_summary":"From the 1720s Dahomey conquered the coastal slaving states and made the sale of war captives a royal enterprise, with a viceroy (yovogan) at Ouidah regulating European traders. Annual military campaigns supplied captives; the crown taxed and monopolised much of the trade until the Atlantic market closed in the 1860s.","roleDetail":[{"t":"Conquest of the coast.","d":"King Agaja took Allada (1724) and Whydah (1727), giving Dahomey direct access to European buyers; historians debate whether this was to seize or to control the trade.","basis":"documented"},{"t":"A tributary of Oyo.","d":"Dahomey paid tribute to the Oyo Empire from the 1720s/1740s for roughly a century, and much of the trade passed under Oyo pressure and competition.","basis":"documented"},{"t":"War as a supply system.","d":"Captives came principally from annual campaigns against neighbours (e.g. Mahi, Yoruba communities); European demand for captives shaped Dahomey's military economy.","basis":"interpretive"},{"t":"Resisting abolition.","d":"Kings Ghezo and Glele defended the trade to British envoys; the last trans-Atlantic shipment from Dahomey is dated to 1863, while palm oil grew in parallel.","basis":"documented"}],"legacy":"France conquered Dahomey in 1892–94 and exiled King Béhanzin; the territory became the French colony of Dahomey and, in 1975, the Republic of Benin. The royal palaces of Abomey are a UNESCO World Heritage Site, and Benin has made public apologies and memorials for its part in the trade.","legacyDetail":[{"t":"Apology and memory.","d":"President Mathieu Kérékou's 1999 apologies and the Cotonou reconciliation conference addressed Dahomey's role; Ouidah's Route des Esclaves commemorates the victims.","basis":"documented"},{"t":"Contested memory.","d":"Dahomey is remembered in Benin both as a symbol of African statehood and resistance to France and as a slave-raiding state, a tension visible in museums and tourism.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — History of the Kingdom of Dahomey","url":"https://en.wikipedia.org/wiki/History_of_the_Kingdom_of_Dahomey"},{"label":"Britannica (Students) — Dahomey, historical kingdom","url":"https://kids.britannica.com/students/article/Dahomey/28540"},{"label":"Fontes Historiae Africanae — Dahomey and the Ending of the Trans-Atlantic Slave Trade (Law, ed.)","url":"https://www.fonteshistoriaeafricanae.co.uk/wp-content/uploads/2024/02/Dahomey-and-the-Ending-of-the-Trans-Atlantic-Slave-Trade.pdf"},{"label":"African History Extra — The kingdom of Dahomey and the Atlantic world","url":"https://www.africanhistoryextra.com/p/the-kingdom-of-dahomey-and-the-atlantic"},{"label":"Boydell & Brewer — Robin Law, Ouidah: The Social History of a West African Slaving Port 1727–1892","url":"https://boydellandbrewer.com/book/ouidah-9780852554975/"}],"connections":[{"id":"port-ouidah","type":"ownership","label":"conquered and ruled Ouidah from 1727"},{"id":"agaja-of-dahomey","type":"ownership","label":"king 1718–1740"},{"id":"ghezo-of-dahomey","type":"ownership","label":"king 1818–1858"},{"id":"oyo-empire","type":"political","label":"tributary of Oyo"},{"id":"francisco-felix-de-souza","type":"trade","label":"appointed Chachá of Ouidah"},{"id":"benin-1999-apology","type":"legacy","label":"successor state apologised 1999"},{"id":"abomey-royal-palaces","type":"ownership","label":"royal seat"},{"id":"compagnie-des-indes","type":"trade","label":"sold captives to French traders"}]},{"id":"agaja-of-dahomey","name":"Agaja, King of Dahomey","category":"African States & Families","role":"Ruler & Supplier","nation":"Dahomey","scale":"Significant","scaleBasis":"estimated","scaleNote":"His conquests of Allada (1724) and Whydah (1727) put the main Bight of Benin slave market under Dahomean control.","start":1724,"end":1740,"lifespan":"c.1673–1740 (reigned 1718–1740)","base":"Abomey, Benin","geo":[7.183,1.991],"aliases":["Dosu"],"origins":"Son of King Houegbadja, Agaja inherited an inland kingdom with no direct access to European traders. Sources differ on whether his reign began in 1708 or 1718.","role_summary":"Agaja's armies conquered the coastal slave-trading kingdoms of Allada and Whydah, making Dahomey a direct seller to European buyers. His reign also brought Oyo invasions that forced Dahomey into tributary status.","roleDetail":[{"t":"Coastal conquest.","d":"Took Allada in 1724 and Whydah (Ouidah) in 1727, briefly disrupting and then redirecting the trade through Dahomean hands.","basis":"documented"},{"t":"Debated motives.","d":"Some historians (notably I. A. Akinjogbin) argued Agaja wanted to curb the slave trade; most, following Robin Law, see the conquests as aimed at controlling it.","basis":"interpretive"}],"legacy":"Agaja's conquests created the Dahomey–Ouidah system that lasted until the 1860s. He is remembered in Benin as one of the great kings of Abomey.","legacyDetail":[{"t":"Historians' debate.","d":"The 'Agaja abolitionist' thesis is a classic historiographical controversy and is now a minority view.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Agaja","url":"https://en.wikipedia.org/wiki/Agaja"},{"label":"Wikipedia — History of the Kingdom of Dahomey","url":"https://en.wikipedia.org/wiki/History_of_the_Kingdom_of_Dahomey"}],"connections":[{"id":"kingdom-of-dahomey","type":"ownership","label":"king"},{"id":"port-ouidah","type":"political","label":"conquered Whydah 1727"},{"id":"oyo-empire","type":"political","label":"invaded by Oyo"},{"id":"tegbesu-of-dahomey","type":"family","label":"succeeded by son Tegbesu"}]},{"id":"tegbesu-of-dahomey","name":"Tegbesu, King of Dahomey","category":"African States & Families","role":"Ruler & Supplier","nation":"Dahomey","scale":"Major","scaleBasis":"estimated","scaleNote":"The slave trade grew significantly in his reign and became the king's largest source of income; annual revenue figures that circulate online cannot be traced to a scholarly source and are omitted here.","start":1740,"end":1774,"lifespan":"d.1774 (reigned 1740–1774; Britannica gives 1732–74)","base":"Abomey, Benin","geo":[7.183,1.991],"aliases":["Tegbessou"],"origins":"A son of Agaja, Tegbesu won a succession struggle against a brother after Agaja's death.","role_summary":"Tegbesu consolidated royal control of the Ouidah trade, making the sale of captives the kingdom's main revenue. Late in his reign Oyo restricted trade through Dahomey, and he sold his own enslaved people to keep shipments going.","roleDetail":[{"t":"Royal revenue.","d":"Under Tegbesu the slave trade provided the largest part of the king's income (per Wikipedia's summary of the scholarship).","basis":"documented"},{"t":"Pressure from Oyo.","d":"Oyo, Dahomey's overlord, diverted trade to Porto-Novo, squeezing Dahomey's supply.","basis":"interpretive"}],"legacy":"His son Kpengla (r. 1774–1789) inherited a kingdom whose politics revolved around competition for slave-trade profits.","legacyDetail":[{"t":"Kpengla.","d":"Kpengla's attempts to control the trade largely failed; he died of smallpox in 1789.","basis":"documented"}],"sources":[{"label":"Wikipedia — Tegbesu","url":"https://en.wikipedia.org/wiki/Tegbesu"},{"label":"Britannica (Students) — Dahomey, historical kingdom","url":"https://kids.britannica.com/students/article/Dahomey/28540"}],"connections":[{"id":"kingdom-of-dahomey","type":"ownership","label":"king"},{"id":"agaja-of-dahomey","type":"family","label":"son of Agaja"},{"id":"port-ouidah","type":"trade","label":"royal trade at Ouidah"},{"id":"oyo-empire","type":"political","label":"tributary to Oyo"}]},{"id":"ghezo-of-dahomey","name":"Ghezo, King of Dahomey","category":"African States & Families","role":"Ruler & Supplier","nation":"Dahomey","scale":"Major","scaleBasis":"estimated","scaleNote":"Ran the illegal trade through Ouidah with de Souza for four decades after British abolition; refused British demands to end it in 1850.","start":1818,"end":1858,"lifespan":"d.1858 (reigned 1818–1858)","base":"Abomey, Benin","geo":[7.183,1.991],"aliases":["Gezo","Gankpe"],"origins":"A royal prince who seized the throne from his brother Adandozan in 1818 with the help of the Brazilian trader Francisco Félix de Souza. He inherited political turmoil and debts.","role_summary":"Ghezo ended Dahomey's tribute to Oyo and relied on the slave trade, run through his ally de Souza at Ouidah, to finance the state. In 1849–50 he told British envoy Frederick Forbes that the trade was integral to his kingdom and offered only a phased end if palm oil trade expanded.","roleDetail":[{"t":"Coup with a slave trader.","d":"De Souza helped Ghezo overthrow Adandozan in 1818 and was rewarded with the post of Chachá, controlling trade with Europeans at Ouidah.","basis":"documented"},{"t":"The 1850 Forbes meeting.","d":"Forbes failed to persuade Ghezo to abolish the trade; Ghezo gave him a captive girl, later Sarah Forbes Bonetta. Britain blockaded Dahomey's ports from 1851.","basis":"documented"},{"t":"Shift to palm oil.","d":"Ghezo promoted palm oil production alongside, not instead of, the trade in captives.","basis":"interpretive"}],"legacy":"Ghezo signed an anti-slave-trade treaty in 1852 under blockade but the trade continued into Glele's reign. Forbes's book 'Dahomey and the Dahomans' (1851) became abolitionist propaganda and a key European source on the kingdom.","legacyDetail":[{"t":"Sarah Forbes Bonetta.","d":"The girl given to Forbes became a goddaughter of Queen Victoria, a story now widely retold by English Heritage and others.","basis":"documented"}],"sources":[{"label":"Royal Collection Trust — Dahomey and the Dahomans, vol. 2, by Frederick E. Forbes","url":"https://col.rct.uk/collection/1072072/dahomey-and-the-dahomans-v-2-by-frederick-e-forbes"},{"label":"English Heritage — Sarah Forbes Bonetta","url":"https://www.english-heritage.org.uk/visit/places/osborne/history-and-stories/sarah-forbes-bonetta/"},{"label":"Wikipedia — History of the Kingdom of Dahomey","url":"https://en.wikipedia.org/wiki/History_of_the_Kingdom_of_Dahomey"},{"label":"Fontes Historiae Africanae — Dahomey and the Ending of the Trans-Atlantic Slave Trade (Law, ed.)","url":"https://www.fonteshistoriaeafricanae.co.uk/wp-content/uploads/2024/02/Dahomey-and-the-Ending-of-the-Trans-Atlantic-Slave-Trade.pdf"}],"connections":[{"id":"kingdom-of-dahomey","type":"ownership","label":"king"},{"id":"francisco-felix-de-souza","type":"political","label":"1818 coup ally; appointed him Chachá"},{"id":"port-ouidah","type":"trade","label":"exported captives via Ouidah"},{"id":"oyo-empire","type":"political","label":"ended tribute to Oyo"},{"id":"glele-of-dahomey","type":"family","label":"succeeded by son Glele"},{"id":"crown-of-portugal","type":"trade","label":"sold to Portuguese/Brazilian buyers"}]},{"id":"glele-of-dahomey","name":"Glele, King of Dahomey","category":"African States & Families","role":"Ruler & Supplier","nation":"Dahomey","scale":"Significant","scaleBasis":"estimated","scaleNote":"Presided over the final illegal shipments from Dahomey (last trans-Atlantic shipment dated 1863), including the 1860 Clotilda captives sold at Ouidah.","start":1858,"end":1863,"lifespan":"d.1889 (reigned 1858–1889)","base":"Abomey, Benin","geo":[7.183,1.991],"aliases":["Glélé","Badohun"],"origins":"Son and successor of Ghezo, he came to the throne as British naval pressure and the collapse of the Atlantic market threatened Dahomey's revenue.","role_summary":"Glele continued war campaigns that produced captives and sold them to the remaining illegal traders until the trade closed in the 1860s. Captives taken by Dahomey were among the 110 people carried to Alabama aboard the Clotilda in 1860.","roleDetail":[{"t":"Last shipments.","d":"The final trans-Atlantic shipment from Dahomey is dated to 1863 (per the Fontes Historiae Africanae collection on Dahomey and the ending of the trade).","basis":"documented"},{"t":"Economic decline.","d":"Palm oil was far less lucrative than captives, and Britannica describes his reign as one of economic decline.","basis":"documented"}],"legacy":"French expansion at Porto-Novo and Cotonou eroded Ouidah's commerce; his son Béhanzin was defeated by France in 1892–94.","legacyDetail":[{"t":"Clotilda descendants.","d":"Descendants of Clotilda survivors in Africatown, Alabama, have visited Ouidah and engaged with Benin about this history.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Glele","url":"https://en.wikipedia.org/wiki/Glele"},{"label":"Fontes Historiae Africanae — Dahomey and the Ending of the Trans-Atlantic Slave Trade (Law, ed.)","url":"https://www.fonteshistoriaeafricanae.co.uk/wp-content/uploads/2024/02/Dahomey-and-the-Ending-of-the-Trans-Atlantic-Slave-Trade.pdf"},{"label":"Britannica (Students) — Dahomey, historical kingdom","url":"https://kids.britannica.com/students/article/Dahomey/28540"}],"connections":[{"id":"kingdom-of-dahomey","type":"ownership","label":"king"},{"id":"ghezo-of-dahomey","type":"family","label":"son of Ghezo"},{"id":"port-ouidah","type":"trade","label":"last shipments via Ouidah"},{"id":"clotilda-meaher","type":"trade","label":"Clotilda captives bought at Ouidah, 1860"}]},{"id":"francisco-felix-de-souza","name":"Francisco Félix de Souza (\"Chachá\")","category":"African States & Families","role":"Broker & Agent","nation":"Bight of Benin (Lagos/Ouidah)","scale":"Dominant","scaleBasis":"estimated","scaleNote":"Widely described as the largest slave trader on the Bight of Benin c.1820–1849, holding exclusive rights over Dahomey's sales at Ouidah; precise numbers are not documented.","start":1788,"end":1849,"lifespan":"1771?–1849","base":"Ouidah, Benin","geo":[6.363,2.085],"aliases":["Chachá I","Francisco Félix de Sousa","Xaxá"],"origins":"Born in Salvador, Bahia (Brazil), probably in 1771, of mixed Portuguese and possibly African/Amerindian descent. He arrived on the coast in the 1790s, worked at the Portuguese fort at Ouidah, and traded at Little Popo (Aného) after quarrels and imprisonment under King Adandozan.","role_summary":"He helped Ghezo seize the Dahomean throne in 1818 and was made Chachá — the king's chief agent for the European trade at Ouidah. For three decades after British abolition he supplied captives to Brazilian, Cuban and Portuguese buyers, mostly by barter on credit.","roleDetail":[{"t":"Kingmaker.","d":"Conspired with Prince Gakpe (Ghezo) to depose Adandozan in 1818; Ghezo granted him a privileged position over the slave trade.","basis":"documented"},{"t":"Illegal-era trader.","d":"His clients were mainly Brazilian and European merchants, and his business continued long after Britain (1807) and Brazil (1831) banned the trade.","basis":"documented"},{"t":"Afro-Brazilian community.","d":"He anchored a community of returned Afro-Brazilians and traders in Ouidah, many themselves formerly enslaved.","basis":"interpretive"}],"legacy":"He died in Ouidah in 1849 heavily indebted. The de Souza family remains prominent in Benin; the title 'Chachá' still passes to a family patriarch, and the family has contested his portrayal as a slave merchant in Ouidah museums.","legacyDetail":[{"t":"Living lineage.","d":"A 'Chachá' is still installed every few decades; Moïse de Souza was listed as family head.","basis":"documented"},{"t":"Literature.","d":"His life inspired Bruce Chatwin's 'The Viceroy of Ouidah' (1980) and Werner Herzog's film 'Cobra Verde' (1987).","basis":"interpretive"}],"sources":[{"label":"Wikipedia — Francisco Félix de Souza","url":"https://en.wikipedia.org/wiki/Francisco_F%C3%A9lix_de_Souza"},{"label":"University of Bayreuth, Africa Multiple — Black Atlantic Revisited, Station 1 (de Souza)","url":"https://www.africamultiple.uni-bayreuth.de/en/1_2-Research/Research-Projects/Arts-and-Aesthetics/Black-Atlantic-revisited/May-Exhibition/Station-1/index.html"},{"label":"InfoEscola — Francisco Félix de Sousa (Chachá)","url":"https://www.infoescola.com/biografias/francisco-felix-de-sousa-chacha"},{"label":"SEPHIS / Elisée Soumonni — Daomé e o mundo atlântico (2001)","url":"https://sephis.org/wp-content/uploads/tainacan-items/4273/4351/LT6_Soumonni_2001_Daome_PT.pdf"}],"connections":[{"id":"ghezo-of-dahomey","type":"political","label":"helped Ghezo seize power 1818"},{"id":"kingdom-of-dahomey","type":"charter","label":"appointed Chachá by the king"},{"id":"port-ouidah","type":"trade","label":"dominated Ouidah trade"},{"id":"port-salvador","type":"trade","label":"sold to Bahian buyers"},{"id":"de-souza-family","type":"family","label":"founder"},{"id":"fort-sao-joao-baptista-ajuda","type":"ownership","label":"served at the Portuguese fort"},{"id":"port-havana","type":"trade","label":"supplied Cuban buyers"}]},{"id":"de-souza-family","name":"De Souza family of Ouidah","category":"African States & Families","role":"Broker & Agent","nation":"Bight of Benin (Lagos/Ouidah)","scale":"Significant","scaleBasis":"estimated","scaleNote":"Sons of Francisco Félix continued trading after 1849 in the declining illegal trade; the family's importance today is social and political rather than commercial.","start":1849,"end":1863,"lifespan":"1820s–present","base":"Ouidah, Benin","geo":[6.363,2.085],"aliases":["Chachá lineage"],"origins":"Descendants of Francisco Félix de Souza and his many wives, forming one of Benin's best-known Afro-Brazilian lineages in the Brazil Quarter of Ouidah.","role_summary":"After 1849 the title of Chachá passed to his sons, who remained agents of the Dahomean crown and traders at Ouidah as the slave trade gave way to palm oil. The lineage later produced civil servants, politicians and businesspeople in colonial and independent Benin.","roleDetail":[{"t":"Inherited office.","d":"Successive Chachás served the kings of Dahomey as intermediaries with European and Brazilian traders.","basis":"documented"},{"t":"Transition to palm oil.","d":"Like other Afro-Brazilian families on the coast, they shifted toward 'legitimate' trade as the Atlantic market closed.","basis":"interpretive"}],"legacy":"The family maintains a memorial at Singbomey in Ouidah and performs a family panegyric on the founder's birthday. Family leaders have acknowledged the history but objected to his labelling as a 'slave merchant' in the Ouidah museum.","legacyDetail":[{"t":"Memory dispute.","d":"The family's resistance to critical portrayals is a frequently cited example of the politics of slave-trade memory in Benin.","basis":"interpretive"}],"sources":[{"label":"Wikipedia — De Souza family","url":"https://en.wikipedia.org/wiki/De_Souza_family"},{"label":"University of Bayreuth, Africa Multiple — Black Atlantic Revisited, Station 1 (de Souza)","url":"https://www.africamultiple.uni-bayreuth.de/en/1_2-Research/Research-Projects/Arts-and-Aesthetics/Black-Atlantic-revisited/May-Exhibition/Station-1/index.html"}],"connections":[{"id":"francisco-felix-de-souza","type":"family","label":"descendants"},{"id":"port-ouidah","type":"legacy","label":"family seat in Ouidah"},{"id":"kingdom-of-dahomey","type":"political","label":"agents of the crown"},{"id":"ouidah-route-des-esclaves","type":"legacy","label":"contested memorialisation"}]},{"id":"oyo-empire","name":"Oyo Empire","category":"African States & Families","role":"Ruler & Supplier","nation":"Oyo","scale":"Major","scaleBasis":"estimated","scaleNote":"Dominant Yoruba state of the 18th century whose captives fed Porto-Novo and Ouidah; its 1820s–30s collapse produced vast numbers of Yoruba captives shipped to Brazil and Cuba.","start":1700,"end":1836,"lifespan":"c.1400s–1836 (Alaafin survives at New Oyo)","base":"Oyo-Ile (Old Oyo), Nigeria","geo":[8.95,4.383],"aliases":["Old Oyo","Alaafin's empire"],"origins":"A Yoruba kingdom of the savanna whose cavalry made it the leading power between the Volta and the Niger. Its ruler, the Alaafin, sat at Oyo-Ile.","role_summary":"Oyo subjugated Dahomey (1724–30, 1738–48) and traded with Europeans through Ajase (Porto-Novo), acting as a key conduit moving captives from the interior to the coast. Alaafin Abiodun (c.1770–89) built policy on the coastal trade.","roleDetail":[{"t":"Overlord of Dahomey.","d":"Oyo forced Dahomey to pay tribute for about a century and shaped which ports captives passed through.","basis":"documented"},{"t":"Porto-Novo route.","d":"Oyo channelled its trade through Ajase/Porto-Novo, competing with Dahomean Ouidah.","basis":"documented"},{"t":"Collapse produced captives.","d":"The Ilorin revolt and Sokoto jihad wars that destroyed Oyo (c.1817–1836) made Yoruba-speakers a large share of 19th-century arrivals in Bahia and Cuba.","basis":"interpretive"}],"legacy":"Old Oyo was abandoned c.1836; a new Oyo was founded further south and the Alaafin remains a traditional ruler. Yoruba religion and culture carried by captives shaped Candomblé in Brazil and Santería in Cuba.","legacyDetail":[{"t":"Diaspora culture.","d":"The large Yoruba presence among late-era captives underlies Yoruba-derived traditions across Brazil and Cuba.","basis":"interpretive"}],"sources":[{"label":"Britannica — Oyo empire","url":"https://www.britannica.com/place/Oyo-empire"},{"label":"World History Encyclopedia — Oyo Empire","url":"https://www.worldhistory.org/Oyo_Empire/"}],"connections":[{"id":"kingdom-of-dahomey","type":"political","label":"overlord of Dahomey"},{"id":"port-ouidah","type":"trade","label":"captives via Ouidah/Porto-Novo"},{"id":"port-salvador","type":"trade","label":"Yoruba captives to Bahia"},{"id":"port-havana","type":"trade","label":"Yoruba captives to Cuba"},{"id":"kosoko-of-lagos","type":"parallel","label":"Lagos traded Oyo-war captives"}]},{"id":"asante-empire","name":"Asante Empire","category":"African States & Families","role":"Ruler & Supplier","nation":"Asante","scale":"Major","scaleBasis":"estimated","scaleNote":"The main source of captives sold at Gold Coast castles in the 18th century; the Gold Coast exported c.1.2 million people overall (SlaveVoyages estimates).","start":1701,"end":1807,"lifespan":"c.1670–1902 (Asantehene today)","base":"Kumasi, Ghana","geo":[6.688,-1.624],"aliases":["Ashanti","Asanteman"],"origins":"An Akan confederation forged by Osei Tutu and the priest Okomfo Anokye around the Golden Stool. It defeated its former overlord Denkyira in 1701.","role_summary":"From the early 1700s Asante supplied war captives and tribute captives to British and Dutch traders on the coast in exchange for firearms that fuelled further expansion. Rulers such as Opoku Ware (r. c.1720–1750) extended the empire and its slave supply.","roleDetail":[{"t":"Guns for captives.","d":"Britannica: from the start of the 18th century Asante supplied enslaved people to British and Dutch traders and received firearms to enforce expansion.","basis":"documented"},{"t":"Gold and captives.","d":"Asante's economy also rested on gold and kola; enslaved labour was widely used inside the state.","basis":"interpretive"},{"t":"Questioning abolition.","d":"In 1820 Asantehene Osei Bonsu asked British envoy Joseph Dupuis why Britain had suddenly stopped buying captives and doubted it was for humanity alone.","basis":"documented"}],"legacy":"Asante fought a series of wars with Britain and was annexed in 1902; the Asantehene remains a powerful traditional ruler in Ghana. Ghana's castle heritage and the 2019 Year of Return have brought renewed attention to Akan participation in the trade.","legacyDetail":[{"t":"Ongoing monarchy.","d":"The Golden Stool and the Asantehene remain at the heart of Asante identity in modern Ghana.","basis":"documented"}],"sources":[{"label":"Britannica — Asante empire","url":"https://www.britannica.com/place/Asante-empire"},{"label":"Britannica — Osei Tutu","url":"https://www.britannica.com/biography/Osei-Tutu"},{"label":"Wikipedia — Asante Empire","url":"https://en.wikipedia.org/wiki/Asante_Empire"}],"connections":[{"id":"osei-bonsu-of-asante","type":"ownership","label":"Asantehene 1804–1824"},{"id":"royal-african-company","type":"trade","label":"sold captives to British traders"},{"id":"dutch-west-india-company","type":"trade","label":"sold captives at Elmina"},{"id":"elmina-castle","type":"trade","label":"captives sold at Elmina"},{"id":"cape-coast-castle","type":"trade","label":"captives sold at Cape Coast"},{"id":"akwamu-kingdom","type":"political","label":"Akan rival states"},{"id":"fante-confederacy","type":"political","label":"longstanding wars with Fante"}]},{"id":"osei-bonsu-of-asante","name":"Osei Bonsu, Asantehene","category":"African States & Families","role":"Ruler & Supplier","nation":"Asante","scale":"Significant","scaleBasis":"estimated","scaleNote":"Ruled Asante as Britain abolished the trade; his 1820 remarks to Joseph Dupuis are a key African source on reactions to abolition.","start":1804,"end":1824,"lifespan":"c.1779–1824 (reigned 1804–1824)","base":"Kumasi, Ghana","geo":[6.688,-1.624],"aliases":["Osei Tutu Kwame"],"origins":"Asantehene at the height of Asante power, he led campaigns against the Fante on the coast in 1807 and after.","role_summary":"He presided over an economy in which war and tribute captives had been sold to the coast; when Britain stopped buying in 1807, he challenged British motives in talks with envoy Joseph Dupuis in 1820.","roleDetail":[{"t":"The Dupuis exchange.","d":"Recorded in Dupuis's 'Journal of a Residence in Ashantee' (1824), Osei Bonsu asked why the British had changed policy and doubted it came from humanity alone.","basis":"documented"},{"t":"Coastal wars.","d":"His campaigns against the Fante (1807, 1811, 1814–16) brought Asante into direct conflict with British coastal interests.","basis":"interpretive"}],"legacy":"His successor's war with Britain (1824) began a century of Anglo-Asante conflict. His words are widely taught as an African perspective on abolition.","legacyDetail":[{"t":"Classroom source.","d":"Excerpts appear in standard world-history source readers such as McKay's.","basis":"documented"}],"sources":[{"label":"Wikipedia — Osei Bonsu","url":"https://en.wikipedia.org/wiki/Osei_Bonsu"},{"label":"Bedford/St Martin's (McKay, Sources) — Osei Bonsu, An Asante King Questions British Motives (1820)","url":"https://digfir-published.macmillanusa.com/mckaysources/mckaysources_ch20_3.html"},{"label":"EAUMF — 28 Feb 1820: British envoy Joseph Dupuis arrives in Kumasi","url":"https://www.eaumf.org/ejm-blog/2018/2/28/february-28-1820-british-envoy-joseph-dupuis-arrives-in-kumasi"}],"connections":[{"id":"asante-empire","type":"ownership","label":"Asantehene"},{"id":"fante-confederacy","type":"political","label":"wars against Fante"},{"id":"cape-coast-castle","type":"political","label":"negotiated with British at Cape Coast"}]},{"id":"akwamu-kingdom","name":"Akwamu Kingdom","category":"African States & Families","role":"Ruler & Supplier","nation":"Gold Coast","scale":"Significant","scaleBasis":"estimated","scaleNote":"Dominated the coastal plain around Accra c.1680–1730 and the trade with Danish, Dutch and English forts there; seized Danish Christiansborg in 1693.","start":1680,"end":1730,"lifespan":"c.1600–present (Akwamufie paramountcy)","base":"Nyanaoase / Akwamufie, Ghana","geo":[5.833,-0.333],"aliases":["Akwamu Empire"],"origins":"An Akan state that rose in the 17th century in the hinterland of Accra and conquered the Ga coast by the 1680s.","role_summary":"Akwamu controlled commerce between the interior and the Accra forts, selling captives, gold and ivory for guns, cloth and metal. In 1693 Akwamu's Asameni seized Danish Christiansborg Castle and traded from it for about a year.","roleDetail":[{"t":"Seizure of Christiansborg.","d":"In June 1693 Asameni and some 80 men posing as traders took the castle, kept its goods, and invited English and Dutch captains to trade, before selling it back to the Danes.","basis":"documented"},{"t":"Not anti-slavery.","d":"Historians stress Akwamu objected to how Europeans conducted trade, not to the trade itself.","basis":"interpretive"},{"t":"Diaspora echo.","d":"Akwamu captives sold after Akwamu's 1730 defeat by Akyem are linked to the 1733 St John (Danish West Indies) revolt.","basis":"interpretive"}],"legacy":"Akwamu was defeated by Akyem in 1730–31 and moved east to the Volta, where its paramount chief still rules at Akwamufie. The Christiansborg episode is retold as a story of both resistance and collaboration.","legacyDetail":[{"t":"Osu Castle.","d":"Christiansborg (Osu Castle) later became the seat of Ghana's government.","basis":"documented"}],"sources":[{"label":"Wikipedia — Akwamu Empire","url":"https://en.wikipedia.org/wiki/Akwamu_Empire"},{"label":"The Conversation — Resistance and collaboration: Asameni and the keys to Christiansborg Castle","url":"https://theconversation.com/resistance-and-collaboration-asameni-and-the-keys-to-christiansborg-castle-in-accra-120006"},{"label":"Wikipedia — Timeline of Accra","url":"https://en.wikipedia.org/wiki/Timeline_of_Accra"}],"connections":[{"id":"christiansborg-castle","type":"political","label":"seized 1693"},{"id":"danish-west-india-guinea-company","type":"trade","label":"sold captives to the Danes"},{"id":"dutch-west-india-company","type":"trade","label":"traded with Dutch forts"},{"id":"asante-empire","type":"political","label":"Akan rival"},{"id":"royal-african-company","type":"trade","label":"traded with English at Accra"}]},{"id":"kingdom-of-kongo","name":"Kingdom of Kongo","category":"African States & Families","role":"Ruler & Supplier","nation":"Kongo","scale":"Major","scaleBasis":"estimated","scaleNote":"Kongo was an early and major supply zone for the Portuguese trade via São Tomé and Mpinda in the 16th century; West Central Africa as a whole supplied c.5.7 million people, nearly half of all Atlantic captives (SlaveVoyages estimates).","start":1500,"end":1860,"lifespan":"c.1390–1914","base":"Mbanza Kongo (São Salvador), Angola","geo":[-6.267,14.25],"aliases":["Kongo dya Ntotila","Wene wa Kongo"],"origins":"The most powerful state in West Central Africa, centred on Mbanza Kongo, emerging in the 14th century. Portuguese navigators arrived in 1483 and the ruling house converted to Christianity.","role_summary":"Kongo's kings exchanged captives — mostly war captives from neighbouring peoples — for European goods and Christian prestige, and Portuguese traders from São Tomé pushed the trade beyond royal control. Disputes over the trade led Portugal to turn to Ndongo and later to found Luanda (1576).","roleDetail":[{"t":"Early partnership.","d":"Under Afonso I Kongo accepted Portuguese advisers and missionaries and supplied enslaved people to Portuguese traders.","basis":"documented"},{"t":"Loss of control.","d":"Afonso's 1526 letters complained that traders were seizing free Kongolese, including nobles.","basis":"documented"},{"t":"Regulated under Kongo law.","d":"Some historians (e.g. John Thornton) argue the trade remained largely regulated under African law and that Kongo later withdrew from large-scale export.","basis":"interpretive"},{"t":"Civil wars.","d":"After the 1665 Battle of Mbwila against Portugal, Kongo's civil wars generated many captives sold to the coast.","basis":"interpretive"}],"legacy":"Kongo became a Portuguese vassal and was absorbed into Angola by 1914. Mbanza Kongo was inscribed as a UNESCO World Heritage Site in 2017; Kongo Christianity and culture strongly shaped the diaspora, notably in the Stono Rebellion and Haitian Revolution.","legacyDetail":[{"t":"Diaspora influence.","d":"Kongolese captives, some Catholic, are linked by historians to the 1739 Stono Rebellion and to Haitian Revolution fighters.","basis":"interpretive"}],"sources":[{"label":"South African History Online — Kingdom of Kongo 1390–1914","url":"https://sahistory.org.za/article/kingdom-kongo-1390-1914"},{"label":"Britannica — History of Angola","url":"https://www.britannica.com/place/Angola/History"},{"label":"EBSCO Research Starters — Kongo (historical kingdom)","url":"https://www.ebsco.com/research-starters/history/kongo-historical-kingdom"},{"label":"African History Extra — The kingdom of Kongo and the Portuguese (1483–1670)","url":"https://www.africanhistoryextra.com/p/the-kingdom-of-kongo-and-the-portuguese"}],"connections":[{"id":"afonso-i-of-kongo","type":"ownership","label":"king 1509–1542"},{"id":"crown-of-portugal","type":"political","label":"alliance and vassalage"},{"id":"port-luanda","type":"trade","label":"captives shipped via Luanda"},{"id":"queen-nzinga","type":"political","label":"neighbouring Ndongo/Matamba"},{"id":"mbanza-kongo","type":"ownership","label":"capital"},{"id":"dutch-west-india-company","type":"political","label":"allied vs Portugal in 1640s"}]},{"id":"afonso-i-of-kongo","name":"Afonso I (Nzinga Mbemba) of Kongo","category":"African States & Families","role":"Ruler & Supplier","nation":"Kongo","scale":"Significant","scaleBasis":"documented","scaleNote":"Ruled during the first large-scale Portuguese slave exports from Central Africa; his 1526 letters to João III are the earliest African protest against abuses of the trade.","start":1509,"end":1542,"lifespan":"c.1456–1542/43 (reigned 1509–1542)","base":"Mbanza Kongo, Angola","geo":[-6.267,14.25],"aliases":["Nzinga Mbemba","Mvemba a Nzinga"],"origins":"Son of King Nzinga a Nkuwu, he was baptised in 1491 and won the throne in 1509 with Christian, Portuguese-backed support.","role_summary":"Afonso made Kongo a Catholic kingdom, sent nobles to Lisbon, and sold enslaved war captives to the Portuguese. In 1526 he wrote to João III that Portuguese traders were seizing free people and even nobles, and asked for the trade to be curbed — but he set up inspectors to regulate it rather than abolish it.","roleDetail":[{"t":"The 1526 letters.","d":"He wrote that 'many of our people, out of great desire for the wares... seize many of our people, free and
